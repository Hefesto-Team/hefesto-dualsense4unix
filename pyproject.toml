[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "hefesto-dualsense4unix"
version = "0.9.5"
description = "DualSense no Linux: gatilhos adaptativos, luz, vibração, sensores, áudio e co-op local"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["dualsense", "ps5", "adaptive-triggers", "linux", "gamepad", "dualsense4unix", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydualsense>=0.7.5",
    "textual>=0.47",
    "typer>=0.9",
    "pydantic>=2.0",
    "python-xlib>=0.33",
    "evdev>=1.6",
    "structlog>=23.0",
    "rich>=13.0",
    "platformdirs>=4.0",
    "filelock>=3.13",
    # O `.yml` do jogo do Lutris se lê e se escreve com ele, o mesmo leitor do
    # Lutris (a camada da lista de exclusão, A-EXCLUSAO-MORA-NA-CAMADA-DO-JOGO-01).
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    # O ruff fica pinado: uma versão nova muda regras e reprova código que passava.
    "ruff==0.15.20",
    "mypy>=1.7",
    "types-python-xlib",
    # O PyYAML é dependência de execução desde 02/10/2026 (acima); os tipos dele ficam aqui.
    "types-PyYAML",
    # Dois verificadores de desenho abrem o Chrome do sistema pelo Playwright; o pacote
    # pip basta, sem `playwright install`.
    "playwright>=1.62",
]
emulation = [
    "python-uinput>=0.11",
]
tray = [
    "PyGObject>=3.44",
]
# Opcional: as métricas funcionam sem ele; serve a quem quiser usar o prometheus_client direto.
metrics = [
    "prometheus-client>=0.19",
]
# Detecção de janela no Wayland pelo portal D-Bus (jeepney, Python puro); sem ele, cai no wlrctl.
cosmic = [
    "jeepney>=0.8",
]
# O formulário do mapa de canais (`scripts/bancada_do_mapa.py`); não é dependência do produto.
bancada = [
    "streamlit>=1.30",
    "pandas>=2.0",
]

[project.scripts]
hefesto-dualsense4unix = "hefesto_dualsense4unix.cli.app:main"
# O `-gui` abre a janela de dez abas.
hefesto-dualsense4unix-gui = "hefesto_dualsense4unix.interface.hefesto_vivo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hefesto_dualsense4unix"]
include = [
    # As páginas da janela e os arquivos que elas referenciam.
    "src/hefesto_dualsense4unix/interface/paginas/*.html",
    "src/hefesto_dualsense4unix/interface/assets/*",
    # Os catálogos .mo, para quem instala só pelo pip achar as traduções.
    "src/hefesto_dualsense4unix/locale/*/LC_MESSAGES/*.mo",
]

# O sdist leva só o que está listado: sem a lista ele levaria arquivo local que só o
# `.git/info/exclude` ou o ignore global escondem.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "pyproject.toml", "README.md", "LICENSE", "LICENSES", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/fixtures/**"]
# O pre-commit passa cada caminho explícito; `force-exclude` faz ele respeitar o `exclude`.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Os geradores de HTML e as ferramentas da janela emitem markup em f-string: ficam isentos só
# de regras de forma, para o HTML gerado seguir legível no diff.
"src/hefesto_dualsense4unix/interface/aba*.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/monta.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/mapa.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/mesa_viva.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100", "N818"]
"src/hefesto_dualsense4unix/interface/calibrar.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/regua*.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/olhar.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/ver.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/conferir*.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/*_viv*.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/medir_subpaths.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/remapear.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/exportar.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/importar.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]
"src/hefesto_dualsense4unix/interface/regerar.py" = ["E501", "E401", "E702", "E741", "I001", "B905", "UP031", "UP009", "RUF001", "RUF002", "RUF003", "RUF100"]

# Nos testes, a guarda de GTK real roda antes do `import gi`, acima do bloco de imports.
"tests/**" = ["E402", "I001"]
# As ferramentas de `scripts/`: isentas só de regras de forma; F, B e SIM seguem valendo.
"scripts/**" = ["E401", "E402", "E501", "E701", "E702", "E741", "I001",
                "N806", "N818", "UP009", "UP031", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pydualsense",
    "pydualsense.*",
    "textual",
    "textual.*",
    "evdev",
    "Xlib",
    "Xlib.*",
    "uinput",
    "gi",
    "gi.*",
]
ignore_missing_imports = true

# Os geradores de HTML e as ferramentas de conferência da janela não passam em `strict`;
# o caminho do produto (`hefesto_vivo`, `pacotes/*`, `onde`, `mesa_viva`, `monta`) passa.
[[tool.mypy.overrides]]
module = [
    "hefesto_dualsense4unix.interface.aba01",
    "hefesto_dualsense4unix.interface.aba02",
    "hefesto_dualsense4unix.interface.aba03",
    "hefesto_dualsense4unix.interface.aba04",
    "hefesto_dualsense4unix.interface.aba05",
    "hefesto_dualsense4unix.interface.aba06",
    "hefesto_dualsense4unix.interface.aba07",
    "hefesto_dualsense4unix.interface.aba08",
    "hefesto_dualsense4unix.interface.aba09",
    "hefesto_dualsense4unix.interface.aba10",
    "hefesto_dualsense4unix.interface.calibrar",
    "hefesto_dualsense4unix.interface.casamento",
    "hefesto_dualsense4unix.interface.conexoes_vivas",
    "hefesto_dualsense4unix.interface.conferir05",
    "hefesto_dualsense4unix.interface.controles_vivos",
    "hefesto_dualsense4unix.interface.exportar",
    "hefesto_dualsense4unix.interface.importar",
    "hefesto_dualsense4unix.interface.jogar_vivo",
    "hefesto_dualsense4unix.interface.mapa",
    "hefesto_dualsense4unix.interface.medir_subpaths",
    "hefesto_dualsense4unix.interface.olhar",
    "hefesto_dualsense4unix.interface.perfis_vivos",
    "hefesto_dualsense4unix.interface.regerar",
    "hefesto_dualsense4unix.interface.regua",
    "hefesto_dualsense4unix.interface.regua_estados",
    "hefesto_dualsense4unix.interface.regua_popup",
    "hefesto_dualsense4unix.interface.remapear",
    "hefesto_dualsense4unix.interface.sistema_viva",
    "hefesto_dualsense4unix.interface.ver",
]
# `ignore_errors`: relaxar só as flags de anotação deixaria queixas que não são defeito.
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
