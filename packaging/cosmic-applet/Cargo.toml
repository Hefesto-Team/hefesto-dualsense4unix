[package]
name = "hefesto-dualsense4unix-applet"
# APPLET-VERSAO-RANCOSA-01 (30/07): ficou em 0.1.0 enquanto o projeto chegou à
# 0.3.0 — o applet é o único artefato compilado da casa e anunciava versão
# errada. Esta linha é ALVO do scripts/check_version_consistency.py: subir o
# pyproject e esquecer aqui reprova a release. Ao mexer, subir também a entrada
# `hefesto-dualsense4unix-applet` do Cargo.lock (o `cargo build` do justfile
# reescreve sozinho, mas deixa a árvore suja no meio do release).
version = "0.9.3"
edition = "2021"
# Redigido no mesmo padrão do packaging/arch/PKGBUILD (`Maintainer: Vitoria
# Maria <[REDACTED]>`): havia um e-mail pessoal real aqui, e nem o
# check_anonymity.sh (não procura e-mail) nem o check_test_data.sh (só varre
# tests/) enxergam este arquivo.
authors = ["Vitoria Maria <[REDACTED]>"]
description = "Applet nativo COSMIC para gatilhos, perfis e bateria do DualSense (Hefesto - Dualsense4Unix)"
license = "MIT"
homepage = "https://github.com/vitoriamariadb/hefesto-dualsense4unix"
repository = "https://github.com/vitoriamariadb/hefesto-dualsense4unix"
keywords = ["cosmic", "applet", "dualsense", "gamepad", "wayland"]
categories = ["gui"]

[dependencies]
# Rev fixada (== a do extra-cosmic-xkill-applet, já validado no COSMIC desta
# máquina) para reaproveitar o cache de build do libcosmic e garantir paridade
# de API. Atualizar em conjunto com o xkill se a mantenedora subir a versão.
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "1d7113a", default-features = false, features = [
    "applet",
    "tokio",
    "wayland",
    "winit",
    "multi-window",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "hefesto-dualsense4unix-applet"
path = "src/main.rs"
