# AVISO MEDIDO (sprint PORTÃO-VIVO-01, bloco B): nesta máquina o
# `core.hooksPath` global aponta para ~/.config/git/hooks, e com isso o git
# NUNCA executa .git/hooks/* — a própria ferramenta `pre-commit` recusa
# instalar. Ou seja: os hooks declarados aqui não rodam no caminho do commit
# local. Pior, a MERA EXISTÊNCIA deste arquivo faz o hook global marcar
# HAS_FRAMEWORK=true e DESLIGAR as checagens próprias dele, delegando a um
# framework que não está instalado.
#
# DÍVIDA PAGA EM 28/07 (leva GUARDA-GI-REAL-01): enquanto o commit local
# continua desviado pelo `hooksPath` global, estes quatro hooks deixaram de ser
# decorativos — o job `pre-commit` do .github/workflows/ci.yml roda
# `pre-commit run --all-files` a cada push, onde `hooksPath` de ninguém
# alcança. Quatro portões declarados, quatro portões vivos.
#
# Continua valendo: no caminho do COMMIT desta máquina, quem protege é o CI, e
# não este arquivo. Rode `pre-commit run --all-files` à mão antes de empurrar
# se quiser a resposta sem esperar o runner.
repos:
  - repo: local
    hooks:
      # GATE-ACENTO-MULTIARQUIVO-01 (29/07): o `pre-commit` APENDA todos os
      # arquivos staged a este entry. Até esta data `--check-file` aceitava um
      # valor só: o argparse ficava com o primeiro nome e o script descartava
      # os demais em silêncio — com N arquivos no commit, N-1 passavam sem
      # checagem nenhuma. A flag agora aceita N caminhos e reprova se QUALQUER
      # um falhar; regressão coberta por
      # tests/unit/test_validar_acentuacao_multiplos_arquivos.py.
      - id: acentuacao-strict
        name: Acentuação PT-BR estrita
        entry: python3 scripts/validar-acentuacao.py --check-file
        language: system
        types: [text]
        exclude: '^(tests/fixtures/|tests/unit/test_validar_acentuacao\.py$|docs/history/|docs/research/|docs/process/agentes/|LICENSE$|NOTICE$|CHANGELOG\.md$|VALIDATOR_BRIEF\.md$|AGENTS\.md$|scripts/validar-acentuacao\.py$|scripts/check_anonymity\.sh$)'
      # PORTÃO-VIVO-01 bloco C / GATE-EMOJI-01: o higienizador do ambiente
      # apaga glifo em silêncio e NÃO reprova — inclusive os glifos que o
      # ADR-011 declara permitidos (Geometric Shapes, Box Drawing, Block
      # Elements, Arrows). Este hook é o que reprova. As exclusões seguem o
      # mesmo princípio do gate de acentuação: o próprio validador e o teste
      # dele precisam conter os casos que detectam.
      - id: glifos
        name: Glifos (emoji proibido, forma geométrica preservada)
        entry: python3 scripts/validar-glifos.py
        language: system
        types: [text]
        exclude: '^(tests/fixtures/|tests/unit/test_validar_glifos\.py$|docs/history/|docs/research/|scripts/validar-glifos\.py$|CHANGELOG\.md$)'
      - id: anonimato
        name: Anonimato (sem menção a IA)
        entry: bash scripts/check_anonymity.sh
        language: system
        pass_filenames: false
      # DOC-VERDADE-02 / E10 (01/08): o portão de referências já tinha job
      # próprio no CI (`referencias-docs`), mas era o ÚNICO dos quatro gates de
      # documento fora daqui — quem rodasse `pre-commit run --all-files` à mão
      # antes de empurrar recebia um verde que não incluía a documentação.
      # Como ele varre a árvore inteira e não os arquivos staged, entra com
      # `pass_filenames: false` e `--all`: passar só o que mudou deixaria
      # passar a mentira que mora no documento que ninguém tocou, que é
      # justamente como as três desta sprint sobreviveram.
      - id: referencias-docs
        name: Referências de documento (arquivo, env e método de IPC)
        entry: python3 scripts/validar-referencias-docs.py --all
        language: system
        pass_filenames: false
      # PALAVRA-01 / E5 (13/08/2026): a sprint pedia "um gate, para não voltar"
      # e ele nunca foi escrito — a seção E5 estava aberta desde 27/07. O
      # portão varre o `main.glade` e reprova rótulo que começa em minúscula
      # (fora de uma lista de exceções com razão e data) e rótulo que carrega
      # jargão aposentado pela E3.
      #
      # `pass_filenames: false` e `always_run: true` pelo mesmo motivo dos dois
      # hooks acima: o portão também confere que a lista de exceções e a de
      # dívida não envelheceram — e essa pergunta é sobre o arquivo INTEIRO,
      # não sobre o que está staged. Filtrar por arquivo deixaria a lista
      # apodrecer calada, que é o defeito que ela existe para não ter.
      - id: palavra-de-tela
        name: Palavra de tela (maiúscula no rótulo, jargão aposentado fora)
        entry: python3 scripts/validar-palavra-de-tela.py --all
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff check
        entry: ruff check
        language: system
        types: [python]
      # ÍCONE-VIVO-01 (03/08): o `scripts/gerar_icones.sh` declara, no próprio
      # cabeçalho, que `--check` "é o que o CI roda" — e NENHUM workflow o
      # chamava. É a família do PORTÃO-VIVO-01 (o gate que se anuncia e não
      # roda). A divergência só aparecia no `pytest`
      # (`test_icones_refletem_o_svg`), minutos depois do commit e longe do
      # gesto que a causou: mexer no `assets/hefesto-logo.svg`.
      #
      # Este hook CONFERE, nunca gera. Regenerar automaticamente poria PNG
      # binário no commit sem ninguém ver — e esta casa já pagou por ferramenta
      # que edita arquivo sozinha (o higienizador que apagava glifo permitido).
      # Os quatro hooks acima também são validadores; nenhum escreve.
      #
      # `pass_filenames: false` porque o script varre o par SVG→PNGs inteiro, e
      # `always_run: true` porque a divergência nasce de um arquivo (o SVG) e se
      # manifesta em outros (os PNGs) — filtrar por arquivo staged deixaria
      # passar exatamente o caso que motivou o hook.
      - id: icones-refletem-o-svg
        name: Ícones derivados do SVG (rode scripts/gerar_icones.sh)
        entry: bash scripts/gerar_icones.sh --check
        language: system
        pass_filenames: false
        always_run: true
      # PARIDADE-PORTAO-01 (11/08): o `scripts/gerar-mapa.py` declara `--check`
      # no próprio cabeçalho ("só verifica se está atualizado") e NENHUM
      # workflow, hook ou teste o chamava. Mesma família do hook acima, e a
      # forma é a mesma pelo mesmo motivo: a divergência nasce num arquivo (o
      # CSV, ou um dos três SVG) e se manifesta em OUTRO (o specs.html), então
      # filtrar por arquivo staged deixaria passar exatamente o caso que
      # motivou o hook. Confere, nunca gera — regenerar poria centenas de KB de
      # HTML no commit sem ninguém ver.
      #
      # MAPA-CONTEUDO-01 (12/08): ele comparava MTIME, e mtime dava verde falso
      # aqui também — basta uma ferramenta TOCAR o specs.html depois da geração
      # (o `--fix` do validar-acentuacao reescreve arquivos) para ele nascer
      # "mais novo" que as fontes. Hoje regenera em memória e compara o
      # CONTEÚDO, então vale igual aqui e no runner.
      - id: mapa-de-canais-publicado
        name: specs.html reflete o CSV e os desenhos (rode scripts/gerar-mapa.py)
        entry: python3 scripts/gerar-mapa.py --check
        language: system
        pass_filenames: false
        always_run: true
      # IPC-DOC-GERADO-01 (13/08): mesma forma, mesmo motivo. A divergência
      # nasce num arquivo (`daemon/ipc_server.py`) e se manifesta em OUTRO
      # (`docs/protocol/ipc-unix-socket.md`), então filtrar por arquivo staged
      # deixaria passar exatamente o caso que motivou o hook — o método novo
      # registrado no dispatcher sem uma linha de contrato.
      #
      # A tabela de curvas próprias (`scripts/gerar-tabela-de-curvas.py`) NÃO
      # está aqui, e é decisão, não esquecimento: ela importa um módulo pydantic
      # e o `language: system` roda o Python pelado de quem commita. Um hook que
      # explode no import é um hook desligado na semana seguinte. Ela vive no job
      # `lint-test` do CI, que instala as dependências, e no teste que a suíte
      # roda sempre.
      - id: contrato-ipc-publicado
        name: o contrato IPC reflete o dispatcher (rode scripts/gerar-contrato-ipc.py)
        entry: python3 scripts/gerar-contrato-ipc.py --check
        language: system
        pass_filenames: false
        always_run: true
      # CITACOES-DERIVADAS-01 (13/08): o irmão de linha do
      # `validar-referencias-docs`. Aqui ele pega o endereço podre no mesmo
      # commit que o produziu, que é quando o conserto custa um minuto.
      - id: citacoes-de-linha-abrem
        name: toda citação `arquivo:linha` de docs/protocol/ abre no que promete
        entry: python3 scripts/validar-citacoes-de-linha.py --all
        language: system
        pass_filenames: false
        always_run: true
