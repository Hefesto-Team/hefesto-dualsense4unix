# ---------------------------------------------------------------------------
# REGISTRA — o que se guarda e não se corrige
# ---------------------------------------------------------------------------
[[regra]]
caminho = "docs/process/**"
zona = "REGISTRA"
razao = """3,2 milhões de palavras de registro histórico, 16,9 vezes o que
ENSINA. Não é versionado (.gitignore), e mesmo assim a regra fica escrita: é a
primeira coisa que um mutirão bem intencionado traduziria."""

[[regra]]
caminho = "docs/history/**"
zona = "REGISTRA"
razao = "história do projeto; não se reescreve para ficar coerente."

[[regra]]
caminho = "docs/research/**"
zona = "REGISTRA"
razao = "material de pesquisa bruto, guardado como veio."

[[regra]]
caminho = "docs/*.txt"
zona = "REGISTRA"
razao = "listas herdadas (etiquetas pré-1.0), guardadas como estavam."

[[regra]]
caminho = "CHANGELOG.md"
zona = "REGISTRA"
razao = "é história de versão; corrigir o passado apagaria o que aconteceu."

[[regra]]
caminho = "arquivados/**"
zona = "REGISTRA"
razao = "o que saiu do produto e ficou guardado com a razão."

[[regra]]
caminho = "captures/**"
zona = "REGISTRA"
razao = "capturas de HID: prova bruta, e prova não se edita."

[[regra]]
caminho = "LICENSE"
zona = "REGISTRA"
razao = "texto legal: traduzir licença sem advogado é criar outra licença."

[[regra]]
caminho = "NOTICE"
zona = "REGISTRA"
razao = "idem LICENSE."

[[regra]]
caminho = "LICENSES/**"
zona = "REGISTRA"
razao = "idem LICENSE."

# ---------------------------------------------------------------------------
# CODIGO — símbolo, endereço, teste, script, artefato
# ---------------------------------------------------------------------------
[[regra]]
caminho = "po/**"
zona = "CODIGO"
razao = """o catálogo é o DESTINO da tradução, não o corpo a traduzir. Traduzir
o .po é o ato; contá-lo como texto a traduzir contaria o trabalho duas vezes."""

[[regra]]
caminho = "**/locale/**"
zona = "CODIGO"
razao = "os .mo compilados são artefato gerado do catálogo."

[[regra]]
caminho = "tests/**"
zona = "CODIGO"
razao = """13.668 frases em português, 3,3 vezes a prosa do produto inteiro. É
saudável — nesta casa o teste explica por que morde —, mas um extrator que
varra **/*.py pega tests/ PRIMEIRO, e o tradutor receberia a suíte antes do
produto. A fronteira tem de dizer isto por escrito e por regra."""

[[regra]]
caminho = "scripts/**"
zona = "CODIGO"
razao = """portões e ferramentas da casa: 138 arquivos que não viajam para quem
usa. FURO DECLARADO: parte deles fala com quem INSTALA, e a zona por caminho
não vê isso. Medir antes de mudar."""

[[regra]]
caminho = "src/**"
zona = "CODIGO"
razao = """o produto por dentro. O que dele é TELA já casou acima; o resto é
símbolo, e nome de símbolo não se traduz."""

[[regra]]
caminho = "packaging/**"
zona = "CODIGO"
razao = "receitas de empacotamento e o applet Rust; contrato, não prosa."

[[regra]]
caminho = "flatpak/**"
zona = "CODIGO"
razao = "manifesto de empacotamento."

[[regra]]
caminho = "assets/**"
zona = "CODIGO"
razao = """regras de udev, units, módulos DKMS, ícones e as folhas de dado de
estilo de jogo. O que deles aparece na tela é lido pelo produto, não copiado."""

[[regra]]
caminho = "*.py"
zona = "CODIGO"
razao = "script na raiz da árvore (bancada.py)."

[[regra]]
caminho = "*.sh"
zona = "CODIGO"
razao = "os lançadores e o install na raiz da árvore."

[[regra]]
caminho = "*.toml"
zona = "CODIGO"
razao = "configuração de projeto."

[[regra]]
caminho = "*.nix"
zona = "CODIGO"
razao = "receita de ambiente."

[[regra]]
caminho = "*.yaml"
zona = "CODIGO"
razao = "configuração na raiz (pre-commit)."

[[regra]]
caminho = "*.txt"
zona = "CODIGO"
razao = "requirements na raiz."

[[regra]]
