# zonas-de-lingua.toml — A FRONTEIRA DA TRADUÇÃO, POR REGRA.
#
# TRADUZIR-O-PROJETO-01, 20/09/2026. Todo arquivo de texto deste repositório
# resolve para UMA de quatro zonas, e a zona diz se ele se traduz:
#
#   TELA      o que a pessoa que USA lê.                          traduz
#   ENSINA    o que a pessoa de FORA lê para aprender.            decisão dela
#   REGISTRA  o que se guarda e não se corrige.                   não traduz
#   CODIGO    símbolo, endereço, teste, script, artefato.         não traduz
#
# POR QUE REGRA, E NÃO LISTA DE ARQUIVO
# --------------------------------------
# Lista de arquivo envelhece a cada arquivo novo, e esta casa já pagou por
# isso: `docs/data/frases-de-tela-25-08.json` é uma enumeração congelada num
# mundo que acabou — ela cita a ordem das abas "medida do main.glade", e o
# main.glade saiu do disco em 06/09/2026. Régua LÊ, nunca DIGITA o que devia
# ler do fonte, e uma regra de caminho é a forma mais fraca de leitura que
# ainda é leitura.
#
# Custo para quem escreve: UMA linha aqui, uma vez por padrão novo de caminho —
# não por arquivo. É o "organicamente" que ela pediu.
#
# NÃO HÁ REGRA PEGA-TUDO, E ISSO É O PONTO. Arquivo que não casa nenhuma regra
# REPROVA, pedindo uma regra. Aceitar o não-classificado como CODIGO por
# omissão faria a próxima pessoa nunca mais declarar zona nenhuma, e a
# fronteira deixaria de existir sem ninguém decidir isso.
#
# O FURO DESTA MEDIDA, DECLARADO: a zona responde sobre ONDE O ARQUIVO MORA,
# não sobre COM QUEM ELE FALA. O `install.sh` fala português com quem instala e
# cai em CODIGO; o `doctor` também. Medir quantas dessas frases chegam ao
# terminal de quem instala — por leitura do fonte, nunca por execução — é
# trabalho declarado na TRADUZIR-O-PROJETO-01 e não foi feito aqui.
#
# A ORDEM IMPORTA: vence a PRIMEIRA regra que casa. Por isso o específico vem
# antes do geral, e o geral de cada pasta vem no fim do bloco dela.
#
# Sintaxe do padrão: glob sobre o caminho relativo à raiz, com `*` que não
# atravessa `/` e `**` que atravessa.

# ---------------------------------------------------------------------------
# A FORMA DO ENDEREÇO DE TRADUÇÃO — quem preenche é a I18N-DA-TELA-NOVA-01
# ---------------------------------------------------------------------------
# A catraca da tela conta "unidade de texto SEM endereço de tradução". Para
# contar isso é preciso saber o que é TER endereço — e a forma do endereço
# (`_()` no gerador, `data-i18n="chave"` no HTML, catálogo por chave, ou outra
# coisa) é decisão da I18N-DA-TELA-NOVA-01, não desta tabela.
#
# ENQUANTO ESTA SEÇÃO NÃO EXISTIR COM `atributo` OU `chamada`, a medida da tela
# se declara INDISPONÍVEL e o piso dela fica em PENDENTE. Ela não devolve zero:
# zero se lê como verde, e verde sobre uma medida desligada é o defeito que
# esta casa mediu em quatro instrumentos diferentes.
#
# Quem definir a forma acrescenta a seção abaixo, e a catraca passa a medir
# sozinha — sem que ninguém edite uma linha de Python:
#
#     [endereco_de_traducao]
#     atributo = "data-i18n"         # o atributo que marca o nó endereçado
#     chamada  = "_"                 # a função que marca o literal endereçado
#     definido_em = "I18N-DA-TELA-NOVA-01, DD/MM/AAAA"
#
# A seção está AUSENTE de propósito. Ausência é resposta: hoje não há forma de
# endereço neste projeto, e dizer "zero frases sem endereço" seria mentira.

# ---------------------------------------------------------------------------
# TELA — o que a pessoa que usa lê
# ---------------------------------------------------------------------------
[[regra]]
caminho = "src/hefesto_dualsense4unix/interface/paginas/**"
zona = "TELA"
razao = "as dez abas publicadas: é o HTML que o WebKit2.WebView renderiza."

[[regra]]
caminho = "src/hefesto_dualsense4unix/interface/pacotes/**"
zona = "TELA"
razao = "os pacotes escrevem texto na tela em tempo de execução."

[[regra]]
caminho = "src/hefesto_dualsense4unix/interface/aba*.py"
zona = "TELA"
razao = "os geradores das dez abas: a frase nasce aqui e vai para o HTML."

[[regra]]
caminho = "src/hefesto_dualsense4unix/interface/frases_que_ela_baniu.py"
zona = "TELA"
razao = "a lista de palavras que a tela não diz é parte do texto da tela."

[[regra]]
caminho = "mockup/**/*.html"
zona = "TELA"
razao = "o desenho que ela aprovou; a direção é mockup/ -> produto."

[[regra]]
caminho = "**/*.desktop"
zona = "TELA"
razao = """o lançador mostra Name e Comment na dock ANTES de a janela existir.
A régua que parasse na borda do <body> não alcançaria isto, e a tela dela não
para no <body> — foi assim que a frase banida apareceu na dica do .desktop."""

[[regra]]
caminho = "**/*.metainfo.xml"
zona = "TELA"
razao = "a loja de aplicativos mostra este texto a quem nunca abriu o produto."

