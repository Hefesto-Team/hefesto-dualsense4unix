@media (max-width:820px){.baixo{grid-template-columns:1fr}}
ul.lista{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:78ch}
ul.lista li{display:flex;gap:12px;align-items:flex-start}
.marca{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--borda);margin-top:2px;display:grid;place-items:center;font-size:13px;color:#191a21}
li.riscado .marca{background:var(--verde);border-color:var(--verde)}

.porque{display:block;font-size:13px;color:var(--laranja);margin-top:2px}
.olhar{margin:18px 0 0;color:var(--suave);font-size:14px;max-width:78ch}
.validar{display:grid;gap:12px;align-content:start}
.votos{display:flex;gap:10px}
.votos button{flex:1;background:var(--painel);border:1px solid var(--borda);color:var(--fg);border-radius:10px;padding:9px 0;font-weight:600}
.votos button[aria-pressed=true][data-v=aprova]{background:rgba(80,250,123,.16);border-color:var(--verde);color:var(--verde)}

textarea{width:100%;min-height:96px;field-sizing:content;resize:vertical;background:var(--painel);color:var(--fg);border:1px solid var(--borda);border-radius:10px;padding:12px 14px;font:15px/1.55 Inter,sans-serif}
textarea:focus{outline:none;border-color:var(--roxo-claro)}
</style>
</head>

<script id="respostas-salvas" type="application/json">{}</script>
<script>
(async () => {
  const DADOS = JSON.parse(document.getElementById('dados').textContent);
  let RESP = {};
  try { RESP = JSON.parse(document.getElementById('respostas-salvas').textContent || '{}') || {}; } catch (e) { RESP = {}; }
  const SERVIDO = location.protocol.startsWith('http');
  const API = SERVIDO ? '' : 'http://127.0.0.1:8766';
  const TODO = 'todo/';
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(`${API}/respostas`, {signal: ctl.signal}); clearTimeout(t);
    if (r.ok) { const s = await r.json(); if (s && typeof s === 'object') RESP = s; }
  } catch (e) { /* vale a embutida */ }
  const el = (tag, attrs = {}, ...filhos) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const f of filhos) if (f != null) e.append(f);
    return e;
  };
  let relogio = null;
  const dd = (n) => String(n).padStart(2, '0');
  async function salvar() {
    const s = document.getElementById('estado');
    try {
      const r = await fetch(`${API}/respostas`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(RESP)});
      if (!r.ok) throw new Error(String(r.status));
      const a = new Date();
      s.className = 'ok'; s.textContent = `Salvo às ${dd(a.getHours())}:${dd(a.getMinutes())}`;
    } catch (e) {
      try { localStorage.setItem('hefesto-volta-r2', JSON.stringify(RESP)); } catch (x) { /* sem armazenamento */ }
      s.className = 'erro'; s.textContent = 'Guardado só neste navegador: o servidor da página está fora do ar.';
    }
  }
  const mexeu = () => { clearTimeout(relogio); relogio = setTimeout(salvar, 700); atualizar(); };
  function atualizar() {
    let feitas = 0;
    for (const a of DADOS.abas) {
      const v = RESP[`r2-${a.cod}`]?.voto;
      if (v) feitas++;
      document.querySelector(`nav a[href="#${a.id}"]`)?.classList.toggle('feito', !!v);
    }
    document.getElementById('conta').textContent = `${feitas} de ${DADOS.abas.length} abas validadas`;
  }
  const main = document.getElementById('abas');
  const nav = document.getElementById('sumario');
  for (const a of DADOS.abas) {
    const chave = `r2-${a.cod}`;
    const r = RESP[chave] || (RESP[chave] = {voto: '', texto: ''});
    nav.append(el('a', {href: `#${a.id}`, text: a.nome}));
    const riscados = a.itens.filter(i => i.riscado).length;
    const votos = el('div', {class: 'votos'});
    for (const [v, rot] of [['aprova', 'Aprovo'], ['ajustar', 'Ajustar']]) {
      const b = el('button', {type: 'button', 'data-v': v, 'aria-pressed': String(r.voto === v), text: rot,
        onclick: () => {
          r.voto = r.voto === v ? '' : v;
          for (const x of votos.children) x.setAttribute('aria-pressed', String(r.voto === x.dataset.v));
          mexeu();
        }});
      votos.append(b);
    }
    const campo = el('textarea', {placeholder: 'O que você achou desta aba', 'aria-label': `Sua validação da aba ${a.nome}`});
    campo.value = r.texto || '';
    campo.addEventListener('input', () => { r.texto = campo.value; mexeu(); });
    main.append(el('section', {id: a.id},
      el('div', {class: 'cab'},
        el('h2', {text: a.nome}),
        el('span', {class: 'placar', text: a.itens.length ? `${riscados} de ${a.itens.length} conferidos na tela` : ''}),
        el('a', {class: 'abrir', href: TODO + a.vivo, target: '_blank', rel: 'noopener', text: 'Abrir e clicar'})),
      el('div', {class: 'fotos'},
        el('figure', {}, el('figcaption', {text: 'Antes'}), el('img', {src: `${TODO}fotos/${a.id}-antes.png`, alt: `${a.nome}, antes`, loading: 'lazy'})),
        el('figure', {}, el('figcaption', {text: 'Depois'}), el('img', {src: `${TODO}fotos/${a.id}-depois.png`, alt: `${a.nome}, depois`, loading: 'lazy'}))),
      el('div', {class: 'baixo'},
        el('div', {},
          el('ul', {class: 'lista'}, ...a.itens.map(i => el('li', {class: i.riscado ? 'riscado' : ''},
            el('span', {class: 'marca', 'aria-hidden': 'true'}),
            el('span', {}, el('span', {class: 'txt', text: i.texto}),
              !i.riscado && i.porque ? el('span', {class: 'porque', text: i.porque}) : null)))),
          a.olhar ? el('p', {class: 'olhar', text: a.olhar}) : null),
        el('div', {class: 'validar'}, votos, campo))));
  }
  atualizar();
  window.addEventListener('pagehide', () => {
    try { navigator.sendBeacon(`${API}/respostas`, new Blob([JSON.stringify(RESP)], {type: 'text/plain'})); } catch (e) { /* fica */ }
  });
})();
</script>
