.r3 .validar{margin-top:18px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}

.votos button[aria-pressed=true][data-v=A],.votos button[aria-pressed=true][data-v=B]{background:rgba(189,147,249,.18);border-color:var(--roxo-claro);color:var(--roxo-claro)}
.r3 textarea{min-height:56px}
nav a.r3n{border:1px solid rgba(189,147,249,.35)}
</style>

, "porque": ""}, {"n": 7, "texto": "Nenhum «?» nos títulos nem nas janelas de mapear", "riscado": true, "porque": ""}, {"n": 8, "texto": "«Meio sufocado» diz Starlight Blue, não P2", "riscado": true, "porque": ""}, {"n": 9, "texto": "Rádio e adaptadores aberta cabe sem rolagem", "riscado": true, "porque": ""}, {"n": 10, "texto": "As barras dos adaptadores começam e acabam na mesma reta", "riscado": true, "porque": ""}, {"n": 11, "texto": "O × dos cartões fica na mesma reta do «Ver no mapa»", "riscado": true, "porque": ""}, {"n": 12, "texto": "Os cartões dos controles perdem os botões de perfil; o perfil se escolhe na aba Sistema", "riscado": true, "porque": ""}], "olhar": "Os cartões terminam no «A luz não acende», a 13 px dos dois lados, sem nenhum botão de perfil (0 na tela)."}, {"id": "09", "cod": "09", "nome": "Sistema", "vivo": "09-sistema.html", "itens": [{"n": 1, "texto": "O Status sem «?»; a dica aparece no hover", "riscado": true, "porque": ""}, {"n": 2, "texto": "«Serviço» passa a se chamar «Funcionamento do app»", "riscado": true, "porque": ""}, {"n": 3, "texto": "Coluna nova Interface: Padrão, Confortável, Espaçoso", "riscado": true, "porque": ""}, {"n": 4, "texto": "Colunas: Funcionamento, Interface, Bateria, Saúde do app", "riscado": true, "porque": ""}, {"n": 5, "texto": "Um botão só: «Permitir correções automáticas»", "riscado": true, "porque": ""}, {"n": 6, "texto": "«Iniciar com o sistema» fica embaixo das correções", "riscado": true, "porque": ""}, {"n": 7, "texto": "«Restaurar de fábrica» com borda vermelha", "riscado": true, "porque": ""}, {"n": 8, "texto": "Doctor, Fixar Proton e Corrigir Vulkan saem como botões", "riscado": true, "porque": ""}, {"n": 9, "texto": "O botão direito abre o menu das abas", "riscado": true, "porque": ""}, {"n": 10, "texto": "O registro diz Cosmic Red e Starlight Blue, não p1 e p2", "riscado": true, "porque": ""}, {"n": 11, "texto": "«Parar o serviço» passa a dizer «Parar»", "riscado": true, "porque": ""}], "olhar": ila das abas diz «Lançadores», o seletor do topo diz P1/P2 e o cabeçalho da tabela não ordena."}, {"id": "mapa-das-portas", "cod": "portas", "nome": "Mapa das portas", "vivo": "mapa-das-portas.html", "itens": [{"n": 1, "texto": "O «?» das sugestões vira dica no título", "riscado": true, "porque": ""}, {"n": 2, "texto": "O botão direito abre o menu das abas", "riscado": true, "porque": ""}, {"n": 3, "texto": "Os botões trazem dica curta no hover", "riscado": true, "porque": "Atual, Sugestões, Adicionar, Registro e os chips Wi-Fi/Webcam/Mouse/Bluetooth sem entrada não têm dica; as da cadeia são técnicas («Driver: btusb»)."}, {"n": 4, "texto": "A cadeia fala com você: «Na Entrada 4. Clique para trocar», sem nome de driver", "riscado": true, "porque": ""}], "olhar": "Legível e bem dividida; as dicas da cadeia falam «Driver: hub/btusb», e Atual, Sugestões, Adicionar, Registro e os chips sem entrada não têm dica."}, {"id": "mapa-do-radio", "cod": "radio", "nome": "Mapa do rádio", "vivo": "mapa-do-radio.html", "itens": [{"n": 1, "texto": "O «?» do espectro sai; a dica fica no título", "riscado": true, "porque": ""}, {"n": 2, "texto": "O botão direito abre o menu das abas", "riscado": true, "porque": ""}, {"n": 3, "texto": "Os botões trazem dica curta no hover", "riscado": true, "porque": "«Conectar» não tem dica; os outros botões têm."}, {"n": 4, "texto": "As barras dos adaptadores começam e acabam na mesma reta", "riscado": true, "porque": ""}, {"n": 5, "texto": "Os aparelhos do adaptador aberto têm o mesmo respiro dos dois lados", "riscado": true, "porque": ""}], "olhar": "Compacta e clara; ~210px vazios embaixo, «Conectar» sem dica e os jogadores por nome, não pela cor."}, {"id": "calibrar-sensores", "cod": "cal", "nome": "Calibrar giroscópio", "vivo": "calibrar-sensores.html", "itens": [{"n": 1, "texto": "Título vira «Calibrar giroscópio»", "riscado": true, "porque": ""}, {"n": 2, "texto": "Sem «?»: a dica aparece no mouse ou no foco", "riscado": true, "porque": ""}, { <script id="respostas-salvas" type="application/json">{}</script>
<script>
(async () => {
  const DADOS = JSON.parse(document.getElementById('dados').textContent);
  let RESP = {};
  try { RESP = JSON.parse(document.getElementById('respostas-salvas').textContent || '{}') || {}; } catch (e) { RESP = {}; }
  const SERVIDO = location.protocol.startsWith('http');
  const API = SERVIDO ? '' : 'http://127.0.0.1:8766';
  const TODO = 'todo/';
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(`${API}/respostas`, {signal: ctl.signal}); clearTimeout(t);
    if (r.ok) { const s = await r.json(); if (s && typeof s === 'object') RESP = s; }
  } catch (e) { /* vale a embutida */ }
  const el = (tag, attrs = {}, ...filhos) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const f of filhos) if (f != null) e.append(f);
    return e;
  };
  let relogio = null;
  const dd = (n) => String(n).padStart(2, '0');
  async function salvar() {
    const s = document.getElementById('estado');
    try {
      const r = await fetch(`${API}/respostas`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(RESP)});
      if (!r.ok) throw new Error(String(r.status));
      const a = new Date();
      s.className = 'ok'; s.textContent = `Salvo às ${dd(a.getHours())}:${dd(a.getMinutes())}`;
    } catch (e) {
      try { localStorage.setItem('hefesto-volta-r2', JSON.stringify(RESP)); } catch (x) { /* sem armazenamento */ }
      s.className = 'erro'; s.textContent = 'Guardado só neste navegador: o servidor da página está fora do ar.';
    }
  }
  const mexeu = () => { clearTimeout(relogio); relogio = setTimeout(salvar, 700); atualizar(); };
  function atualizar() {
    let feitas = 0;
    for (const a of DADOS.abas) {
      const v = RESP[`r2-${a.cod}`]?.voto;
      if (v) feitas++;
      document.querySelector(`nav a[href="#${a.id}"]`)?.classList.toggle('feito', !!v);
    }
    const R3m = JSON.parse(document.getElementById('dados-r3').textContent).mudancas;
    const f3 = R3m.filter(m => RESP[`r3-${m.aba}-${m.n}`]?.voto).length;
    document.getElementById('conta').textContent = `${f3} de ${R3m.length} mudanças da rodada 3 · ${feitas} de ${DADOS.abas.length} abas da rodada 2`;
  }
  const main = document.getElementById('abas');
  const nav = document.getElementById('sumario');
  const R3 = JSON.parse(document.getElementById('dados-r3').textContent);
  const caixa3 = document.getElementById('r3');
  const fig = (rot, src, alt) => el('figure', {}, el('figcaption', {text: rot}), el('img', {src: `${TODO}fotos/${src}`, alt, loading: 'lazy'}));
  caixa3.append(el('h2', {class: 'rodada', text: 'Rodada 3 (13/10): as suas escolhas, uma a uma'}),
    el('p', {class: 'r3-intro', text: 'Cada cartão é uma mudança que nasceu de uma escolha sua de 13/10, com a foto de antes e a de depois; a parte nova está contornada de rosa. Onde a sua resposta deixou duas leituras, as duas estão lado a lado, e você escolhe A ou B. Nenhuma página rola em 1212x809, 1212x740 nem 1918x840.'}));
  nav.append(el('a', {href: '#r3', class: 'r3n', text: 'Rodada 3'}));
  for (const m of R3.mudancas) {
    const chave = `r3-${m.aba}-${m.n}`;
    const r = RESP[chave] || (RESP[chave] = {voto: '', texto: ''});
    const opcoes = m.leituras ? [['A', 'Fico com A'], ['B', 'Fico com B'], ['ajustar', 'Ajustar']] : [['aprova', 'Aprovo'], ['ajustar', 'Ajustar']];
    const votos = el('div', {class: 'votos'});
    for (const [v, rot] of opcoes) votos.append(el('button', {type: 'button', 'data-v': v, 'aria-pressed': String(r.voto === v), text: rot,
      onclick: () => { r.voto = r.voto === v ? '' : v; for (const x of votos.children) x.setAttribute('aria-pressed', String(r.voto === x.dataset.v)); mexeu(); }}));
    const campo = el('textarea', {placeholder: 'O que você achou desta mudança', 'aria-label': `Sua validação da mudança ${m.n} de ${m.nome}`});
    campo.value = r.texto || '';
    campo.addEventListener('input', () => { r.texto = campo.value; mexeu(); });
    const leit = m.leituras ? [el('p', {class: 'pergunta', text: m.pergunta}),
      el('div', {class: 'par'}, ...Object.entries(m.leituras).map(([k, L]) => el('figure', {class: 'leitura'},
        el('figcaption', {}, el('b', {text: k}), L.o_que, ' · ', el('a', {href: TODO + L.pagina, target: '_blank', rel: 'noopener', text: 'abrir'})),
        el('img', {src: `${TODO}fotos/${L.foto}`, alt: `Leitura ${k}`, loading: 'lazy'}))))] : [];
    caixa3.append(el('section', {class: 'r3', id: chave},
      el('div', {class: 'cab'}, el('h2', {text: `${m.nome} · mudança ${m.n}`}), el('span', {class: 'etq', text: m.origem_tela}),
        el('a', {class: 'abrir', href: TODO + m.pagina, target: '_blank', rel: 'noopener', text: 'Abrir e clicar'})),
      el('span', {class: 'sprint', text: m.sprint}),
      el('p', {class: 'muda', text: m.o_que_muda}),
      el('div', {class: 'par'}, fig(m.antes_rot, m.antes, `${m.nome}, antes`), fig('Depois', m.depois, `${m.nome}, depois`)),
      ...leit,
      el('div', {class: 'validar'}, votos, campo)));
  }
  for (const a of DADOS.abas) {
    const chave = `r2-${a.cod}`;
    const r = RESP[chave] || (RESP[chave] = {voto: '', texto: ''});
    nav.append(el('a', {href: `#${a.id}`, text: a.nome}));
    const riscados = a.itens.filter(i => i.riscado).length;
    const votos = el('div', {class: 'votos'});
    for (const [v, rot] of [['aprova', 'Aprovo'], ['ajustar', 'Ajustar']]) {
      const b = el('button', {type: 'button', 'data-v': v, 'aria-pressed': String(r.voto === v), text: rot,
        onclick: () => {
          r.voto = r.voto === v ? '' : v;
          for (const x of votos.children) x.setAttribute('aria-pressed', String(r.voto === x.dataset.v));
          mexeu();
        }});
      votos.append(b);
    }
    const campo = el('textarea', {placeholder: 'O que você achou desta aba', 'aria-label': `Sua validação da aba ${a.nome}`});
    campo.value = r.texto || '';
    campo.addEventListener('input', () => { r.texto = campo.value; mexeu(); });
    main.append(el('section', {id: a.id},
      el('div', {class: 'cab'},
        el('h2', {text: a.nome}),
        el('span', {class: 'placar', text: a.itens.length ? `${riscados} de ${a.itens.length} conferidos na tela` : ''}),
        el('a', {class: 'abrir', href: TODO + a.vivo, target: '_blank', rel: 'noopener', text: 'Abrir e clicar'})),
      el('div', {class: 'fotos'},
        el('figure', {}, el('figcaption', {text: 'Antes'}), el('img', {src: `${TODO}fotos/${a.id}-antes.png`, alt: `${a.nome}, antes`, loading: 'lazy'})),
        el('figure', {}, el('figcaption', {text: 'Depois'}), el('img', {src: `${TODO}fotos/${a.id}-depois.png`, alt: `${a.nome}, depois`, loading: 'lazy'}))),
      el('div', {class: 'baixo'},
        el('div', {},
          el('ul', {class: 'lista'}, ...a.itens.map(i => el('li', {class: i.riscado ? 'riscado' : ''},
            el('span', {class: 'marca', 'aria-hidden': 'true'}),
            el('span', {}, el('span', {class: 'txt', text: i.texto}),
              !i.riscado && i.porque ? el('span', {class: 'porque', text: i.porque}) : null)))),
          a.olhar ? el('p', {class: 'olhar', text: a.olhar}) : null),
        el('div', {class: 'validar'}, votos, campo))));
  }
  atualizar();
  window.addEventListener('pagehide', () => {
    try { navigator.sendBeacon(`${API}/respostas`, new Blob([JSON.stringify(RESP)], {type: 'text/plain'})); } catch (e) { /* fica */ }
  });
})();
</script>
