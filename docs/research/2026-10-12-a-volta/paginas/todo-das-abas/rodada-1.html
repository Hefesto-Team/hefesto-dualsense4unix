<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A volta do todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#191a21; --app-bg:#21222c; --painel:#282a36; --painel-2:#2f3240; --borda:#44475a; --borda-2:#565a70;
  --fg:#f8f8f2; --suave:#c8ccda; --comment:#8896c4;
  --roxo:#8B00FF; --roxo-claro:#bd93f9; --roxo-fundo:rgba(139,0,255,.16);
  --cyan:#8be9fd; --green:#50fa7b; --orange:#ffb86c; --pink:#ff79c6; --red:#ff5555; --yellow:#f1fa8c;
  --raio:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
a{color:var(--cyan)}
.mono,code{font-family:'JetBrains Mono',monospace}
.casca{max-width:none;margin:0;padding:0 28px}
button{font:inherit;color:inherit;cursor:pointer}

/* topo */
header.topo{position:sticky;top:0;z-index:10;background:rgba(25,26,33,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda)}
.topo .casca{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-top:12px;padding-bottom:12px}
.marca{display:flex;align-items:baseline;gap:10px;flex:1 1 340px;min-width:0}
.marca h1{margin:0;font-size:20px;font-weight:700;color:var(--roxo-claro);white-space:nowrap}
.marca p{margin:0;color:var(--suave);font-size:13.5px}
.numeros{display:flex;gap:8px;flex-wrap:wrap}
.num{background:var(--painel);border:1px solid var(--borda);border-radius:8px;padding:3px 10px;font-size:13px;color:var(--suave);white-space:nowrap}
.num b{color:var(--fg);font-family:'JetBrains Mono',monospace;font-weight:500;margin-right:4px}
.salvar{display:flex;align-items:center;gap:10px;margin-left:auto}
.btn-salvar{background:var(--roxo);border:0;border-radius:8px;padding:8px 20px;font-weight:600;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.btn-salvar:hover{filter:brightness(1.15)}
.btn-filtro{background:var(--painel);border:1px solid var(--borda-2);border-radius:8px;padding:7px 14px;font-weight:600;color:var(--fg);cursor:pointer;white-space:nowrap}
.btn-filtro[aria-pressed="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}
body.so-falta .respondido,body.so-falta .completa{display:none!important}
body.so-falta #bancada{display:none}
.estado{font-size:13px;color:var(--comment);white-space:nowrap}
.estado.ok{color:var(--green)} .estado.erro{color:var(--red);white-space:normal} .estado.sujo{color:var(--orange)}
nav.sumario{border-top:1px solid var(--borda)}
nav.sumario .casca{display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
nav.sumario a{text-decoration:none;color:var(--suave);background:var(--painel);border:1px solid var(--borda);border-radius:999px;padding:2px 10px;font-size:12.5px;white-space:nowrap}
nav.sumario a:hover{border-color:var(--roxo-claro);color:var(--fg)}
nav.sumario a .cont{font-family:'JetBrains Mono',monospace;color:var(--comment);margin-left:6px;font-size:11.5px}
nav.sumario a.feito .cont{color:var(--green)}

/* seções */
main{padding:22px 0 60px}
section.aba,section.bloco{background:var(--app-bg);border:1px solid var(--borda);border-radius:14px;padding:18px;margin:0 0 22px}
.cab-aba{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.cab-aba h2{margin:0;font-size:19px;font-weight:700}
.cab-aba h2 .id{font-family:'JetBrains Mono',monospace;color:var(--roxo-claro);font-weight:500;margin-right:8px}
.cab-aba .resumo{color:var(--comment);font-size:13px}
.cab-aba .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--painel);border:1px solid var(--borda-2);border-radius:8px;padding:6px 12px;font-size:13.5px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--roxo-claro)}
.btn[aria-pressed=true]{background:var(--roxo-fundo);border-color:var(--roxo);color:#fff}
.fotos{display:grid;grid-template-columns:1fr;gap:22px}
figure{margin:0;min-width:0}
figure a{display:block;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:#000;line-height:0}
figure a:hover{border-color:var(--roxo-claro)}
figure img{width:100%;height:auto;display:block}
figcaption{font-size:12.5px;color:var(--comment);margin-top:5px}
figcaption b{color:var(--suave);font-weight:600}

/* mudanças */
h3{font-size:15px;margin:20px 0 10px;color:var(--suave);font-weight:600}
ol.mudancas{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{background:var(--painel);border:1px solid var(--borda);border-radius:var(--raio);padding:12px 14px;position:relative}
.item.alvo{border-color:var(--roxo-claro);box-shadow:0 0 0 1px var(--roxo-claro)}
.item.arrastando{border-color:var(--cyan);border-style:dashed}
.item.v-aprova{border-left:4px solid var(--green)} .item.v-reprova{border-left:4px solid var(--red)} .item.v-ajustar{border-left:4px solid var(--orange)}
.linha1{display:flex;gap:12px;align-items:flex-start}
.n{flex:0 0 auto;min-width:26px;height:26px;border-radius:13px;background:var(--roxo);color:#fff;font:700 12.5px/26px 'JetBrains Mono',monospace;text-align:center;padding:0 6px}
.corpo{flex:1;min-width:0}
.oque{margin:1px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px}
.sprint{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--comment);overflow-wrap:anywhere}
.etq{border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid}
.etq.implementada{color:var(--green);border-color:rgba(80,250,123,.45);background:rgba(80,250,123,.08)}
.etq.escolhida{color:var(--cyan);border-color:rgba(139,233,253,.45);background:rgba(139,233,253,.08)}
.etq.escolher{color:var(--orange);border-color:rgba(255,184,108,.5);background:rgba(255,184,108,.08)}
.etq.nosso{color:var(--pink);border-color:rgba(255,121,198,.45);background:rgba(255,121,198,.08)}
.fora-foto{color:var(--yellow);font-size:11.5px}
.etq.ordem{color:var(--purple);border-color:rgba(189,147,249,.5);background:rgba(189,147,249,.1)}
.foto-item{margin:12px 0 4px;width:100%}
.foto-item img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--border)}
.foto-item figcaption{font-size:12px;color:var(--muted, #a6a6b8);margin-top:4px}
.nota{font-size:12px;color:var(--comment);margin:6px 0 0;overflow-wrap:anywhere}
.resposta{margin-top:10px;display:grid;gap:8px}
.votos{display:flex;gap:6px;flex-wrap:wrap}
.voto{background:transparent;border:1px solid var(--borda-2);border-radius:7px;padding:4px 12px;font-size:13px;color:var(--suave)}
.voto:hover{border-color:var(--roxo-claro);color:var(--fg)}
.voto.aprova[aria-pressed=true]{background:rgba(80,250,123,.16);border-color:var(--green);color:var(--green)}
.voto.reprova[aria-pressed=true]{background:rgba(255,85,85,.16);border-color:var(--red);color:var(--red)}
.voto.ajustar[aria-pressed=true]{background:rgba(255,184,108,.16);border-color:var(--orange);color:var(--orange)}
textarea{width:100%;min-height:38px;resize:vertical;background:var(--app-bg);color:var(--fg);border:1px solid var(--borda);border-radius:7px;padding:7px 9px;font:13.5px/1.4 'Space Grotesk',system-ui,sans-serif}
textarea:focus{outline:none;border-color:var(--roxo-claro)}
.anexo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--comment)}
.anexo label{border:1px dashed var(--borda-2);border-radius:7px;padding:3px 10px;cursor:pointer;color:var(--suave)}
.anexo label:hover{border-color:var(--roxo-claro)}
.anexo input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.miniaturas{display:flex;flex-wrap:wrap;gap:8px}
.mini{position:relative;border:1px solid var(--borda);border-radius:6px;overflow:hidden;background:#000;line-height:0}
.mini img{height:64px;width:auto;max-width:160px;display:block;object-fit:cover}
.mini span{display:block;padding:6px 8px;line-height:1.3;font-size:11px;background:var(--app-bg);max-width:180px;overflow-wrap:anywhere}
.mini button{position:absolute;top:2px;right:2px;border:0;border-radius:4px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;line-height:1;padding:3px 5px}
.anexo .erro{color:var(--red)}

.veredito{margin-top:16px;border:1px solid var(--roxo);background:linear-gradient(180deg,rgba(139,0,255,.1),transparent);border-radius:var(--raio);padding:12px 14px}
.veredito h3{margin:0 0 4px;color:var(--fg)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--suave);font-size:13.5px}
details ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--suave)}
details li{margin:4px 0}

/* perguntas */
.brief{background:var(--painel);border:1px solid var(--borda);border-radius:var(--raio);padding:14px;margin-bottom:12px}
.brief h3{margin:0 0 2px;color:var(--fg);font-size:15.5px}
.brief .de{font-size:12px;color:var(--comment);margin-bottom:8px}
.pergunta{border-top:1px solid var(--borda);padding-top:10px;margin-top:10px}
.pergunta:first-of-type{border-top:0;margin-top:0}
.pergunta p.q{margin:0 0 8px}
.opcoes{display:grid;gap:6px;margin-bottom:8px}
.opcao{display:flex;gap:10px;align-items:flex-start;background:var(--app-bg);border:1px solid var(--borda);border-radius:8px;padding:7px 10px;cursor:pointer}
.opcao:hover{border-color:var(--roxo-claro)}
.opcao input{accent-color:var(--roxo);margin-top:4px;flex:0 0 auto}
.opcao .v{font-family:'JetBrains Mono',monospace;color:var(--roxo-claro);min-width:1.6em}
.opcao .rec{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--green);border:1px solid rgba(80,250,123,.45);border-radius:5px;padding:0 6px;white-space:nowrap}
.opcao:has(input:checked){border-color:var(--roxo);background:var(--roxo-fundo)}
.vazio{color:var(--comment);font-style:italic;margin:4px 0 0}
h2.secao{margin:0 0 12px;font-size:19px}
/* A largura inteira (pedido de 12/10, ~17h25): as fotos uma embaixo da outra, a 100%; cada mudança com o texto à
   esquerda e a resposta à direita, e a foto do estado a 100% embaixo; as opções das perguntas em colunas. */
section.aba,section.bloco{padding:22px 26px}
figcaption{font-size:13.5px;margin-top:7px}
.corpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,34%);grid-template-rows:auto auto auto 1fr;column-gap:28px;align-items:start}
.corpo > *{grid-column:1}
.corpo > .resposta{grid-column:2;grid-row:1 / -1;margin-top:0}
.corpo > .foto-item{grid-column:1 / -1}
.oque{font-size:15.5px}
.opcoes{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
textarea{field-sizing:content;max-height:40vh}
@media (max-width:1100px){
  .corpo{display:block}
  .corpo > .resposta{margin-top:10px}
}

@media (max-width:760px){
  .fotos{grid-template-columns:1fr}
  .topo .casca{padding-top:8px;padding-bottom:8px;gap:6px 10px}
  .marca{flex:1 1 auto}
  .marca h1{font-size:17px}
  .marca p{display:none}
  .numeros{order:3;flex-basis:100%;gap:6px}
  .num{font-size:12px;padding:2px 8px}
  .salvar{margin-left:auto}
  .btn-salvar{padding:6px 16px}
  nav.sumario .casca{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
  .cab-aba .acoes{margin-left:0}
  section.aba,section.bloco{padding:14px 12px}
  html{scroll-padding-top:150px}
}

/* ===== Harmonia (12/10, ~17h35: «muito texto gritante e sem respiro») =====
   Letra de leitura (Inter) no corpo, Space Grotesk só nos títulos; o branco puro fica para os títulos e o texto
   corre em cinza claro; a linha de leitura para em ~78 caracteres; mais ar entre blocos; etiquetas e notas calmas. */
:root{--texto:#cfd2de;--texto-2:#a3a8bd;--fino:#3a3d4d;--ar:28px}
body{font:15.5px/1.7 'Inter',system-ui,sans-serif;color:var(--texto);letter-spacing:.005em}
h1,h2,h3,.btn,.btn-salvar,.btn-filtro,.voto,nav.sumario a,.n{font-family:'Space Grotesk',system-ui,sans-serif}
header.topo{background:rgba(22,23,30,.92);border-bottom:1px solid var(--fino)}
.topo .casca{padding-top:14px;padding-bottom:14px}
.marca h1{font-size:21px;letter-spacing:-.01em}
.marca p{color:var(--texto-2);font-size:13.5px}
.num{background:transparent;border-color:var(--fino);color:var(--texto-2)}
nav.sumario{border-top:1px solid var(--fino)}
nav.sumario .casca{gap:8px;padding-top:10px;padding-bottom:12px}
nav.sumario a{background:transparent;border-color:var(--fino);color:var(--texto-2);padding:3px 12px}
main{padding:40px 0 90px}
section.aba,section.bloco{background:#1e1f28;border:1px solid var(--fino);border-radius:18px;padding:34px 40px 38px;margin:0 0 56px}
.cab-aba{margin-bottom:26px;gap:10px 18px}
.cab-aba h2{font-size:26px;font-weight:600;color:#fff;letter-spacing:-.015em}
.cab-aba h2 .id{font-size:18px;color:var(--roxo-claro);opacity:.8}
.cab-aba .resumo{color:var(--texto-2);font-size:14px}
.btn{background:transparent;border-color:var(--fino);color:var(--texto);padding:7px 14px;border-radius:9px}
.fotos{gap:34px}
figure a{border-color:var(--fino);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
figcaption{color:var(--texto-2);font-size:13.5px;margin-top:10px}
figcaption b{color:#fff;font-weight:600;margin-right:2px}
h3.titulo-lista{margin:46px 0 18px;font-size:19px;font-weight:600;color:#fff;display:flex;align-items:center;gap:10px}
h3.titulo-lista span{font:500 13px/1 'JetBrains Mono',monospace;color:var(--texto-2);border:1px solid var(--fino);border-radius:999px;padding:4px 9px}
ol.mudancas{gap:18px}
.item{background:#252733;border:1px solid var(--fino);border-radius:14px;padding:24px 28px}
.item.v-aprova,.item.v-reprova,.item.v-ajustar{border-left-width:3px}
.linha1{gap:18px}
.n{background:var(--roxo-fundo);color:var(--roxo-claro);border:1px solid rgba(189,147,249,.35);min-width:30px;height:30px;border-radius:15px;font:600 13px/28px 'Space Grotesk',sans-serif}
.corpo{grid-template-columns:minmax(0,1fr) minmax(360px,32%);column-gap:48px;grid-template-rows:auto auto auto 1fr}
.oque{max-width:78ch;margin:2px 0 12px;font-size:16px;line-height:1.75;color:var(--texto)}
.meta{gap:8px 12px}
.etq{border:0;border-radius:999px;padding:2px 11px;font:500 12px/1.6 'Inter',sans-serif;cursor:help}
.etq.implementada{background:rgba(80,250,123,.1)} .etq.escolhida{background:rgba(139,233,253,.1)}
.etq.escolher{background:rgba(255,184,108,.11)} .etq.nosso{background:rgba(255,121,198,.1)}
.etq.ordem{color:var(--roxo-claro);background:rgba(189,147,249,.12)}
.fora-foto{color:#d9d39a;font-size:12.5px}
.nota{color:var(--texto-2);font-size:13.5px;line-height:1.65}
.nota.aparte{max-width:78ch;margin:16px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--fino)}
.foto-item{margin:24px 0 4px}
.foto-item img{border:1px solid var(--fino);border-radius:12px}
.foto-item figcaption{font-size:13px;color:var(--texto-2);margin-top:9px}
.resposta{gap:12px}
.voto{border-color:var(--fino);color:var(--texto-2);padding:6px 16px;border-radius:9px;font-size:13.5px}
textarea{background:#1e1f28;border-color:var(--fino);border-radius:9px;padding:10px 12px;font:14px/1.55 'Inter',sans-serif;color:var(--texto)}
textarea::placeholder{color:#6f748c}
.anexo{color:#7b809a}
.anexo label{border-color:var(--fino);color:var(--texto-2)}
.veredito{margin-top:34px;border:1px solid rgba(139,0,255,.45);background:linear-gradient(180deg,rgba(139,0,255,.08),transparent 70%);border-radius:14px;padding:22px 28px}
.veredito h3{font-size:17px;margin:0 0 12px}
details{margin-top:24px}
summary{color:var(--texto-2)}
h2.secao{font-size:26px;font-weight:600;color:#fff;margin:0 0 26px;letter-spacing:-.015em}
.brief{background:#252733;border-color:var(--fino);border-radius:14px;padding:26px 30px;margin-bottom:22px}
.brief h3{font-size:18px;font-weight:600;margin:0 0 4px}
.brief .de{color:var(--texto-2);font-size:13px;margin-bottom:18px}
.pergunta{border-top:1px solid var(--fino);padding-top:22px;margin-top:22px}
.pergunta p.q{max-width:96ch;margin:0 0 14px;font-size:15.5px;color:var(--texto)}
.opcoes{gap:10px;margin-bottom:12px}
.opcao{background:#1e1f28;border-color:var(--fino);border-radius:11px;padding:12px 14px;line-height:1.55}
.opcao .rec{border:0;background:rgba(80,250,123,.1);border-radius:999px;padding:1px 9px;font-weight:500}
@media (max-width:1100px){section.aba,section.bloco{padding:24px 20px}.item{padding:18px}}
</style>
</head>
<body>
<header class="topo">
  <div class="casca">
    <div class="marca">
      <h1>A volta do todo</h1>
      <p>Cada aba como está hoje e como fica com todas as sprints abertas. Marque o que aprova.</p>
    </div>
    <div class="numeros" id="numeros"></div>
    <div class="salvar">
      <span class="estado" id="estado" role="status" aria-live="polite"></span>
      <button class="btn-filtro" id="filtro" type="button" aria-pressed="false" title="Esconde o que você já marcou e mostra só o que falta responder">Só o que falta</button>
      <button class="btn-salvar" id="salvar" type="button" title="A página já salva sozinha a cada marcação; este botão salva de novo na hora">Salvar</button>
    </div>
  </div>
  <nav class="sumario" aria-label="Sumário"><div class="casca" id="sumario"></div></nav>

o em 09/10 põe os mesmos ajustes também na janela Acessórios (abas Meus toques e Touchpad). A T7 (12/10, mais nova) pede um dono só: a aba 05 é a dona e grava, e a janela só lê. Os ajustes finos do touchpad do desenho (a altura do dedo, o dedo parado, o deslize, o clique) não couberam na linha: ficam no padrão do desenho e na dica."}, {"n": 4, "sprint": "ordem dela de 12/10, 14h40 (sprint a escrever: O-MODO-AUTOMATICO-E-UM-BOTAO-SO-01)", "o_que_muda": "A Vibração ganha o mesmo botão único «Modo automático» das abas 01 a 04 (era a única das cinco sem ele). Ligado: o jogo decide a força da vibração e da háptica, e a força, o sensor háptico e os motores de cada coluna ficam apagados; o Testar agora segue à mão. O botão é ciano escuro com a letra branca nos dois estados (resposta sua de 12/10); ligado, o fundo clareia, o contorno acende e a bolinha enche.", "origem": "ordem-dela-12-10", "conflito": null, "foto": "05-m4.png", "foto_estado": "Com o Modo automático ligado: a força, o sensor háptico e os motores ficam apagados; o Testar agora segue à mão."}, {"n": 5, "sprint": "ordem dela de 12/10, 14h52 (foto da aba 05; sprint a escrever: A-VIBRACAO-PREENCHE-O-QUADRO-01)", "o_que_muda": "As linhas da Vibração se distribuem na vertical: o quadro cresce até a seção Meus toques, e a Força, os três motores e o «Testar agora» dividem a sobra (a Força com o dobro), em vez de o Testar agora ficar colado no Motor direito com um vão vazio embaixo.", "origem": "ordem-dela-12-10", "conflito": null, "foto": "05-m5.png", "foto_estado": "Na janela de 1680x840 (o tamanho da foto dela de 14h49): o quadro preenche a altura."}], "por_baixo": [{"sprint": "O-PARAR-CALA-O-TESTE-QUE-AINDA-ESTAVA-NO-AR-01", "o_que_muda": "O «Parar» cala o teste que ainda estava no ar, e os gestos rodam na ordem do clique."}, {"sprint": "OS-CORACOES-DA-VIBRACAO-NAO-SEGURAM-A-JANELA-01", "o_que_muda": "O teste rebate na fila de cada controle, fora do fio da janela."}, {"sprint": "FECHAR-A-JANELA-DEVOLVE-O-QUE-AS-ABAS-SEGURAVAM-01", "o_que_muda": "Fechar a janela cala o teste que a aba segurava."}, {"sprint": "A-FORCA-DA-VIBRACAO-DE-CADA-CONTROLE-SAI-DE-UM-FUNIL-SO-COM-A-BATERIA-DELE-E-O-TETO-01", "o_que_muda": "Implementada na fds-1: a força de cada controle sai de um funil só, com a bateria dele e o teto (decisão por delegação, a validar por ela)."}, {"sprint": "O-ESTILO-CHEGA-AO-GATILHO-E-A-VIBRACAO-DE-CADA-CONTROLE-01", "o_que_muda": "Implementada na fds-1: o estilo do jogo chega à vibração de cada controle."}, {"sprint": "O-CONTROLE-VIBRA-NO-MODO-DO-FIRMWARE-DELE-01", "o_que_muda": "A vibração v2 segue o firmware de cada controle; a sprint diz que a tela não muda."}, {"sprint": "A-VIBRACAO-DO-JOGO-NAO-ESPERA-O-SONO-DA-VOLTA-01", "o_que_muda": "A vibração do jogo não espera a volta do repouso."}, {"sprint": "A-INTERFACE-INTEIRA-SE-ALCANCA-PELO-CONTROLE-E-PELO-TECLADO-01", "o_que_muda": "Foco, Tab, Esc e o X do controle alcançam toda ação e o ?; só atributos, a foto não muda."}, {"sprint": "O-NUMERO-DA-BARRA-NAO-CONGELA-NO-VALOR-VELHO-01", "o_que_muda": "O número da barra sai da alavanca quando o voo termina; o gesto lê a alavanca, nunca o texto."}, {"sprint": "A-ALTURA-E-A-LARGURA-DA-JANELA-NAO-PULSAM-01", "o_que_muda": "A janela para de crescer e encolher sozinha (medir o 100dvh, o repinte e a folga do mudo)."}, {"sprint": "A-JANELA-REGISTRA-O-PROPRIO-TAMANHO-E-O-MOTIVO-DE-FECHAR-01", "o_que_muda": "O registro guarda o tamanho da janela e o motivo de fechar."}, {"sprint": "O-TEMA-DE-CORES-ENTRA-PELA-FOLHA-DE-USUARIO-01", "o_que_muda": "O tema entra pela folha de usuário; no tema padrão nada muda, e as peças novas usam só os tokens do :root."}]}, {"id": "06", "cod": "06", "nome": "Navegação", "vivo": "06-navegacao.html", "visiveis": ["1", "9", "10", "11", "15", "16", "17", "18"], "mudancas": [{"n": 1, "sprint": "O-POINT-AND-CLICK-E-A-ACESSIBILIDADE-SE-DEFINEM-NA-NAVEGACAO-01", "o_que_muda": "A fila de botões vira «Definições controle e mouse | Trocar os botões | Point and click | Acessibilidade | Voltar ao padrão».", "origem": "desenho-escolhido", "conflito": "O nome sem hífen é o da volta de 12/10 (BRIEF-T2 e T3), igual nas abas 01, 10 e no mapa do controle."}, {"n": 2, "sprint": "O-POINT-AND-CLICK-E-A-ACESSIBILIDADE-SE-DEFINEM-NA-NAVEGACAO-01", "o_que_muda": "A janela «Estilo point and click» do desenho A: molde (Visual novel, Só mouse, Teclado e mouse), o perfil do jogo, o cursor (Mover com, Devagar enquanto segura, Velocidade devagar, Aceleração), a tabela «Os botões no jogo» e Cancelar, Voltar ao molde, Guardar; ganha role=dialog.", "origem": "desenho-escolhido", "conflito": "O nome sem hífen é o da volta de 12/10 (BRIEF-T2 e T3), igual nas abas 01, 10 e no mapa do controle.", "foto": "06-m2.png", "foto_estado": "Com a janela «Estilo point and click» aberta."}, {"n": 3, "sprint": "A-ABA-NAVEGACAO-TEM-OS-DOIS-POINT-AND-CLICK-E-A-VELOCIDADE-QUE-FUNCIONA-01", "o_que_muda": "A Velocidade e a Rolagem (−/+) saem da janela do estilo; um dono só, na aba, e a dica fica na linha «Mover com».", "origem": "recomendada-a-escolher", "conflito": "O desenho A escolhido tinha o −/+ na janela; vence a volta de 12/10 (T3 e T7, um dono por feature).", "foto": "06-m3.png", "foto_estado": "Com a janela «Estilo point and click» aberta."}, {"n": 4, "sprint": "O-CURSOR-GANHA-PRECISAO-PERMANENCIA-E-CLIQUE-TRAVADO-01", "o_que_muda": "«Parar para clicar» (permanência) e «Prender o clique» (clique travado) entram na janela do estilo.", "origem": "desenho-nosso-a-validar", "conflito": "", "foto": "06-m4.png", "foto_estado": "Com a janela «Estilo point and click» aberta."}, {"n": 5, "sprint": "O-BOTAO-ALTERNA-REPETE-E-ENTENDE-TOQUE-LONGO-E-DUPLO-01", "o_que_muda": "A janela «Acessibilidade motora» do desenho A (Para P1, Sim em todo perfil; Uma mão, Alternar em vez de segurar, Toque longo, Repetição), agora em 3 linhas de 2 cartões, com 980 px.", "origem": "desenho-escolhido", "conflito": "", "foto": "06-m5.png", "foto_estado": "Com a janela «Acessibilidade motora» aberta."}, {"n": 6, "sprint": "O-TREMOR-E-O-APERTO-JUNTO-NAO-DECIDEM-O-BOTAO-01", "o_que_muda": "Cartão «Tremor e aperto junto»: Ignorar repetição abaixo de 120 ms (saiu do Toque longo), Aperto mínimo 50 ms, Botão que trava (L1, R1, L2, R2) e Gestos sem apertar junto.", "origem": "desenho-nosso-a-validar", "conflito": "", "foto": "06-m6.png", "foto_estado": "Com a janela «Acessibilidade motora» aberta."}, {"n": 7, "sprint": "OS-ANALOGICOS-DO-JOGO-GANHAM-ZONA-MORTA-CURVA-E-UMA-MAO-01", "o_que_muda": "Cartão «Analógicos do jogo»: Zona morta, Curva (Linear, Precisa, Estável, Digital), Sensibilidade, e Inverter Y, Inverter X, Trocar os lados.", "origem": "desenho-nosso-a-validar", "conflito": "", "foto": "06-m7.png", "foto_estado": "Com a janela «Acessibilidade motora» aberta."}, {"n": 8, "sprint": "O-BOTAO-ALTERNA-REPETE-E-ENTENDE-TOQUE-LONGO-E-DUPLO-01", "o_que_muda": "«Toque duplo em até 0,3 s» no cartão Toque longo.", "origem": "desenho-nosso-a-validar", "conflito": "", "foto": "06-m8.png", "foto_estado": "Com a janela «Acessibilidade motora» aberta."}, {"n": 9, "sprint": "A-ABA-NAVEGACAO-TEM-OS-DOIS-POINT-AND-CLICK-E-A-VELOCIDADE-QUE-FUNCIONA-01", "o_que_muda": "«Status da navegação» vira «Perfil de point and click»: Mouse | Teclado, com a frase de cada um no title, e o botão «Configurar», que leva à captura no mapa do controle.", "origem": "recomendada-a-escolher", "conflito": "BRIEF-T3, opção A aplicada. O liga/desliga sai desta aba: quem ativa é a aba 01 (T7). Os moldes da janela (item 2) e o par Mouse | Teclado precisam de um nome só na escolha dela."}, {"n": 10, "sprint": "A-ABA-NAVEGACAO-TEM-OS-DOIS-POINT-AND-CLICK-E-A-VELOCIDADE-QUE-FUNCIONA-01", "o_que_muda": "«Velocidade do cursor» é um controle só, no perfil; a dica diz que vale para o analógico esquerdo, o touchpad e o point and click.", "origem": "recomendada-a-escolher", "conflito": "O teto do trilho é o valor que a sprint mede no aparelho; o desenho usa a escala de hoje, e a tela não fala da me <script>
(async () => {
  const DADOS = JSON.parse(document.getElementById('dados').textContent);
  let RESP = {};
  try { RESP = JSON.parse(document.getElementById('respostas-salvas').textContent || '{}') || {}; } catch (e) { RESP = {}; }

  const TODO = 'todo/';
  const ANEXOS = SERVIDO ? '/anexos/' : `${API}/anexos/`;
  // A marcação de agora: o que ficou só no navegador (sem servidor) vence; senão o servidor; senão a embutida.
  const LS = 'hefesto-volta-todo-respostas';
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { local = null; }
  let doServidor = null;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(`${API}/respostas`, {signal: ctl.signal}); clearTimeout(t);
    if (r.ok) doServidor = await r.json();
  } catch (e) { doServidor = null; }
  let pendenteAoAbrir = false;
  if (local && local.pendente && local.resp) { RESP = local.resp; pendenteAoAbrir = true; }
  else if (doServidor && typeof doServidor === 'object') RESP = doServidor;
  else if (local && local.resp) RESP = local.resp;
  const ORIGEM = {
    'implementada-na-fds': ['implementada', 'implementada'],
    'desenho-escolhido': ['escolhida', 'escolhida'],
    'recomendada-a-escolher': ['escolher', 'recomendada, a escolher'],
    'desenho-nosso-a-validar': ['nosso', 'desenho nosso, a validar'],
    'ordem-dela-12-10': ['ordem', 'ordem dela de 12/10'],
  };
  const VOTOS = [['aprova', 'Aprova'], ['reprova', 'Reprova'], ['ajustar', 'Ajustar']];
  const VOTOS_ABA = [['aprova', 'Aprova a aba'], ['reprova', 'Reprova'], ['ajustar', 'Ajustar']];
  let sujo = false;
  let itemAtivo = null;

  const el = (tag, attrs = {}, ...filhos) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const f of filhos.flat(Infinity)) if (f != null) e.append(f);
    return e;
  };
  const resp = (chave) => (RESP[chave] ||= {voto: '', texto: '', anexos: []});
  let relogio = null;
  const guardarNoNavegador = (pendente) => {
    try { localStorage.setItem(LS, JSON.stringify({pendente, resp: limpas()})); } catch (e) { /* sem armazenamento */ }
  };
  const marcarSujo = () => {
    sujo = true;
    guardarNoNavegador(true);
    const s = document.getElementById('estado');
    s.className = 'estado sujo'; s.textContent = 'Salvando…';
    atualizarSumario();
    clearTimeout(relogio);
    relogio = setTimeout(salvar, 700);
  };

  // topo
  const nAbas = DADOS.abas.length;
  document.getElementById('numeros').append(
    el('span', {class: 'num'}, el('b', {text: nAbas}), 'abas'),
    el('span', {class: 'num'}, el('b', {text: DADOS.total}), 'mudanças'),
    el('span', {class: 'num'}, el('b', {text: DADOS.escolher}), 'recomendadas, a escolher'),
  );

  // anexos
  async function enviarAnexo(chave, arquivo, caixa) {
    const erro = caixa.querySelector('.erro');
    erro.textContent = '';
    const nome = (arquivo.name && arquivo.name !== 'image.png') ? arquivo.name
      : `colado-${new Date().toTimeString().slice(0, 8).replace(/:/g, '')}.png`;
    try {
      const r = await fetch(`${API}/anexo?item=${encodeURIComponent(chave)}&nome=${encodeURIComponent(nome)}`,
        {method: 'POST', body: arquivo});
      if (!r.ok) throw new Error(`o servidor respondeu ${r.status}`);
      const j = await r.json();
      resp(chave).anexos.push(j.nome);
      desenharMiniaturas(chave, caixa);
      marcarSujo();
    } catch (e) {
      erro.textContent = `Não anexou: ${e.message.includes('fetch') ? 'o servidor da página não está no ar' : e.message}.`;
    }
  }
  function desenharMiniaturas(chave, caixa) {

      const url = ANEXOS + encodeURIComponent(nome);
      const imagem = /\.(png|jpe?g|webp|gif)$/i.test(nome);
      const tirar = el('button', {type: 'button', title: 'Tirar este anexo', 'aria-label': 'Tirar este anexo', onclick: (ev) => {
        ev.preventDefault();
        const lista = resp(chave).anexos; lista.splice(lista.indexOf(nome), 1);
        desenharMiniaturas(chave, caixa); marcarSujo();
      }, text: '✕'});
      alvo.append(el('a', {class: 'mini', href: url, target: '_blank', rel: 'noopener', title: nome},
        imagem ? el('img', {src: url, alt: 'Anexo', loading: 'lazy'}) : el('span', {text: nome}), tirar));
    }
  }
  function caixaDeAnexo(chave) {
    const id = `arq-${chave}`;
    const caixa = el('div', {class: 'anexo'});
    const entrada = el('input', {type: 'file', id, multiple: true, onchange: (ev) => {
      for (const f of ev.target.files) enviarAnexo(chave, f, caixa);
      ev.target.value = '';
    }});
    caixa.append(
      el('label', {for: id, text: 'Anexar'}), entrada,
      el('span', {text: 'ou cole com Ctrl+V, ou arraste aqui'}),
      el('span', {class: 'erro', role: 'alert'}),
      el('div', {class: 'miniaturas'}),
    );
    desenharMiniaturas(chave, caixa);
    return caixa;
  }
  function blocoDeResposta(chave, votos) {
    const r = resp(chave);
    const area = el('div', {class: 'resposta'});
    const linhaVotos = el('div', {class: 'votos', role: 'group', 'aria-label': 'Voto'});
    const dono = () => area.closest('.item, .veredito');
    const pintar = () => {
      for (const b of linhaVotos.children) b.setAttribute('aria-pressed', String(b.dataset.v === r.voto));
      const d = dono(); if (!d) return;
      d.classList.remove('v-aprova', 'v-reprova', 'v-ajustar');
      if (r.voto) d.classList.add(`v-${r.voto}`);
    };
    for (const [v, rotulo] of votos) {
      linhaVotos.append(el('button', {type: 'button', class: `voto ${v}`, 'data-v': v, 'aria-pressed': 'false', text: rotulo,
        onclick: () => { r.voto = (r.voto === v) ? '' : v; pintar(); marcarSujo(); }}));
    }
    const texto = el('textarea', {rows: 1, placeholder: 'O que ajustar, ou um comentário', 'aria-label': 'Comentário'});
    texto.value = r.texto || '';
    texto.addEventListener('input', () => { r.texto = texto.value; marcarSujo(); });
    area.append(linhaVotos, texto, caixaDeAnexo(chave));
    requestAnimationFrame(pintar);
    return area;
  }
  function tornarAlvo(caixa, chave) {
    caixa.dataset.chave = chave;
    caixa.addEventListener('focusin', () => ativar(caixa));
    caixa.addEventListener('pointerdown', () => ativar(caixa));
    caixa.addEventListener('dragover', (ev) => { ev.preventDefault(); caixa.classList.add('arrastando'); });
    caixa.addEventListener('dragleave', () => caixa.classList.remove('arrastando'));
    caixa.addEventListener('drop', (ev) => {
      ev.preventDefault(); caixa.classList.remove('arrastando'); ativar(caixa);
      for (const f of ev.dataTransfer.files) enviarAnexo(chave, f, caixa.querySelector('.anexo'));
    });
  }
  function ativar(caixa) {
    if (itemAtivo && itemAtivo !== caixa) itemAtivo.classList.remove('alvo');
    itemAtivo = caixa; caixa.classList.add('alvo');
  }
  document.addEventListener('paste', (ev) => {
    if (!itemAtivo) return;
    const arquivos = [...(ev.clipboardData?.items || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
    if (!arquivos.length) return;
    ev.preventDefault();
    for (const f of arquivos) enviarAnexo(itemAtivo.dataset.chave, f, itemAtivo.querySelector('.anexo'));
  });

  // abas
  const miolo = document.getElementById('miolo');
  for (const aba of DADOS.abas) {
    const sec = el('section', {class: 'aba', id: `aba-${aba.id}`, 'aria-labelledby': `t-${aba.id}`});
    const fotoAntes = TODO + `fotos/${aba.id}-antes.png`;
    const fotoDepois = TODO + `fotos/${aba.id}-depois.png`;
    const fotoMarcada = TODO + `fotos/${aba.id}-depois-marcado.png`;
    const nEscolher = aba.mudancas.filter(m => m.origem === 'recomendada-a-escolher').length;
    const imgDepois = el('img', {src: fotoDepois, alt: `${aba.nome}, depois`, width: 1212, height: 809, loading: 'lazy'});
    const linkDepois = el('a', {href: fotoDepois, target: '_blank', rel: 'noopener', title: 'Abrir em tamanho real'}, imgDepois);
    const legendaDepois = el('figcaption', {}, el('b', {text: 'Depois'}), ' · o todo');
    const trocar = el('button', {type: 'button', class: 'btn', 'aria-pressed': 'false', text: 'Mostrar o que mudou', onclick: () => {
      const on = trocar.getAttribute('aria-pressed') !== 'true';
      trocar.setAttribute('aria-pressed', String(on));
      imgDepois.src = on ? fotoMarcada : fotoDepois;
      linkDepois.href = on ? fotoMarcada : fotoDepois;
      legendaDepois.replaceChildren(el('b', {text: 'Depois'}), on ? ' · o todo, com cada mudança contornada' : ' · o todo');
    }});
    sec.append(
      el('div', {class: 'cab-aba'},
        el('h2', {id: `t-${aba.id}`}, el('span', {class: 'id', text: /^\d/.test(aba.id) ? aba.id : '·'}), aba.nome),
        el('span', {class: 'resumo', text: `${aba.mudancas.length} ${aba.mudancas.length === 1 ? 'mudança' : 'mudanças'} · ${nEscolher} a escolher`}),
        el('div', {class: 'acoes'},
          trocar,
          el('a', {class: 'btn', href: TODO + aba.vivo, target: '_blank', rel: 'noopener', text: 'Abrir o todo vivo ↗'}))),
      el('div', {class: 'fotos'},
        el('figure', {},
          el('a', {href: fotoAntes, target: '_blank', rel: 'noopener', title: 'Abrir em tamanho real'},
            el('img', {src: fotoAntes, alt: `${aba.nome}, antes`, width: 1212, height: 809, loading: 'lazy'})),
          el('figcaption', {}, el('b', {text: 'Antes'}), ' · o publicado da 1-11')),
        el('figure', {}, linkDepois, legendaDepois)),
      el('h3', {class: 'titulo-lista'}, 'O que muda ', el('span', {text: `${aba.mudancas.length}`})),
    );
    const lista = el('ol', {class: 'mudancas'});
    for (const m of aba.mudancas) {
      const chave = `todo-${aba.cod}-${m.n}`;
      const [cls, rotulo] = ORIGEM[m.origem] || ['nosso', m.origem];
      const naFoto = aba.visiveis.includes(String(m.n));
      const item = el('li', {class: 'item'},
        el('div', {class: 'linha1'},
          el('span', {class: 'n', text: m.n, 'aria-label': `Mudança ${m.n}`}),
          el('div', {class: 'corpo'},
            el('p', {class: 'oque', text: m.o_que_muda}),
            el('div', {class: 'meta'},
              el('span', {class: `etq ${cls}`, text: rotulo, title: m.sprint}),
              (naFoto || m.foto) ? null : el('span', {class: 'fora-foto', text: 'Não aparece na foto: veja no todo vivo'}),
            ),
            m.conflito ? el('p', {class: 'nota aparte', text: m.conflito}) : null,
            m.foto ? el('figure', {class: 'foto-item'},
              el('a', {href: TODO + 'fotos/' + m.foto, target: '_blank', rel: 'noopener', title: 'Abrir em tamanho real'},
                el('img', {src: TODO + 'fotos/' + m.foto, alt: `${aba.nome}, mudança ${m.n}`, loading: 'lazy'})),
              el('figcaption', {}, m.foto_estado || '')) : null,
            blocoDeResposta(chave, VOTOS))));
      tornarAlvo(item, chave);
      lista.append(item);
    }
    sec.append(lista);
    const chaveAba = `todo-${aba.cod}`;
    const ver = el('div', {class: 'veredito'}, el('h3', {text: `A aba ${aba.nome} inteira`}), blocoDeResposta(chaveAba, VOTOS_ABA));
    tornarAlvo(ver, chaveAba);
    sec.append(ver);
    if (aba.por_baixo.length) {
      sec.append(el('details', {},
        el('summary', {text: `Por baixo: ${aba.por_baixo.length} que mudam sem mudar o desenho`}),
        el('ul', {}, aba.por_baixo.map(p => el('li', {}, p.o_que_muda, ' ', el('span', {class: 'sprint', text: p.sprint}))))));
    }
    miolo.append(sec);
  }

  // perguntas de desenho
  const perg = el('section', {class: 'bloco', id: 'perguntas', 'aria-labelledby': 't-perguntas'},
    el('h2', {class: 'secao', id: 't-perguntas', text: 'As perguntas de desenho'}));
  const nomeDaAba = Object.fromEntries(DADOS.abas.map(a => [a.id, a.nome]));
  for (const b of DADOS.briefs) {
    const caixa = el('div', {class: 'brief', id: `brief-${b.id}`},
      el('h3', {text: `${b.id} · ${b.titulo}`}),
      el('div', {class: 'de'}, `${b.origem || 'BRIEF-' + b.id}. Na tela: `,
        b.abas.map((a, i) => [i ? ', ' : '', el('a', {href: `#aba-${a}`, text: nomeDaAba[a] || a})])));
    for (const q of b.perguntas) {
      const r = resp(q.chave);
      const bloco = el('div', {class: 'pergunta', 'data-chave': q.chave}, el('p', {class: 'q', text: `«${q.texto}»`}));
      if (q.nota) bloco.append(el('p', {class: 'nota', text: q.nota}));
      const ops = el('div', {class: 'opcoes', role: 'radiogroup', 'aria-label': q.texto});
      const ordenadas = [...q.opcoes].sort((x, y) => (y.rec ? 1 : 0) - (x.rec ? 1 : 0));
      for (const o of ordenadas) {
        const entrada = el('input', {type: 'radio', name: q.chave, value: o.v});
        entrada.checked = r.voto === o.v;
        entrada.addEventListener('click', () => {
          if (r.voto === o.v) { r.voto = ''; entrada.checked = false; } else r.voto = o.v;
          marcarSujo();
        });
        ops.append(el('label', {class: 'opcao'}, entrada, el('span', {class: 'v', text: o.v.length <= 2 ? o.v : '·'}),
          el('span', {}, o.rotulo, o.rec ? el('span', {class: 'rec', text: 'Recomendada · está no todo'}) : null)));
      }
      if (!q.opcoes.some(o => o.rec)) bloco.append(el('p', {class: 'nota', text: 'Sem recomendação: a escolha é sua.'}));
      const texto = el('textarea', {rows: 1, placeholder: 'Outra ideia ou um comentário', 'aria-label': 'Comentário'});
      texto.value = r.texto || '';
      texto.addEventListener('input', () => { r.texto = texto.value; marcarSujo(); });
      bloco.append(ops, texto);
      caixa.append(bloco);
    }
    perg.append(caixa);
  }
  miolo.append(perg);

  miolo.append(el('section', {class: 'bloco', id: 'bancada', 'aria-labelledby': 't-bancada'},
    el('h2', {class: 'secao', id: 't-bancada', text: 'Bancada'}),
    el('p', {class: 'vazio', text: 'A folha da bancada entra aqui depois.'})));

  // sumário
  const sumario = document.getElementById('sumario');
  const contadores = [];
  for (const aba of DADOS.abas) {
    const cont = el('span', {class: 'cont'});
    const a = el('a', {href: `#aba-${aba.id}`}, /^\d/.test(aba.id) ? `${aba.id} ${aba.nome}` : aba.nome, cont);
    contadores.push([a, cont, aba]);
    sumario.append(a);
  }
  sumario.append(el('a', {href: '#perguntas', text: 'Perguntas'}), el('a', {href: '#bancada', text: 'Bancada'}));
  function atualizarSumario() {
    for (const [a, cont, aba] of contadores) {
      const feitas = aba.mudancas.filter(m => RESP[`todo-${aba.cod}-${m.n}`]?.voto).length;
      cont.textContent = `${feitas}/${aba.mudancas.length}`;
      a.classList.toggle('feito', feitas === aba.mudancas.length && !!RESP[`todo-${aba.cod}`]?.voto);
    }
    if (typeof aplicarFiltro === 'function' && document.getElementById('filtro')) aplicarFiltro();
  }
  atualizarSumario();

  // salvar
  function limpas() {
    const out = {};
    for (const [k, v] of Object.entries(RESP)) {
      if (k.startsWith('_')) continue;
      if (v && typeof v === 'object' && 'voto' in v && !v.voto && !(v.texto || '').trim() && !(v.anexos || []).length) continue;
      out[k] = v;
    }
    return out;
  }
  const dd = (n) => String(n).padStart(2, '0');
  async function salvar() {
    clearTimeout(relogio);
    const s = document.getElementById('estado');
    const corpo = JSON.stringify(limpas());
    try {
      const r = await fetch(`${API}/respostas`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: corpo});
      if (!r.ok) throw new Error(`o servidor respondeu ${r.status}`);
      sujo = false;
      guardarNoNavegador(false);
      const agora = new Date();
      s.className = 'estado ok';
      s.textContent = `Salvo às ${dd(agora.getHours())}:${dd(agora.getMinutes())}:${dd(agora.getSeconds())}`;
    } catch (e) {
      s.className = 'estado erro';
      s.textContent = 'Guardado só neste navegador: o servidor da página não está no ar. Salva no arquivo quando ele voltar.';
    }
  }
  document.getElementById('salvar').addEventListener('click', salvar);
  // Fechou ou recarregou antes dos 700 ms: o último toque vai pelo beacon (text/plain não pede licença ao servidor).
  window.addEventListener('pagehide', () => {
    if (!sujo) return;
    try { navigator.sendBeacon(`${API}/respostas`, new Blob([JSON.stringify(limpas())], {type: 'text/plain'})); } catch (e) { /* fica no navegador */ }
  });
  if (pendenteAoAbrir) salvar();

  // o filtro «Só o que falta»: esconde o que já tem voto ou escolha; o item em que você está mexendo só some quando você sai dele
  const botaoFiltro = document.getElementById('filtro');
  const FILTRO = 'hefesto-volta-todo-filtro';
  function ocupado(e) { return e === itemAtivo || e.contains(document.activeElement); }
  function aplicarFiltro() {
    let faltam = 0;
    for (const e of document.querySelectorAll('.item[data-chave], .veredito[data-chave], .pergunta[data-chave]')) {
      const feito = !!RESP[e.dataset.chave]?.voto;
      if (!feito) faltam++;
      if (!feito || !ocupado(e)) e.classList.toggle('respondido', feito);
    }
    for (const sec of document.querySelectorAll('section.aba, .brief')) {
      const pendentes = sec.querySelectorAll('.item[data-chave]:not(.respondido), .veredito[data-chave]:not(.respondido), .pergunta[data-chave]:not(.respondido)');
      sec.classList.toggle('completa', pendentes.length === 0);
    }
    document.getElementById('filtro').textContent = `Só o que falta (${faltam})`;
  }
  botaoFiltro.addEventListener('click', () => {
    const on = botaoFiltro.getAttribute('aria-pressed') !== 'true';
    botaoFiltro.setAttribute('aria-pressed', String(on));
    document.body.classList.toggle('so-falta', on);
    try { localStorage.setItem(FILTRO, on ? '1' : '0'); } catch (e) { /* sem armazenamento */ }
    aplicarFiltro();
  });
  const sair = (ev) => {
    if (itemAtivo && !itemAtivo.contains(ev.target)) { itemAtivo.classList.remove('alvo'); itemAtivo = null; }
    setTimeout(aplicarFiltro, 0);
  };
  document.addEventListener('focusin', sair);
  document.addEventListener('pointerdown', sair);
  let filtroSalvo = '0';
  try { filtroSalvo = localStorage.getItem(FILTRO) || '0'; } catch (e) { /* sem armazenamento */ }
  if (filtroSalvo === '1') { botaoFiltro.setAttribute('aria-pressed', 'true'); document.body.classList.add('so-falta'); }
  aplicarFiltro();
})();
</script>
</body>
</html>
