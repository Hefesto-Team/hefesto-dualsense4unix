<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hefesto — Rádio e adaptadores</title>
<style>
  :root {
    --app-bg:#21222c; --panel:#282a36; --elevated:#2b2d3a;
    --border-sutil:#343746; --border-forte:#44475a; --linha:#53576f;
    --fg:#f8f8f2; --texto-suave:#c8ccda; --texto-mudo:#9a9eb8; --comment:#8896c4;
    --cyan:#8be9fd; --green:#50fa7b; --orange:#ffb86c;
    --pink:#ff79c6; --purple:#bd93f9; --red:#ff5555; --yellow:#f1fa8c;
    --sel-bg:rgba(189,147,249,0.16);

    --font-corpo: 'Space Grotesk', system-ui, sans-serif;
    --font-dado:  'JetBrains Mono', ui-monospace, monospace;
    --ease: cubic-bezier(.22,.61,.36,1);

    --c-entrada: var(--cyan);
    --c-mic:     var(--pink);
    --c-som:     var(--orange);
    --c-haptica: var(--purple);
    --c-entrada-veu: rgba(139,233,253,.32);
    --c-som-veu:     rgba(255,184,108,.32);
    --c-haptica-veu: rgba(189,147,249,.32);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; padding: 20px;
    background: var(--app-bg); color: var(--fg);
    font-family: var(--font-corpo); font-size: 13.5px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .i { width: 1em; height: 1em; display: block; flex: none;
       fill: none; stroke: currentColor; stroke-width: 1.9;
       stroke-linecap: round; stroke-linejoin: round; }
  .i.cheio { fill: currentColor; stroke: none; }
  .ds { fill: none; stroke: currentColor; stroke-width: 1.1;
        vector-effect: non-scaling-stroke; }

  .quadro {
    position: relative; z-index: 0;
    max-width: 1210px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--linha);
    border-radius: 9px; padding: 11px 14px 14px;
  }

  .cab { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .cab .seta { color: var(--purple); font-size: 10px; }
  .cab h1 { font-size: 13.5px; font-weight: 600; margin: 0; color: var(--purple); }
  .cab .conta {
    font-family: var(--font-dado); font-size: 11px; color: var(--texto-mudo);
    margin-left: 4px;
  }
  .cab .direita { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 7px; min-height: 32px;
    background: transparent; border: 1px solid var(--linha);
    color: var(--texto-suave); font: inherit; font-size: 12.5px; cursor: pointer;
    text-decoration: none;
    transition: background var(--ease) 120ms, border-color var(--ease) 120ms, color var(--ease) 120ms;
  }
  .btn:hover { border-color: var(--texto-suave); color: var(--fg); }
  .btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .btn .i { font-size: 15px; }
  .btn.principal { border-color: var(--green); color: var(--green); }
  .btn.principal:hover { background: rgba(80,250,123,.1); }
  .btn.so-icone { padding: 7px; width: 32px; justify-content: center; }

  .sala { display: flex; flex-direction: column; gap: 7px; }

  .lugar {
    background: var(--app-bg); border: 1px solid var(--linha);
    border-radius: 9px; padding: 5px 10px 6px;
    display: flex; flex-direction: column; gap: 7px;
    transition: border-color var(--ease) 140ms;
  }
  .marca.varrendo { color: var(--yellow); cursor: help; }
  .lugar.alvo  { border-color: var(--green); background: rgba(80,250,123,.06); }
  .lugar.recebeu { animation: recebeu 900ms var(--ease) 1; }
  @keyframes recebeu {
    0%, 100% { border-color: var(--border-forte); }
    25%, 60% { border-color: var(--green); }
  }
  @media (prefers-reduced-motion: reduce) { .lugar.recebeu { animation: none } }
  .lugar.cheio { border-color: var(--orange); }

  .lugar-topo { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .abre-lugar {
    width: 24px; height: 24px; padding: 0; flex: none; border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent;
    color: var(--texto-mudo); cursor: pointer; font-size: 10px;
    transition: transform var(--ease) 140ms;
  }
  .abre-lugar:hover { border-color: var(--linha); color: var(--fg); }
  .abre-lugar:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .abre-lugar[aria-expanded="true"] { transform: rotate(90deg); }
  .lugar-corpo { display: flex; flex-direction: column; gap: 8px; }

  .lugar-nome {
    font-size: 13.5px; font-weight: 600; color: var(--fg);
    width: 16ch; flex: none; min-height: 26px;
    background: transparent; border: 1px solid var(--linha); border-radius: 6px;
    padding: 3px 6px; font-family: inherit;
  }
  .lugar-nome:hover { border-color: var(--texto-mudo); }
  .lugar-nome:focus { outline: none; border-color: var(--purple); background: var(--panel); }
  .lugar-nome::placeholder { color: var(--orange); font-weight: 400; font-style: italic; }

  .onde { display: flex; align-items: center; gap: 6px;
          font-family: var(--font-dado); font-size: 11px; color: var(--texto-mudo); }
  .onde .marca {
    display: inline-flex; align-items: center; font-size: 15px;
    color: var(--texto-suave); cursor: help;
  }
  .onde .marca.hub   { color: var(--orange); }
  .onde .marca.junto { color: var(--orange); }
  .onde .marca.usb3  { color: var(--yellow); }

  .lugar-conta { display: flex; align-items: center; gap: 8px; margin-left: auto;
                 font-family: var(--font-dado); font-size: 11.5px; color: var(--texto-mudo); }
  .lugar-conta .quanto.apertado { color: var(--orange); }
  .lugar-conta .quanto.estourou { color: var(--orange); font-weight: 600; }
  .lugar-conta .sobra { display: flex; align-items: center; gap: 3px; cursor: help; }
  .lugar-conta .sobra.nao-cabe { color: var(--texto-suave); }
  .lugar-conta .sobra.passou { color: var(--orange); }
  .lugar-conta .sobra .i { font-size: 14px; }
  .canais-do-lugar { display: flex; align-items: center; gap: 4px; cursor: help;
                     font-size: 11px; color: var(--texto-mudo); }
  .canais-do-lugar .i { font-size: 14px; }
  .canais-do-lugar.apertado { color: var(--orange); }
  .canais-do-lugar[data-nivel="liso"] { color: var(--green); }
  .canais-do-lugar[data-nivel="medio"] { color: var(--fg); }
  .canais-do-lugar[data-nivel="engasga"] { color: var(--red); font-weight: 600; }

  .trilho {
    position: relative; height: 10px; border-radius: 5px; overflow: hidden; opacity: .88;
    background: var(--panel); border: 1px solid var(--linha); display: flex; gap: 1px;
  }
  .trilho.estourado { border-color: rgba(255,184,108,.6); }
  .bloco { height: 100%; min-width: 2px; cursor: help;
           transition: width var(--ease) 260ms, filter var(--ease) 120ms; }
  .bloco:hover { filter: brightness(1.25); }
  .barra-do-lugar { position: relative; padding-top: 7px; flex: 1 1 auto; min-width: 110px; }
  .marca-do-teto {
    position: absolute; top: 0; width: 0; height: 0; transform: translateX(-4px);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid var(--orange); cursor: help;
  }

  .aparelhos { display: flex; flex-direction: column; gap: 2px; }

  .linha {
    display: grid; grid-template-columns: 36px 13ch 1fr 6ch;
    align-items: center; gap: 9px;
    padding: 3px 8px 3px 5px; border-radius: 7px;
    background: transparent; border: 1px solid transparent;
    cursor: grab; user-select: none;
    transition: background var(--ease) 120ms;
  }
  .linha:hover { background: var(--panel); }
  .linha:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .linha.arrastando { opacity: .45; }
  .linha .ds  { width: 34px; height: 24px; justify-self: center; }
  .linha .ico { font-size: 19px; justify-self: center; }
  .nome {
    font-size: 12.5px; color: var(--fg); background: transparent;
    border: 1px solid transparent; border-radius: 5px;
    padding: 3px 5px; min-height: 26px; width: 100%; min-width: 0; font-family: inherit;
  }
  .nome:hover { border-color: var(--linha); }
  .nome:focus { outline: none; border-color: var(--purple); background: var(--app-bg); }

  .features { display: flex; min-width: 0; }
  .faixa-do-aparelho { display: flex; gap: 0; min-width: 0; align-items: center; }
  .fluxo { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .fluxo .seta { font-size: 13px; flex: none; opacity: .4; }
  .fluxo.manda .seta  { color: var(--c-entrada); }
  .fluxo.recebe .seta { color: var(--c-som); }
  .fluxo + .fluxo { margin-left: 7px; padding-left: 7px;
                    border-left: 1px solid var(--border-forte); }
  .sem-radio { font-family: var(--font-dado); font-size: 10.5px;
               color: var(--texto-mudo); opacity: .7; cursor: help;
               align-self: center; }
  .fatias.zero { opacity: .45; }
  .vaga {
    position: relative; display: flex; align-items: center; gap: 5px;
    height: 24px; border-radius: 6px; padding: 0 7px;
    border: 1px dashed var(--linha); background: transparent;
    color: var(--texto-mudo); font: inherit; font-size: 11px; cursor: pointer;
    overflow: hidden; transition: all var(--ease) 140ms;
  }
  .vaga .i { font-size: 15px; flex: none; }
  .hz { font-family: var(--font-dado); font-size: 10px; opacity: .8;
        white-space: nowrap; margin-left: 3px; }
  .parte { display: flex; align-items: center; gap: 2px; min-width: 0;
           height: 24px; border-radius: 6px; padding: 0 6px; overflow: hidden;
           border: 1px solid transparent; font: inherit; font-size: 11px;
           transition: flex-grow var(--ease) 200ms; }
  .parte.movimento { color: var(--c-entrada); border-color: var(--c-entrada);
                     background: var(--panel); }
  .parte.voz { color: var(--texto-mudo); border-style: dashed;
               border-color: var(--linha); cursor: pointer;
               justify-content: center; }
  .parte.voz[aria-pressed="true"] { color: var(--c-mic); border-style: solid;
                                    border-color: var(--c-mic);
                                    background: rgba(255,121,198,.08); }
  .parte.voz:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }
  .vaga.entrada.fixa.partida { gap: 3px; padding: 0; border: none;
                               background: none; height: 24px;
                               overflow: visible; }
  .passageiro { display: inline-flex; align-items: center; flex: none;
                font-size: 13px; opacity: .45; cursor: help; margin-left: 2px; }
  .passageiro:hover, .passageiro:focus-visible { opacity: .95; }
  .vaga:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .vaga.fixa { cursor: help; }
  .vaga[aria-pressed="true"], .vaga.fixa { border-style: solid; }
  .vaga[aria-pressed="true"], .vaga.fixa { background: var(--panel); }
  .vaga.entrada[aria-pressed="true"], .vaga.entrada.fixa {
    border-color: var(--c-entrada); color: var(--c-entrada); }
  .vaga.som[aria-pressed="true"]     { border-color: var(--c-som);     color: var(--c-som); }
  .vaga.haptica[aria-pressed="true"] { border-color: var(--c-haptica); color: var(--c-haptica); }
  .vaga:not([aria-pressed="true"]):not(.fixa):hover { border-color: var(--texto-suave); color: var(--texto-suave); }
  .vaga:not([aria-pressed="true"]):not(.fixa):hover { border-color: var(--texto-suave); color: var(--texto-suave); }

  .selo-zero {
    width: 26px; height: 24px; border-radius: 6px; padding: 0; flex: none;
    margin-left: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px dashed var(--linha); background: transparent;
    color: var(--texto-mudo); cursor: pointer; font-size: 15px;
  }
  .selo-zero[aria-pressed="true"] { border-style: solid; border-color: var(--yellow);
                                    color: var(--yellow); }
  .selo-zero:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .selo-mic { padding: 0 5px; }

  .ponte { display: flex; gap: 3px; flex: 1 1 auto; min-width: 88px; }

  .fatias { font-family: var(--font-dado); font-size: 10.5px; color: var(--texto-mudo);
            text-align: right; cursor: help; }

  .soltar-fila { display: flex; align-items: center; justify-content: center; gap: 6px;
                 margin-top: 3px; }
  .soltar {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    flex: 1 1 auto; min-height: 28px; border: 1px dashed var(--linha);
    border-radius: 7px; background: transparent; font: inherit;
    color: var(--texto-mudo); font-size: 11.5px; cursor: pointer;
  }
  .soltar:hover { border-color: var(--texto-suave); color: var(--texto-suave); }
  .soltar:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .lugar.alvo .soltar { border-color: var(--green); color: var(--green); }

  .lampada {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 30px; height: 28px; padding: 0; border-radius: 7px; font-family: inherit;
    border: 1px solid var(--green); background: rgba(80,250,123,.08);
    color: var(--green); cursor: pointer;
  }
  .lampada:hover { background: rgba(80,250,123,.2); }
  .lampada:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .lampada .i { font-size: 14px; }

  .balao {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 8px;
    background: rgba(80,250,123,.09); border: 1px solid rgba(80,250,123,.35);
    font-size: 12.5px; color: var(--texto-suave);
  }
  .balao .ds { width: 28px; height: 20px; flex: none; }
  .balao .como { font-size: 11px; color: var(--texto-mudo); }
  .balao .ok {
    margin-left: auto; padding: 5px 14px; border-radius: 6px; min-height: 28px;
    background: var(--green); border: none; color: var(--app-bg);
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .balao .ok:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .sugestao {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    padding: 7px 10px; border-radius: 9px;
    background: rgba(80,250,123,.07); border: 1px solid rgba(80,250,123,.3);
    font-size: 12.5px; color: var(--texto-suave);
  }
  .sugestao.impossivel { background: rgba(255,184,108,.07); border-color: rgba(255,184,108,.32); }
  .sugestao .marca { color: var(--green); font-size: 16px; display: flex; }
  .sugestao.impossivel .marca { color: var(--orange); }
  .sugestao .ds { width: 26px; height: 18px; flex: none; }
  .sugestao .ok {
    margin-left: auto; padding: 5px 14px; border-radius: 6px; min-height: 28px;
    background: var(--green); border: none; color: var(--app-bg);
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .sugestao .ok:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .espectro { margin-bottom: 11px; }
  .espectro-cab {
    display: flex; align-items: center; gap: 7px; margin-bottom: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--green);
  }
  .espectro-cab .ajuda {
    width: 20px; height: 20px; padding: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--linha); background: transparent;
    color: var(--texto-mudo); cursor: help; font-size: 13px;
  }
  .espectro-cab .conta { font-weight: 400; font-size: 11px; color: var(--texto-mudo);
                         font-family: var(--font-dado); }
  .selo-fora {
    display: inline-flex; align-items: center; gap: 4px; margin-left: auto;
    padding: 1px 7px; border-radius: 999px; cursor: help;
    border: 1px dashed var(--border-forte); color: var(--texto-mudo);
    font-family: var(--font-dado); font-size: 10px;
  }
  .selo-fora .i { font-size: 13px; }
  .selo-fora + .no-ar { margin-left: 9px; }
  .portas { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  .grupo-de-portas {
    display: flex; gap: 3px; padding: 3px; border-radius: 7px;
    border: 1px dashed var(--border-sutil); cursor: help;
  }
  .porta {
    width: 26px; height: 26px; border-radius: 5px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--linha); background: var(--app-bg);
    color: var(--texto-mudo); cursor: pointer;
    transition: all var(--ease) 130ms;
  }
  .porta .i { font-size: 14px; }
  .porta .ds { width: 18px; height: 13px; }
  .porta.bom    { border-color: rgba(80,250,123,.45); }
  .porta.atento { border-color: var(--orange); }
  .porta.ruim   { border-color: var(--orange); background: rgba(255,184,108,.08); }
  .porta.tres::after {
    content: ''; position: absolute; width: 18px; height: 1px;
    background: var(--yellow); transform: translateY(9px);
  }
  .porta { position: relative; }
  .porta.vizinha { background: var(--sel-bg); border-color: var(--purple); }
  .porta:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .canais {
    position: relative; height: 38px; border-radius: 9px;
    background: var(--app-bg); border: 1px solid var(--linha); overflow: hidden;
  }
  .evitado {
    position: absolute; top: 0; bottom: 0;
    background: repeating-linear-gradient(45deg,
      rgba(255,184,108,.22) 0 4px, transparent 4px 8px);
  }
  .canais.duas-pistas { height: 58px; }
  .canais.duas-pistas .faixa.pista-0 { top: 4px;  bottom: auto; height: 24px; }
  .canais.duas-pistas .faixa.pista-1 { top: 30px; bottom: auto; height: 24px; }
  .faixa {
    position: absolute; top: 6px; bottom: 6px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; overflow: hidden; border: 1px solid transparent;
    padding: 0; background: none;
  }
  .faixa { background: var(--panel); border-color: var(--linha); color: var(--texto-mudo); }
  .faixa.forte { border-color: var(--orange); color: var(--orange); }
  .faixa.medio { border-color: var(--yellow); color: var(--yellow); }
  .faixa.fraco { border-color: var(--comment); color: var(--comment); }
  .faixa.fora { border-style: dashed; border-color: var(--border-forte);
                color: var(--texto-mudo); opacity: .55; }
  .faixa.custa { background: rgba(255,184,108,.10); }
  .faixa.provavel { border-style: dashed; }
  .faixa.sem-nome { border-color: var(--purple); color: var(--purple);
                    background: var(--sel-bg); cursor: pointer; }
  .faixa.sem-nome:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }
  .faixa .ch { font-family: var(--font-dado); font-size: 9.5px; opacity: .9;
               margin-left: 4px; }

  .salto {
    position: absolute; top: 0; bottom: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg,
      rgba(139,233,253,.13) 0 1px, transparent 1px 7px);
  }
  .no-ar { display: flex; align-items: center; gap: 5px; margin-left: auto;
           padding-right: 10px; margin-right: 6px; border-right: 1px solid var(--linha);
           font-size: 11px; color: var(--texto-mudo); cursor: help; }
  .no-ar .i { font-size: 15px; }
  .no-ar .ds { width: 20px; height: 14px; }

  .entradas {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--linha);
  }
  .recado {
    margin-left: auto; display: none; align-items: center; gap: 8px;
    min-width: 0; font-size: 12px; color: var(--texto-suave);
    padding: 0 4px;
  }
  .recado.vivo { display: inline-flex; animation: recado-entra 180ms var(--ease); }
  .recado .diz { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recado .desfazer {
    flex: none; min-height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--border-forte); background: transparent;
    color: var(--purple); font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .recado .desfazer:hover { border-color: var(--purple); background: var(--sel-bg); }
  .recado .confirma { color: var(--green); border-color: var(--green); }
  .recado .confirma:hover { border-color: var(--green); background: rgba(80,250,123,.10); }
  .recado.perguntando { color: var(--fg); margin-left: 0; flex: 1 1 auto; }
  .recado.perguntando .diz { white-space: normal; overflow: visible;
                             text-overflow: clip; }
  .entradas.perguntando > .btn,
  .entradas.perguntando > .mapa { display: none; }
  .recado .desfazer:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  @keyframes recado-entra { from { opacity: 0 } to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .recado.vivo { animation: none } }
  .recado + .mapa { margin-left: 6px; }

  .entradas .mapa {
    margin-left: auto; color: var(--purple); text-decoration: none;

  #veu-pergunta.aberto { background: rgba(0,0,0,.72); }
  .caixa-pergunta {
    position: absolute; z-index: 3; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(440px, calc(100% - 40px));
    background: var(--elevated); border: 1px solid var(--border-forte);
    border-radius: 10px; padding: 16px 17px 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
    display: flex; flex-direction: column; gap: 13px;
  }
  .caixa-pergunta[hidden] { display: none; }
  .caixa-pergunta .diz { margin: 0; font-size: 13px; line-height: 1.5; color: var(--fg); }
  .caixa-pergunta .botoes { display: flex; justify-content: flex-end; gap: 8px; }
  .caixa-pergunta .confirma { color: var(--green); border-color: var(--green); }
  .caixa-pergunta .confirma:hover { border-color: var(--green); background: rgba(80,250,123,.10); }
  .veu {
    position: absolute; inset: 0; border-radius: 9px;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none; transition: opacity var(--ease) 180ms;
  }
  .veu.aberto { opacity: 1; pointer-events: auto; }
  .painel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 340px; max-width: 92%;
    background: var(--panel); border-left: 1px solid var(--linha);
    border-radius: 0 9px 9px 0; overflow-y: auto;
    padding: 15px 15px 20px; display: flex; flex-direction: column; gap: 11px;
    opacity: 0; visibility: hidden; transform: translateX(-14px);
    transition: opacity var(--ease) 180ms, transform var(--ease) 180ms,
                visibility 0s linear 180ms;
    z-index: 2;
  }
  .painel.aberto { opacity: 1; visibility: visible; transform: none;
                   transition-delay: 0s, 0s, 0s; }
  .painel-cab { display: flex; align-items: center; gap: 9px; }
  .painel-cab h2 { font-size: 13.5px; font-weight: 600; margin: 0; color: var(--green); }
  .pulso { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
           animation: pisca 1.4s var(--ease) infinite; flex: none; }
  @keyframes pisca { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) {
    .pulso { animation: none }
    .fatia, .painel, .veu, .btn, .custo { transition: none }
  }
  .painel-cab .fechar { margin-left: auto; }

  .escolha-lugar { display: flex; gap: 5px; flex-wrap: wrap; }
  .op {
    padding: 5px 10px; border-radius: 20px; font-size: 11.5px; min-height: 28px;

  .achados { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
  .achado {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 9px; border-radius: 9px;
    background: var(--app-bg); border: 1px solid var(--linha);
  }
  .achado .ds { width: 26px; height: 18px; flex: none; color: var(--cyan); }
  .achado .ico { font-size: 17px; color: var(--texto-mudo); flex: none; }
  .achado .nome { font-size: 12.5px; }
  .achado .forca { margin-left: auto; font-family: var(--font-dado); font-size: 10.5px; color: var(--texto-mudo); }
  .achado .btn { padding: 4px 10px; font-size: 11.5px; min-height: 26px; }


  .painel .escolha { display: flex; flex-direction: column; gap: 7px; }

  .trilho.vagas { height: 14px; overflow: visible; opacity: 1; gap: 3px;
                  background: transparent; border: 0; }
  .vaga-ponte { flex: 1 1 0; height: 100%; border-radius: 4px; cursor: help;
                border: 1px dashed var(--linha); display: flex; align-items: center;
                justify-content: center; color: var(--fg); }
  .vaga-ponte .i { font-size: 10px; }
  .vaga-ponte.cheia { border-style: solid; }
  .vaga-ponte.alem  { border: 1px solid var(--orange); }
  .vaga-ponte.reservada { animation: pisca 1.4s var(--ease) infinite; }
  .parte.movimento .nivel { display: inline-flex; align-items: center; }
  .parte.movimento .hz { opacity: 1; color: var(--texto-mudo); }
  .parte.movimento[data-nivel="liso"] .hz { color: var(--green); }
  .parte.movimento[data-nivel="medio"] .hz { color: var(--fg); }
  .parte.movimento[data-nivel="engasga"] { border-color: var(--red); }
  .parte.movimento[data-nivel="engasga"] .hz { color: var(--red); font-weight: 600; }
  .parte.movimento:not([data-nivel]),
  .parte.movimento[data-nivel="medio"] { --arco-2: 0; }
  .parte.movimento[data-nivel="engasga"] { --arco-1: 0; --arco-2: 0; }
  .fatias.alem { color: var(--orange); font-weight: 600; }
  .vaga.alem { border-color: var(--orange) !important; }
  .espera { display: inline-flex; align-items: center; gap: 5px; min-height: 24px;
            padding: 1px 9px; border-radius: 20px; font-family: var(--font-corpo);
            font-size: 11.5px; color: var(--green); border: 1px solid rgba(80,250,123,.6);
            animation: pisca 1.4s var(--ease) infinite; white-space: nowrap; }
  .espera .ds { width: 20px; height: 14px; }
  .lugar.esperando { border-color: rgba(80,250,123,.6); }
  .linha.esperando { cursor: default; }
  .linha.esperando .nome { opacity: .6; }
  .linha .segure { color: var(--green); font-size: 11.5px;
                   animation: pisca 1.4s var(--ease) infinite; }
  .btn.recusa { animation: recusa 420ms var(--ease) 1; border-color: var(--texto-mudo); }
  @keyframes recusa { 0%,100% { transform: none } 25% { transform: translateX(-3px) }
                      75% { transform: translateX(3px) } }

    .vaga-ponte.reservada, .espera, .linha .segure, .btn.recusa { animation: none }

<script>
function lerCsv(id) {
  const cru = document.getElementById(id).textContent.trim().split('\n');
  const cab = cru.shift().split(',');
  return cru.filter(l => l.trim()).map(linha => {
    const campos = linha.split(',');
    const o = {}; cab.forEach((c, i) => { o[c] = (campos[i] ?? '').trim(); });
    return o;
  });
}

const linhas = lerCsv('dados');
const QUEDA_MINIMA_DA_VARREDURA = 32.5;
const QUEDA_MAXIMA_DA_VARREDURA = 43.4;

const LUGARES = linhas.filter(l => l.tabela === 'lugar').map(l => {
  const o = {
    id: l.id, nome: l.nome, tipo: l.a, barramento: l.b, entrada: l.c,
    face: l.d, teto_parado: Number(l.e), quedas: Number(l.f || 0), usb: l.g,
    varrendo: /varrendo/i.test(l.h || ''),
  };
  Object.defineProperty(o, 'teto', {
    enumerable: true,
    get() {
      return this.varrendo
        ? Math.round(this.teto_parado * (1 - QUEDA_MAXIMA_DA_VARREDURA / 100))
        : this.teto_parado;
    },
  });
  return o;
});
const APARELHOS = linhas.filter(l => l.tabela === 'aparelho').map(l => ({
  id: l.id, nome: l.nome, tipo: l.a, cor: l.b, lugar: l.c,
  entrada: Number(l.d), mic: Number(l.e), ponte: Number(l.f), cor_nome: l.g,
  bonds: (l.i || '').split('|').filter(Boolean),
  ligado: {
      mic: /mic/.test(l.h),
    ponte: /vib/.test(l.h) ? 'haptica' : (/som|ponte/.test(l.h) ? 'som' : null),
    luz: /luz/.test(l.h),
  },
  fixo: /fixo/.test(l.h),
}));
const ESPECTRO = linhas.filter(l => l.tabela === 'espectro').map(l => ({
  id: l.id, nome: l.nome, tipo: l.a, ini: Number(l.b), fim: Number(l.c), forca: l.d,
}));
const EVITADOS = linhas.filter(l => l.tabela === 'evitado').map(l => ({
  lugar: l.a, ini: Number(l.b), fim: Number(l.c),
}));
const CANAIS_DO_BT = 79;
function canaisDe(lid) {
  const perdidos = EVITADOS.filter(v => !v.lugar || v.lugar === lid)
    .reduce((s, v) => s + (v.fim - v.ini), 0);
  return CANAIS_DO_BT - perdidos;
}
const PORTAS = lerCsv('dados').filter(l => l.tabela === 'porta').map(l => ({
  id: l.id, caminho: l.a, usb: l.b, ocupa: l.c, grupo: l.d,
}));


const CUSTO_DE_UM_CONTROLE = 520.8 + 32.6 + 375;
const FATIAS_DO_PACOTE_A2DP = 6;
function custoDe(ap) {
  return ap.entrada
    + (ap.ligado.mic ? ap.mic : 0)
    + (ap.ligado.ponte ? ap.ponte : 0);
}
function fatiasDe(ap) {
  return [['entrada', ap.entrada],
          ['mic',     ap.ligado.mic ? ap.mic : 0],
          ['som',     ap.ligado.ponte === 'som' ? ap.ponte : 0],
          ['haptica', ap.ligado.ponte === 'haptica' ? ap.ponte : 0]];
}
const moradoresDe = lid => APARELHOS.filter(a => a.lugar === lid);
const HZ = {
  movimento_so: 260.4,
  movimento_mic: 170.5,
  voz: 106.2,
  ponte: 93.75,
};
const FATIAS_POR_SEGUNDO = 1600;
const PASSAGEIROS = [
  ['i-giro',   'Giroscópio e acelerômetro'],
  ['i-touch',  'Touchpad'],
  ['i-botoes', 'Botões, sticks e gatilhos'],
];

const escalaDoLugar = lid =>
  Math.max(1, ...moradoresDe(lid).map(custoDe));
const usoDe = lid => moradoresDe(lid).reduce((s, a) => s + custoDe(a), 0);

const PONTES_POR_ADAPTADOR = 2;
const MARGINAL_DA_PONTE = 187.5;
const PARTE_DA_VOZ = HZ.voz / (HZ.voz + HZ.movimento_mic);
const HZ_QUE_ENGASGA = 125;
const HZ_DO_JOGO = 250;
const FATIAS_POR_RELATORIO_DE_ENTRADA = 2;
function pontesQueCabem(lid) {
  const lug = LUGARES.find(l => l.id === lid);
  const controles = moradoresDe(lid).filter(a => a.tipo === 'controle').length;
  const sobra = lug.teto - FATIAS_POR_RELATORIO_DE_ENTRADA * HZ_QUE_ENGASGA * controles;
  return Math.max(0, Math.min(PONTES_POR_ADAPTADOR, Math.floor(sobra / MARGINAL_DA_PONTE)));
}
const nivelDoMovimento = hz => (typeof hz !== 'number' || Number.isNaN(hz)) ? ''
  : hz >= HZ_DO_JOGO ? 'liso' : hz >= HZ_QUE_ENGASGA ? 'medio' : 'engasga';
const DICA_DO_MOVIMENTO = {
  liso: 'Movimento por segundo: chega tudo o que o jogo usa',
  medio: 'Movimento por segundo: chega menos que pelo USB',
  engasga: 'Movimento por segundo: engasga',
  '': 'Movimento por segundo',
};
const CANAIS_MINIMOS_DO_AFH = 20;
const CANAIS_CALMOS = 60;
const nivelDosCanais = c => c >= CANAIS_CALMOS ? 'liso'
  : c > CANAIS_MINIMOS_DO_AFH ? 'medio' : 'engasga';

const ligadosEm = lid => moradoresDe(lid).filter(a => !a.esperando);
const pontesDe = lid => moradoresDe(lid)
  .filter(a => a.tipo === 'controle' && a.ligado.ponte);
function arDe(lid) {
  const lug = LUGARES.find(l => l.id === lid);
  const ms = ligadosEm(lid);
  const pontes = ms.filter(a => a.tipo === 'controle' && a.ligado.ponte).length;
  const sons = ms.filter(a => a.tipo === 'caixa' || a.tipo === 'fone')
    .reduce((s, a) => s + a.entrada, 0);
  return lug.teto - MARGINAL_DA_PONTE * pontes - sons;
}
function hzDe(ap) {
  const n = ligadosEm(ap.lugar).filter(a => a.tipo === 'controle').length || 1;
  const parte = Math.max(0, arDe(ap.lugar)) / 2 / n;
  const voz = ap.ligado.mic ? Math.min(HZ.voz, parte * PARTE_DA_VOZ) : 0;
  return { mov: parte - voz, voz };
}
function vagaDe(ap) {
  if (ap.tipo !== 'controle' || !ap.ligado.ponte) return 0;
  return pontesDe(ap.lugar).indexOf(ap) + 1;
}

function estadoDaMesa() {
  const alem = LUGARES.reduce((s, l) =>
    s + Math.max(0, pontesDe(l.id).length - PONTES_POR_ADAPTADOR), 0);
  const hzs = APARELHOS.filter(a => a.tipo === 'controle' && !a.esperando)
    .map(a => hzDe(a).mov);
  return { alem, pior: hzs.length ? Math.min(...hzs) : Infinity };
}
const melhorQue = (a, b) => a.alem < b.alem || (a.alem === b.alem && a.pior > b.pior + 10);
function sugestao(soPara) {
  const agora = estadoDaMesa();
  let melhor = null;
  for (const ap of APARELHOS) {
    if (ap.fixo || ap.esperando || ap.tipo !== 'controle') continue;
    for (const destino of LUGARES) {
      if (destino.id === ap.lugar || (soPara && destino.id !== soPara.id)) continue;
      if (ap.ligado.ponte && pontesDe(destino.id).length >= PONTES_POR_ADAPTADOR) continue;
      const de = ap.lugar;
      ap.lugar = destino.id;
      const depois = estadoDaMesa();
      ap.lugar = de;
      if (melhorQue(depois, agora) && (!melhor || melhorQue(depois, melhor.depois))) {
        melhor = { ap, destino, depois };
      }
    }
  }
  if (!melhor) return agora.alem ? { impossivel: true } : null;
  return melhor;
}

const ICONE_DO_APARELHO = {
  teclado: 'i-teclado', mouse: 'i-mouse', caixa: 'i-caixa',
  fone: 'i-fone', webcam: 'i-webcam', outro: 'i-radio',
};
const ICONE_DO_RADIO = {
  wifi: 'i-wifi', fone: 'i-fone', teclado: 'i-teclado',
  mouse: 'i-mouse', webcam: 'i-webcam',
};
const ICONE_DO_CUSTO = { mic: 'i-mic', som: 'i-som', haptica: 'i-vibra' };
function veuDaCor(cor, alfa) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(cor || '');
  if (!m) return cor;
  return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' +
    parseInt(m[3], 16) + ',' + alfa + ')';
}
const COR_DO_TIPO = {
  teclado: '#8b8fa8', mouse: '#6d7186', webcam: '#a8a08c',
  caixa: '#8c8299', fone: '#7e9aa8', outro: '#606062',
};
function corDe(ap) { return ap.cor || COR_DO_TIPO[ap.tipo] || 'var(--texto-mudo)'; }
const maiuscula = s => (s || '').replace(/^./, c => c.toUpperCase());
const virgula = n => String(n).replace('.', ',');

const NOME_CUSTO = {
  mic: 'microfone', som: 'som', haptica: 'vibração',
  entrada: 'o que o controle manda',
};

function icone(nome, classe) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'i' + (classe ? ' ' + classe : ''));
  s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#' + nome);
  s.appendChild(u);
  return s;
}
function silhueta(ap, classe) {
  const s = icone('i-ds', classe || 'ds');
  s.style.color = ap.cor || 'var(--texto-mudo)';
  s.dataset.campo = 'desenho';
  s.dataset.hefAlvo = 'atributo';
  s.dataset.hefAtributo = 'data-colorway';
  s.dataset.colorway = (ap.cor_nome || '').toLowerCase().replace(/ /g, '-');
  return s;
}

function texto(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function comoSeChama(ap) {
  if (ap.tipo === 'controle' && ap.cor_nome) {
    return 'o <b>' + texto(ap.cor_nome) + '</b>' +
      (ap.nome ? ' de <b>' + texto(ap.nome) + '</b>' : '');
  }
  return (ARTIGO_DO_TIPO[ap.tipo] || 'o') + ' <b>' + texto(ap.nome) + '</b>';
}
const ARTIGO_DO_TIPO = { caixa: 'a', webcam: 'a' };
function comoSeChamaOLugar(lug) {
  return lug.nome ? 'o <b>' + texto(lug.nome) + '</b>'
                  : 'a <b>Entrada ' + texto(lug.entrada) + '</b>';
}
function comoSeLe(ap) {
  const q = ap.tipo === 'controle' && ap.cor_nome
    ? 'controle ' + ap.cor_nome : ap.tipo;
  return ap.nome + ', ' + q;
}

function pintar() {
  const sala = document.getElementById('sala');
  sala.innerHTML = '';

  for (const lug of LUGARES) {
    const moradores = moradoresDe(lug.id);
    const pontes = pontesDe(lug.id);
    const esperando = moradores.filter(a => a.esperando);
    const card = document.createElement('div');
    card.className = 'lugar' + (pontes.length > PONTES_POR_ADAPTADOR ? ' cheio' : '') +
      (esperando.length ? ' esperando' : '');
    card.dataset.campo = 'lugar';
    card.dataset.alvo = lug.id;
    card.dataset.id = lug.id;

    const topo = document.createElement('div');
    topo.className = 'lugar-topo';

    if (lug.aberto === undefined) {
      const pior = LUGARES.filter(l => pontesDe(l.id).length > PONTES_POR_ADAPTADOR)
        .sort((a, b) => pontesDe(b.id).length - pontesDe(a.id).length)[0];
      for (const o of LUGARES) o.aberto = false;
      if (pior) pior.aberto = true;
    }
    const abre = document.createElement('button');
    abre.className = 'abre-lugar';
    abre.innerHTML = '<span aria-hidden="true">\u25B6</span>';
    abre.setAttribute('aria-expanded', String(lug.aberto));
    abre.title = (lug.aberto ? 'Esconder' : 'Ver') + ' os aparelhos deste adaptador';
    abre.setAttribute('aria-label', abre.title);
    abre.dataset.gesto = 'abrir-adaptador';
    abre.dataset.alvo = lug.id;
    abre.addEventListener('click', () => {
      const abrindo = !lug.aberto;
      for (const o of LUGARES) o.aberto = false;
      lug.aberto = abrindo;
      pintar();
    });
    topo.appendChild(abre);

    const nome = document.createElement('input');
    nome.className = 'lugar-nome'; nome.value = lug.nome;
    nome.placeholder = 'Dê um nome a este adaptador';
    nome.setAttribute('aria-label', 'Nome deste adaptador');
    nome.dataset.gesto = 'adaptador-renomear';
    nome.dataset.alvo = lug.id;
    nome.dataset.campo = 'lugar-nome';
    nome.dataset.hefAlvo = 'valor';
    const caberNome = () => {
      nome.style.width = Math.max(
        (nome.value || nome.placeholder).length + 2, 10) + 'ch';
    };
    caberNome();
    nome.addEventListener('input', caberNome);
    nome.addEventListener('change', () => { lug.nome = nome.value; pintar(); });
    topo.appendChild(nome);

    const onde = document.createElement('span');
    onde.className = 'onde';
    if (lug.face) {
      const m = document.createElement('span');
      m.className = 'marca ' + (lug.tipo === 'hub' ? 'hub' : 'direto');
      m.appendChild(icone(lug.tipo === 'hub' ? 'i-hub' : 'i-placa'));
      m.title = lug.face; m.setAttribute('role', 'img');
      m.setAttribute('aria-label', lug.face);
      onde.appendChild(m);
      const e = document.createElement('span');
      e.textContent = 'Entrada ' + lug.entrada;
      onde.appendChild(e);
    }
    if (lug.varrendo) {
      const v = document.createElement('span');
      v.className = 'marca varrendo';
      v.appendChild(icone('i-varrendo'));
      v.title = 'Outro programa está procurando aparelhos por aqui. Controle novo vai para outro adaptador.';
      v.setAttribute('role', 'img'); v.setAttribute('aria-label', v.title);
      v.dataset.campo = 'lugar-varrendo';
      onde.appendChild(v);
    }
    const portaDele = PORTAS.find(p => p.ocupa === lug.id);
    const aPorta = portaDele ? comoEstaAPorta(portaDele) : null;
    if (aPorta && aPorta.estado !== 'bom' && aPorta.estado !== 'neutro') {
      const j = document.createElement('span');
      j.className = 'marca junto';
      j.appendChild(icone('i-aviso'));
      j.title = maiuscula(aPorta.porque) + '.';
      j.setAttribute('role', 'img'); j.setAttribute('aria-label', j.title);
      onde.appendChild(j);
    }
    if (/3\.0/.test(lug.usb || '')) {
      const u = document.createElement('span');
      u.className = 'marca usb3';
      u.appendChild(icone('i-aviso'));
      u.title = 'Entrada USB 3.0: faz ruído no rádio. Prefira uma 2.0.';
      u.setAttribute('role', 'img'); u.setAttribute('aria-label', u.title);
      onde.appendChild(u);
    }
    for (const ap of esperando) {
      const e = document.createElement('span');
      e.className = 'espera';
      e.dataset.campo = 'esperando-parear';
      e.dataset.alvo = ap.id;
      e.appendChild(silhueta(ap));
      e.append('Segure PS + Create');
      e.title = 'Segure PS + Create no ' + (ap.cor_nome || ap.nome) + ' até a luz piscar.';
      onde.appendChild(e);
    }
    topo.appendChild(onde);

    const conta = document.createElement('span');
    conta.className = 'lugar-conta';
    const n = pontes.length;
    const cabem = pontesQueCabem(lug.id);
    const q = document.createElement('span');
    q.className = 'quanto canais-do-lugar ' +
      (n > cabem ? 'estourou' : (n === cabem ? 'apertado' : ''));
    q.dataset.campo = 'lugar-pontes';
    q.dataset.cabem = String(cabem);
    q.appendChild(icone('i-som'));
    q.append(n + '/' + cabem);
    q.title = 'Controles com som ou vibração: ' + n + ' de ' + cabem +
      (n > cabem ? ' — o som engasga' : '');
    q.setAttribute('role', 'img');
    q.setAttribute('aria-label', q.title);
    conta.appendChild(q);

    const canais = canaisDe(lug.id);
    const ch = document.createElement('span');
    ch.className = 'canais-do-lugar';
    ch.dataset.nivel = nivelDosCanais(canais);
    ch.appendChild(icone('i-radio'));
    ch.append(canais + '/' + CANAIS_DO_BT);
    ch.title = (canais === CANAIS_DO_BT ? 'Usa os ' + CANAIS_DO_BT + ' canais'
      : 'Evita ' + (CANAIS_DO_BT - canais) + ' dos ' + CANAIS_DO_BT + ' canais (vizinhos)')
      + (ch.dataset.nivel === 'engasga' ? '. Usa o mínimo que o rádio aceita' : '');
    ch.setAttribute('role', 'img');
    ch.setAttribute('aria-label', ch.title);
    conta.appendChild(ch);

    const livres = cabem - n;
    const sobra = document.createElement('span');
    sobra.className = 'sobra' + (livres < 0 ? ' passou' : (livres === 0 ? ' nao-cabe' : ''));
    if (livres >= 1) {
      sobra.appendChild(icone('i-mais'));
      for (let i = 0; i < livres; i++) sobra.appendChild(icone('i-ds', 'ds'));
      sobra.title = livres === 1 ? 'Cabe mais 1 com som' : 'Cabem mais ' + livres + ' com som';
    } else {
      sobra.appendChild(icone('i-nao-cabe'));
      sobra.title = livres < 0 ? 'Passou do limite: o som engasga' : 'Cheio de som (sem som, cabe)';
    }
    sobra.setAttribute('role', 'img');
    sobra.setAttribute('aria-label', sobra.title);
    conta.appendChild(sobra);
    topo.appendChild(conta);
    const barra = document.createElement('div');
    barra.className = 'barra-do-lugar';
    const trilho = document.createElement('div');
    trilho.className = 'trilho vagas';
    trilho.dataset.campo = 'lugar-barra';
    trilho.dataset.alvo = lug.id;
    trilho.dataset.hefAlvo = 'html';
    const escala = Math.max(PONTES_POR_ADAPTADOR, n);
    for (let i = 0; i < escala; i++) {
      const ap = pontes[i];
      const v = document.createElement('div');
      v.className = 'vaga-ponte' + (ap ? ' cheia' : '') +
        (i >= PONTES_POR_ADAPTADOR ? ' alem' : '') + (ap && ap.esperando ? ' reservada' : '');
      if (ap) {
        v.style.background = veuDaCor(corDe(ap), .5);
        if (i < PONTES_POR_ADAPTADOR) v.style.borderColor = corDe(ap);
        v.appendChild(icone(ICONE_DO_CUSTO[ap.ligado.ponte]));
        v.title = (ap.cor_nome || ap.nome) + ' · ' + NOME_CUSTO[ap.ligado.ponte] +
          (ap.esperando ? ' · esperando' : '') + (i >= PONTES_POR_ADAPTADOR ? ' · passou do limite' : '');
      } else {
        v.title = 'Vaga livre';
      }
      trilho.appendChild(v);
    }
    barra.appendChild(trilho);
    if (n > PONTES_POR_ADAPTADOR) {
      const marca = document.createElement('div');
      marca.className = 'marca-do-teto';
      marca.style.left = 'calc(' + (PONTES_POR_ADAPTADOR / escala) * 100 + '% - 1.5px)';
      marca.title = 'Limite: ' + PONTES_POR_ADAPTADOR;
      barra.appendChild(marca);
      trilho.classList.add('estourado');
    }
    topo.insertBefore(barra, conta);
    card.appendChild(topo);
    if (!lug.aberto) { sala.appendChild(card); continue; }

    const lista = document.createElement('div');
    lista.className = 'aparelhos';
    lista.dataset.lugar = lug.id;
    lista.dataset.campo = 'doca';
    lista.dataset.alvo = lug.id;
    for (const ap of moradores) lista.appendChild(linhaDe(ap));

    {
      const fila = document.createElement('div');
      fila.className = 'soltar-fila';
      const pe = document.createElement('button');
      pe.className = 'soltar';
      pe.appendChild(icone('i-soltar'));
      pe.append(moradores.length ? 'Arraste outro para cá' : 'Arraste um aparelho para cá');
      pe.title = 'Trazer um aparelho para cá';
      pe.dataset.gesto = 'trazer-para-ca';
      pe.dataset.alvo = lug.id;
      pe.addEventListener('click', () => quemVemPraCa(lug));
      fila.appendChild(pe);
      const s = sugestaoPara(lug);
      if (s) {
        const lamp = document.createElement('button');
        lamp.className = 'lampada';
        lamp.appendChild(icone('i-lampada'));
        lamp.title = 'Quem funciona melhor aqui';
        lamp.setAttribute('aria-label', lamp.title);
        lamp.dataset.gesto = 'sugerir-alocacao';
        lamp.dataset.alvo = lug.id;
        lamp.addEventListener('click', () => mostrarBalao(card, s));
        fila.appendChild(lamp);
      }
      lista.appendChild(fila);
    }
    card.appendChild(lista);
    sala.appendChild(card);
  }

  document.getElementById('conta').textContent =
    APARELHOS.filter(a => a.tipo === 'controle').length + ' controles · ' +
    LUGARES.length + ' adaptadores';
  pintarEspectro();
  pintarPortas();
}

function sugestaoPara(destino) {
  const s = sugestao(destino);
  return s && !s.impossivel ? s : null;
}

let _fecharPergunta = null;
const _LETRA_DA_ENTIDADE = { amp: '&', lt: '<', gt: '>' };
function poeFrase(onde, frase) {
  onde.textContent = '';
  let dentro = onde;
  for (const parte of String(frase).split(/(<br>|<b>|<\/b>)/)) {
    if (parte === '<br>') onde.appendChild(document.createElement('br'));
    else if (parte === '<b>') dentro = onde.appendChild(document.createElement('b'));
    else if (parte === '</b>') dentro = onde;
    else if (parte) {
      dentro.appendChild(document.createTextNode(
        parte.replace(/&(amp|lt|gt);/g, (_, e) => _LETRA_DA_ENTIDADE[e])));
    }
  }
}
function perguntar(diz, rotuloSim, sim, nao, outro) {
  const caixa = document.getElementById('pergunta');
  const veu = document.getElementById('veu-pergunta');
  if (!caixa) return;
  const antesDoFoco = document.activeElement;
  poeFrase(caixa.querySelector('.diz'), diz);
  const s = caixa.querySelector('#pergunta-sim');
  const n = caixa.querySelector('#pergunta-nao');
  const o = caixa.querySelector('#pergunta-outro');
  s.textContent = rotuloSim;
  const s2 = s.cloneNode(true), n2 = n.cloneNode(true), o2 = o.cloneNode(true);
  s.replaceWith(s2); n.replaceWith(n2); o.replaceWith(o2);
  o2.hidden = !outro;
  if (outro) o2.textContent = outro.rotulo;
  const fechar = () => {
    caixa.hidden = true;
    veu.classList.remove('aberto');
    document.removeEventListener('keydown', porEscape, true);
    _fecharPergunta = null;
    if (antesDoFoco && antesDoFoco.focus) antesDoFoco.focus();
  };
  const porEscape = e => {
    if (e.key === 'Escape') { e.stopPropagation(); fechar(); if (nao) nao(); }
  };
  s2.addEventListener('click', () => { fechar(); sim(); });
  n2.addEventListener('click', () => { fechar(); if (nao) nao(); });
  if (outro) o2.addEventListener('click', () => { fechar(); outro.aoEscolher(); });
  veu.onclick = () => { fechar(); if (nao) nao(); };
  document.addEventListener('keydown', porEscape, true);
  _fecharPergunta = () => { fechar(); if (nao) nao(); };
  caixa.hidden = false;
  veu.classList.add('aberto');
  s2.focus();
}

function comoSeParea(ap) {
  if (ap.tipo === 'controle') return 'Depois, segure <b>PS + Create</b> até a luz piscar.';
  return 'Depois, ponha ' + (ARTIGO_DO_TIPO[ap.tipo] || 'o') + ' ' + ap.tipo + ' para parear.';
}
function pedirParaMover(ap, destinoId, depois) {
  if (!ap || ap.lugar === destinoId || ap.fixo) return false;
  const lug = LUGARES.find(l => l.id === destinoId);
  document.querySelectorAll('.lugar.alvo').forEach(l => l.classList.remove('alvo'));
  const alvo = document.querySelector('.lugar[data-id="' + destinoId + '"]');
  if (alvo) alvo.classList.add('alvo');
  const ela = ARTIGO_DO_TIPO[ap.tipo] === 'a';
  const cheio = ap.tipo === 'controle' && ap.ligado.ponte &&
    pontesDe(destinoId).length >= PONTES_POR_ADAPTADOR;
  perguntar(
    'Mover ' + comoSeChama(ap) + ' para ' + comoSeChamaOLugar(lug) + '?<br>' +
    'Só ' + (ela ? 'ela' : 'ele') + ' sai daqui. ' + comoSeParea(ap) +
    (cheio ? ' Lá o som pode engasgar.' : ''),
    'Mover',
    () => { moverAgora(ap, destinoId); if (depois) depois(); },
    () => { if (alvo) alvo.classList.remove('alvo'); });
  return true;
}

function pedirVagaDePonte(ap, k) {
  const lug = LUGARES.find(l => l.id === ap.lugar);
  let destino = null, melhor = null;
  for (const d of LUGARES) {
    if (d.id === ap.lugar || pontesDe(d.id).length >= PONTES_POR_ADAPTADOR) continue;
    const de = ap.lugar;
    ap.lugar = d.id; ap.ligado.ponte = k;
    const est = estadoDaMesa();
    ap.lugar = de; ap.ligado.ponte = null;
    if (!melhor || melhorQue(est, melhor)) { melhor = est; destino = d; }
  }
  const ligarAqui = () => { ap.ligado.ponte = k; pintar(); };
  const oQue = k === 'som' ? 'o som' : 'a vibração';
  if (!destino) {
    perguntar('Todas as entradas já têm ' + PONTES_POR_ADAPTADOR +
      ' controles com som ou vibração.<br>Ligar ' + oQue + ' mesmo assim? Pode engasgar.',
      'Ligar', ligarAqui);
    return;
  }
  perguntar(maiuscula(comoSeChamaOLugar(lug)) + ' já tem ' + PONTES_POR_ADAPTADOR +
    ' controles com som ou vibração.<br>Mover ' + comoSeChama(ap) + ' para ' +
    comoSeChamaOLugar(destino) + ' e ligar lá?',
    'Mover e ligar',
    () => { ap.ligado.ponte = k; moverAgora(ap, destino.id); },
    null,
    { rotulo: 'Ligar aqui', aoEscolher: ligarAqui });
}

const PS_CREATE_NO_MOCKUP_MS = 4000;
function moverAgora(ap, destinoId) {
  if (!ap || ap.lugar === destinoId) return false;
  ap.lugar = destinoId;
  ap.bonds = [];
  ap.esperando = true;
  pintar();
  if (!window.SEM_RELOGIO) setTimeout(() => chegou(ap), PS_CREATE_NO_MOCKUP_MS);
  return true;
}
function chegou(ap) {
  if (!ap.esperando) return;
  ap.esperando = false;
  ap.bonds = [ap.lugar];
  pintar();
  const card = document.querySelector('.lugar[data-id="' + ap.lugar + '"]');
  if (card) {
    card.classList.add('recebeu');
    setTimeout(() => card.classList.remove('recebeu'), 900);
  }
}

const ondeSoltar = e =>
  (e.target.closest && e.target.closest('.lugar')) || null;

document.addEventListener('dragover', e => {
  const doca = ondeSoltar(e);
  if (!doca) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.lugar').forEach(l => l.classList.remove('alvo'));
  doca.classList.add('alvo');
});
document.addEventListener('dragleave', e => {
  const doca = ondeSoltar(e);
  if (doca && !doca.contains(e.relatedTarget)) doca.classList.remove('alvo');
});
document.addEventListener('drop', e => {
  const doca = ondeSoltar(e);
  if (!doca) return;
  e.preventDefault();
  const ap = APARELHOS.find(a => a.id === e.dataTransfer.getData('text/plain'));
  document.querySelectorAll('.lugar').forEach(l => l.classList.remove('alvo'));
  if (ap) pedirParaMover(ap, doca.dataset.id);
});

function canaisQueCusta(e) {
  if (e.forca === 'fora') return 0;
  return EVITADOS.reduce((s, v) =>
    s + Math.max(0, Math.min(e.fim, v.fim) - Math.max(e.ini, v.ini)), 0);
}

function pistaLivre(e, pistas) {
  for (let i = 0; i < pistas.length; i++) {
    if (pistas[i].every(o => e.ini >= o.fim || e.fim <= o.ini)) {
      pistas[i].push(e); return i;
    }
  }
  if (pistas.length >= 2) { pistas[1].push(e); return 1; }
  pistas.push([e]); return pistas.length - 1;
}

const EH_RADIO = new Set(['controle', 'wifi', 'teclado', 'mouse', 'fone', 'caixa']);

function oQueOcupa(porta) {
  if (!porta.ocupa) return null;
  const l = LUGARES.find(x => x.id === porta.ocupa);
  if (l) return { tipo: 'adaptador', nome: l.nome || 'Entrada ' + l.entrada, radio: true, icone: 'i-radio' };
  const a = APARELHOS.find(x => x.id === porta.ocupa);
  if (a) return { tipo: a.tipo, nome: a.nome, radio: a.tipo !== 'webcam',
                  icone: a.tipo === 'controle' ? 'i-ds' : (ICONE_DO_APARELHO[a.tipo] || 'i-radio'),
                  cor: corDe(a) };
  const e = ESPECTRO.find(x => x.id === porta.ocupa);
  if (e) return { tipo: e.tipo, nome: e.nome, radio: true,
                  icone: ICONE_DO_RADIO[e.tipo] || 'i-radio' };
  return null;
}

function numeroDaPorta(porta) {
  const m = /^(.*)\.(\d+)$/.exec(porta.caminho) || /^(\d+)-(\d+)$/.exec(porta.caminho);
  return m ? { pai: m[1], n: Number(m[2]) } : null;
}
function aoLado(a, b) {
  const x = numeroDaPorta(a), y = numeroDaPorta(b);
  return !!(x && y && x.pai === y.pai && Math.abs(x.n - y.n) === 1);
}
function comoEstaAPorta(porta) {
  const meu = oQueOcupa(porta);
  const vizinhas = PORTAS.filter(o => o.id !== porta.id && aoLado(o, porta));
  const radiosAoLado = vizinhas.filter(o => { const q = oQueOcupa(o); return q && q.radio; });
  const tresOcupadaAoLado = vizinhas.filter(o => o.usb === '3.0' && oQueOcupa(o));
  if (meu && meu.radio) {
    if (tresOcupadaAoLado.length) return { estado: 'ruim', porque: 'USB 3.0 ao lado' };
    if (radiosAoLado.length) {
      const quem = radiosAoLado.map(o => (oQueOcupa(o) || {}).nome).filter(Boolean);
      return { estado: 'atento', porque: 'colado em ' + (quem.join(', ') || 'outro rádio') };
    }
    return { estado: 'bom', porque: 'nenhum rádio ao lado' };
  }
  if (!meu) {
    if (porta.usb === '3.0') return { estado: 'neutro', porque: 'livre (USB 3.0: melhor para o que não é rádio)' };
    if (radiosAoLado.length) return { estado: 'atento', porque: 'livre, rádio ao lado' };
    return { estado: 'bom', porque: 'livre' };
  }
  return { estado: 'neutro', porque: 'não usa rádio' };
}

function pintarPortas() {
  const faixa = document.getElementById('portas');
  if (!faixa) return;
  faixa.innerHTML = '';
  const grupos = [];
  for (const porta of PORTAS) {
    let g = grupos.find(x => x.nome === porta.grupo);
    if (!g) { g = { nome: porta.grupo, portas: [] }; grupos.push(g); }
    g.portas.push(porta);
  }
  for (const g of grupos) {
    const bloco = document.createElement('div');
    bloco.className = 'grupo-de-portas';
    bloco.title = g.nome;
    bloco.setAttribute('aria-label', g.nome);
    for (const porta of g.portas) {
      const meu = oQueOcupa(porta);
      const como = comoEstaAPorta(porta);
      const c = document.createElement('button');
      c.className = 'porta ' + como.estado + (porta.usb === '3.0' ? ' tres' : '');
      c.dataset.grupo = g.nome;
      c.dataset.gesto = 'examinar-portas';
      c.dataset.alvo = porta.id;
      if (meu) {
        const ic = icone(meu.icone, meu.icone === 'i-ds' ? 'ds' : '');
        if (meu.cor) ic.style.color = meu.cor;
        c.appendChild(ic);
      }
      c.title = 'Entrada ' + porta.caminho + ' · USB ' + porta.usb + ' · ' +
        (meu ? meu.nome || meu.tipo : 'livre') + ' — ' + como.porque + '.';
      c.setAttribute('aria-label', c.title);
      c.addEventListener('mouseenter', () => acenderGrupo(g.nome, true));
      c.addEventListener('mouseleave', () => acenderGrupo(g.nome, false));
      c.addEventListener('focus', () => acenderGrupo(g.nome, true));
      c.addEventListener('blur', () => acenderGrupo(g.nome, false));
      bloco.appendChild(c);
    }
    faixa.appendChild(bloco);
  }
}

    if (v.ini > c) livres.push([c, v.ini]);

  const evitados = Math.max(0, ...LUGARES.map(l => CANAIS_DO_BT - canaisDe(l.id)));
  const semNome = ESPECTRO.filter(e => !e.nome).length;

  conta.title = 'O adaptador que mais evita: ' + evitados + ' de 79 canais' +
    (pior && canaisQueCusta(pior) ? '. Pior vizinho: ' + (pior.nome || 'sem nome') + '.' : '.');
