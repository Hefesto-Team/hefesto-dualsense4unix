<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hefesto — aba JOGAR</title>
<style>
  /* AS FONTES MORAM NO PRODUTO (AS-FONTES-DA-INTERFACE-MORAM-NO-PRODUTO-01): o `<link>` do Google segurava o
     `complete` enquanto a rede não respondia. `../assets/fontes/` vale de `paginas/` e de `mockup/` (a raiz tem
     `assets/fontes`, link para a mesma pasta). Os pesos são os que o `<link>` pedia (Space Grotesk 400–700, JetBrains
     Mono 400–500): o negrito da mono continua o sintetizado de antes, e a letra não muda. Versão e origem: `assets/fontes/ORIGEM.md`. */
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url('../assets/fontes/SpaceGrotesk-wght.ttf') format('truetype')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 500;font-display:swap;src:url('../assets/fontes/JetBrainsMono-wght.ttf') format('truetype')}
  /* ---------------------------------------------------------------
     As 11 cores do GUIA_IMPLEMENTACAO.md. Nenhuma inventada.
     --------------------------------------------------------------- */
  :root{
    --app-bg:#21222c; --panel:#282a36; --elevated:#2b2d3a;
    --border-sutil:#343746; --border-forte:#44475a;
    /* O FUNDO EM VOLTA DA JANELA É UM TOKEN — 21/10/2026, A-MOLDURA-DA-PAGINA-SEGUE-O-TEMA-01:
       o `#11121a` era cor por extenso no `body`, e tema nenhum o alcançava. */
    --fundo-da-pagina:#11121a;
    /* DUAS CORES SUBIRAM EM 30/08/2026, e o número é a razão.
       O usuário apontou o sintoma três vezes, em três abas: *"os campos de importância
       tipo cor, brilho, selecione player tão invisíveis"*, *"essas cores de nomes
       de campos e essa fonte tem um contraste horrível"*, *"em todas as abas isso
       tem que ser visto infelizmente"*.
       MEDIDO nas dez abas, contraste WCAG de todo texto contra o fundo real:
       390 elementos abaixo do limiar, e DUAS cores respondem por 93% deles —
       `--comment` 217 vezes a 3,03:1 e `--texto-mudo` 146 vezes a 4,47:1.
       O limiar para texto pequeno é 4,5:1; as duas ficavam abaixo, uma delas
       por muito. Não era defeito de aba nenhuma: era a paleta.
       O QUE MUDOU É SÓ A LUMINÂNCIA. O matiz e a saturação de cada uma
       continuam os mesmos — a cara da interface não muda, o texto aparece:
         --comment    #6272a4 -> #8896c4   3,03:1 -> 4,89:1
         --texto-mudo #8b8fa8 -> #9a9eb8   4,47:1 -> 5,40:1
       Os hex de origem eram do GUIA_IMPLEMENTACAO.md, e o `--comment` de lá é a
       cor de COMENTÁRIO do Dracula — feita para código, onde apagar é o efeito
       desejado. Usá-la em texto de interface é que era o engano. */
    --fg:#f8f8f2; --texto-suave:#c8ccda; --texto-mudo:#9a9eb8; --comment:#8896c4;
    --cyan:#8be9fd; --green:#50fa7b; --orange:#ffb86c;
    --pink:#ff79c6; --purple:#bd93f9; --red:#ff5555; --yellow:#f1fa8c;
    --sel-bg:rgba(189,147,249,0.16);
    /* O FUNDO E O ARO DA LOGO SÃO DO TEMA — 20/10/2026, O-TEMA-CLARO-NASCE-COMO-EXTENSAO-01.
       Na casa, nada atrás da logo (o SVG já é o disco); o tema claro diz o disco escuro, para
       a logo, intacta, pintar sobre o escuro de sempre. A régua é `mods.tema.validar`. */
    --logo-fundo:none; --logo-aro:transparent;
    /* O RÓTULO DE CAMPO TEM COR DE RÓTULO, NÃO DE COMENTÁRIO.
       `.sec-rot` nascia `var(--comment)` (#6272a4) nas SEIS abas que a usam, e
       ela leu o resultado pelo que ele é: *"os campos de importância tipo cor,
       brilho, selecione player tão invisíveis"*. #6272a4 sobre o `--panel`
       (#282a36) dá contraste 2,6:1 — abaixo do 4,5:1 que texto pequeno pede.
       O roxo é a cor de destaque DA CASA, medida: as dez abas pintam o
       `.quadro-titulo` de #bd93f9, sem exceção.
       Um TOKEN e não um hex por aba: assim a Vibração troca o dela numa linha
       (o usuário pediu verde lá) sem ninguém digitar cor em seis arquivos — que é
       exatamente como esta regra virou seis cópias divergentes.

       VERDE, E NÃO ROXO — decisão, 30/08: *"deixa verde os nomes"*
       (Iluminação) e *"os nomes das seções tem que ser verde"* (Gatilhos). Ela
       já pedira verde na Vibração horas antes; agora vale para as dez, e a
       exceção escopada em `.vib` some por ser redundante.
       O roxo continua sendo a cor do TÍTULO do quadro (`.quadro-titulo`, as dez
       pintam #bd93f9). São dois papéis: o título nomeia a ABA, o rótulo nomeia a
       LINHA. Cores diferentes é o que os separa. */
    --rot-campo:var(--green);
    /* ---------------------------------------------------------------
       A ESCALA DA BORDA ESTRUTURAL — UMA SÓ, 31/08/2026.

       PEDIDO, vendo Gatilhos, Iluminação e Vibração: *"é preciso remover as
       bordas sobrando de tudo e deixar as bordas menos perceptíveis mas
       presentes e modernas de forma que não roube a atenção de forma
       negativa"*; e sobre a Perfis: *"nessa aba aqui as bordas tão horríveis"*.

       O DEFEITO NÃO ERA UMA BORDA — ERA A FAIXA INTEIRA. Censo do DOM das
       quatro abas, contraste de cada borda contra o fundo REAL atrás dela: a
       borda ESTRUTURAL ia de **1,21:1** (`--border-sutil`, que sumia) a
       **4,89:1** (`.btn`, que usava `--comment`) na MESMA tela — quatro vezes
       de diferença. É isso que fazia a Gatilhos ler como GRADE: a divisória
       horizontal gritava a 3,37:1 enquanto a vertical, encostada nela, sumia a
       1,21:1. Não havia peso demais nem de menos; havia peso NENHUM em comum.

       O VALOR, E DE ONDE ELE SAI. Um só, e ele é o MEIO EM LUMINÂNCIA entre os
       dois extremos que ela mesma julgou: #343746 tem L 23,9% e ela o chamou de
       invisível em 30/08; #767a92 tem L 51,8% e é o que ela chamou de excessivo
       hoje. L 38% é o meio exato, e o matiz e a saturação continuam os da
       família (H 231, S 13%) — muda só a luminância, como em 30/08.

         --linha  #53576f   2,01:1 sobre --panel · 2,23:1 sobre --app-bg

       São **40% menos** que a linha de 30/08 (3,37:1) e **66% mais** que a
       borda que sumia (1,21:1). O rótulo verde ao lado dela está a 10,4:1 e o
       texto mudo a 5,40:1: a linha recua diante dos dois, que é o que "presente
       e não rouba a atenção" quer dizer em número.

       QUEM NÃO LÊ DAQUI, e é o ponto: a borda que carrega INFORMAÇÃO. A cor do
       plástico (D-A-BORDA-E-A-IDENTIDADE-DA-PECA), o estado (`.on`,
       `.aba.ativa`, `:hover`) e o foco continuam com a cor deles — esmaecer
       essas é apagar o dado, não o enfeite.
       --------------------------------------------------------------- */
    --linha:#53576f;
    /* A LINHA QUE SEPARA UM CAMPO DO OUTRO. Pedido: *"linha abaixo de cada
       campo"* / *"as linhas horizontais deveriam separar os campos em linhas"*
       e, quando a viu: *"as linhas divisórias em todas as páginas tão
       invisíveis (…) a primeira coluna serve como nome da linha e a divisória
       entre eles tem que estar clara"*.

       ELA ESTAVA CERTA, E O NÚMERO ERA BRUTAL. `--border-sutil` (#343746) sobre
       o painel (#282a36) dá **1,21:1** — a linha existia no DOM e não na tela.
       `--border-forte` também não servia: 1,56:1.

       O QUE CADUCOU EM 31/08, e é a metade seguinte da mesma medição: o #767a92
       escolhido em 30/08 mirava a WCAG 1.4.11 (3:1 para componente gráfico) e
       chegava a **3,37:1**. Só que 1.4.11 é o piso do que IDENTIFICA um
       controle — um traço que só separa duas células não precisa dele, e a esse
       peso ele passou a competir com o que separa. O usuário viu o resultado em três
       abas e pediu o contrário. O nome fica (seis abas o escrevem); quem manda
       agora é a escala acima, e ela vale para as dez de uma vez. */
    --rot-linha:var(--linha);
    /* cores de plástico — a borda diz QUAL peça é (D-A-BORDA-E-A-IDENTIDADE-DA-PECA) */
    /* OS CINCO PLÁSTICOS SÃO GERADOS — `monta.py` os reescreve a cada geração,
       lendo o `<style>` que `scripts/gerar_cores_do_dualsense.py` pôs no SVG. Os
       valores abaixo são o retrato do último `python3 abaNN.py`; editá-los à mão
       não muda nada, porque a geração os substitui. Estavam errados até 27/08:
       o Cosmic Red era `#b11f54` e a amostragem devolveu `#A51C48`. */
    --cosmic-red:#ae335a; --nova-pink:#e35b8c; --starlight-blue:#7eb8d4;
    --galactic-purple:#74588e; --midnight-black:#606062;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--fundo-da-pagina); color:var(--fg);
    font-family:'Space Grotesk',system-ui,sans-serif;
    /* O RECUO TEM DONO — `--recuo-do-corpo`, no `:root` de baixo. Ele entra
       DUAS vezes na conta da altura da `.janela` (em cima e embaixo), e era
       justamente esse 16 que o `interface/janela.py` transcrevia à mão. */
    padding:var(--recuo-do-corpo); display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}

  /* A LARGURA ESTICA, COM TETO — 08/09/2026, decisão de produto.

     ELA ERA `width:1180px` FIXO. Ela, com o produto instalado e os quatro
     DualSense na mesa: *"o background fica completamente preto"*. Medido: não
     era falta de fundo — o `body` já pinta `--fundo-da-pagina` logo acima, e o que ela
     via era a cor da casa, só que MUITA: a janela maximizada tem ~1900px e o
     desenho parava em 1180, deixando ~360px de casa de cada lado.

     A recomendação foi levada ao usuário e o usuário aprovou (*"eu confio em vc, manda
     ver"*): ESTICA, COM TETO. As razões, para ninguém as desfazer sem medir:
     ela tem UMA tela e maximiza, então a sobra é o que ela vê o tempo todo;
     ela tem QUATRO controles, e as abas de uma coluna por jogador estavam
     espremidas; e o teto protege a leitura, porque esticar sem limite alonga a
     linha até ela deixar de se ler.

     DE ONDE SAI O 1600, e ele é HIPÓTESE MEDIDA, não dogma. As dez páginas
     publicadas foram fotografadas e medidas em 1180, 1400, 1600 e 1900 —
     geometria computada no Chrome, não o texto deste CSS:

       * NADA QUEBRA em nenhuma das quatro. Zero rolagem lateral, zero caixa
         fora da moldura, e a contagem de conteúdo-que-não-cabe é IDÊNTICA nas
         quatro (02: 4 · 03: 51 · 04: 36 · 05: 34) — ela é anterior e não tem a
         ver com a largura. A grade é fluida e cresce.
       * O QUE SE GANHA: a coluna por jogador da Gatilhos
         (`.duas-colunas`, `repeat(4, minmax(0,1fr))`) vai de **228px a 333px**,
         +46%. É a razão 2 dela, com número.
       * O QUE SE PAGA, e é o que fecha o teto: a linha de leitura alonga.
         O registro da Sistema vai de 157 para 237 caracteres por linha; o
         número de um ajuste da Gatilhos se afasta do nome dele de 87 para
         183px. Em 1900 os mesmos viram 294 e 258 — o dobro do preço para
         metade do ganho, e as fotos mostram o botão de modo virando uma caixa
         de 460px para uma palavra.

     Em 1600 o ganho ainda é grande e o preço ainda é o dobro do aprovado; daí
     para cima o preço cresce e o ganho não. Se alguém remedir e achar melhor,
     troque o número E a razão — o que NÃO muda é a decisão: estica, com teto.

     O `min()` faz o teto e o encolhimento na mesma linha; o `max-width:100%`
     abaixo continua por redundância barata. Abaixo de 1212px de documento nada
     mudou: quem segura o piso é o `set_size_request` da janela GTK
     (`interface/janela.py`), e ele ficou MAIS carregado, não menos. O COSMIC
     que ladrilha não o lê (medido em 13/09/2026: janela de 816 px, a vista
     rola e o rodapé sai por baixo). */
  /* A JANELA TEM UMA ALTURA SÓ, nas dez abas. Ela, 27/08: "sair clicando entre
     as abas causa muito desconforto, pq muda tudo". Media de 530 (Iluminação) a
     1032 (Conexões) — quase o dobro: o rodapé pulava meia tela a cada clique.
     DE ONDE SAI O 710, e por que não é a altura da tela. A primeira tentativa
     foi 1048 — o teto da TV da bancada — para que nenhuma aba precisasse rolar. Deu
     errado: o conteúdo das dez vai de 281px (Iluminação) a 783px (Conexões), e
     com 1048 a Iluminação ficava com 518px de quadro vazio. Ela: "iluminação,
     jogar e outras abas tão muito ruins com esse super espaço vazio na parte
     inferior".
     Não existe altura que sirva às duas pontas. 757 é a altura exata da SEXTA
     aba mais cheia (Lançadores, 508px de conteúdo): seis abas cabem inteiras e
     as quatro densas rolam POR DENTRO do miolo — que é o que uma janela de
     aplicativo faz, e não move nada do que está em volta. Foi escolhida assim
     de propósito: parar num número menor faz aparecer barra de rolagem para
     8 ou 27 pixels, que é pior do que um vão.
     O `scrollbar-gutter:stable` reserva a barra sempre: sem ele a largura do
     miolo mudava 15px entre a aba que rola e a que não rola.
     O `overflow-y:auto` do miolo é rede: hoje nada passa dos 817px que sobram,
     e o dia em que passar a janela continua do mesmo tamanho. */
  .janela{
    width:min(100%,1600px); height:var(--alt-janela); max-width:100%; background:var(--app-bg);
    /* A JANELA NÃO PASSA DA TELA — 19/09/2026, e o defeito é do usuário: os quatro
       botões do rodapé cortados ao meio pela borda de baixo, com a janela
       ladrilhada.  <!-- noqa-acento -->

       O NÚMERO É EXATO: a altura é `clamp(--piso-da-vista, 100dvh − recuo×2,
       --teto-da-vista)`, e o piso de 777 mais os dois recuos de 16 dão **809**.
       Acima disso a janela encolhe junto e nada se perde; ABAIXO ela TRAVA em
       777 e passa da viewport — 19 px fora a 790, 49 a 760, 109 a 700. O que
       sai é justamente o fim da janela, onde mora o `.rodape`.

       O `max-height` É A CURA INTEIRA porque o mecanismo já existe: `.miolo` é
       `flex:1; min-height:0; overflow-y:auto` e rola por dentro, e o `.rodape`
       é irmão dele, colado no fim. Limitar a janela faz o miolo absorver a
       diferença — o rodapé deixa de sair, e nenhuma altura de conteúdo muda.

       O PISO NÃO SE MEXE: ele existe para o conteúdo não se espremer (foi o que
       curou a aba Navegação), e continua mandando na altura do MIOLO. O que ele
       não pode mais fazer é empurrar o rodapé para fora da tela.

       E POR QUE O PISO PEDIDO EM CÓDIGO NÃO BASTA, medido em 13/09/2026:
       *"o COSMIC que ladrilha não o lê"*. Quando ela
       ladrilha, a janela recebe menos altura que o piso — e a tela tem de
       aguentar, porque o gesto é dela e não vai ser revogado.

       A RÉGUA É `tests/unit/test_a_janela_nunca_passa_da_tela.py`. */
    max-height:calc(100dvh - var(--recuo-do-corpo) * 2);
    display:flex; flex-direction:column;
    border:1px solid var(--linha); border-radius:10px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }

  /* ---------- a marca ----------
     A FAIXA DE CABEÇALHO SAIU — 10/09/2026, decisão de produto («1 + rodapé»,
     ALTURA-DA-VISTA-01). Eram 60 px em cada uma das dez abas: o logotipo de
     46, o `h1` «Hefesto — DualSense4Unix» e a linha «Gerenciador DualSense
     para Linux».

     A RAZÃO É A MESMA QUE TIROU O SUBTÍTULO DA MOLDURA EM 08/09, e ela serve
     inteira aqui: *"a barra já diz «Hefesto», e tudo o que muda — a aba, o
     alvo, o perfil ativo — já está DENTRO da janela"*
     (`interface/hefesto_vivo.py`). Das 213 px de cromo da `.janela`, essa
     faixa era a única parcela que REPETIA o que a moldura do sistema já diz.

     O QUE ELA CARREGAVA E NÃO ERA REPETIÇÃO desceu uma faixa: o logotipo
     DO USUÁRIO, que continua na tela como marca de 24 px à esquerda da linha do
     alvo, e a contagem de controles, que é dado vivo do daemon e agora mora
     ao lado do perfil ativo. As duas mudanças estão em `.fita-linha`, logo
     abaixo.

     O LUGAR DA CONTAGEM (`x USB · y BT`) foi decidido em 13/09/2026, por
     delegação de produto, com a foto da tela na mão. É reversível: o que muda é
     este bloco e a linha do alvo, no corpo da página. */
  /* 46/44 e não 24/22 desde 21/09/2026 — a conta está em `monta.MARCA_DA_LOGO`. */
  .logo{
    width:46px;height:46px;border-radius:50%;flex:0 0 46px;
    background:radial-gradient(circle at 35% 30%,#3b2d5c,#1a1b24 70%);
    border:1px solid var(--linha);
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }

  /* ---------- a marca + a fita do alvo + a contagem + o perfil ativo ----------
     O RECUO SUBIU DA `.fita` PARA A LINHA — 10/09/2026. Enquanto a linha tinha
     um filho só que pagasse o recuo, tanto fazia; agora ela tem quatro (marca,
     fita, contagem, perfil), e um recuo que mora no segundo deles deixa o
     primeiro colado na borda. O 10/12 vertical é o MESMO de antes, então a
     faixa continua medindo o que media. */
  .fita-linha{display:flex;align-items:center;gap:10px;padding:10px 18px 12px}
  .conectado{margin-left:auto;text-align:right;font-size:12.5px;color:var(--green);white-space:nowrap}
  .conectado .bolinha{color:var(--green)}
  /* O TOPO COM O SERVIÇO PARADO (20/10/2026), nas dez abas: sem texto e sem ponto; o Status da
     Jogar em Desligado é o único sinal (D-2010-O-SERVICO-PARADO-NAO-GANHA-FRASE). Quem diz «parado»
     é o campo da fita que o menu do botão direito também lê; o piloto escreve «—» no `<b>` vazio, e
     o `display:none` o leva junto. Mora aqui, e não numa aba, porque o topo é o mesmo nas dez. */
  .fita-linha:has(i[data-servico="parado"]) .conectado{display:none}
  /* E O PERFIL ATIVO FICA À DIREITA (21/10/2026): o `margin-left:auto` mora na `.conectado`, e com
     ela fora o chip caía colado na marca. Com o serviço parado, quem empurra é o próprio chip. */
  .fita-linha:has(i[data-servico="parado"]) .perfil-ativo{margin-left:auto}
  .fita{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--fg);
  }
  .marca-nome{font-size:14px;line-height:1.15;font-weight:700;letter-spacing:-.01em;
              white-space:nowrap;color:var(--fg);margin-right:6px}
  .marca-nome .m-hef{color:var(--pink)}
  .marca-nome .m-4{color:var(--green)}
  .fita > span:first-child{font-size:13.5px;color:var(--texto-suave)}
  /* o Perfil Ativo — igual nas dez abas, sempre visível.
     O EMPURRÃO PARA A DIREITA MUDOU DE DONO em 10/09/2026: quem carrega o
     `margin-left:auto` agora é a `.conectado`, que passou a ser o PRIMEIRO do
     grupo da direita. Dois `auto` na mesma linha flex não empurram mais: eles
     PARTEM a sobra ao meio, e a contagem pousaria no centro da faixa. */
  .perfil-ativo{
    display:flex;align-items:center;gap:7px;
    padding:5px 11px;border-radius:7px;
    border:1px solid var(--linha);background:var(--panel);min-width:0;
  }
  /* UMA LINHA SÓ (16/10/2026): no tamanho do nome, o «Perfil ativo» quebrava em duas assim que um
     perfil tinha nome, e o nome longo de um jogo esticava o topo; o rótulo não quebra, e o nome
     cede com reticência (a base comum dá a dica com ele inteiro). */
  .pa-rot{font-size:12.5px;color:var(--fg);white-space:nowrap}
  .pa-nome{font-size:12.5px;color:var(--pink);font-weight:600;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* O BOTÃO QUE TRAVA A NAVEGAÇÃO DOS CONTROLES (26/10/2026, O-BOTAO-QUE-TRAVA-A-NAVEGACAO-DOS-CONTROLES-01):
     na moldura, igual nas dez abas, à direita do perfil ativo. Solto, o cadeado está aberto e os
     controles navegam a janela; apertado (`aria-pressed`, pintado pelo piloto a partir da Interna do
     daemon), o cadeado fecha e acende em ciano, como o Modo automático, e nenhum controle mexe na
     janela. O valor é o da Interna: o botão não guarda nada. SÓ O CADEADO, sem rótulo: com quatro
     controles na fita, o rótulo empurrava o botão para fora da janela no piso de 1212 px; o nome
     mora no `aria-label` e o efeito na dica. */
  .trava-nav{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;
    border-radius:7px;border:1px solid var(--linha);background:var(--panel);color:var(--fg);
    font-family:inherit;font-weight:600;font-size:12.5px;line-height:1;white-space:nowrap;cursor:pointer;flex:0 0 auto;
    transition:background .15s,border-color .15s,color .15s}
  .trava-nav svg{width:14px;height:14px;flex:0 0 14px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .trava-nav .t-arco{transition:transform .15s;transform-origin:8px 6px;transform:translate(0,-1.5px) rotate(-28deg)}
  .trava-nav:hover{border-color:#5fd3e6}
  .trava-nav[aria-pressed="true"]{background:#0e7c8c;border-color:#5fd3e6;color:#fff}
  .trava-nav[aria-pressed="true"] .t-arco{transform:none}
  .trava-nav:focus-visible{outline:2px solid var(--cyan,#8be9fd);outline-offset:2px}
  /* E O CADEADO NUNCA SAI DA JANELA: com quatro controles de nome longo («Galactic Purple») no piso
     de 1212 px, a linha passava da janela em 39 px e o cadeado ficava do lado de fora. Quem cede é o
     nome do plástico nos chips, com reticências (a base comum põe o nome inteiro na dica), e só
     depois do perfil ativo: o `flex-shrink` mil vezes maior deixa o nome longo de um perfil cortar o
     dele antes de cortar o de qualquer controle. O «Selecionar:» e o «Todos» não cedem. */
  .fita{min-width:0}
  .fita-linha .perfil-ativo{flex-shrink:1000;overflow:hidden}
  .fita .chip.plastico{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fita > span:first-child,.fita .chip:not(.plastico){flex-shrink:0}
  /* A FITA QUE NÃO ESCOLHE TEM OS CHIPS ACESOS COMO QUALQUER OUTRA — 09/10/2026
     (O-SELECIONAR-ACENDE-QUEM-ESTA-ESCOLHIDO-01, pedido de 29/09: *"a cor de
     todos os botões do Selecionar deveriam estar acesas e com as bordas
     corretas"*). Quem acende é `monta.acesos_da_fita`; a folha não tem opinião
     própria sobre a fita inerte, e as regras `.fita.inerte .chip` que apagavam
     o chip (FITA-01, 08/09, e o cinza de 30/08) saíram. Só o rótulo
     `Selecionar:` segue na cor de comentário: não é botão. O `opacity` não
     volta: escondia o texto do contraste (2,18:1) sem a régua ver. */
  .fita.inerte{color:var(--fg)}
  /* ---------- O MODO NATIVO: A FITA FICA CINZA E MUDA — 09/10/2026 ----------
     DESLIGAR-O-HEFESTO-DEVOLVE-O-CONTROLE-AO-LINUX-01, opção a. Com o Hefesto
     desligado quem manda é o jogo, e a fita só mostra quem está conectado: a
     camada `.so-no-nativo` cobre a fita inteira, não deixa o clique chegar nos
     chips e carrega a dica. O PINTOR É O CORPO (`body.nativo`), pintado pelo
     piloto a cada tique; o resto da trava (o que cada aba por controle grava)
     mora em `monta.CSS_DO_NATIVO`, só nas cinco páginas que precisam. */
  .fita{position:relative}
  .so-no-nativo{display:none}
  body.nativo .fita .so-no-nativo{display:block;position:absolute;inset:0;z-index:2;cursor:default}
  body.nativo .fita{color:var(--fg)}
  body.nativo .fita .chip,body.nativo .fita .chip.on,body.nativo .fita .chip.plastico{
    border-color:var(--border-sutil);background:transparent;color:var(--fg);
    font-weight:400;--borda-do-chip:1px}
  /* a peça fixa do cartão e a trava do quadro nascem escondidas */
  .visto-fixo,.visto-legenda,.trava-nativo{display:none}
  body.nativo .visto-fixo{grid-column:1/-1;display:flex;align-items:center;justify-content:center;
    gap:7px;height:28px;border:1px solid var(--border-sutil);border-radius:7px;
    background:transparent;color:var(--texto-suave);font-size:12px;font-weight:600;cursor:default}
  body.nativo .visto-fixo .cad{color:var(--fg)}
  body.nativo .visto-legenda{grid-column:1/-1;height:28px;display:flex;align-items:center;
    justify-content:center;color:var(--fg);font-size:11.5px}
  body.nativo .cartao.off .visto-fixo,body.nativo .cartao.off .visto-legenda{display:none}
  body.nativo .mascara .chip{display:none}
  body.nativo .cartao.alvo{background:var(--app-bg)}
  body.nativo .trava-nativo{display:inline-flex;align-items:center;gap:6px;margin-left:auto;
    margin-right:10px;color:var(--fg);font-size:12px;cursor:default}
  body.nativo .trava-nativo .cad{color:var(--fg)}
  /* AQUI MORAVA A CAIXA ALTA DA VIA, e ela SAIU — ESQUELETO-C2, 11/09/2026.
     Era a TELA-TRES-01 §3, pedido de 08/09: "cabo e rádio coloca
     maiúsculo." O que ela leu três dias depois, na MESMA tela:

         fita   P1 • Cosmic Red • CABO
         card   Cosmic Red • cabo

     "Leia o cabo e acordado (ambos minusculo sem iniciar de forma   (noqa-acento: citação literal)
      capitular). Esse tipo de coisa não pode se repetir na interface."   (noqa-acento: citação literal)

     A REVOGAÇÃO É A LEITURA CERTA DE «coloca maiúsculo», e não humor: a regra
     de produto é de 30/08 — "a maiúscula a regra é sobre a primeira letra a ser   (noqa-acento: citação literal)
     capitalizada, é o padrão do projeto" —, e foi por ela que a caixa alta
     saiu dos rótulos de seção no mesmo dia (`.sec-rot`, nos geradores). Subir
     a palavra INTEIRA nunca foi o que esse padrão diz.

     E O DOCUMENTO NUNCA FOI O CULPADO: o texto no HTML já era minúsculo (a
     regra de `monta.rotulo` — maiúscula escrita no HTML tira dela a chance de
     copiar o nome como ele é). A grafia dupla morava SÓ na folha de estilo, e
     é por isso que uma régua que lesse apenas o texto das dez páginas daria
     verde sobre uma tela que gritava. Quem mede as DUAS metades é
     `scripts/check_a_maiuscula_decorativa.py`, que nasceu com esta cura.

     O `<span class="via">` FICA: ele é o ENDEREÇO da via no rótulo do chip
     (`monta.rotulo_do_chip`), não um gancho de estilo. */
  .chip{
    --borda-do-chip:1px;
    padding:5px 12px;border-radius:6px;font-size:12px;
    border:var(--borda-do-chip) solid var(--linha);background:var(--app-bg);color:var(--fg);
    cursor:default;
  }
  .chip.on{border-color:var(--purple);background:var(--sel-bg);color:var(--fg);font-weight:600}
  /* a borda grossa é a cor do plástico; o interior diz se está escolhido */
  .chip.plastico{--borda-do-chip:2px}
  /* A FITA NÃO SALTA AO TROCAR DE ABA — 13/09/2026, VAO-DO-ESQUELETO-01.

     O DEFEITO: a altura da linha do alvo é a do filho mais alto, e o chip media
     28 px com a borda de 1 e 30 com a de 2. As três abas que escolhem traziam o
     chip do plástico com 2 e a linha media 52; as sete de fita inerte, com 1,
     mediam 51 (o «Perfil ativo», de 29, é quem manda nelas). A barra de abas e
     o quadro desciam 1 px a cada troca. A sprint mediu 2 px antes de a faixa de
     cabeçalho sair; remedido depois, com Chrome e com o piloto, é 1.

     A CURA ESCRITA NA SPRINT CAIU AO MEDIR: pôr 2 px na borda do chip inerte
     devolve a espessura que o usuário mandou tirar em 08/09 («cinza como os demais»,
     a regra logo abaixo) e deixa a 07 em 51, porque a fita de lá nasce só com
     o «Todos». Pelo rádio a cor não se lê e nenhum chip ganha a classe do
     plástico; com a pintura, a mesma aba muda de 51 para 52 no primeiro tique.

     A CURA É NA CAUSA: a espessura tem um dono, `--borda-do-chip`, e o ar de
     cima e de baixo lê dele. Borda mais ar somam sempre 7 px, que é o chip
     vivo do plástico (2 + 5): a linha das abas que escolhem não muda um pixel,
     e todo chip da fita mede 30 em qualquer estado — o «Todos», de borda 1,
     ganha 1 px de ar em cima e embaixo nas dez. O ar horizontal não mudou.
     09/10/2026: a fita inerte também leva a borda de 2 px do plástico (o cinza de
     08/09 foi revogado), e a linha mede o mesmo nas dez. */
  .fita .chip{padding-top:calc(7px - var(--borda-do-chip));
              padding-bottom:calc(7px - var(--borda-do-chip));
              white-space:nowrap}
  /* A COR DO CHIP VEM DA MESA, NÃO DE UMA CLASSE POR MODELO. Eram
     `.c-red` e `.c-blue`, uma classe por plástico — com quatro controles na mesa
     viram quatro, e com os 28 do CSV, vinte e oito. `monta.fita()` escreve a
     cor no `style` do chip, lida do desenho. */
  .chip.plastico{border-color:var(--plastico, var(--border-forte))}
  /* O CHIP DA FITA RESPONDE AO MOUSE — 20/10/2026, A-BARRA-DE-BAIXO-E-A-FITA-RESPONDEM-AO-MOUSE-01.
     Só na fita que se clica (a 01, a 02 e a 08; a `.inerte` não escolhe nada, e no modo nativo a
     camada `.so-no-nativo` fica por cima). O chip fora do aceso ganha o tom da cor do plástico, e a
     borda do plástico fica; o «Todos», sem plástico, um fundo claro e a borda `--texto-suave`, como
     o `.seg button:hover:not(.on)`. */
  .fita:not(.inerte) .chip:hover:not(.on){background:rgba(255,255,255,.1);
    background:color-mix(in srgb,var(--fg) 10%,transparent)}
  .fita:not(.inerte) .chip.plastico:hover:not(.on){
    background:color-mix(in srgb,var(--plastico,var(--border-forte)) 24%,var(--app-bg))}
  .fita:not(.inerte) .chip:not(.plastico):hover:not(.on){border-color:var(--texto-suave)}

  /* A LISTA ABERTA DE UM <select> — o usuário viu, 28/08: as opções somem quando o
     dropdown abre. O popup do <select> é do SISTEMA, não da página: ele nasce com
     o fundo CLARO do tema do Chrome, e o `color` que a folha dá ao `select`
     (texto claro, para o nosso fundo escuro) é herdado pelas `option`. Claro
     sobre claro. Só a linha selecionada se lia, porque o realce a pinta.
     A cura tem de estar na `option`, não no `select`: são caixas diferentes. */
  select option{background:var(--panel);color:var(--fg)}
  select option:checked{background:var(--sel-bg);color:var(--fg)}

  /* ---------- a tira de abas ---------- */
  .tira{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--linha)}
  .aba{
    padding:11px 13px;font-size:13px;color:var(--fg);
    border-bottom:2px solid transparent;white-space:nowrap;cursor:default;
  }
  a.aba{text-decoration:none;cursor:pointer}
  a.aba:hover{color:var(--texto-suave);background:rgba(255,255,255,.03)}
  .aba.falta{opacity:.35;cursor:not-allowed}
  .aba.ativa{color:var(--fg);border-bottom-color:var(--pink);font-weight:600}

  /* ---------- o miolo ---------- */
  /* O RESPIRO É 18 DOS DOIS LADOS — 16/10/2026 (AS-TELAS-QUE-ELA-PEDIU-EM-16-10-01, T1).
     A conta velha (3 de padding + 15 do `scrollbar-gutter:stable`) supunha uma barra que
     ocupa lugar; no WebKitGTK a barra é de sobrepor (`offsetWidth-clientWidth` = 0) e o
     quadro ficava a 3 px da borda direita em nove abas. Sem rolagem vertical em tela
     nenhuma, não há barra a reservar. */
  .miolo{padding:16px 18px 18px 18px;display:flex;flex-direction:column;gap:14px;
         flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:auto}
  /* O QUADRO NÃO ESTICA POR PADRÃO. Ele já esticou: com a altura da janela fixa,
     o último quadro de toda aba encostava no rodapé, e nas abas curtas isso virou
     um quadro cinza gigante e vazio. Ela, 27/08: "nessa aba encurtar verticalmente
     o bloco cinza então". O quadro fica do tamanho do que tem dentro, e a sobra
     fica no fundo da janela, fora dele.
     `estica` é o caso oposto — a aba cujo conteúdo SABE crescer, como a lista de
     perfis. Aí o quadro cresce e o conteúdo cresce junto, até o rodapé.
     `flex-grow`, e NÃO `flex:1`: o atalho zera o `flex-basis` e o quadro passa a
     caber em menos do que precisa. `flex-shrink:0` mantém a base no conteúdo. */
  /* `estica` ENCOLHE e cresce: `flex-shrink:0` o travava na altura natural do
     conteúdo — a lista de perfis inteira, 13 linhas — e o quadro passava 116px
     do miolo, com a fileira de botões fora da janela. Quem encolhe de verdade é
     a lista lá dentro, que rola. */
  .miolo > .quadro.estica{flex-grow:1;flex-shrink:1;min-height:0;
                          display:flex;flex-direction:column}
  .miolo > .quadro.estica > .quadro-corpo{flex:1;min-height:0;display:flex;flex-direction:column}

  .quadro{border:1px solid var(--linha);border-radius:9px;background:var(--panel)}
  .quadro-topo{
    display:flex;align-items:center;gap:8px;padding:11px 14px 0;
  }
  .quadro-titulo{font-size:13.5px;font-weight:600;color:var(--purple)}
  /* A DICA mora no `data-dica` do próprio botão ou área (`base-comum.css`/`.js`); nenhum «?» existe. */
  .dica{
    display:none;position:absolute;left:22px;top:-4px;width:330px;z-index:40;
    background:var(--elevated);border:1px solid var(--linha);border-radius:7px;
    padding:9px 11px;font-size:11.5px;line-height:1.5;color:var(--texto-suave);
    text-align:left;font-weight:400;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .dica b{color:var(--fg)}
  .quadro-corpo{padding:10px 14px 14px}

  /* ---------- SEÇÃO QUE ABRE E FECHA ----------
     Pedido, 30/08/2026, sobre a Conexões: *"deixa todas essas seções
     expansíveis igual fizemos em controles"*.

     MESMO MECANISMO DA CONTROLES, e de propósito: `input` escondido +
     `:has(:checked)` + `<label>`. Sem uma linha de JavaScript — o mockup abre
     como arquivo, sem servidor, e é regra desta casa que ele continue assim.
     A diferença é o TIPO: a Controles usa `radio` (um card aberto por vez, e a
     fita aponta qual); aqui é `checkbox`, porque as seções são independentes e
     ela pode querer duas abertas.

     A seta é `::before` no rótulo, não um segundo elemento: um `<span>` a mais
     no cabeçalho desalinharia o título dos outros nove quadros da casa, que já
     nascem no mesmo x. */
  .quadro > input.abre{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
  label.quadro-titulo{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  label.quadro-titulo::before{content:"▾";font-size:10px;color:var(--fg);width:9px}
  .quadro:has(> input.abre:not(:checked)) label.quadro-titulo::before{content:"▸"}
  .quadro:has(> input.abre:not(:checked)) > .quadro-corpo{display:none}
  /* fechada, ela não estica: senão o quadro fechado tomaria a altura toda */
  .miolo > .quadro.estica:has(> input.abre:not(:checked)){flex:0 0 auto}

  /* O RÓTULO DE LINHA TEM UMA COR SÓ NAS DEZ ABAS — 30/08/2026.
     Eu curei `.sec-rot` e assumi que era A classe de rótulo. São CINCO —
     `.sec-rot`, `.linha-rot`, `.rot`, `.stick-rot` e o `<th>` das tabelas — e o usuário
     viu o resultado: *"dá pra ver em todas as abas problemas que não foram
     corrigidos"*. A Jogar, a Controles, a Navegação, a Sistema e a Perfis
     ficaram com rótulo cinza ao lado de cinco abas com rótulo verde.
     `--rot-campo` é o dono; quem nomeia uma linha lê dele. */
  .linha-rot{font-size:12px;font-weight:600;color:var(--rot-campo);margin-bottom:7px}

  /* seletor segmentado */
  .seg{display:flex;gap:7px;flex-wrap:wrap}
  .seg button{
    flex:1;min-width:150px;padding:9px 10px;border-radius:7px;font-size:12.5px;
    font-family:inherit;border:1px solid var(--linha);
    background:var(--app-bg);color:var(--fg);cursor:pointer;
  }
  .seg button.on{border-color:var(--purple);background:var(--sel-bg);color:var(--fg);font-weight:600}
  .seg button:hover:not(.on){border-color:var(--comment);color:var(--texto-suave)}
  /* O TRAVADO TINHA CARA DE CLICÁVEL — achado de 31/08. O botão nasce
     `disabled` de verdade (medido: zero gestos ao clicar), e nada na tela
     dizia isso. Sem `opacity`, que é a lição medida da `.fita.inerte`: a
     opacidade mora no ancestral e cega toda régua que lê `color`. */
  .seg button:disabled{border-color:var(--border-sutil);color:var(--fg);cursor:not-allowed}
  .seg button:disabled:hover{border-color:var(--border-sutil);color:var(--fg)}

  /* a linha de estado: o que VALE agora */
  .estado{
    display:flex;align-items:center;gap:7px;margin-top:9px;
    font-size:12px;color:var(--fg);
  }
  .estado .valor{color:var(--fg);font-weight:600}
  .estado .verde{color:var(--green)}
  .estado .laranja{color:var(--orange)}

  /* a fileira de modos do Hefesto LIGADO — cinco chips na tela.
     O NÚMERO DA TELA NÃO É O NÚMERO DO PRODUTO, e a diferença é decisão
     de 31/08: `ponte_escada.ESCADA` tem QUATRO pontes, e uma delas (Nativo)
     saiu da fileira para virar a posição DESLIGADO do interruptor. Dos cinco
     chips, três são degrau (DualSense, Xbox, Steam Input) e dois não são
     (Point And Click, Navegação) — por isso o algarismo do círculo é derivado
     de `indice_do_degrau`, e não digitado. */
  .escada{display:flex;align-items:stretch;gap:7px}
  .degrau{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 10px;border-radius:7px;
    font-size:12.5px;border:1px solid var(--linha);
    background:var(--app-bg);color:var(--fg);cursor:pointer;white-space:nowrap;
  }
  .degrau i{
    font-style:normal;font-family:'JetBrains Mono',monospace;font-size:10px;
    width:15px;height:15px;line-height:14px;text-align:center;border-radius:50%;
    border:1px solid var(--linha);color:var(--fg);
  }
  .degrau:hover:not(.on){border-color:var(--comment);color:var(--texto-suave)}
  .degrau.on{
    border-color:var(--purple);background:var(--sel-bg);color:var(--fg);font-weight:600;
  }
  .degrau.on i{border-color:var(--purple);color:var(--purple)}
  /* O SEPARADOR TEM COR DE TEXTO, NÃO DE BORDA (30/08). `--border-forte` é
     #44475a: 1,73:1 sobre o fundo — um traço que existe no DOM e não na tela.
     `--texto-mudo` o põe em 4,96:1 e ele continua recuando diante do texto. */
  .seta{color:var(--fg);font-size:13px}

  /* a prova de que o Aplicar ainda deve (D-APLICAR-NAO-SALVA) */
  .pendente{
    display:flex;align-items:center;gap:7px;margin-top:8px;padding:7px 10px;
    border:1px dashed var(--orange);border-radius:6px;
    font-size:11.5px;color:var(--orange);background:rgba(255,184,108,.07);
  }

  /* ---------- a área de avisos, com espaço reservado (P8) ---------- */
  .avisos{
    min-height:38px;border:1px solid var(--linha);border-radius:9px;
    background:var(--panel);padding:9px 14px;display:flex;align-items:center;gap:9px;
    font-size:12px;
  }
  .avisos.vazio{color:var(--fg);border-style:dashed}
  .selo{
    font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:600;
    font-family:'JetBrains Mono',monospace;
  }
  .selo.alerta{background:var(--orange);color:var(--app-bg)}
  .conta{margin-left:auto;font-size:11px;color:var(--fg)}
  .link{color:var(--cyan);text-decoration:none;border-bottom:1px dotted var(--cyan);cursor:pointer}

  /* ---------- controles: SÓ a contagem e a ponte (decisão de produto) ---------- */
  .mesa{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .contagem{font-size:13px}
  .contagem .n{color:var(--cyan);font-weight:600;font-family:'JetBrains Mono',monospace}
  .pecas{display:flex;gap:7px}
  /* a peça: SVG pequeno na cor do plástico + número */
  .cartao{
    display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;
    border:2px solid var(--linha);border-radius:7px;background:var(--app-bg);
    font-size:11.5px;color:var(--texto-suave);
  }
  /* CSS MORTO, REMOVIDO em 27/08: `.cartao.c-red` e `.cartao.c-blue` eram uma
     classe por plástico. Com quatro na mesa faltariam duas; com os 28 do CSV,
     vinte e seis. A cor vem de `--plastico`, escrita pelo gerador a partir do
     desenho — o mesmo mecanismo do chip da fita. Zero usos nos dez HTML. */
  .cartao .pl{font-family:'JetBrains Mono',monospace;color:var(--fg);font-weight:500}
  .cartao .via{color:var(--fg);font-size:11px}
  .cartao .bat{color:var(--green);font-family:'JetBrains Mono',monospace;font-size:11px}

  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  /* A COR DO BOTÃO SECUNDÁRIO MUDOU DE LUGAR — 31/08/2026: do CONTORNO para a
     PALAVRA. O `.btn` desenhava a borda com `--comment` (4,89:1) e as três
     variantes com o acento cheio — verde 11,5:1, vermelho 4,53:1, roxo 5,90:1.
     Numa coluna de Iluminação são dois botões empilhados, e na Vibração outros
     dois: quatro retângulos gritando em volta de palavras que já dizem tudo.
     Ela: *"botão com borda ao lado de botão com borda ao lado de célula com
     borda"*.
     NADA DE INFORMAÇÃO SAIU: o texto de cada variante continua verde, vermelho
     ou roxo — é ele que diz "isto liga", "isto desliga", "isto guarda". O que
     saiu foi o contorno repetindo em 300px de perímetro o que a palavra diz em
     sete letras. E o acento VOLTA no `:hover`, que é onde ele informa de fato:
     o botão sob o ponteiro se acende na cor da própria ação. */
  .btn{
    padding:8px 13px;border-radius:7px;font-size:12.5px;font-family:inherit;cursor:pointer;
    border:1px solid var(--linha);background:transparent;color:var(--texto-suave);
  }
  .btn:hover{border-color:var(--texto-suave);color:var(--fg)}
  .btn.verde{color:var(--green)}
  .btn.vermelho{color:var(--red)}
  .btn.roxo{color:var(--purple)}
  .btn.verde:hover{border-color:var(--green);color:var(--green)}
  .btn.vermelho:hover{border-color:var(--red);color:var(--red)}
  .btn.roxo:hover{border-color:var(--purple);color:var(--purple)}
  /* O AMARELO DO «Voltar ao padrão» — borda e letra, nas duas abas que voltam ao de fábrica: a
     Navegação e o «Restaurar de fábrica» da Sistema (AS-TELAS-QUE-ELA-PEDIU-EM-16-10-01, S2). */
  .btn.amarelo-padrao{border-color:var(--yellow);color:var(--yellow)}
  .btn.amarelo-padrao:hover{border-color:var(--yellow);color:var(--yellow);
                            background:rgba(241,250,140,.08)}

  /* ---------- Conectado agora + Atenção, lado a lado ---------- */
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .conta-avisos{margin-left:auto;font-size:11px;color:var(--fg)}
  .aviso-item{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--texto-suave)}
  .sub-secao{margin-top:14px;padding-top:12px;border-top:1px solid var(--linha)}
  .sep{color:var(--fg);margin:0 3px}   /* idem — ver `.seta` acima */

  .faixa-final{display:flex;align-items:center;gap:12px;margin-top:12px}
  .faixa-final .pendente{flex:1;margin-top:0}
  .col-atencao{border-left:1px solid var(--linha);padding-left:16px}


  /* ---------- rodapé ----------
     O RECUO VERTICAL CAIU DE 12 PARA 6 — 10/09/2026, a metade «+ rodapé» da
     decisão de produto. A faixa media 59 px (12 + 34 do botão + 12 + 1 de borda) e
     passa a medir 47; os 12 px vão para o quadro, nas DEZ abas de uma vez,
     porque esta barra existe nas dez.

     O QUE NÃO ENCOLHEU, e é a ressalva de produto: *"nenhum dos quatro botões pode
     ficar menor do que a mão do usuário alcança"*. O botão continua com
     `height:var(--h-acao)` = 34 px, que é a escala de ação desta casa
     (`:root`, lá embaixo) — o que encolheu é o AR em volta dele. Encolher o
     botão seria trocar a barra de rolagem dela por um alvo de clique menor,
     que é pagar a queixa com outra queixa. */
  .rodape{
    display:flex;align-items:center;gap:10px;padding:6px 18px;
    border-top:1px solid var(--linha);background:var(--app-bg);
  }
  /* O EMPURRÃO TROCOU DE DONO. Era o `.recibo{flex:1}` que jogava os quatro
     botões para a direita; ele saiu da barra em 30/08 (virou dica de cada botão,
     ver `fim.html`) e sem substituto os botões cairiam para a esquerda. A margem
     automática no primeiro faz o mesmo serviço sem um elemento vazio no DOM. */
  .rodape .r-aplicar{margin-left:auto}
  .rodape button{
    padding:8px 15px;border-radius:7px;font-size:12.5px;font-family:inherit;
    font-weight:600;cursor:pointer;border:1px solid transparent;
  }
  .r-aplicar{background:var(--green);color:var(--app-bg)}
  .r-salvar{border-color:var(--purple)!important;color:var(--purple);background:transparent}
  .r-importar{border-color:var(--orange)!important;color:var(--orange);background:transparent}
  .r-exportar{border-color:var(--comment)!important;color:var(--fg);background:transparent}
  /* A BARRA DE BAIXO RESPONDE AO MOUSE — 20/10/2026, A-BARRA-DE-BAIXO-E-A-FITA-RESPONDEM-AO-MOUSE-01,
     o desenho aprovado em 20/10. Os três de contorno ganham o fundo leve da cor deles e o Aplicar
     (cheio) clareia; nada muda de lugar nem de tamanho. A cor sai do token (`color-mix`), para o
     tema que troca o token levar o tom junto; o `rgba` antes é o da casa, para o motor sem `color-mix`. */
  .rodape .r-aplicar:hover{background:#7dfb9b;background:color-mix(in srgb,var(--green) 75%,#fff)}
  .rodape .r-salvar:hover{background:rgba(189,147,249,.18);
    background:color-mix(in srgb,var(--purple) 18%,transparent)}
  .rodape .r-importar:hover{background:rgba(255,184,108,.18);
    background:color-mix(in srgb,var(--orange) 18%,transparent)}
  .rodape .r-exportar:hover{background:rgba(136,150,196,.2);
    background:color-mix(in srgb,var(--comment) 20%,transparent)}

  .marca{color:var(--orange)}

  /* ---------- os SVGs REAIS ----------
     Logo: layout/assets/hefesto-logo.svg, LIDA pelo `monta.py` e injetada
     na âncora que fica no cabeçalho, lá embaixo — nenhuma cópia mora aqui.
     (E a âncora NÃO se escreve aqui: a primeira versão deste comentário a citou
     literal, o `str.replace(…, 1)` casou com a CITAÇÃO em vez do cabeçalho, e o
     logotipo inteiro foi parar dentro de um comentário de CSS — invisível, com
     as dez páginas geradas sem erro nenhum. Hoje o `monta.py` exige que a
     âncora apareça UMA vez só, que é o que teria pego isto na hora.)
     · Controle: assets/control-svg/dualsense.svg
     O controle traz as peças nomeadas do `docs/data/pecas-do-dualsense.csv` e a
     folha das cores por `data-colorway`, gerada de `docs/data/cores-do-dualsense.csv`
     — a mesma fonte que o specs.html usa. */
  .logo{background:var(--logo-fundo);border-color:var(--logo-aro);overflow:hidden}
  .logo svg{width:44px;height:44px;display:block}
  .ds-svg{width:100%;height:auto;display:block}
  .cartao .ds-svg{width:72px;flex:0 0 72px}

  /* O LUGAR VAZIO NÃO DESENHA CONTROLE — 04/09/2026, e é decisão de produto:
     "aqui os svgs do controle so deveria aparecer se eles tivessem conectados".

     ELA SUBSTITUI A DECISÃO DE 31/08, que dizia o contrário e está escrita em
     seis lugares (`monta.py:84`, `aba01.py:650`, `aba04.py:689`,
     `aba05.py:778`, `aba06.py:1042`, `aba10.py:380`), assim:
     "O DESENHO FICA, apagado. Um lugar sem desenho nenhum não diz que ali cabe
     um controle; um desenho cinza diz."
     O lugar CONTINUA na tela — a moldura, o rótulo `P3 · Desconectado` e o
     travessão ficam, e é isso que segue ensinando que ali cabe um. O que sai é
     só o desenho do aparelho, que era a parte que afirmava presença.

     É `display:none`, e NÃO remoção do DOM, por duas razões medidas: as réguas
     cobram a regra e o elemento no publicado
     (`test_a_06_o_lugar_vazio_nao_veste_o_mockup.py`), e o pintor distribui cor
     por ÍNDICE — `aba06.py:1047` avisa que "um lugar vazio sem endereço tiraria
     uma casa da fila e o P4 receberia a cor do P3".

     UMA REGRA PARA AS CINCO ABAS: a marca `data-conectado="nao"` é escrita pelo
     gerador E pelo piloto (`hefesto_vivo.py:425`), e reaberta quando o controle
     chega (`:611`). Por isso isto vive aqui, na folha das dez, e não repetido em
     aba01/04/05/06/10. */
  [data-conectado="nao"] .ds-svg,
  .ds-svg[data-conectado="nao"]{display:none}
  .ds-motores{max-width:250px;margin:6px auto}
  /* as peças ocultas do SVG acendem quando a classe .acesa entra */
  .ds-svg .oculta{opacity:0}
  .ds-svg .oculta.acesa{opacity:.95}

  /* O DESENHO É DE LINHA, e o `.corpo` do SVG traça SÓ OS PUNHOS — ele é careca por
     construção. A cabeça do controle vem do `[id$="-touchpad"]` e dos ombros `#l1`/`#r1`, que
     no aparelho real são o MESMO plástico. Por isso os três levam a cor da peça, e só
     os controles de entrada (d-pad, botões, analógicos) ficam em tom neutro.
     Medido em 26/08 isolando cada grupo do SVG num render. */
  .ds-svg .peca{fill:#6b7385}
  /* `sem-tinta` é o ALVO invisível de uma peça cujo desenho é outro: o do PS é o
     glifo, e o círculo existe só para receber o clique e o ponteiro. A regra
     vivia no `mapa.py` e no `exportar.py` e FALTAVA aqui — por isso `.peca`
     pintava um disco cinza atrás do logo do PS nas dez abas. Ela, 27/08:
     "tem um círculo no PS de cada imagem, tem que excluir eles e deixar só o
     glifo lá". */
  .ds-svg .sem-tinta{fill:none !important;stroke:none !important}
  /* o traço do topo é FINO no arquivo; o stroke iguala à grossura dos punhos */
  .ds-svg [id$="-touchpad"] .peca,
  .ds-svg [id$="-l1"] .peca,
  .ds-svg [id$="-r1"] .peca{stroke-width:.9;stroke-linejoin:round}
  /* A COR DO PLÁSTICO NÃO MORA MAIS AQUI — 27/08/2026.
     Este bloco tinha 32 linhas: quatro colorways × oito seletores, escritos à
     mão, pintando o corpo, o touchpad e os dois ombros com UMA cor cada. Duas
     coisas o derrubaram no mesmo dia: (1) o hex estava errado e ninguém tinha
     como ver — o Cosmic Red era `#b11f54` e a amostragem devolveu `#A51C48`;
     (2) o DualSense não é de uma cor só, e o desenho pintava tudo igual.
     Agora a folha vem DENTRO do SVG, gerada de `docs/data/cores-do-dualsense.csv`
     por `scripts/gerar_cores_do_dualsense.py`: 28 modelos × 8 zonas, com a
     legibilidade contra o fundo escuro pela mesma conta do produto
     (`integrations/cor_do_plastico.tom_para_a_borda`). O portão que reprova a
     divergência é `scripts/check_cores_do_dualsense.py`. */
  /* A BOLA DO POLEGAR (`.miolo`, dentro de cada analógico) nascia com
     `fill="#b11f54"` gravado no arquivo — o vermelho do Cosmic Red, em TODO
     controle, inclusive no azul. Ela, 27/08: "esse círculo no centro dos
     analógicos tem que ter a cor de cada controle".
     ATENÇÃO ao nome: `.miolo` é TAMBÉM a classe do corpo da página (linha 92).
     São coisas diferentes; por isso as duas regras andam sempre com `.ds-svg`
     na frente. */

  /* ---------------------------------------------------------------
     A ESCALA — uma só altura por família de controle, nas dez abas.
     Medido em 26/08: havia QUATRO alturas de botão na mesma janela
     (31 / 35 / 37 / 38 px). Nenhuma errada sozinha; juntas, é o que
     faz a janela parecer montada por pessoas diferentes.
     `height` e não `min-height`: min-height não ENCOLHE quem já é
     mais alto — foi assim que a primeira tentativa deixou o 37 e o
     38 passarem, com a régua verde de tudo o mais.
     --------------------------------------------------------------- */
  :root{
    --h-escolha:36px;   /* botão de escolha, select, campo — o que se clica para decidir */
    --h-acao:34px;      /* botão de ação: Aplicar, Apagar, Guardar */
    --gap:14px;         /* o passo vertical entre quadros */
    --pad-quadro:14px;  /* a margem interna de todo quadro */
    --rot:92px;         /* a coluna de rótulo, igual em toda aba que tem campo */
    /* 777 DESDE 31/08/2026, e os 20px a mais são o pedido: *"talvez
       estender mais verticalmente o Dispositivos Conectados faça caber."*
       Ela estava certa, e o número diz por quê: o card aberto da Controles
       ESTICA para preencher o corpo, então a folga de verdade é
       `o que o corpo dá` menos `o que o card pede no natural`. Com 757 essa
       conta dava **1px** — o card pede 327 e a caixa oferece 328. Um pixel não
       é folga: é sorte, e ela já tinha visto a barra aparecer na tela do usuário.
       Com 777 a folga passa a 21px.
       O QUE ELE CUSTA, e está medido nas dez: a Jogar vai de 89 para 109px de
       vão e a Conexões de 216 para 236 — as duas já eram as mais vazias, e o
       vão delas é o ponto 6.2 da lista dela. Nenhuma outra aba passa a rolar.

       O 777 DEIXOU DE SER A ALTURA E VIROU O PISO — 10/09/2026, decisão de produto
       («1 + rodapé», ALTURA-DA-VISTA-01). Ela, com a janela maximizada na TV:
       *"ainda joga pra baixo e abre a barra de navegação. tem espaço vertical  <!-- noqa-acento: citação literal -->
       pra aproveitar aqui"*.

       O QUE ESTAVA MEDIDO, e é a causa inteira: a vista da `WebView` na TV da bancada
       mede **840** px e a página pedia **809** (16 + 777 + 16). Os 31 px que
       sobravam não iam para aba nenhuma — morriam entre a moldura da `.janela`
       e a borda da janela do sistema. Cresça a janela quanto quiser: com a
       altura em pixel o `.miolo` ficava nos mesmos 564, e a barra de rolagem
       que o usuário viu era a mesma que veria numa janela de 809.

       DE ONDE SAI CADA UM DOS TRÊS NÚMEROS:

         piso 777   é o desenho de ontem: nenhuma aba fica pior do que já estava;
         100dvh     a vista de verdade. Numa `WebView` embutida não há barra de
                    navegador que apareça e suma, então `dvh`, `svh`, `lvh` e
                    `vh` valem o mesmo — medido neste WebKit, os quatro dão 840
                    na vista do usuário. `dvh` fica porque DIZ a intenção;
         menos 32   o recuo do `body`, que tem dono uma linha acima
                    (`--recuo-do-corpo`) e não se digita duas vezes;
         teto 855   a maior vista que este desenho promete PREENCHER. Acima
                    dela o que sobra viraria vão, e vão vazio é queixa de uso
                    (*"iluminação, jogar e outras abas tão muito ruins com esse
                    super espaço vazio na parte inferior"*). Na TV da bancada o teto
                    nunca é alcançado: 840 − 32 = 808. Numa tela 4K — e a TV
                    da bancada tem o modo 3840x2160 — sem teto a Navegação ficaria com
                    mais de mil pixels de vão.

       QUEM MANDA EM QUEM, depois desta linha: o CSS manda em quanto a `.janela`
       usa da tela; o Python manda no PISO (`interface/janela.PISO_DA_VISTA`,
       que é o `set_size_request` da janela). Nenhum dos dois copia o número do
       outro — era o que acontecia até hoje, e a cópia já tinha apodrecido. */
    --recuo-do-corpo:16px;
    --piso-da-vista:777px;
    --teto-da-vista:855px;
    --alt-janela:clamp(var(--piso-da-vista),
                       calc(100dvh - var(--recuo-do-corpo) * 2),
                       var(--teto-da-vista));
  }
  .seg button,.modos button,.players button,.degrau,select.pronto,.escolha{
    height:var(--h-escolha);padding-top:0;padding-bottom:0;
    display:flex;align-items:center;
  }
  .modos button{justify-content:flex-start}
  .seg button,.players button,.degrau{justify-content:center}
  select.pronto{display:block;line-height:calc(var(--h-escolha) - 2px)}
  .btn,.mini{height:var(--h-acao);padding-top:0;padding-bottom:0;
             display:inline-flex;align-items:center;justify-content:center}
  .rodape button{height:var(--h-acao);padding-top:0;padding-bottom:0}
  .campo .nome,.barra .nome{flex:0 0 var(--rot)}

  /* O RÓTULO DE UM CONTROLE, na janela inteira, é sempre o mesmo e nesta ordem:
     player • cor do plástico • transporte. Decisão, 26/08/2026, com a MARCA
     na frente; ela a tirou em 27/08 — "tira o Sony das outras abas também" —
     porque a marca se repetia em cada card e em cada chip da fita sem separar
     um controle do outro. O que resta é o que distingue.
     O separador é o ponto médio esmaecido — ele agrupa sem competir com o nome. */
  /* O SEPARADOR É O QUE SUSTENTA A ORDEM DE PRODUTO, e ele estava ilegível.
     A ordem do rótulo de um controle é decisão, de 26/08:
     **marca • player • plástico • transporte**. O `•` que a sustenta usava
     `var(--border-forte)` e media **1,73:1** contra o chip e **1,56:1** contra o
     quadro — o texto ao lado dele mede 4,96:1, três vezes mais. No chip ESCOLHIDO,
     onde a leitura mais precisa separar os campos, ele sumia de vez: o P1 lia
     "P1  Cosmic Red  USB" enquanto o P2 lia "P2 · Starlight Blue · BT".
     `var(--comment)` põe os dois casos acima de 3:1 — o piso de traço — sem
     competir com o texto. Medido em 27/08/2026. */
  .pt{color:var(--fg);margin:0 1px;font-size:10px;vertical-align:1px}
</style>
</head>
<body>

<div class="janela">

  <!-- ================= A LINHA DO ALVO =================
       A FAIXA DE CABEÇALHO SAIU EM 10/09/2026, decisão de produto («1 + rodapé»).
       Eram 60 px repetindo o que a moldura do sistema já diz; a razão inteira,
       com o número, está no bloco `---------- a marca ----------` do `<style>`.
       O que ela carregava e NÃO era repetição desceu para esta linha: o
       logotipo dela, agora como marca de 24 px, e a contagem de controles, que
       é dado vivo do daemon.

       A MARCA CONTINUA VINDO DO ARQUIVO DO USUÁRIO — 30/08/2026, e a razão está
       medida. Eram 55 linhas de SVG coladas neste arquivo, e por isso eram a
       versão VELHA: ela redesenhou o logotipo em `assets/hefesto-logo.svg`
       (6.039 bytes, com `transform-box`/`transform-origin` no anel, a chama
       nova e a bigorna com sombra) e as dez páginas continuaram mostrando o
       desenho de antes. Pior: havia TRÊS desenhos vivos ao mesmo tempo — o
       dela, os 3.466 bytes deste arquivo em oito páginas, e outros 2.566 na
       02 e na 04, que estavam paradas há mais tempo. Ninguém tinha como saber
       que existia uma segunda cópia, muito menos uma terceira.
       É a mesma doença da fita, das cores do plástico e do padrão das
       lâmpadas: desenho digitado num arquivo que não é o dono dele.
       O `monta.py` LÊ o `.svg` — ela redesenha, e as dez abas mudam juntas na
       próxima volta do `regerar.py`. O anti-defeito que morava neste
       comentário viaja com o arquivo dela: os `<title>` do SVG são TOOLTIP, e
       os dela já nascem capitalizados ("Bolinha rosa", "Chama amarela").

       A fita fica ESMAECIDA aqui: nada nesta aba ajusta por controle.
       O PERFIL ATIVO fica à direita, e é IGUAL nas dez abas: em cada tela ele
       diz em qual perfil aquela mudança vai cair.

       O NOME DO PERFIL NASCE TRAVESSÃO — 13/09/2026, PERFIS-TIRA-BUSCA-ATIVO-01
       §4.1, absorvida pela VAO-DO-ESQUELETO-01. O arquivo trazia o perfil do
       exemplo do desenho, e ele ficava na tela até o primeiro tique de cada
       aba e sempre que a pintura falhava: ela ativou um perfil e o chip seguiu
       dizendo outro. O travessão é o que `pacotes.topo()` escreve quando nada
       está valendo — pintura que falha mostra ausência, nunca um perfil falso. -->
  <div class="fita-linha">
    <div class="logo"><!--LOGO--></div>
    <div class="marca-nome"><span class="m-hef">Hefesto</span><br><span class="m-ds">DualSense<span class="m-4">4</span>Unix</span></div>
    <div class="fita inerte">
      <span>Selecionar:</span>
      <span class="chip on">Todos</span>
      <span class="chip plastico c-red">P1 <span class="pt">•</span> Cosmic Red <span class="pt">•</span> USB</span>
      <span class="chip plastico c-blue">P2 <span class="pt">•</span> Starlight Blue <span class="pt">•</span> BT</span>
    </div>
    <div class="conectado"><span class="bolinha">●</span> <b>2 USB · 2 BT</b></div>
    <div class="perfil-ativo" data-dica="O que você mudar em qualquer aba cai neste perfil ao Salvar perfil.">
      <span class="pa-rot">Perfil ativo</span>
      <span class="pa-nome">—</span>
    </div>
    <button type="button" class="trava-nav" data-gesto="travar-navegacao" data-campo="navegacao-travada"
            data-hef-alvo="atributo" data-hef-atributo="aria-pressed" aria-pressed="false"
            aria-label="Travar navegação" data-dica="Travar navegação: os controles deixam de mexer na janela do Hefesto">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.6"/><path class="t-arco" d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2"/></svg>
    </button>
    <i hidden data-campo="servico" data-hef-alvo="atributo" data-hef-atributo="data-servico" data-servico="de-pe"></i>
  </div>

  <!-- ================= MIOLO ================= -->
