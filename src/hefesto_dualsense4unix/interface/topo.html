<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hefesto — aba JOGAR</title>
<style>
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url('../assets/fontes/SpaceGrotesk-wght.ttf') format('truetype')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 500;font-display:swap;src:url('../assets/fontes/JetBrainsMono-wght.ttf') format('truetype')}
  :root{
    --app-bg:#21222c; --panel:#282a36; --elevated:#2b2d3a;
    --border-sutil:#343746; --border-forte:#44475a;
    --fundo-da-pagina:#11121a;
    --fg:#f8f8f2; --texto-suave:#c8ccda; --texto-mudo:#9a9eb8; --comment:#8896c4;
    --cyan:#8be9fd; --green:#50fa7b; --orange:#ffb86c;
    --pink:#ff79c6; --purple:#bd93f9; --red:#ff5555; --yellow:#f1fa8c;
    --sel-bg:rgba(189,147,249,0.16);
    --logo-fundo:none; --logo-aro:transparent;
    --rot-campo:var(--green);
    --linha:#53576f;
    --rot-linha:var(--linha);
    --cosmic-red:#ae335a; --nova-pink:#e35b8c; --starlight-blue:#7eb8d4;
    --galactic-purple:#74588e; --midnight-black:#606062;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--fundo-da-pagina); color:var(--fg);
    font-family:'Space Grotesk',system-ui,sans-serif;
    padding:var(--recuo-do-corpo); display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}

  .janela{
    width:min(100%,1600px); height:var(--alt-janela); max-width:100%; background:var(--app-bg);
    max-height:calc(100dvh - var(--recuo-do-corpo) * 2);
    display:flex; flex-direction:column;
    border:1px solid var(--linha); border-radius:10px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }

  .logo{
    width:46px;height:46px;border-radius:50%;flex:0 0 46px;
    background:radial-gradient(circle at 35% 30%,#3b2d5c,#1a1b24 70%);
    border:1px solid var(--linha);
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }

  .fita-linha{display:flex;align-items:center;gap:8px;padding:10px 18px 12px}
  .conectado{margin-left:auto;text-align:right;font-size:12.5px;color:var(--green);white-space:nowrap}
  .conectado .bolinha{color:var(--green)}
  .fita-linha:has(i[data-servico="parado"]) .conectado{display:none}
  .fita-linha:has(i[data-servico="parado"]) .perfil-ativo{margin-left:auto}
  .fita{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--fg);
  }
  .marca-nome{font-size:14px;line-height:1.15;font-weight:700;letter-spacing:-.01em;
              white-space:nowrap;color:var(--fg);margin-right:2px}
  .marca-nome .m-hef{color:var(--pink)}
  .marca-nome .m-4{color:var(--green)}
  .fita > span:first-child{font-size:13.5px;color:var(--texto-suave)}
  .perfil-ativo{
    display:flex;align-items:center;gap:7px;
    padding:5px 11px;border-radius:7px;
    border:1px solid var(--linha);background:var(--panel);min-width:0;font-size:12.5px;
  }
  .pa-rot{font-size:12.5px;color:var(--fg);white-space:nowrap}
  .pa-nome{font-size:12.5px;color:var(--pink);font-weight:600;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis;min-width:0}
  .trava-nav{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;
    border-radius:7px;border:1px solid var(--linha);background:var(--panel);color:var(--fg);
    font-family:inherit;font-weight:600;font-size:12.5px;line-height:1;white-space:nowrap;cursor:pointer;flex:0 0 auto;
    transition:background .15s,border-color .15s,color .15s}
  .trava-nav svg{width:14px;height:14px;flex:0 0 14px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .trava-nav .t-arco{transition:transform .15s;transform-origin:8px 6px;transform:translate(0,-1.5px) rotate(-28deg)}
  .trava-nav:hover{border-color:#5fd3e6}
  .trava-nav[aria-pressed="true"]{background:#0e7c8c;border-color:#5fd3e6;color:#fff}
  .trava-nav[aria-pressed="true"] .t-arco{transform:none}
  .trava-nav:focus-visible{outline:2px solid var(--cyan,#8be9fd);outline-offset:2px}
  .fita{min-width:0}
  .fita-linha .perfil-ativo{display:grid;grid-auto-flow:column;grid-template-columns:minmax(0,max-content) minmax(3em,max-content);flex-shrink:1000;overflow:hidden;min-width:min-content}.fita-linha .pa-rot{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .fita .chip.plastico{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fita > span:first-child,.fita .chip:not(.plastico){flex-shrink:0}
  .fita.inerte{color:var(--fg)}
  .fita{position:relative}
  .so-no-nativo{display:none}
  body.nativo .fita .so-no-nativo{display:block;position:absolute;inset:0;z-index:2;cursor:default}
  body.nativo .fita{color:var(--fg)}
  body.nativo .fita .chip,body.nativo .fita .chip.on,body.nativo .fita .chip.plastico{
    border-color:var(--border-sutil);background:transparent;color:var(--fg);
    font-weight:400;--borda-do-chip:1px}
  .visto-fixo,.visto-legenda,.trava-nativo{display:none}
  body.nativo .visto-fixo{grid-column:1/-1;display:flex;align-items:center;justify-content:center;
    gap:7px;height:28px;border:1px solid var(--border-sutil);border-radius:7px;
    background:transparent;color:var(--texto-suave);font-size:12px;font-weight:600;cursor:default}
  body.nativo .visto-fixo .cad{color:var(--fg)}
  body.nativo .visto-legenda{grid-column:1/-1;height:28px;display:flex;align-items:center;
    justify-content:center;color:var(--fg);font-size:11.5px}
  body.nativo .cartao.off .visto-fixo,body.nativo .cartao.off .visto-legenda{display:none}
  body.nativo .mascara .chip{display:none}
  body.nativo .cartao.alvo{background:var(--app-bg)}
  body.nativo .trava-nativo{display:inline-flex;align-items:center;gap:6px;margin-left:auto;
    margin-right:10px;color:var(--fg);font-size:12px;cursor:default}
  body.nativo .trava-nativo .cad{color:var(--fg)}
  .chip{
    --borda-do-chip:1px;
    padding:5px 12px;border-radius:6px;font-size:12px;
    border:var(--borda-do-chip) solid var(--linha);background:var(--app-bg);color:var(--fg);
    cursor:default;
  }
  .chip.on{border-color:var(--purple);background:var(--sel-bg);color:var(--fg);font-weight:600}
  .chip.plastico{--borda-do-chip:2px}
  .fita .chip{padding-top:calc(7px - var(--borda-do-chip));
              padding-bottom:calc(7px - var(--borda-do-chip));
              white-space:nowrap}
  .chip.plastico{border-color:var(--plastico, var(--border-forte))}
  .fita:not(.inerte) .chip:hover:not(.on){background:rgba(255,255,255,.1);
    background:color-mix(in srgb,var(--fg) 10%,transparent)}
  .fita:not(.inerte) .chip.plastico:hover:not(.on){
    background:color-mix(in srgb,var(--plastico,var(--border-forte)) 24%,var(--app-bg))}
  .fita:not(.inerte) .chip:not(.plastico):hover:not(.on){border-color:var(--texto-suave)}

  select option{background:var(--panel);color:var(--fg)}
  select option:checked{background:var(--sel-bg);color:var(--fg)}

  .tira{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--linha)}
  .aba{
    padding:11px 13px;font-size:13px;color:var(--fg);
    border-bottom:2px solid transparent;white-space:nowrap;cursor:default;
  }
  a.aba{text-decoration:none;cursor:pointer}
  a.aba:hover{color:var(--texto-suave);background:rgba(255,255,255,.03)}
  .aba.falta{opacity:.35;cursor:not-allowed}
  .aba.ativa{color:var(--fg);border-bottom-color:var(--pink);font-weight:600}

  .miolo{padding:16px 18px 18px 18px;display:flex;flex-direction:column;gap:14px;
         flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:auto}
  .miolo > .quadro.estica{flex-grow:1;flex-shrink:1;min-height:0;
                          display:flex;flex-direction:column}
  .miolo > .quadro.estica > .quadro-corpo{flex:1;min-height:0;display:flex;flex-direction:column}

  .quadro{border:1px solid var(--linha);border-radius:9px;background:var(--panel)}
  .quadro-topo{
    display:flex;align-items:center;gap:8px;padding:11px 14px 0;
  }
  .quadro-titulo{font-size:13.5px;font-weight:600;color:var(--purple)}
  .dica{
    display:none;position:absolute;left:22px;top:-4px;width:330px;z-index:40;
    background:var(--elevated);border:1px solid var(--linha);border-radius:7px;
    padding:9px 11px;font-size:11.5px;line-height:1.5;color:var(--texto-suave);
    text-align:left;font-weight:400;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .dica b{color:var(--fg)}
  .quadro-corpo{padding:10px 14px 14px}

  .quadro > input.abre{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
  label.quadro-titulo{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  label.quadro-titulo::before{content:"▾";font-size:10px;color:var(--fg);width:9px}
  .quadro:has(> input.abre:not(:checked)) label.quadro-titulo::before{content:"▸"}
  .quadro:has(> input.abre:not(:checked)) > .quadro-corpo{display:none}
  .miolo > .quadro.estica:has(> input.abre:not(:checked)){flex:0 0 auto}

  .linha-rot{font-size:12px;font-weight:600;color:var(--rot-campo);margin-bottom:7px}

  .seg{display:flex;gap:7px;flex-wrap:wrap}
  .seg button{
    flex:1;min-width:150px;padding:9px 10px;border-radius:7px;font-size:12.5px;
    font-family:inherit;border:1px solid var(--linha);
    background:var(--app-bg);color:var(--fg);cursor:pointer;
  }
  .seg button.on{border-color:var(--purple);background:var(--sel-bg);color:var(--fg);font-weight:600}
  .seg button:hover:not(.on){border-color:var(--comment);color:var(--texto-suave)}
  .seg button:disabled{border-color:var(--border-sutil);color:var(--fg);cursor:not-allowed}
  .seg button:disabled:hover{border-color:var(--border-sutil);color:var(--fg)}

  .estado{
    display:flex;align-items:center;gap:7px;margin-top:9px;
    font-size:12px;color:var(--fg);
  }
  .estado .valor{color:var(--fg);font-weight:600}
  .estado .verde{color:var(--green)}
  .estado .laranja{color:var(--orange)}

  .escada{display:flex;align-items:stretch;gap:7px}
  .degrau{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 10px;border-radius:7px;
    font-size:12.5px;border:1px solid var(--linha);
    background:var(--app-bg);color:var(--fg);cursor:pointer;white-space:nowrap;
  }
  .degrau i{
    font-style:normal;font-family:'JetBrains Mono',monospace;font-size:10px;
    width:15px;height:15px;line-height:14px;text-align:center;border-radius:50%;
    border:1px solid var(--linha);color:var(--fg);
  }
  .degrau:hover:not(.on){border-color:var(--comment);color:var(--texto-suave)}
  .degrau.on{
    border-color:var(--purple);background:var(--sel-bg);color:var(--fg);font-weight:600;
  }
  .degrau.on i{border-color:var(--purple);color:var(--purple)}
  .seta{color:var(--fg);font-size:13px}

  .pendente{
    display:flex;align-items:center;gap:7px;margin-top:8px;padding:7px 10px;
    border:1px dashed var(--orange);border-radius:6px;
    font-size:11.5px;color:var(--orange);background:rgba(255,184,108,.07);
  }

  .avisos{
    min-height:38px;border:1px solid var(--linha);border-radius:9px;
    background:var(--panel);padding:9px 14px;display:flex;align-items:center;gap:9px;
    font-size:12px;
  }
  .avisos.vazio{color:var(--fg);border-style:dashed}
  .selo{
    font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:600;
    font-family:'JetBrains Mono',monospace;
  }
  .selo.alerta{background:var(--orange);color:var(--app-bg)}
  .conta{margin-left:auto;font-size:11px;color:var(--fg)}
  .link{color:var(--cyan);text-decoration:none;border-bottom:1px dotted var(--cyan);cursor:pointer}

  .mesa{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .contagem{font-size:13px}
  .contagem .n{color:var(--cyan);font-weight:600;font-family:'JetBrains Mono',monospace}
  .pecas{display:flex;gap:7px}
  .cartao{
    display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;
    border:2px solid var(--linha);border-radius:7px;background:var(--app-bg);
    font-size:11.5px;color:var(--texto-suave);
  }
  .cartao .pl{font-family:'JetBrains Mono',monospace;color:var(--fg);font-weight:500}
  .cartao .via{color:var(--fg);font-size:11px}
  .cartao .bat{color:var(--green);font-family:'JetBrains Mono',monospace;font-size:11px}

  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .btn{
    padding:8px 13px;border-radius:7px;font-size:12.5px;font-family:inherit;cursor:pointer;
    border:1px solid var(--linha);background:transparent;color:var(--texto-suave);
  }
  .btn:hover{border-color:var(--texto-suave);color:var(--fg)}
  .btn.verde{color:var(--green)}
  .btn.vermelho{color:var(--red)}
  .btn.roxo{color:var(--purple)}
  .btn.verde:hover{border-color:var(--green);color:var(--green)}
  .btn.vermelho:hover{border-color:var(--red);color:var(--red)}
  .btn.roxo:hover{border-color:var(--purple);color:var(--purple)}
  .btn.amarelo-padrao{border-color:var(--yellow);color:var(--yellow)}
  .btn.amarelo-padrao:hover{border-color:var(--yellow);color:var(--yellow);
                            background:rgba(241,250,140,.08)}

  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .conta-avisos{margin-left:auto;font-size:11px;color:var(--fg)}
  .aviso-item{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--texto-suave)}
  .sub-secao{margin-top:14px;padding-top:12px;border-top:1px solid var(--linha)}
  .sep{color:var(--fg);margin:0 3px}

  .faixa-final{display:flex;align-items:center;gap:12px;margin-top:12px}
  .faixa-final .pendente{flex:1;margin-top:0}
  .col-atencao{border-left:1px solid var(--linha);padding-left:16px}


  .rodape{
    display:flex;align-items:center;gap:10px;padding:6px 18px;
    border-top:1px solid var(--linha);background:var(--app-bg);
  }
  .rodape .r-aplicar{margin-left:auto}
  .rodape button{
    padding:8px 15px;border-radius:7px;font-size:12.5px;font-family:inherit;
    font-weight:600;cursor:pointer;border:1px solid transparent;
  }
  .r-aplicar{background:var(--green);color:var(--app-bg)}
  .r-salvar{border-color:var(--purple)!important;color:var(--purple);background:transparent}
  .r-importar{border-color:var(--orange)!important;color:var(--orange);background:transparent}
  .r-exportar{border-color:var(--comment)!important;color:var(--fg);background:transparent}
  .rodape .r-aplicar:hover{background:#7dfb9b;background:color-mix(in srgb,var(--green) 75%,#fff)}
  .rodape .r-salvar:hover{background:rgba(189,147,249,.18);
    background:color-mix(in srgb,var(--purple) 18%,transparent)}
  .rodape .r-importar:hover{background:rgba(255,184,108,.18);
    background:color-mix(in srgb,var(--orange) 18%,transparent)}
  .rodape .r-exportar:hover{background:rgba(136,150,196,.2);
    background:color-mix(in srgb,var(--comment) 20%,transparent)}

  .marca{color:var(--orange)}

  .logo{background:var(--logo-fundo);border-color:var(--logo-aro);overflow:hidden}
  .logo svg{width:44px;height:44px;display:block}
  .ds-svg{width:100%;height:auto;display:block}
  .cartao .ds-svg{width:72px;flex:0 0 72px}

  [data-conectado="nao"] .ds-svg,
  .ds-svg[data-conectado="nao"]{display:none}
  .ds-motores{max-width:250px;margin:6px auto}
  .ds-svg .oculta{opacity:0}
  .ds-svg .oculta.acesa{opacity:.95}

  .ds-svg .peca{fill:#6b7385}
  .ds-svg .sem-tinta{fill:none !important;stroke:none !important}
  .ds-svg [id$="-touchpad"] .peca,
  .ds-svg [id$="-l1"] .peca,
  .ds-svg [id$="-r1"] .peca{stroke-width:.9;stroke-linejoin:round}

  :root{
    --h-escolha:36px;
    --h-acao:34px;
    --gap:14px;
    --pad-quadro:14px;
    --rot:92px;
    --recuo-do-corpo:16px;
    --piso-da-vista:777px;
    --teto-da-vista:855px;
    --alt-janela:clamp(var(--piso-da-vista),
                       calc(100dvh - var(--recuo-do-corpo) * 2),
                       var(--teto-da-vista));
  }
  .seg button,.modos button,.players button,.degrau,select.pronto,.escolha{
    height:var(--h-escolha);padding-top:0;padding-bottom:0;
    display:flex;align-items:center;
  }
  .modos button{justify-content:flex-start}
  .seg button,.players button,.degrau{justify-content:center}
  select.pronto{display:block;line-height:calc(var(--h-escolha) - 2px)}
  .btn,.mini{height:var(--h-acao);padding-top:0;padding-bottom:0;
             display:inline-flex;align-items:center;justify-content:center}
  .rodape button{height:var(--h-acao);padding-top:0;padding-bottom:0}
  .campo .nome,.barra .nome{flex:0 0 var(--rot)}

  .pt{color:var(--fg);margin:0 1px;font-size:10px;vertical-align:1px}
</style>
</head>
<body>

<div class="janela">

  <div class="fita-linha">
    <div class="logo"><!--LOGO--></div>
    <div class="marca-nome"><span class="m-hef">Hefesto</span><br><span class="m-ds">DualSense<span class="m-4">4</span>Unix</span></div>
    <div class="fita inerte">
      <span>Selecionar:</span>
      <span class="chip on">Todos</span>
      <span class="chip plastico c-red">P1 <span class="pt">•</span> Cosmic Red <span class="pt">•</span> USB</span>
      <span class="chip plastico c-blue">P2 <span class="pt">•</span> Starlight Blue <span class="pt">•</span> BT</span>
    </div>
    <div class="conectado"><span class="bolinha">●</span> <b>2 USB · 2 BT</b></div>
    <div class="perfil-ativo" data-dica="Perfil ativo: o que você mudar em qualquer aba cai neste perfil ao Salvar perfil.">
      <span class="pa-rot">Perfil ativo</span>
      <span class="pa-nome">—</span>
    </div>
    <button type="button" class="trava-nav" data-gesto="travar-navegacao" data-campo="navegacao-travada"
            data-hef-alvo="atributo" data-hef-atributo="aria-pressed" aria-pressed="false"
            aria-label="Travar navegação" data-dica="Travar navegação: os controles deixam de mexer na janela do Hefesto">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.6"/><path class="t-arco" d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2"/></svg>
    </button>
    <i hidden data-campo="servico" data-hef-alvo="atributo" data-hef-atributo="data-servico" data-servico="de-pe"></i>
  </div>

  <div class="tira">
    <a class="aba" href="01-jogar.html">Jogar</a>
    <a class="aba" href="03-gatilhos.html">Gatilhos</a>
    <a class="aba" href="04-iluminacao.html">Iluminação</a>
    <a class="aba" href="05-vibracao.html">Vibração</a>
    <a class="aba" href="06-navegacao.html">Navegação</a>
    <a class="aba" href="08-conexoes.html">Conexões</a>
    <a class="aba" href="09-sistema.html">Sistema</a>
    <a class="aba" href="10-perfis.html">Perfis</a>
    <a class="aba" href="07-lancadores.html">Experimental</a>
  </div>
