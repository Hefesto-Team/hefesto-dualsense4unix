<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hefesto — o mapa do controle</title>
<style>
  :root{
    --app-bg:#21222c; --panel:#282a36; --elevated:#2b2d3a;
    --border-sutil:#343746; --border-forte:#44475a;
    --branco:#ffffff; --fg:#f8f8f2; --texto-suave:#c8ccda; --texto-mudo:#8b8fa8; --comment:#6272a4;
    --cyan:#8be9fd; --green:#50fa7b; --orange:#ffb86c;
    --pink:#ff79c6; --purple:#bd93f9; --red:#ff5555; --yellow:#f1fa8c;
    --luz-apagada:#3f4350; --led-apagado:#4a4f5c; --led-aceso:#e8ecf5;
    --sem-plastico:#3a3f4b;
    --f:ui-sans-serif,system-ui,"Cantarell","Segoe UI",Roboto,sans-serif;
    --m:ui-monospace,"JetBrains Mono","Fira Mono","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#11121a;color:var(--fg);font-family:var(--f);
       display:flex;flex-direction:column;align-items:center;gap:16px}
  .cx{background:var(--app-bg);border-radius:11px;border:1px solid var(--border-sutil);
      overflow:hidden;display:flex;flex-direction:column}
  .ds{width:100%;height:auto}
  .ds .peca,.ds .corpo{stroke:none}
  .ds g[id^="mp-"]:not([id^="mp-glifo"]):not(.sobre):not(.alvo)
    > :is(rect,path,circle,ellipse,polygon){fill:var(--z-casca-solida, var(--sem-plastico))}
  .ds #mp-lightbar{color:var(--luz-apagada)}
  .ds #mp-lightbar *{fill:var(--luz, currentColor)}
  .ds #mp-led-jogador rect{fill:var(--led-apagado)}
  .ds #mp-led-jogador rect.led-on{fill:var(--led-aceso)}
  .ds .sem-tinta{fill:none !important;stroke:none !important}
  .ds #mp-corpo .peca,.ds #mp-corpo .corpo{stroke:var(--z-casca-solida, var(--sem-plastico));stroke-width:.42;
                      stroke-linejoin:round;stroke-linecap:round}
  .ds .oculta{opacity:0 !important}
  .sobre{color:var(--branco);opacity:1;pointer-events:none;--pena:.35}
  .sobre *:not([fill="none"]):not(title){fill:currentColor !important}
  .sobre [stroke]:not([stroke="none"]){stroke:currentColor !important}
  .sobre text,.sobre tspan{fill:currentColor !important}
  .sobre svg{overflow:visible}
  .sobre [stroke-width]{stroke-width:calc(var(--pena) * 32 / var(--lado))}
  .alvo,.alvo *{fill:transparent;stroke:transparent;stroke-width:1.8;
                stroke-linejoin:round;stroke-linecap:round;pointer-events:all;cursor:pointer}
  :root{--recuo-do-corpo:16px;--piso-da-vista:777px;--teto-da-vista:855px;--alt-janela:clamp(var(--piso-da-vista), calc(100dvh - var(--recuo-do-corpo) * 2), var(--teto-da-vista))}
  body{padding:var(--recuo-do-corpo)}
  .cx{width:min(100%,1600px);height:var(--alt-janela);max-width:100%;max-height:calc(100dvh - var(--recuo-do-corpo) * 2)}

  .mc{--tipo:var(--purple)}
  .mc[data-tipo="pac"]{--tipo:var(--cyan)}
  .mc[data-tipo="troca"]{--tipo:var(--orange)}
  .mc-topo{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--border-sutil);flex:none}
  .mc-topo h1{font-size:17px;font-weight:700;color:var(--pink)}
  .voltar2{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:7px;text-decoration:none;
    border:1px solid var(--border-forte);background:var(--panel);color:var(--texto-suave);font-size:12px}
  .voltar2:hover{border-color:var(--purple);color:var(--fg)}
  .mc-topo > .mc-rot{margin-left:auto}
  .mc-chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
  .chip{height:30px;padding:0 12px;border-radius:7px;border:2px solid var(--plastico,var(--border-forte));
    background:var(--app-bg);color:var(--texto-suave);font:12px var(--f);cursor:pointer;white-space:nowrap;text-align:center}
  .chip.on{background:rgba(189,147,249,.16);color:var(--fg);font-weight:600}
  .chip .pt{color:var(--fg);margin:0 2px}
  @media (max-width:1000px){.mc-chips{gap:5px}.chip{padding:0 7px}}
  .mc-perfil{display:grid;grid-template-columns:292px minmax(0,1fr) 292px;gap:20px;align-items:center;
    padding:12px 20px;border-bottom:1px solid var(--border-sutil);flex:none}
  .mc-perfil .cel{display:flex;align-items:center;gap:12px;min-width:0}
  .mc-rot{font-size:12px;color:var(--texto-suave);white-space:nowrap}
  .mc-rot[data-dica]{cursor:help}
  .campo2{height:32px;border-radius:7px;border:1px solid var(--border-forte);background:var(--app-bg);color:var(--fg);
    font:12.5px var(--f);padding:0 10px}
  #perfil,.nome2{width:auto;flex:1 1 0;min-width:0}
  .mc-perfil[data-fixo="sim"] .nome2{color:var(--fg)}
  .etiqueta{height:24px;display:inline-flex;align-items:center;padding:0 10px;border-radius:12px;font-size:11.5px;
    font-weight:600;color:var(--app-bg);background:var(--tipo)}
  .usar-em{display:flex;gap:6px;align-items:center;margin-left:auto}
  .usar-em .jogo{height:26px;display:inline-flex;align-items:center;padding:0 10px;border-radius:13px;font-size:11.5px;
    border:1px solid var(--tipo);color:var(--fg);background:transparent;font-family:var(--f)}
  .usar-em .mais{border-style:dashed;color:var(--fg);border-color:var(--border-forte);cursor:pointer}
  .cx > .corpo{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
  .mapa.mc-mapa{flex:1 0 auto;display:grid;grid-template-columns:292px minmax(0,1fr) 292px;gap:20px;
    padding:14px 20px;align-items:stretch;align-content:center}
  .mc-lado{display:flex;flex-direction:column;gap:7px;justify-content:space-between}
  .b2{display:grid;grid-template-columns:24px 74px minmax(0,1fr);align-items:center;gap:8px;height:37px;padding:0 10px;
    border-radius:8px;border:1px solid var(--border-sutil);background:var(--panel);color:var(--fg);font:12px var(--f);
    cursor:pointer;text-align:left}
  .b2:hover{border-color:var(--comment)}
  .b2-gl{display:flex;align-items:center;justify-content:center;color:var(--texto-suave)}
  .b2-gl svg{width:18px;height:18px}
  .b2-nm{font-size:11.5px;color:var(--texto-suave);white-space:nowrap}
  .b2-val{height:25px;display:flex;align-items:center;padding:0 9px;border-radius:6px;background:var(--app-bg);
    color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
  .b2[data-estado~="muda"]{border-left:1px solid var(--tipo);box-shadow:inset 2px 0 0 var(--tipo)}
  .b2[data-estado~="muda"] .b2-val{color:var(--fg);box-shadow:inset 0 0 0 1px var(--tipo)}
  .b2[data-estado~="pisca"]{border-color:var(--pink)}
  .b2[data-estado~="on"]{border-color:var(--pink);background:rgba(255,121,198,.10)}
  .b2[data-estado~="on"] .b2-gl,.b2[data-estado~="pisca"] .b2-gl{color:var(--pink)}
  .mc-centro{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;justify-content:flex-start}
  .mc-desenho{display:flex;justify-content:center;min-height:0}
  .mc-desenho .ds{width:100%;height:auto;max-height:380px}
  .mc-baixo{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
  .mc-baixo .b2{grid-template-columns:24px 58px minmax(0,1fr);gap:8px}
  .mc-baixo .b2:last-child{grid-column:1 / -1;justify-self:center;width:calc(50% - 6px)}
  .sel2{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:5;background:var(--panel);
    border:1px solid var(--pink);border-radius:11px;box-shadow:0 18px 50px rgba(0,0,0,.55);
    display:flex;flex-direction:column;padding:14px 16px;gap:12px}
  .sel2[hidden]{display:none}
  .sel2-topo{display:flex;align-items:center;gap:14px}
  .sel2-tit{font-size:13.5px;font-weight:600;color:var(--fg)}
  .sel2-b{color:var(--pink)}
  .seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-left:auto}
  .seg2 button{height:30px;padding:0 14px;border-radius:7px;border:1px solid var(--border-forte);background:var(--app-bg);
    color:var(--texto-suave);font:12px var(--f);cursor:pointer}
  .seg2 button[hidden]{display:none}
  .seg2 button.on{border-color:var(--purple);background:rgba(189,147,249,.16);color:var(--fg);font-weight:600}
  .sel2-x{width:30px;height:30px;border-radius:7px;border:1px solid var(--border-forte);background:transparent;
    color:var(--fg);font-size:15px;cursor:pointer}
  .sel2-grade{flex:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:42px;gap:9px;align-content:start}
  .sel2-grade[hidden]{display:none}
  .op3{display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:8px;border:1px solid var(--border-sutil);
    background:var(--app-bg);color:var(--fg);font:12px var(--f);cursor:pointer;text-align:left;min-width:0}
  .op3:hover{border-color:var(--purple)}
  .op3 svg{width:18px;height:18px;flex:none;color:var(--texto-suave)}
  .op3.on{border-color:var(--tipo);box-shadow:inset 0 0 0 1px var(--tipo);background:rgba(255,184,108,.08)}
  .op3.gravar{grid-column:1 / -1;justify-content:center;border-color:var(--red);color:var(--red);font-weight:600}
  .op3.gravar .ponto{width:9px;height:9px;border-radius:50%;background:var(--red)}
  .op3.gravar.ouvindo{background:rgba(255,85,85,.12)}
  .sel2-rod{display:flex;justify-content:flex-end}
  .sel2-rod .op3{height:32px}
  .mc-cursor{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--border-sutil);flex:none}
  .mc-cursor .campo2{height:30px}
  .mc-cursor .par2{display:flex;align-items:center;gap:12px}
  .mc:not([data-tipo="pac"]) .mc-cursor{display:none}
  .mc-rod{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:12px 20px;border-top:1px solid var(--border-sutil);flex:none}
  .btn2{height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--border-forte);
    background:transparent;color:var(--texto-suave);font:12.5px var(--f);cursor:pointer;text-decoration:none}
  .btn2.amarelo{border-color:#f1fa8c;color:#f1fa8c}
  .btn2.roxo{border-color:var(--purple);color:var(--purple)}

  .mc .mapa:has(.item-circle[data-estado~="on"]) #mp-circle :is(.peca, rect, circle, path, ellipse){fill:var(--pink) !important;stroke:var(--pink) !important}

  .mc .mapa:has(.item-cross:hover) .s-cross, .mc .mapa:has(.a-cross:hover) .s-cross{color:var(--fg) !important;opacity:1}

<style id="base-comum">
/* ===== Base comum das abas (rodada 2, 12/10/2026) =====
   Copiada IGUAL em todo mockup do todo. Três peças: a dica no hover (sem «?»), o Modo automático
   e o menu do botão direito desenhado no visual das abas (BRIEF-T6, opção B). */

/* 1. A dica: qualquer frase, botão ou área com data-dica mostra a dica ao passar o mouse ou focar.
      Nenhum botão «?» existe mais. A dica tem no máximo ~12 palavras: show, don't tell.
      A caixa `.da-base` é só a do desenho: na janela do produto a dona do `#hef-dica` é a camada do piloto. */
[data-dica]{cursor:help}
button[data-dica],a[data-dica],select[data-dica],input[data-dica],[role="button"][data-dica]{cursor:pointer}
#hef-dica.da-base{position:fixed;z-index:2147483000;max-width:280px;padding:7px 11px;border-radius:8px;
  background:#1b1c25;border:1px solid var(--border-forte,#44475a);color:var(--texto-suave,#c8ccda);
  font:500 12.5px/1.45 'Space Grotesk',system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none;
  opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s}
#hef-dica.da-base.visivel{opacity:1;transform:none}
/* O foco num título, rótulo ou frase com dica (o `tabindex` vem da base) aparece com o mesmo contorno do Modo automático. */
[data-dica][tabindex]:focus-visible{outline:2px solid var(--cyan,#8be9fd);outline-offset:2px}

/* 2. O Modo automático: pílula com bolinha. Os dois estados têm de se distinguir num relance.
      Desligado: contorno neutro, bolinha vazia, letra suave (vale o que está na aba).
      Ligado: ciano cheio, bolinha branca acesa, letra branca; a área que ele governa esmaece. */
.modo-auto{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 16px 0 12px;border-radius:999px;
  border:1px solid var(--border-forte,#44475a);background:transparent;color:var(--texto-suave,#c8ccda);
  font:600 13.5px/1 'Space Grotesk',system-ui,sans-serif;cursor:pointer;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.modo-auto .p{width:11px;height:11px;border-radius:50%;border:2px solid var(--texto-mudo,#9a9eb8);background:transparent;
  transition:all .15s}
.modo-auto:hover{border-color:#5fd3e6;color:#fff}
.modo-auto[aria-pressed="true"]{background:#0e7c8c;border-color:#5fd3e6;color:#fff;box-shadow:0 0 0 3px rgba(95,211,230,.18)}
.modo-auto[aria-pressed="true"] .p{border-color:#fff;background:#fff;box-shadow:0 0 8px #fff}
.modo-auto:focus-visible{outline:2px solid var(--cyan,#8be9fd);outline-offset:2px}
.governado-pelo-jogo{opacity:.42;pointer-events:none;filter:saturate(.6)}

/* 3. O menu do botão direito, no visual das abas. */
.menu-hefesto{position:fixed;z-index:2147482000;min-width:190px;padding:6px;border-radius:12px;
  background:#252733;border:1px solid var(--border-forte,#44475a);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.menu-hefesto button{display:flex;width:100%;align-items:center;gap:10px;height:34px;padding:0 12px;border:0;
  border-radius:8px;background:transparent;color:var(--fg,#f8f8f2);font:500 13.5px/1 'Space Grotesk',system-ui,sans-serif;text-align:left;cursor:pointer}
.menu-hefesto button:hover{background:rgba(189,147,249,.14)}
.menu-hefesto button[disabled]{color:var(--fg,#f8f8f2);opacity:.55;cursor:default;background:transparent}
.menu-hefesto hr{border:0;border-top:1px solid var(--border-sutil,#343746);margin:5px 4px}
</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const mc = $('.mc'), pop = $('.sel2'), ds = $('svg.ds'), nome = $('#nome');
  const captura = $('#mapa-captura'), gravar = $('.op3.gravar', pop);
  const PADRAO = {"1": [3], "2": [2, 4], "3": [1, 3, 5], "4": [1, 2, 4, 5]};
  const ROTULO = gravar.querySelector('span:last-child').textContent;
  let linha = null, ouvindo = false, soModificador = null;

  const mostra = aba => {
    $$('.seg2 button', pop).forEach(x => x.classList.toggle('on', x.dataset.aba === aba));
    $$('.sel2-grade', pop).forEach(g => g.hidden = g.dataset.aba !== aba);
    escuta(false);
  };
  const abre = b => {
    if (b.dataset.fixo === 'sim') return;
    linha = b;
    $('.sel2-b', pop).textContent = $('.b2-nm', b).textContent;
    const atual = ($('.b2-atual', b) || {}).textContent || '';
    $$('.op3', pop).forEach(o => o.classList.toggle('on', !!atual && o.dataset.v === atual));
    const troca = b.dataset.troca === 'sim';
    $('.seg2 [data-aba="controle"]', pop).hidden = !troca;
    const em = aba => !!$(`.sel2-grade[data-aba="${aba}"] .op3[data-v="${atual}"]`, pop);
    mostra(atual.startsWith('troca:') && troca ? 'controle' : em('mouse') ? 'mouse' : atual && !em('controle') ? 'teclado' : troca ? 'controle' : 'mouse');
    pop.hidden = false;
  };
  /* A linha escolhida só fica acesa enquanto o seletor dela está aberto: fechar manda `mapa-botao` sem
     botão, e o pacote apaga o `on`. O `setTimeout` deixa passar antes o clique da opção que fechou. */
  const solta = () => setTimeout(() => $('#mapa-solta').click(), 0);
  const fecha = () => { escuta(false); pop.hidden = true; solta(); };

  /* a captura: a tecla, o botão do mouse ou o botão do controle que a pessoa aperta */
  const MODIFICADOR = {ControlLeft: 'LEFTCTRL', ControlRight: 'RIGHTCTRL', ShiftLeft: 'LEFTSHIFT', ShiftRight: 'RIGHTSHIFT',
    AltLeft: 'LEFTALT', AltRight: 'RIGHTALT', MetaLeft: 'LEFTMETA', MetaRight: 'RIGHTMETA'};
  const NOMEADA = {ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', Space: 'SPACE', Enter: 'ENTER',
    NumpadEnter: 'ENTER', Tab: 'TAB', Backspace: 'BACKSPACE', Delete: 'DELETE', Home: 'HOME', End: 'END', PageUp: 'PAGEUP',
    PageDown: 'PAGEDOWN', Insert: 'INSERT', Comma: 'COMMA', Period: 'DOT', PrintScreen: 'SYSRQ'};
  const tecla = e => {
    const c = e.code;
    if (/^Key[A-Z]$/.test(c)) return 'KEY_' + c.slice(3);
    if (/^Digit[0-9]$/.test(c)) return 'KEY_' + c.slice(5);
    if (/^F([1-9]|1[0-2])$/.test(c)) return 'KEY_' + c;
    return NOMEADA[c] ? 'KEY_' + NOMEADA[c] : '';
  };
  const modificadores = e => [e.ctrlKey && 'KEY_LEFTCTRL', e.altKey && 'KEY_LEFTALT', e.shiftKey && 'KEY_LEFTSHIFT',
    e.metaKey && 'KEY_LEFTMETA'].filter(Boolean);
  const escuta = on => {
    ouvindo = on; soModificador = null;
    gravar.classList.toggle('ouvindo', on);
    gravar.querySelector('span:last-child').textContent = on ? 'Aperte uma tecla ou um botão' : ROTULO;
  };
  const manda = (campo, valor) => {
    delete captura.dataset.tecla; delete captura.dataset.troca;
    captura.dataset[campo] = valor;
    escuta(false); pop.hidden = true;
    captura.click();
    solta();
  };
  document.addEventListener('keydown', e => {
    if (!ouvindo) return;
    e.preventDefault(); e.stopPropagation();
    if (e.code === 'Escape' && !modificadores(e).length) { escuta(false); return; }
    if (MODIFICADOR[e.code]) { soModificador = 'KEY_' + MODIFICADOR[e.code]; return; }
    const k = tecla(e);
    if (k) { soModificador = null; manda('tecla', [...modificadores(e), k].join('+')); }
  }, true);
  document.addEventListener('keyup', e => {
    if (!ouvindo || !soModificador || !MODIFICADOR[e.code]) return;
    e.preventDefault(); manda('tecla', soModificador);
  }, true);
  const BOTAO_DO_MOUSE = ['BTN_LEFT', 'BTN_MIDDLE', 'BTN_RIGHT'];
  document.addEventListener('mousedown', e => {
    if (!ouvindo) return;
    if (e.target.closest('.op3.gravar')) return;
    if (e.target.closest('.sel2')) { escuta(false); return; }
    if (BOTAO_DO_MOUSE[e.button]) { e.preventDefault(); e.stopPropagation(); manda('tecla', BOTAO_DO_MOUSE[e.button]); }
  }, true);
  document.addEventListener('contextmenu', e => { if (ouvindo) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
  /* o botão do controle: a linha que ganha `pisca` enquanto a captura escuta vira a troca */
  const olho = new MutationObserver(lista => {
    if (!ouvindo) return;
    for (const m of lista) {
      const antes = (m.oldValue || '').split(' '), agora = (m.target.dataset.estado || '').split(' ');
      if (agora.includes('pisca') && !antes.includes('pisca') && m.target.dataset.destino)
        { manda('troca', m.target.dataset.destino); return; }
    }
  });
  $$('.b2[data-destino]').forEach(b => olho.observe(b, {attributes: true, attributeFilter: ['data-estado'], attributeOldValue: true}));

  $$('.b2').forEach(b => b.addEventListener('click', () => abre(b)));
  $$('.alvo').forEach(a => a.addEventListener('click', () => {
    const peca = [...a.classList].find(c => c.startsWith('a-'));
    const b = peca && $(`.b2.item-${peca.slice(2)}`);
    if (b) b.click();
  }));
  $('.seg2', pop).addEventListener('click', e => { const t = e.target.closest('button'); if (t) mostra(t.dataset.aba); });
  $('.sel2-x', pop).addEventListener('click', fecha);
  gravar.addEventListener('click', () => escuta(!ouvindo));
  pop.addEventListener('click', e => {
    const o = e.target.closest('.op3');
    if (o && o !== gravar) fecha();
  });

  /* o controle escolhido pinta o casco, os cinco pontos do jogador e a barra de luz do desenho */
  const acende = c => {
    if (!c) return;
    ds.dataset.colorway = c.dataset.colorway || '';
    for (let i = 1; i <= 5; i++) {
      const led = document.getElementById('mp-led-jogador-' + i);
      if (led) led.classList.toggle('led-on', (PADRAO[c.dataset.jogador] || []).includes(i));
    }
    if (c.dataset.luz) document.getElementById('mp-lightbar').style.setProperty('--luz', c.dataset.luz);
  };
  const chips = $('.mc-chips');
  new MutationObserver(() => acende($('.chip.on', chips))).observe(chips, {childList: true, subtree: true, attributes: true});
  chips.addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (c) { $$('.chip', chips).forEach(x => x.classList.toggle('on', x === c)); acende(c); }
  });
  acende($('.chip.on', chips));
  const bloqueia = () => { nome.readOnly = $('.mc-perfil').dataset.fixo === 'sim'; };
  new MutationObserver(bloqueia).observe($('.mc-perfil'), {attributes: true, attributeFilter: ['data-fixo']});
  bloqueia();
  /* A ÂNCORA DO ENDEREÇO escolhe o perfil de abertura (O-MAPA-DO-CONTROLE-ABRE-NO-PERFIL-QUE-A-ANCORA-PEDE-E-LE-A-ESCOLHA-DO-POINT-AND-CLICK-01).
     `#point-and-click` e `#trocar` vêm da aba Navegação; o produto pinta, no `data-chave` de dois marcadores
     que não aparecem, a chave que cada uma pede. Sem âncora, ou com outra, nada muda: abre em Navegar. */
  const MARCADOR = {'#point-and-click': 'ancora-pac', '#trocar': 'ancora-trocar'};
  const lista = $('#perfil');
  /* A âncora se segue UMA vez por chegada (a carga ou o `hashchange`), quando a chave pintada já tem
     lugar no seletor. Depois o seletor é de quem usa: o perfil ativo que troca no meio da edição
     não muda a escolha feita nem larga o que não se salvou. */
  let seguida = null;
  const seguirAncora = () => {
    if (seguida === location.hash) return;
    const campo = MARCADOR[location.hash];
    const marca = campo && $('[data-campo="' + campo + '"]');
    const chave = marca ? marca.dataset.chave : '';
    if (campo && !(chave && [...lista.options].some(o => o.value === chave))) return;
    seguida = location.hash;
    if (!chave || lista.value === chave) return;
    lista.value = chave;
    lista.dispatchEvent(new Event('change', {bubbles: true}));
  };
  /* O TÍTULO DIZ QUAL DAS DUAS TELAS É: a Navegação abre o mesmo mapa por «Trocar os botões» e por
     «Point and click», e o `<h1>`, o `aria-label` e o `<title>` seguem a âncora. */
  const TITULO = {'#trocar': 'Trocar os botões', '#point-and-click': 'Point and click'};
  const titula = () => {
    const t = TITULO[location.hash] || 'Mapa do controle';
    $('#mc-titulo').textContent = t;
    mc.setAttribute('aria-label', t);
    document.title = 'Hefesto — ' + t;
  };
  titula();
  addEventListener('hashchange', titula);
  addEventListener('hashchange', () => { seguida = null; seguirAncora(); });
  new MutationObserver(seguirAncora).observe($('.mc-perfil'), {subtree: true, childList: true, attributes: true});
  seguirAncora();
})();
</script>
<script id="base-comum">
/* Base comum das abas: a dica no hover e o menu do botão direito. Uma vez por página, igual em todas. */
(() => {
  /* A dica: só nasce aqui quando NÃO há a camada da janela (`__hefDica`, do piloto), que é a dona
     do `#hef-dica` no produto. Os dois nunca rodam juntos: o teste vem a cada evento, porque a
     camada da janela chega depois da carga da página. */
  let dica = null, alvo = null;
  /* A dica aberta é a descrição de quem a abriu, para o leitor de tela: o `id` entra no
     `aria-describedby` enquanto ela está aberta e sai com ela, sem apagar o que já havia. */
  const descrever = (el, liga) => {
    const lista = (el.getAttribute('aria-describedby') || '').split(/\s+/).filter(t => t && t !== 'hef-dica');
    if (liga) lista.push('hef-dica');
    if (lista.length) el.setAttribute('aria-describedby', lista.join(' ')); else el.removeAttribute('aria-describedby');
  };
  const mostrar = el => {
    if (alvo && alvo !== el) descrever(alvo, false);
    if (!dica) { dica = document.createElement('div'); dica.id = 'hef-dica'; dica.className = 'da-base'; dica.setAttribute('role', 'tooltip'); }
    alvo = el; dica.textContent = el.dataset.dica;
    descrever(el, true);
    if (!dica.isConnected) document.body.append(dica);
    const r = el.getBoundingClientRect(), d = dica.getBoundingClientRect();
    let x = r.left + r.width / 2 - d.width / 2, y = r.bottom + 8;
    if (y + d.height > innerHeight - 6) y = r.top - d.height - 8;
    dica.style.left = Math.max(6, Math.min(x, innerWidth - d.width - 6)) + 'px'; dica.style.top = y + 'px';
    dica.classList.add('visivel');
  };
  const esconder = () => { if (alvo) descrever(alvo, false); alvo = null; if (dica) dica.classList.remove('visivel'); };
  /* O TEXTO CORTADO PELA RETICÊNCIA GANHA A DICA COM ELE INTEIRO (16/10/2026): sem ela, o fim da
     frase não se lê em lugar nenhum. Na passagem do ponteiro, em captura e antes de qualquer camada
     de dica (a desta base e a da janela, que lê o `data-dica` primeiro), o elemento com
     `text-overflow:ellipsis` mais perto do ponteiro ganha o texto todo, se corta, e perde a dica
     que esta regra lhe deu, se deixou de cortar. A dica própria de um elemento nunca é trocada. */
  document.addEventListener('mousemove', e => {
    let el = e.target && e.target.nodeType === 1 ? e.target : null;
    for (let n = 0; el && n < 4; el = el.parentElement, n++) {
      if (getComputedStyle(el).textOverflow !== 'ellipsis') continue;
      const daRegra = el.hasAttribute('data-dica-do-corte');
      if (el.hasAttribute('data-dica') && !daRegra) return;
      const texto = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (texto && el.scrollWidth > el.clientWidth + 1) {
        el.setAttribute('data-dica', texto); el.setAttribute('data-dica-do-corte', '');
      } else if (daRegra) {
        el.removeAttribute('data-dica'); el.removeAttribute('data-dica-do-corte');
      }
      return;
    }
  }, true);
  for (const [ev, f] of [['mouseover', 'in'], ['focusin', 'in'], ['mouseout', 'out'], ['focusout', 'out']])
    document.addEventListener(ev, e => {
      if (window.__hefDica) return;
      const el = e.target.closest && e.target.closest('[data-dica]');
      if (f === 'in' && el && el.dataset.dica && el !== alvo) mostrar(el);
      if (f === 'out' && el && !el.contains(e.relatedTarget)) esconder();
    });
  /* O Modo automático: a área que o botão governa esmaece enquanto ele está ligado, e o `data-modo`
     leva o que o PRÓXIMO clique pede. Tudo parte do `aria-pressed`, que o piloto também pinta;
     o clique só vira o `aria-pressed` na hora (depois de o piloto ter lido o `data-modo`). */
  const sincronizar = b => {
    const on = b.getAttribute('aria-pressed') === 'true';
    const pedido = on ? 'personalizado' : 'automatico';
    if (b.dataset.modo !== pedido) b.dataset.modo = pedido;
    if (b.dataset.governa)
      document.querySelectorAll(b.dataset.governa).forEach(el => el.classList.toggle('governado-pelo-jogo', on));
  };
  const sincronizarTodos = () => document.querySelectorAll('.modo-auto').forEach(sincronizar);
  sincronizarTodos();
  new MutationObserver(ms => {
    if (ms.some(m => m.type === 'childList' || (m.target.matches && m.target.matches('.modo-auto')))) sincronizarTodos();
  }).observe(document.body, {subtree: true, childList: true, attributes: true, attributeFilter: ['aria-pressed']});
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.modo-auto');
    if (b) setTimeout(() => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'), 0);
  });
  /* O menu do botão direito: Copiar (cinza sem seleção), Atualizar, Desligar ou Ligar, Reiniciar,
     Reconectar controles (o mesmo «Reconectar» da aba Jogar, desde 19/10/2026), Fechar.
     Cada item é um `data-gesto` comum: no produto a janela o despacha como qualquer botão. O serviço
     parado ou pausado vira «Ligar», de um clique só; o estado vem do `data-servico` do cabeçalho. */
  const fechar = () => document.querySelectorAll('.menu-hefesto.vivo').forEach(m => m.remove());
  document.addEventListener('contextmenu', e => {
    e.preventDefault(); fechar();
    const m = document.createElement('div'); m.className = 'menu-hefesto vivo'; m.setAttribute('role', 'menu');
    const sel = String(getSelection()).trim() !== '';
    const servico = (document.querySelector('[data-campo="servico"]') || {dataset: {}}).dataset.servico;
    const ligar = servico === 'parado' || servico === 'pausado';
    const item = ligar
      ? '<button type="button" role="menuitem" data-gesto="menu-desligar" data-dica="O Hefesto volta a cuidar dos controles">Ligar</button>'
      : '<button type="button" role="menuitem" data-gesto="menu-desligar" data-menu="desligar" data-dica="O Hefesto sai da frente e o jogo lê o controle direto">Desligar</button>';
    m.innerHTML = `<button type="button" role="menuitem" data-menu="copiar" ${sel ? '' : 'disabled'}>Copiar</button><hr>
      <button type="button" role="menuitem" data-gesto="menu-atualizar">Atualizar</button>
      ${item}
      <button type="button" role="menuitem" data-gesto="menu-reiniciar">Reiniciar</button>
      <button type="button" role="menuitem" data-gesto="menu-reconectar" data-dica="Desliga e liga de novo todos os controles">Reconectar controles</button><hr>
      <button type="button" role="menuitem" data-gesto="menu-fechar">Fechar</button>`;
    document.body.append(m);
    const r = m.getBoundingClientRect();
    m.style.left = Math.min(e.clientX, innerWidth - r.width - 6) + 'px';
    m.style.top = Math.min(e.clientY, innerHeight - r.height - 6) + 'px';
  });
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.menu-hefesto button');
    if (!b) { fechar(); return; }
    if (b.disabled) return;
    if (b.dataset.menu === 'copiar') document.execCommand('copy');
    /* Desligar pede dois cliques, como o «Parar» da aba Sistema: o primeiro troca a palavra, o segundo age. */
    if (b.dataset.menu === 'desligar') {
      if (b.textContent.trim() !== 'Confirma?') { setTimeout(() => { b.textContent = 'Confirma?'; }, 0); return; }
    }
    setTimeout(fechar, 0);
  });
})();
/* O alcance pelo teclado e pelo controle (A-INTERFACE-INTEIRA-SE-ALCANCA-PELO-CONTROLE-E-PELO-TECLADO-01).
   Dois contratos, para toda página e para as telas que vierem depois:
   1. o que o mouse aciona (`data-gesto`, `data-hef-gesto`) tem parada no Tab e responde a Enter e Espaço;
   2. a tela que abre por cima (`.tela-nova`, por `:target`) é um diálogo: o foco entra nela, o Tab fica
      nela, Esc a fecha e o foco volta a quem a abriu. */
(() => {
  const NATIVO = 'a[href],button,input:not([type=hidden]),select,textarea,summary,[contenteditable=""],[contenteditable="true"]';
  const GESTO = '[data-gesto],[data-hef-gesto]';
  const SEM_PARADA = 'option,optgroup,html,body';
  const aparece = el => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const jaTemParada = el => el.hasAttribute('tabindex') || el.matches(NATIVO)
    || Array.from(el.querySelectorAll(NATIVO)).some(d => !d.disabled && aparece(d));
  /* A dica de um título, de um rótulo ou de uma frase também tem parada: `[data-dica]` que não é
     focável por natureza ganha o `tabindex`, e o `focusin` que a dica já escuta a abre. O papel
     fica como está (um `h4` continua título). Quem tem um campo ou botão dentro não ganha parada
     própria: o foco dele já abre a dica do que o contém. */
  const PEDE_PARADA = GESTO + ',[data-dica]';
  const marcar = raiz => {
    const todos = raiz.matches && raiz.matches(PEDE_PARADA) ? [raiz] : [];
    raiz.querySelectorAll && todos.push(...raiz.querySelectorAll(PEDE_PARADA));
    for (const el of todos) if (!el.matches(SEM_PARADA) && !jaTemParada(el)) el.setAttribute('tabindex', '0');
  };
  marcar(document.body);
  new MutationObserver(ms => {
    for (const m of ms) {
      if (m.type === 'attributes') marcar(m.target);
      else for (const n of m.addedNodes) if (n.nodeType === 1) marcar(n);
    }
  }).observe(document.body, {subtree: true, childList: true, attributes: true, attributeFilter: ['data-dica']});
  /* Enter e Espaço fazem o que o clique faz, em quem não é botão por natureza. */
  document.addEventListener('keydown', e => {
    if ((e.key !== 'Enter' && e.key !== ' ') || e.defaultPrevented || e.repeat) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const el = e.target;
    if (!el || !el.matches || !el.matches(GESTO) || el.matches(NATIVO)) return;
    e.preventDefault();
    el.click();
  });
  /* A tela por cima. A caixa dela é o diálogo; o nome vem do título quando a página não deu um. */
  const caixaDe = tela => tela.querySelector('.tn-cx') || tela.firstElementChild;
  const prepararTelas = () => document.querySelectorAll('.tela-nova').forEach(tela => {
    const caixa = caixaDe(tela);
    if (!caixa) return;
    if (!caixa.hasAttribute('role')) caixa.setAttribute('role', 'dialog');
    if (!caixa.hasAttribute('aria-modal')) caixa.setAttribute('aria-modal', 'true');
    const tit = tela.querySelector('.tn-tit');
    if (tit && !caixa.hasAttribute('aria-label') && !caixa.hasAttribute('aria-labelledby'))
      caixa.setAttribute('aria-label', tit.textContent.replace(/\s+/g, ' ').trim());
  });
  prepararTelas();
  const PARADAS = 'a[href],button:not([disabled]),input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  const paradasDe = caixa => Array.from(caixa.querySelectorAll(PARADAS)).filter(aparece);
  const aberta = () => document.querySelector('.tela-nova:target');
  let quemAbriu = null, ultimo = null, estavaAberta = false;
  document.addEventListener('focusin', e => { if (!e.target.closest || !e.target.closest('.tela-nova')) ultimo = e.target; });
  /* O X do controle clica sem dar foco: o link do clique é quem abriu, e o O devolve o foco a ele. */
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (a && !a.closest('.tela-nova')) ultimo = a;
  }, true);
  const aoMudar = () => {
    const tela = aberta();
    if (tela && !estavaAberta) {
      quemAbriu = ultimo;
      const caixa = caixaDe(tela);
      const alvo = caixa && (caixa.querySelector('[autofocus]') || paradasDe(caixa)[0]);
      if (alvo) alvo.focus();
      else if (caixa) { caixa.setAttribute('tabindex', '-1'); caixa.focus(); }
    } else if (!tela && estavaAberta && quemAbriu && quemAbriu.isConnected) {
      quemAbriu.focus(); quemAbriu = null;
    }
    estavaAberta = !!tela;
  };
  /* A âncora do endereço só vira `:target` com a página já lida: o foco entra na volta também. */
  addEventListener('hashchange', aoMudar);
  addEventListener('DOMContentLoaded', aoMudar);
  addEventListener('load', aoMudar);
  aoMudar();
  document.addEventListener('keydown', e => {
    const tela = aberta();
    if (!tela || e.defaultPrevented) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      const x = tela.querySelector('a.tn-x,.fechar,[data-fechar]');
      if (x) x.click(); else location.hash = '';
    } else if (e.key === 'Tab') {
      const caixa = caixaDe(tela), lista = caixa ? paradasDe(caixa) : [];
      if (!lista.length) { e.preventDefault(); return; }
      const dentro = caixa.contains(document.activeElement);
      const fim = e.shiftKey ? lista[0] : lista[lista.length - 1];
      if (!dentro || document.activeElement === fim) { e.preventDefault(); (e.shiftKey ? lista[lista.length - 1] : lista[0]).focus(); }
    }
  });
})();
</script>
