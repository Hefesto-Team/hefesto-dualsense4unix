<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hefesto — o mapa das entradas</title>
<style>
  :root {
    /* Paleta Drácula — os tokens de scripts/paleta_da_casa.py, byte a byte.
       O mockup tem de parecer parte do Hefesto, não um site sobre ele. */
    --color-paper:      #282a36;
    --color-paper-2:    #21222c;
    --color-paper-3:    #343746;
    --color-rule:       #44475a;
    --color-ink:        #f8f8f2;
    --color-ink-quiet:  #a8b0c8;
    --color-ink-faint:  #6272a4;
    --color-accent:     #bd93f9;
    --color-ok:         #50fa7b;
    --color-lacuna:     #ffb86c;
    --color-alerta:     #ff5555;
    --color-frio:       #8be9fd;

    /* Pilha do sistema, como manda a casa: nada de fonte web, abre sem rede. */
    --font-corpo: ui-sans-serif, system-ui, "Cantarell", "Fira Sans", "Segoe UI", Roboto, sans-serif;
    --font-dado:  ui-monospace, "JetBrains Mono", "Fira Mono", "DejaVu Sans Mono", monospace;

    --space-3xs: .25rem; --space-2xs: .5rem;  --space-xs: .75rem;
    --space-sm:  1rem;   --space-md:  1.5rem; --space-lg: 2.5rem;

    --text-xs: .75rem;  --text-sm: .8125rem; --text-base: .9375rem;
    --text-lg: 1.125rem; --text-xl: 1.5rem;

    --radius-sm: 3px; --radius-md: 6px;
    --ease-out: cubic-bezier(.22,.61,.36,1);
    --dur-fast: 120ms;

    --usb3: #2c5f9e;
    --usb2: #5b6072;
  }

  * { box-sizing: border-box; }
  /* A CAIXA DA JANELA — 24/09/2026, decisão de produto: «vira caixa da janela,
     rolando por dentro». O recuo e o tamanho são os das abas (as três
     linhas no fim deste bloco); o cabeçalho fica e o `.corpo` rola. */
  body {
    margin: 0; background: #11121a; color: var(--color-ink);
    font-family: var(--font-corpo); font-size: var(--text-base); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
  }
  .pagina { background: var(--color-paper); border: 1px solid var(--color-paper-3);
            border-radius: 11px; overflow: hidden; display: flex; flex-direction: column;
            padding: var(--space-md) var(--space-sm) 0; }
  .pagina > .topo { flex: 0 0 auto; }
  .pagina > .corpo { flex: 1; min-height: 0; overflow-y: auto;
                     margin: 0 calc(-1 * var(--space-sm));
                     padding: 0 var(--space-sm) var(--space-lg); }
  :root{--recuo-do-corpo:16px;--piso-da-vista:777px;--teto-da-vista:855px;--alt-janela:clamp(var(--piso-da-vista), calc(100dvh - var(--recuo-do-corpo) * 2), var(--teto-da-vista))}
  body{padding:var(--recuo-do-corpo)}
  .pagina{width:min(100%,1600px);height:var(--alt-janela);max-width:100%;max-height:calc(100dvh - var(--recuo-do-corpo) * 2)}

  /* ─── cabeçalho ─────────────────────────────────────────── */
  .topo { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2xs) var(--space-sm);
          padding-bottom: var(--space-xs); border-bottom: 1px solid var(--color-rule); }
  .topo h1 { margin: 0; font-size: var(--text-xl); font-weight: 600; letter-spacing: -.01em; }
  .topo h1 em { color: var(--color-accent); font-style: normal; }
  .topo .nota { color: var(--color-ink-faint); font-size: var(--text-sm); margin-left: auto; }
  /* A DATA NÃO PODE SER `.nota` — 11/09/2026. A folha do produto apaga toda
     `.nota` (bilhete de projeto), e aqui isso deixava a página afirmando
     «o arranjo de agora» sobre uma leitura congelada. A data é DADO da
     página, então tem classe própria, que a folha do produto não esconde. */
  .topo .quando { color: var(--color-ink-faint); font-size: var(--text-sm); margin-left: auto;
                  font-family: var(--font-dado); }

  /* ─── os três modos ─────────────────────────────────────── */
  .modos { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-md); }
  .modo {
    font: inherit; font-size: var(--text-sm); font-weight: 600;
    background: var(--color-paper-3); color: var(--color-ink);
    border: 1px solid var(--color-rule); border-radius: var(--radius-sm);
    padding: .45rem .85rem; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .modo:hover { background: var(--color-rule); }
  .modo:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .modo[aria-pressed="true"] { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 22%, var(--color-paper-3)); }
  .modo.destaque[aria-pressed="false"] { border-color: color-mix(in srgb, var(--color-ok) 55%, transparent); color: var(--color-ok); }
  .modo.destaque[aria-pressed="true"] { border-color: var(--color-ok); background: color-mix(in srgb, var(--color-ok) 20%, var(--color-paper-3)); color: var(--color-ink); }

  /* ─── o painel que muda com o modo ──────────────────────── */
  .painel { margin-top: var(--space-2xs); border: 1px solid var(--color-rule);
            border-radius: var(--radius-md); background: var(--color-paper-2); padding: var(--space-sm); }
  .painel > p.chamada { margin: 0 0 var(--space-2xs); font-size: var(--text-base); font-weight: 600; }
  .painel > p.chamada .grande { color: var(--color-ok); }
  .escolhas { display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
  .escolha { font: inherit; font-size: var(--text-sm); display: inline-flex; align-items: center; gap: .4rem;
             background: var(--color-paper-3); color: var(--color-ink); border: 1px solid var(--color-rule);
             border-radius: var(--radius-sm); padding: .35rem .7rem; cursor: pointer; }
  .escolha:hover { background: var(--color-rule); }
  .escolha:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .escolha[aria-pressed="true"] { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 20%, var(--color-paper-3)); }
  .escolha i { width: .55rem; height: .55rem; border-radius: 50%; flex: none; }

  .licao { margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: 1px solid var(--color-rule);
           display: grid; grid-template-columns: minmax(0,1fr) minmax(0,15rem); gap: var(--space-sm); align-items: start; }
  @media (max-width: 760px) { .licao { grid-template-columns: 1fr; } }
  .licao .texto { margin: 0; font-size: var(--text-sm); color: var(--color-ink-quiet); max-width: 62ch; }
  .licao .texto b { color: var(--color-ink); font-weight: 600; }
  .conta-caixa { border: 1px solid var(--color-rule); border-radius: var(--radius-sm); background: var(--color-paper);
                 padding: var(--space-2xs) var(--space-xs); font-size: var(--text-xs); }
  .conta-caixa b { display: block; color: var(--color-ink); margin-bottom: .2rem; }
  .conta-caixa div { font-family: var(--font-dado); color: var(--color-ink-quiet); font-variant-numeric: tabular-nums; }

  /* ─── a receita: os movimentos ──────────────────────────── */
  .receita { list-style: none; margin: 0; padding: 0; counter-reset: passo;
             display: flex; flex-direction: column; gap: var(--space-2xs); }
  .receita > li { counter-increment: passo; display: grid; grid-template-columns: 1.7rem minmax(0,1fr); gap: var(--space-2xs);
                  border: 1px solid var(--color-rule); border-left: 3px solid var(--color-ok);
                  border-radius: var(--radius-sm); background: var(--color-paper); padding: var(--space-2xs) var(--space-xs); }
  .receita > li::before { content: counter(passo); font-family: var(--font-dado); font-weight: 600;
                          color: var(--color-ok); font-size: var(--text-sm); line-height: 1.6; }
  .receita h4 { margin: 0 0 .15rem; font-size: var(--text-base); font-weight: 600; }
  .receita ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .18rem; }
  .receita ul li { display: flex; flex-wrap: wrap; gap: .4rem; align-items: baseline; font-size: var(--text-sm); color: var(--color-ink-quiet); }
  .receita ul li b { color: var(--color-ink); font-weight: 600; }
  .nada-a-fazer { border: 1px solid color-mix(in srgb, var(--color-ok) 45%, var(--color-rule));
                  border-left: 3px solid var(--color-ok); border-radius: var(--radius-sm);
                  background: var(--color-paper); padding: var(--space-xs) var(--space-sm); }
  .nada-a-fazer b { color: var(--color-ok); }
  .acoes { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-sm); }
  .btn { font: inherit; font-size: var(--text-sm); background: var(--color-paper-3); color: var(--color-ink);
         border: 1px solid var(--color-rule); border-radius: var(--radius-sm); padding: .35rem .7rem; cursor: pointer; }
  .btn:hover { background: var(--color-rule); }
  .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .btn.forte { border-color: var(--color-ok); color: var(--color-ok); }

  .selo { flex: none; font-family: var(--font-dado); font-size: .625rem; text-transform: uppercase;
          letter-spacing: .06em; padding: .05rem .38rem; border-radius: 2px; border: 1px solid; }
  .selo.medido   { color: var(--color-ok);     border-color: color-mix(in srgb, var(--color-ok) 45%, transparent); }
  .selo.espec    { color: var(--color-frio);   border-color: color-mix(in srgb, var(--color-frio) 45%, transparent); }
  .selo.derivado { color: var(--color-lacuna); border-color: color-mix(in srgb, var(--color-lacuna) 45%, transparent); }

  /* ─── o palco ───────────────────────────────────────────── */
  .palco { display: grid; grid-template-columns: minmax(0,1fr) 268px; gap: var(--space-md); align-items: start; margin-top: var(--space-md); }
  @media (max-width: 900px) { .palco { grid-template-columns: 1fr; } }
  .faces { display: flex; flex-direction: column; gap: var(--space-md); }
  .face-cab { display: flex; align-items: baseline; gap: var(--space-2xs); margin-bottom: var(--space-2xs); }
  .face-cab h3 { margin: 0; font-size: var(--text-sm); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
  .face-cab .quantas { font-size: var(--text-xs); color: var(--color-ink-faint); font-family: var(--font-dado); }
  /* a divergência do hub: uma linha a mais, sem culpa */
  .diverge { margin: 0 0 var(--space-2xs); font-size: var(--text-xs); color: var(--color-lacuna); }
  .edita .lido { font-size: var(--text-xs); color: var(--color-ink-quiet); }
  .edita .origem { font-size: var(--text-xs); color: var(--color-ink-quiet); }

  .chapa { border: 1px solid var(--color-rule); border-radius: var(--radius-md);
           background: linear-gradient(160deg, var(--color-paper-3), var(--color-paper-2)); padding: var(--space-sm); }
  .chapa.grade-tras { display: grid; grid-template-columns: repeat(2, max-content); gap: .55rem var(--space-md); }
  .chapa.coluna { display: flex; flex-direction: column; gap: .55rem; }
  .chapa.fileira { display: grid; grid-template-columns: repeat(3, max-content); gap: .55rem var(--space-md); }
  @media (max-width: 640px) { .chapa.fileira, .chapa.grade-tras { grid-template-columns: max-content; } }

  /* ─── um soquete ────────────────────────────────────────── */
  .soquete { display: flex; align-items: flex-start; gap: .45rem; }
  .num { flex: none; min-width: 1.5rem; height: 1.5rem; padding: 0 .3rem; border-radius: 99px;
         display: inline-grid; place-items: center; font-family: var(--font-dado); font-size: .6875rem;
         font-weight: 600; background: var(--color-paper); color: var(--color-ink-quiet);
         border: 1px solid var(--color-rule); margin-top: .05rem; }
  .plug { position: relative; flex: none; margin-top: .05rem; width: 3.4rem; height: 1.45rem; border-radius: 2px;
          border: 1px solid #0d0e13; cursor: pointer; padding: 0; background: var(--usb2);
          transition: box-shadow var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .plug.v3 { background: var(--usb3); }
  .plug::after { content: ""; position: absolute; left: .28rem; right: .28rem; top: .3rem; height: .34rem;
                 border-radius: 1px; background: rgba(248,248,242,.55); }
  .plug:hover { transform: translateY(-1px); }
  .plug:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }
  .plug[data-v="cheia"]  { box-shadow: 0 0 0 2px var(--color-accent); }
  .plug[data-v="melhor"] { box-shadow: 0 0 0 3px var(--color-ok), 0 0 16px 2px rgba(80,250,123,.4); }
  .plug[data-v="serve"]  { box-shadow: 0 0 0 2px var(--color-ink-faint); }
  .plug[data-v="evite"]  { box-shadow: 0 0 0 2px var(--color-lacuna); }
  .plug[data-v="ruim"]   { box-shadow: 0 0 0 2px var(--color-alerta), 0 0 14px 2px rgba(255,85,85,.32); }
  .plug[data-v="chega"]  { box-shadow: 0 0 0 3px var(--color-ok), 0 0 16px 2px rgba(80,250,123,.4); }
  .plug[data-v="sai"]    { box-shadow: 0 0 0 2px var(--color-alerta); opacity: .55; }
  .plug[data-v="fica"]   { box-shadow: 0 0 0 2px var(--color-ink-faint); }
  .plug[data-problema="1"] { box-shadow: 0 0 0 2px var(--color-alerta), 0 0 14px 2px rgba(255,85,85,.32); }

  .rotulo { min-width: 8.6rem; max-width: 13rem; font-size: var(--text-xs); line-height: 1.35; }
  .rotulo .nome { display: block; font-weight: 600; }
  .rotulo .caminho { display: block; font-family: var(--font-dado); color: var(--color-ink-faint); font-size: .6875rem; }
  .rotulo .vazio { color: var(--color-ink-faint); font-style: italic; }
  /* o nome que ela deu à entrada: uma linha só, com reticências */
  .rotulo .nomeada { display: block; font-weight: 700; white-space: nowrap;
                     overflow: hidden; text-overflow: ellipsis; }
  .rotulo .veredito { display: block; font-weight: 600; }
  .rotulo .veredito.melhor, .rotulo .veredito.chega { color: var(--color-ok); }
  .rotulo .veredito.serve, .rotulo .veredito.fica { color: var(--color-ink-quiet); }
  .rotulo .veredito.evite { color: var(--color-lacuna); }
  .rotulo .veredito.ruim, .rotulo .veredito.sai { color: var(--color-alerta); }
  .rotulo .veredito.cheia { color: var(--color-ink-faint); }
  .rotulo .porque { display: block; color: var(--color-ink-quiet); }

  .por-confirmar {
    margin-top: var(--space-2xs); padding: var(--space-2xs) var(--space-xs);
    border: 1px dashed var(--color-lacuna); border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--color-lacuna) 8%, var(--color-paper-2));
  }
  .por-confirmar > b { display: block; font-size: var(--text-sm); color: var(--color-lacuna); margin-bottom: .3rem; }
  .pend-lista { display: flex; flex-wrap: wrap; gap: .3rem; }
  .pend-lista .chip.pend { width: auto; min-width: 11rem; }
  .por-confirmar .pend-ajuda { display: block; margin-top: .35rem; font-size: var(--text-xs); color: var(--color-ink-faint); }
  .plug[data-v="fora"] { opacity: .35; box-shadow: none; cursor: not-allowed; }
  .rotulo .veredito.fora { color: var(--color-ink-faint); }

  .filho { margin-left: 2rem; padding-left: var(--space-sm); border-left: 2px dashed var(--color-rule); margin-top: .3rem; }
  .filho .cabo { font-size: var(--text-xs); color: var(--color-ink-faint); margin-bottom: .2rem; }

  /* ─── bandeja ───────────────────────────────────────────── */
  .bandeja { border: 1px solid var(--color-rule); border-radius: var(--radius-md); background: var(--color-paper-2); padding: var(--space-xs); }
  .bandeja h3 { margin: 0 0 var(--space-3xs); font-size: var(--text-sm); font-weight: 600; }
  .bandeja p.ajuda { margin: 0 0 var(--space-2xs); font-size: var(--text-xs); color: var(--color-ink-faint); }
  .lista { display: flex; flex-direction: column; gap: .3rem; }
  .chip { display: flex; align-items: center; gap: .5rem; width: 100%; font: inherit; font-size: var(--text-xs);
          text-align: left; background: var(--color-paper-3); color: var(--color-ink);
          border: 1px solid var(--color-rule); border-radius: var(--radius-sm); padding: .35rem .5rem; cursor: pointer; }
  .chip:hover { border-color: var(--color-ink-faint); }
  .chip:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .chip[data-alocado="1"] { opacity: .45; }
  .chip[data-segurando="1"] { border-color: var(--color-ok); background: color-mix(in srgb, var(--color-ok) 16%, var(--color-paper-3)); opacity: 1; }
  .chip .marca { flex: none; width: .5rem; height: .5rem; border-radius: 50%; }
  .chip .txt { flex: 1; min-width: 0; }
  .chip .txt b { display: block; font-weight: 600; }
  .chip .txt span { display: block; font-family: var(--font-dado); color: var(--color-ink-faint); font-size: .6875rem; }

  .legenda { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-xs);
             font-size: var(--text-xs); color: var(--color-ink-faint); }
  .legenda span { display: inline-flex; align-items: center; gap: .35rem; }
  .amostra { width: 1.4rem; height: .65rem; border-radius: 2px; border: 1px solid #0d0e13; flex: none; }
  .amostra.v3 { background: var(--usb3); } .amostra.v2 { background: var(--usb2); }
  .amostra.r-ok { background: transparent; border: 2px solid var(--color-ok); }
  .amostra.r-ev { background: transparent; border: 2px solid var(--color-lacuna); }
  .amostra.r-ru { background: transparent; border: 2px solid var(--color-alerta); }

  /* ─── desempenho ────────────────────────────────────────── */
  .secao { margin-top: var(--space-lg); }
  .secao > h2 { margin: 0 0 var(--space-2xs); font-size: var(--text-base); font-weight: 600; color: var(--color-accent); }
  .secao > .sub { margin: 0 0 var(--space-sm); font-size: var(--text-sm); color: var(--color-ink-faint); max-width: 70ch; }
  .moldura { border: 1px solid var(--color-rule); border-radius: var(--radius-md); background: var(--color-paper-2); padding: var(--space-sm); }
  .adaptadores { display: flex; flex-direction: column; gap: var(--space-2xs); }
  .adap { display: grid; grid-template-columns: 13rem minmax(0,1fr) 10rem; gap: var(--space-2xs) var(--space-sm); align-items: center; font-size: var(--text-sm); }
  @media (max-width: 720px) { .adap { grid-template-columns: 1fr; } }
  .adap .quem b { font-weight: 600; }
  .adap .quem span { display: block; font-family: var(--font-dado); font-size: var(--text-xs); color: var(--color-ink-faint); }
  .barra { height: .55rem; border-radius: 99px; background: var(--color-paper-3); border: 1px solid var(--color-rule); overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--color-accent); }
  .barra i.folgada  { background: var(--color-ok); }
  .barra i.apertada { background: var(--color-lacuna); }
  .barra i.cheia    { background: var(--color-alerta); }
  .conta { font-family: var(--font-dado); font-size: var(--text-xs); font-variant-numeric: tabular-nums; color: var(--color-ink-quiet); text-align: right; }
  .conta em { font-style: normal; color: var(--color-ok); }
  .conta em.folgada  { color: var(--color-ok); }
  .conta em.apertada { color: var(--color-lacuna); }
  .conta em.cheia    { color: var(--color-alerta); }

  .linha-perfil { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-bottom: .5rem; }
  .linha-mic { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem;
               margin: 0 0 .9rem; padding: var(--space-2xs) var(--space-xs);
               border: 1px solid var(--color-rule); border-left: 3px solid var(--color-frio);
               border-radius: var(--radius-sm); background: var(--color-paper); }
  .linha-mic > b { font-size: var(--text-sm); margin-right: .3rem; }
  .mic-porque { flex: 1 1 22rem; font-size: var(--text-xs); color: var(--color-ink-faint); }
  .mic-porque b { color: var(--color-ink-quiet); }

  .controles-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-bottom: .5rem; }
  .ctl-rot { font-size: var(--text-sm); color: var(--color-ink-quiet); }
  .ctl-nota { margin: 0 0 .9rem; font-size: var(--text-xs); color: var(--color-ink-faint); max-width: 74ch; }
  .ctl-nota b { color: var(--color-ink-quiet); }
  .veredito-mesa { margin-top: .7rem; padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-sm);
                   border: 1px solid var(--color-rule); border-left: 3px solid var(--color-ok);
                   font-size: var(--text-sm); color: var(--color-ink-quiet); }
  .veredito-mesa.ruim { border-left-color: var(--color-alerta); }
  .veredito-mesa.aviso { border-left-color: var(--color-lacuna); margin-top: .5rem; }
  .veredito-mesa b { color: var(--color-ink); }
  .veredito-mesa .selo { display: inline-block; }
  ul.mudar { margin: .4rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .3rem; }
  ul.mudar li { font-size: var(--text-sm); }
  ul.mudar .passo { color: var(--color-ink-faint); font-size: var(--text-xs); }

  .rodape { margin-top: var(--space-lg); padding-top: var(--space-sm); border-top: 1px solid var(--color-rule);
            font-size: var(--text-xs); color: var(--color-ink-faint); max-width: 78ch; }

    ordem.forEach(function (cl) {
      APARELHOS.filter(function (a) { return a.classe === cl && !aparelhoSemLugar(a.id); }).forEach(function (ap) {
        var cands = portas.filter(function (p) { return !ocupada(plano, p); });
        if (!cands.length) return;
        var atual = portaDe(ap.id);
        var melhor = null, melhorNota = null;
        cands.forEach(function (p) {
          var nota = notaDe(ap, p, plano, jaPostos);
          /* bônus de ficar parado: só desempata, nunca troca uma escolha melhor */
          var efetiva = nota.n + (p.n === atual ? bonusParado : 0);
          if (melhor === null || efetiva > melhorNota.efetiva) { melhor = p; melhorNota = { nota: nota, efetiva: efetiva }; }
        });
        if (!melhor) return;
        plano[melhor.n] = ap.id;
        /* Se a porta de hoje foi tomada por outro aparelho no plano, o
           movimento é FORCADO — nao ha "ficar onde esta" para comparar, e
           esconde-lo faria o mapa e a receita discordarem na tela. */
        var tomada = atual && plano[atual] && plano[atual] !== ap.id;
        var notaAtual = (atual && !tomada) ? notaDe(ap, porNum(atual), plano, jaPostos).n : -Infinity;
        var razoes = melhorNota.nota.razoes.slice();
        if (tomada) razoes.unshift({ selo: "derivado",
          txt: "a " + naFraseDe(atual) + " passou a ser do " + (acha(plano[atual]) || {}).tipo + ", então este precisa de outro lugar" });
        motivo[ap.id] = {
          razoes: razoes,
          peso: melhorNota.nota.peso,
          ganho: tomada ? Infinity : (melhorNota.nota.n - notaAtual),
          forcado: !!tomada,
          essencial: !!tomada || (melhorNota.nota.peso === "essencial" && (melhorNota.nota.n - notaAtual) >= 30)
        };
        if (ap.classe === "bt") jaPostos.push(melhor);
      });
    });

    /* Passe final: aparelhos INTERCAMBIÁVEIS (mesma classe e mesmo modelo)
       não têm por que trocar de lugar entre si. Se um deles já está numa
       das portas de destino, ele fica nela — o conjunto de portas é o mesmo,
       e cada troca evitada é um movimento a menos que ela precisa fazer.
       Sem isto o plano mandava mover dois UB500 idênticos entre a 9 e a 15a. */
    var porModelo = {};
    APARELHOS.forEach(function (a) {
      var k = a.classe + "|" + a.nome;
      (porModelo[k] = porModelo[k] || []).push(a);
    });
    Object.keys(porModelo).forEach(function (k) {
      var grupo = porModelo[k];
      if (grupo.length < 2) return;
      var destinos = grupo.map(function (a) { return portaDeEm(plano, a.id); }).filter(Boolean);
      if (destinos.length < 2) return;
      var novo = {}, sobram = destinos.slice(), pendentes = [];
      grupo.forEach(function (a) {
        var hoje = portaDe(a.id), i = sobram.indexOf(hoje);
        if (hoje && i !== -1) { novo[a.id] = hoje; sobram.splice(i, 1); }
        else pendentes.push(a);
      });
      pendentes.forEach(function (a) { novo[a.id] = sobram.shift(); });
      destinos.forEach(function (d) { delete plano[d]; });
      grupo.forEach(function (a) { if (novo[a.id]) plano[novo[a.id]] = a.id; });
      /* o motivo acompanha a porta, não o aparelho: recalcula para quem mudou */
      grupo.forEach(function (a) {
        var p = novo[a.id]; if (!p) return;
        var atual = portaDe(a.id);
        var n = notaDe(a, porNum(p), plano, jaPostos.filter(function (q) { return q.n !== p; }));
        var tomada2 = atual && plano[atual] && plano[atual] !== a.id;
        var na = (atual && !tomada2) ? notaDe(a, porNum(atual), plano, []).n : -Infinity;
        var rz = n.razoes.slice();
        if (tomada2) rz.unshift({ selo: "derivado",
          txt: "a " + naFraseDe(atual) + " passou a ser do " + (acha(plano[atual]) || {}).tipo + ", então este precisa de outro lugar" });
        motivo[a.id] = { razoes: rz, peso: n.peso, ganho: tomada2 ? Infinity : (n.n - na), forcado: !!tomada2,
                         essencial: !!tomada2 || (n.peso === "essencial" && (n.n - na) >= 30) };
      });
    });

    oMapaSoMoveOQueAReceitaManda(plano, motivo, jaPostos, proibida);
    return { plano: plano, motivo: motivo };
  }

  /* A ÚNICA regra de "isto vira ordem de serviço", e ela tem UM DONO. Ela
     morava dentro de receita(), e o mapa — que sai de planejar() — não a
     consultava: nas variantes que PROÍBEM a entrada de hoje o desenho mostrava
     o aparelho no lugar novo e a receita não mandava mexer, e quem olhava a
     tela via o aparelho noutro lugar SEM instrução nenhuma. Agora as duas
     beiras perguntam a mesma coisa aqui. D-MAPA-SEM-RECEITA, 25/08/2026.      */
  function receitaManda(de, para, m) {
    if (!para || de === para) return false;
    /* quem ainda não tem lugar no mapa entra sempre: não há "ficar onde está"
       para comparar. Quem já tem lugar só entra se o movimento MELHORA. */
    return !de || (!!m && m.ganho > 0);
  }

  /* A frase que a receita diz quando a variante tirou do tabuleiro a entrada em
     que o aparelho está hoje — o único caso em que ele sai de um lugar bom sem
     ganho nenhum, e sem esta linha a ordem de serviço não teria porquê. */
  var PORQUE_A_VARIANTE_TIROU = "esta opção não usa a entrada {de}, onde ele está hoje";

  /* D-MAPA-SEM-RECEITA: se não há ordem, o mapa não move nada. Roda DEPOIS do
     passe dos intercambiáveis, que ainda troca destinos entre irmãos.
     Duas entradas de hoje NÃO aceitam o aparelho de volta, e nas duas o
     movimento vira ORDEM em vez de sumir do mapa: a que a variante proibiu
     (devolvê-lo desenharia um dongle no extensor numa opção chamada "sem o
     extensor") e a que outro aparelho tomou.                               */
  function oMapaSoMoveOQueAReceitaManda(plano, motivo, jaPostos, proibida) {
    APARELHOS.forEach(function (a) {
      var de = portaDe(a.id), para = portaDeEm(plano, a.id);
      if (!de || !para || de === para) return;
      if (receitaManda(de, para, motivo[a.id])) return;
      var pd = porNum(de);
      if (!pd) return;                 /* entrada declarada que não existe em face nenhuma */

      delete plano[para];
      var tirada = !!proibida(pd);
      var volta = !tirada && !ocupada(plano, pd);
      var destino = volta ? de : para;
      var porta = volta ? pd : porNum(para);
      plano[destino] = a.id;
      if (!porta) return;
      var n = notaDe(a, porta, plano, jaPostos.filter(function (q) { return q.n !== destino; }));
      var tomada = de && plano[de] && plano[de] !== a.id;
      var na = tomada ? -Infinity : notaDe(a, pd, plano, []).n;
      var rz = n.razoes.slice();
      if (tomada) rz.unshift({ selo: "derivado",
        txt: "a " + naFraseDe(de) + " passou a ser do " + (acha(plano[de]) || {}).tipo + ", então este precisa de outro lugar" });
      else if (!volta) rz.unshift({ selo: "derivado", txt: PORQUE_A_VARIANTE_TIROU.replace("{de}", de) });
      motivo[a.id] = { razoes: rz, peso: n.peso,
        ganho: (tomada || !volta) ? Infinity : (n.n - na),
        forcado: !!tomada || !volta,
        essencial: !!tomada || !volta || (n.peso === "essencial" && (n.n - na) >= 30) };
    });
  }

  /* ══ 4. A RECEITA: a diferença entre o que está e o que devia ════════
     Só entra aqui o que MELHORA. Aparelho que já está numa porta tão boa
     quanto a melhor candidata fica onde está, e não vira movimento — e o mapa
     pergunta à MESMA função, para os dois nunca discordarem na tela.       */
  function receita(op) {
    var r = planejar(op), movs = [];
    APARELHOS.forEach(function (a) {
      var de = portaDe(a.id), para = portaDeEm(r.plano, a.id);
      var m = r.motivo[a.id] || { razoes: [], essencial: false, ganho: 0 };
      if (!receitaManda(de, para, m)) return;

      var linhas = [];
      if (de) {
        var pd = porNum(de);
        if (pd && pd.onde === "hub" && a.classe === "wifi")
          linhas.push({ s: "medido", t: "Hoje ele está no hub, e os dois chips do hub enumeram a <b>5000M</b> (<code>4-1</code>, <code>4-1.1</code>): o enlace SuperSpeed fica treinado, e é o <b>tráfego</b> dele que irradia." });
        else if (pd && pd.onde === "hub" && a.classe === "teclado")
          linhas.push({ s: "medido", t: "Hoje ele está pendurado no hub (<code>" + caminhoDe(a.id) + "</code>)." });
        else
          linhas.push({ s: "medido", t: "Hoje ele está na entrada <b>" + de + "</b> (<code>" + caminhoDe(a.id) + "</code>)." });
      } else {
        linhas.push({ s: "medido", t: "Ele apareceu no sistema e ainda não tem lugar no mapa." });
      }
      m.razoes.slice(0, 3).forEach(function (z) {
        linhas.push({ s: z.selo, t: z.txt.charAt(0).toUpperCase() + z.txt.slice(1) + "." });
      });
      movs.push({
        essencial: !!m.essencial, ganho: m.ganho,
        titulo: emAtributo(rotuloDoAparelho(a)) + " → " + emAtributo(rotuloDe(para)),
        linhas: linhas
      });
    });
    /* os essenciais primeiro, e dentro deles o de maior ganho */
    movs.sort(function (x, y) {
      if (x.essencial !== y.essencial) return x.essencial ? -1 : 1;
      if (x.ganho === y.ganho) return 0;
      return y.ganho > x.ganho ? 1 : -1;
    });
    if (movs.length) {
      movs.push({
        titulo: "O que muda quando você terminar", semNumero: true,
        linhas: [
          { s: "derivado", t: "Os dongles ficam no alto e separados, com o Wi-Fi fora do hub deles." },
          { s: "derivado", t: "<b>Quanto isso melhora o seu Bluetooth não foi medido nesta máquina.</b> O ensaio que responde conta os quadros que chegam e confere se vieram inteiros — antes e depois da mudança." }
        ]
      });
    }
    return movs;
  }
  function rot(a) {
    if (a.classe === "bt") return { g: "o", n: "dongle Bluetooth" };
    if (a.classe === "hub") return { g: "o", n: "cabo do hub" };
    if (a.classe === "webcam") return { g: "a", n: "webcam" };
    return { g: "o", n: a.tipo.toLowerCase() };
  }

  /* ══ 5. O julgamento por porta, no modo "estou segurando" ════════════ */
  function superspeedNoHub() {
    var p = portaDe("wifi"); var pp = p && porNum(p);
    return !!(pp && pp.onde === "hub");
  }
  function frase1(t) { t = String(t || ""); return t.charAt(0).toUpperCase() + t.slice(1); }
  function julgar(porta) {
    var oc = alocacao[porta.n];
    if (oc) { var a = acha(oc); return { v: "cheia", txt: "Ocupada", porque: a.tipo + " — clique para tirar" }; }
    if (ocupada(alocacao, porta)) return { v: "cheia", txt: "Ocupada", porque: porta.filho ? "Com o extensor" : "A entrada-mãe está em uso" };
    if (segurando) {
      var reg = regiaoDoCaminho(leitura()[segurando]);
      var mesmaRegiao = reg === null || (reg === "hub" ? porta.onde === "hub" : porta.onde === "pc");
      if (!mesmaRegiao) return { v: "fora", txt: "Outra região",
        porque: reg === "hub" ? "este está no hub" : "este está direto no PC" };
    }
    if (!naMao) return null;

    var noHub = porta.onde === "hub";
    var vz = porta.par ? acha(alocacao[porta.par]) : null;
    var vzRadio = vz && ehRadio(vz.classe);

    if (naMao === "bt") {
      if (noHub && superspeedNoHub()) return { v: "ruim", txt: "Evite", porque: "o Wi-Fi usa o SuperSpeed deste mesmo hub, e esse tráfego vira ruído em 2,4 GHz" };
      if (vzRadio) return { v: "evite", txt: "Vale evitar", porque: "colada no " + vz.tipo + ", na " + naFraseDe(porta.par) };
      if (porta.esticada) return { v: "melhor", txt: "Melhor lugar", porque: "na ponta do extensor: a antena mais longe das outras" };
      if (noHub) return { v: "melhor", txt: "Melhor lugar", porque: "no alto do rack, com a antena acima das cabeças" };
      return { v: "serve", txt: "Serve", porque: "entrada direta, mas na altura da escrivaninha" };
    }
    if (naMao === "wifi") {
      if (noHub) return { v: "ruim", txt: "Evite", porque: "aqui o tráfego dele em 5 Gbps fica ao lado dos dongles do controle" };
      if (porta.usb !== 3) return { v: "evite", txt: "Vale evitar", porque: "entrada preta — o Wi-Fi perde velocidade" };
      if (vzRadio) return { v: "evite", txt: "Vale evitar", porque: "colada no " + vz.tipo + ", na " + naFraseDe(porta.par) };
      return { v: "melhor", txt: "Melhor lugar", porque: "azul, direta do PC e longe das antenas de rádio" };
    }
    if (naMao === "teclado") {
      if (noHub) return { v: "ruim", txt: "Evite", porque: "no hub você pode ficar sem teclado na BIOS" };
      if (vzRadio) return { v: "evite", txt: "Vale evitar", porque: "colada no " + vz.tipo + ", na " + naFraseDe(porta.par) };
      return { v: "melhor", txt: "Melhor lugar", porque: "direta do PC — funciona na BIOS e na recuperação" };
    }
    if (naMao === "mouse") {
      if (vzRadio) return { v: "evite", txt: "Vale evitar", porque: "colada no " + vz.tipo + ", na " + naFraseDe(porta.par) };
      if (noHub && superspeedNoHub()) return { v: "evite", txt: "Vale evitar", porque: "hub com o tráfego do Wi-Fi ao lado" };
      if (porta.usb === 3) return { v: "serve", txt: "Serve", porque: "gasta uma entrada azul que ele não usa" };
      return { v: "melhor", txt: "Melhor lugar", porque: "entrada preta, longe de outro rádio" };
    }
    if (naMao === "webcam") {
      if (porta.usb === 3) return { v: "serve", txt: "Serve", porque: "gasta uma entrada azul que ela não precisa" };
      return { v: "melhor", txt: "Melhor lugar", porque: "entrada preta, que é o que ela pede" };
    }
    return null;
  }

  /* ══ 4.1 AS VARIANTES ════════════════════════════════════════════════
     Um arranjo só não serve: o melhor no papel pode ser impossível na mesa
     — o cabo não alcança, o hub está longe, a entrada de trás é inacessível.
     Cada variante é a MESMA regra com uma restrição declarada, e a tela diz
     o que se perde em cada uma.                                            */
  var VARIANTES = [
    { id: "melhor", rotulo: "Ideal", op: {},
      desc: "Sem restrição: o arranjo que a regra escolhe quando tudo é possível." },
    { id: "poucos", rotulo: "Menos trocas", op: { bonusParado: 45 },
      desc: "Aceita um lugar pior para você mexer em menos coisas. Bom quando desmontar o arranjo custa caro." },
    { id: "sem-ext", rotulo: "Sem extensor", op: { proibir: function (p) { return !!p.esticada; } },
      desc: "Para quando o cabo de extensão não alcança onde você queria, ou você não quer usá-lo." },
    { id: "so-pc", rotulo: "Sem hub", op: { proibir: function (p) { return p.onde === "hub"; } },
      desc: "Só as entradas do gabinete. É o caso de quem não tem hub — e de notebook." }
  ];
  var variante = "melhor";
  function opDaVariante() {
    for (var i = 0; i < VARIANTES.length; i++) if (VARIANTES[i].id === variante) return VARIANTES[i].op;
    return {};
  }
  /* O QUE SE PERDE, em palavra. "437 pontos pior" não diz nada a ninguém;
     a pessoa precisa saber O QUÊ fica pior, para decidir se aceita.        */
  function consequencias(op) {
    var pl = planejar(op).plano, out = [];
    var bts = APARELHOS.filter(function (a) { return a.classe === "bt"; })
      .map(function (a) { return porNum(portaDeEm(pl, a.id)); }).filter(Boolean);
    var noAlto = bts.filter(function (p) { return p.onde === "hub"; }).length;
    if (bts.length && noAlto === 0) out.push("os dongles ficam na altura da escrivaninha, não no alto do rack");
    else if (noAlto < bts.length) out.push((bts.length - noAlto) + " dongle(s) fora do alto");
    if (!bts.some(function (p) { return p.esticada; })) out.push("o extensor não é usado");
    var poss = bts.map(function (p) { return p.pos; }).filter(function (x) { return x !== undefined; }).sort(function (a, b) { return a - b; });
    var minVao = poss.length > 1 ? Math.min.apply(null, poss.slice(1).map(function (v, i) { return v - poss[i]; })) : null;
    if (minVao !== null && minVao <= 1) out.push("dois dongles ficam em entradas coladas");
    var colados = 0;
    APARELHOS.forEach(function (a) {
      if (!ehRadio(a.classe)) return;
      var p = porNum(portaDeEm(pl, a.id)); if (!p || !p.par) return;
      var viz = pl[p.par]; if (viz && ehRadio(classeDe(viz))) colados++;
    });
    if (colados) out.push(Math.ceil(colados / 2) + " par(es) de rádio ficam colados");
    return out;
  }

  /* a nota total de um plano: só para ordenar as variantes entre si */
  function qualidade(op) {
    var r = planejar(op), t = 0, ja = [];
    APARELHOS.forEach(function (a) {
      var p = portaDeEm(r.plano, a.id); if (!p) { t -= 60; return; }
      var pt = porNum(p); if (!pt) return;
      t += notaDe(a, pt, r.plano, ja).n;
      if (a.classe === "bt") ja.push(pt);
    });
    return t;
  }

  /* ══ 4.2 A RE-IDENTIFICAÇÃO ══════════════════════════════════════════
     Ela mexeu nos cabos. O caminho de barramento de quem mudou é outro; o
     serial não. Comparando as duas leituras, o produto diz o que saiu de
     onde — e, quando a entrada nova está declarada no mapa, ele diz para
     onde, sem ela escrever nada.                                          */
  /* a linha de "de onde eu sei" de cada aparelho que mudou de lugar */
  function linhaDoAchado(m, reconhecido) {
    var abre = '<li><span class="selo derivado">derivado</span><span>';
    if (reconhecido) {
      return abre + "A entrada já está marcada no mapa.</span></li>";
    }
    var reg = regiaoDoCaminho(m.agora);
    var onde = (reg === "hub")
      ? "pende do hub, então ele <b>está no hub</b>"
      : "não pende do hub, então ele <b>está direto no gabinete</b>";
    return abre + "O caminho <code>" + m.agora + "</code> " + onde
         + ". Falta marcar a entrada: clique nele e depois na entrada certa.</span></li>";
  }

  function reexame(de, para) {
    var a = LEITURAS[de].caminho, b = LEITURAS[para].caminho;
    var porCaminho = {};
    Object.keys(MAPA).forEach(function (n) { porCaminho[MAPA[n]] = n; });
    var mudou = [];
    APARELHOS.forEach(function (ap) {
      if (a[ap.id] === b[ap.id]) return;
      mudou.push({
        ap: ap, antes: a[ap.id], agora: b[ap.id],
        entradaAntes: porCaminho[a[ap.id]] || null,
        entradaAgora: porCaminho[b[ap.id]] || null
      });
    });
    return mudou;
  }

  /* ══ 4.3 OS CONTROLES: onde cada um deve ficar para render 100% ══════
     O bond do Bluetooth fica PRESO ao adaptador em que nasceu — o BlueZ não
     reequilibra sozinho, e plugar outro dongle não move ninguém. Então quem
     está em qual adaptador é escolha, e é escolha que decide se a mesa cheia
     funciona. O produto sabe onde cada controle está: o `HID_PHYS` do uevent
     do nó hidraw publica o MAC do adaptador, e abre como uid 1000, sem sudo.

     A CONTA, medida (`integrations/dualsense_bt_audio.py:76-78`, A/B de 25/07/2026):
       sem microfone .. 260,4 relatórios por segundo
       com microfone .. 276,7  (o áudio NÃO abre canal novo: divide a fila)
     Gatilho, vibração, barra de luz, giroscópio e touch andam no MESMO canal
     HID — eles não somam pacote. **Só o microfone muda a conta.**            */
  /* O NÚMERO TEM UM DONO SÓ, e aí é `integrations/radio_da_mesa.py`, que tem
     portão contra `docs/data/mapa-controles.csv`. Estas três linhas guardavam
     260 / 277 / 1600 — a MESMA medição, arredondada. Agora são os números
     exatos, iguais aos do Python byte a byte: 170,5 de entrada + 106,2 de áudio
     = 276,7 com microfone. D-OS-NUMEROS-DO-RADIO-TEM-UM-DONO-SO, 25/08/2026. */
  var CUSTO_SEM_MIC = 260.4, CUSTO_COM_MIC = 276.7, SLOTS = 1600;

  /* fatia de segundo com vírgula, do jeito daqui: 830.0999999999999 não é número
     que se mostre a ninguém. SÓ para a tela — a conta nunca arredonda. */
  function fatias(v) { return (Math.round(v * 10) / 10).toString().replace(".", ","); }

  /* AS TRÊS FAIXAS, e elas são a régua que a casa já escreveu
     (DESEMPENHO-A-CONTA-DE-SLOTS-01:147). A primeira versão desta tela conhecia
     só DOIS estados — "folgada" para tudo abaixo de 1600 e "não cabe" acima — e
     por isso dizia "Cabe, com folga" na configuração exata do público deste
     produto: quatro controles num adaptador só, 1106,8 de 1600, que é 69,2%. A
     régua da casa chama isso de APERTADA. Falso verde no caso que mais importa. */
  function faixa(usado) {
    var f = usado / SLOTS;
    if (f <= 0.60) return { nome: "Folgada",  classe: "folgada" };
    if (f <= 0.85) return { nome: "Apertada", classe: "apertada" };
    return { nome: "Cheia", classe: "cheia" };
  }

  /* ══ O PERFIL DE DESEMPENHO ══════════════════════════════════════════
     Substitui os CINCO degraus do "Orçamento" de hoje, dos quais QUATRO não
     fazem nada — medido em `core/rumble.py`: `_ORCAMENTO_COM_TETO` só casa
     com "economia"; `balanceado`, `max`, `auto` e o não-declarado devolvem
     `None`. E o teto alcança a vibração e mais nada, coisa que a própria
     tela já confessa.

  var PERFIS = [

  var quantos = CONTROLES.length;

  function custo(c) { return c.mic ? CUSTO_COM_MIC : CUSTO_SEM_MIC; }

    return APARELHOS.filter(function (a) { return a.classe === "bt"; })
      .map(function (a) {

  /* O ARRANJO DOS CONTROLES.
     Regra que salva a credibilidade do conselho, a mesma do mapa: **ninguém
     troca de adaptador à toa.** Trocar custa caro de verdade aqui — desfazer
     o pareamento, apagar o cache SDP e parear de novo, com o controle na mão.
     Então parte-se de onde cada um JÁ está, e só se move alguém quando isso
     BAIXA a carga do adaptador mais cheio. Sem isso, o plano mandava trocar
     três controles entre dongles idênticos, sem ganho nenhum.               */
  function planoDosControles() {
    var ads = adaptadores();
    if (!ads.length) return { ads: [], carga: {}, destino: {}, cabe: false, sobra: 0 };
    var vivos = CONTROLES.slice(0, quantos);
    var carga = {}, destino = {};
    ads.forEach(function (a) { carga[a.id] = 0; });

    /* 1. cada um fica onde está — se o adaptador dele ainda existe */
    var orfaos = [];
    vivos.forEach(function (c) {
      if (carga[c.onde] !== undefined) { destino[c.nome] = c.onde; carga[c.onde] += custo(c); }
      else orfaos.push(c);

    /* 2. quem perdeu o adaptador vai para o menos carregado */
    orfaos.forEach(function (c) {
      var m = ads[0];
      ads.forEach(function (a) { if (carga[a.id] < carga[m.id]) m = a; });
      destino[c.nome] = m.id; carga[m.id] += custo(c);
    });
    /* 3. rebalanceia SÓ enquanto isso baixar o pico */
    for (var volta = 0; volta < vivos.length * 2; volta++) {
      var cheio = ads[0], vazio = ads[0];
      ads.forEach(function (a) {
        if (carga[a.id] > carga[cheio.id]) cheio = a;
        if (carga[a.id] < carga[vazio.id]) vazio = a;
      });
      if (cheio.id === vazio.id) break;
      var cand = vivos.filter(function (c) { return destino[c.nome] === cheio.id; });
      if (!cand.length) break;
      var c = cand[cand.length - 1];
      var picoAntes = carga[cheio.id];
      var picoDepois = Math.max(carga[cheio.id] - custo(c), carga[vazio.id] + custo(c));
      if (picoDepois >= picoAntes) break;          /* não melhora: para */
      carga[cheio.id] -= custo(c); carga[vazio.id] += custo(c); destino[c.nome] = vazio.id;
    }

    var pico = Math.max.apply(null, ads.map(function (a) { return carga[a.id]; }));
    /* quantos MAIS cabem: simula acrescentar até um adaptador estourar.
       Dividir a folga total daria número maior e falso — controle não se
       parte entre dois adaptadores. */
    var teste = {}, sobra = 0;
    ads.forEach(function (a) { teste[a.id] = carga[a.id]; });
    while (sobra < 32) {
      var m2 = ads[0];
      ads.forEach(function (a) { if (teste[a.id] < teste[m2.id]) m2 = a; });
      if (teste[m2.id] + CUSTO_COM_MIC > SLOTS) break;
      teste[m2.id] += CUSTO_COM_MIC; sobra++;
    }
    return { ads: ads, carga: carga, destino: destino, cabe: pico <= SLOTS, sobra: sobra };
  }

  function soqueteHTML(porta, ctx) {
    var h = "", ap = null, estado = "", vered = "", porque = "", problema = "";

    if (ctx.modo === "ideal" && !semLugar(porta)) {
      var idPlano = ctx.plano[porta.n], idAgora = alocacao[porta.n];
      ap = idPlano ? acha(idPlano) : null;
      if (idPlano && idPlano !== idAgora) {
        /* SÓ O VEREDITO — 01/10/2026 (pedido f): de onde e para onde já estão
           na lista de cima. */
        estado = "chega";
      } else if (!idPlano && idAgora) {
        ap = acha(idAgora); estado = "sai";
      } else if (idPlano) { estado = "fica"; }
    } else {
      var id = alocacao[porta.n];
      ap = id ? acha(id) : null;
      var j = semLugar(porta) ? null : julgar(porta);
      if (ap) {
        estado = "cheia";
        if (ap.classe === "wifi" && porta.onde === "hub") { problema = ' data-problema="1"'; vered = "Mudar daqui"; }
        if (ap.classe === "teclado" && porta.onde === "hub") { problema = ' data-problema="1"'; vered = "Mudar daqui"; }
      } else if (j) { estado = j.v; if (j.v !== "fora") { vered = j.txt; porque = j.porque; } }
    }

    var titulo = ap ? ap.tipo + " — " + ap.nome : rotuloDe(porta.n) + " vazia";
    h += '<div class="soquete" data-soquete="' + porta.n + '"><span class="num">' + porta.n + "</span>"
      + '<button class="plug' + (porta.usb === 3 ? " v3" : "") + '" data-porta="' + porta.n + '"'
      + (estado ? ' data-v="' + estado + '"' : "") + problema
      + ensinaNaEntrada(porta)
      + (achado && alocacao[porta.n] === achado ? ' data-achado="1"' : "")
      + ' aria-label="' + titulo + '" title="' + titulo + '"></button><span class="rotulo">';
    /* O NOME QUE ELA DEU, na primeira linha do rótulo — cortado com
       reticências, e inteiro na dica. O selo `.num` continua o número:
       é o do metal. */
    var batismo = nomeDe(porta.n);
    if (batismo) h += '<span class="nomeada" title="' + emAtributo(batismo) + '">'
      + emAtributo(batismo) + '</span>';
    if (ap) {
      h += '<button class="ap-btn nome" data-ap-abre="' + porta.n + '"'
        + ((doProduto() ? GRAVA.indexOf(String(porta.n)) !== -1 : true) ? ' draggable="true"' : "")
        + ' style="color:' + ap.cor + '" title="Abrir o painel de ' + emAtributo(rotuloDoAparelho(ap))
        + '">' + emAtributo(rotuloDoAparelho(ap)) + '</button><span class="caminho">' + (caminhoDe(ap.id) || "—") + "</span>";
      if (vered) h += '<span class="veredito ' + estado + '">' + vered + "</span>";
      if (porque) h += '<span class="porque">' + frase1(porque) + "</span>";
    } else if (vered) {
      h += '<span class="veredito ' + estado + '">' + vered + '</span><span class="porque">' + frase1(porque) + "</span>";
    } else {
      h += '<span class="vazio">Vazia</span>';
    }
    if ((DECLARADO[porta.n] && DECLARADO[porta.n].liga === "hub") || HUB_LIDO[porta.n]) h += '<span class="decl">Hub</span>';
    h += "</span></div>";
    if (porta.filho) h += '<div class="filho"><div class="cabo">↳ ' + porta.filho.cabo + "</div>" + soqueteHTML(porta.filho, ctx) + "</div>";

        + (sem.length ? ' · <b style="color:var(--color-lacuna)">' + sem.length + " aparelho"
            + (sem.length > 1 ? "s" : "") + " fora do mapa</b>" : "")
        + (pend ? ' · Clique em <b style="color:var(--color-ok)">Sugestões</b>' : "")
        + "</span></p>";
    }
    painel.innerHTML = html;
    cuidarDoAviso();

    /* as faces */
    document.getElementById("faces").innerHTML = FACES.map(function (f) {
      var mapa = modo === "ideal" ? r.plano : alocacao;
      var total = f.portas.length + f.portas.filter(function (p) { return p.filho; }).length;
      var cheias = f.portas.reduce(function (s, p) { return s + (mapa[p.n] ? 1 : 0) + (p.filho && mapa[p.filho.n] ? 1 : 0); }, 0);
      /* os aparelhos que ESTA região tem e cuja entrada ainda não foi
         declarada: eles aparecem, porque o produto os vê. Esconder seria
         mentir sobre a mesa dela. */
      var reg = f.regiao;
      var pend = (modo === "ideal") ? [] : semEntrada().filter(function (x) { return x.regiao === reg; });
      /* a região "pc" tem duas faces: a faixa vai numa só, para não duplicar */
      if (reg === "pc" && !f.donaDaFaixaPc) pend = [];
      var faixa = "";
      if (pend.length) {
        faixa = '<div class="por-confirmar">'
          + "<b>" + pend.length + (reg === "hub" ? " no hub" : " no PC") + " sem entrada marcada</b>"
          + '<div class="pend-lista">'
          + pend.map(function (x) {
              return '<button class="chip pend" data-ap="' + x.ap.id + '"'
                + (segurando === x.ap.id ? ' data-segurando="1"' : "") + ">"
                + '<i class="marca" style="background:' + x.ap.cor + '"></i>'
                + '<span class="txt"><b>' + x.ap.tipo + "</b><span>" + x.caminho + "</span></span></button>";
            }).join("")
          + "</div>"
          + "</div>";
      }
      /* A FACE DIZ DE QUAL ENTRADA PENDE (D-2609-O-HUB-PENDE-DA-ENTRADA): o
         título é do dono («Hub na Entrada 3»), e a divergência é uma linha
         a mais, sem culpa. */
      return '<div><div class="face-cab"><h3>' + (f.titulo || f.nome) + '</h3><span class="quantas">' + cheias + " de " + total + " ocupadas</span></div>"
        + (f.diverge ? '<p class="diverge">' + f.diverge + "</p>" : "")
        + '<div class="rolar"><div class="chapa ' + f.forma + '">' + f.portas.map(function (p) { return soqueteHTML(p, ctx); }).join("") + "</div></div>"
        + (f.leitura && modo !== "ideal"
            ? '<p class="leitura-da-maquina">' + f.leitura.map(emAtributo).join(" · ") + "</p>" : "")
        + faixa + "</div>";
    }).join("");

    /* a bandeja */
    document.getElementById("bandeja").innerHTML = APARELHOS.map(function (a) {
      var p = modo === "ideal" ? portaDeEm(r.plano, a.id) : portaDe(a.id);
      return '<button class="chip" data-ap="' + a.id + '"' + (p ? ' data-alocado="1"' : "")
        + ' title="' + emAtributo(a.nome + " · " + (caminhoDe(a.id) || "não está plugado")) + '"'
        + (segurando === a.id ? ' data-segurando="1"' : "") + ">"
        + '<i class="marca" style="background:' + a.cor + '"></i>'
        + '<span class="txt"><b>' + emAtributo(rotuloDoAparelho(a)) + "</b></span>"
        + (p ? '<span class="num">' + p + "</span>" : "") + "</button>";
    }).join("");
    /* A DICA DIZ QUE A ENTRADA ABRE UM EDITOR — 26/09/2026: nada na tela
       dizia, e ela nunca o achou. Quantos estão sem lugar já está no
       painel («fora do mapa»). */
    document.getElementById("ajuda-bandeja").textContent = "";

    /* legenda */
    document.getElementById("legenda").innerHTML = modo === "ideal"
      ? '<span><i class="amostra r-ok"></i> Entra aqui</span><span><i class="amostra r-ru"></i> Sai daqui</span>'
        + '<span><i class="amostra v3"></i> USB 3.0</span><span><i class="amostra v2"></i> USB 2.0</span>'
      : modo === "mao"
      ? '<span><i class="amostra r-ok"></i> Melhor lugar</span><span><i class="amostra r-ev"></i> Vale evitar</span>'
        + '<span><i class="amostra r-ru"></i> Evite</span><span><i class="amostra v3"></i> USB 3.0</span><span><i class="amostra v2"></i> USB 2.0</span>'
      : '<span><i class="amostra v3"></i> USB 3.0</span><span><i class="amostra v2"></i> USB 2.0</span>'
        + '<span><i class="amostra r-ru"></i> Lugar ruim</span>';

    mostrarEditor();
  }

  /* ══ 7. INTERAÇÃO ════════════════════════════════════════════════════ */
  document.addEventListener("click", function (ev) {
    /* O EDITOR DA ENTRADA — 26/09/2026. Os gestos dele vêm antes de todos:
       um botão dentro do editor não pode cair no clique do plugue embaixo. */
    if (ev.target.closest(".modo[data-modo]")) { editando = null; editandoAp = null; segurando = null; }
    if (ev.target.id === "edita-fecha") { editando = null; editandoAp = null; segurando = null; pintar(); return; }
    var lg = ev.target.closest("#edita [data-liga]");
    /* A TELA ESPERA O DISCO — 26/09/2026, D-2609-A-TELA-DO-MAPA-ESPERA-O-DISCO.
       O botão que leva o gesto ao disco não pinta nada aqui: ele fica
       «em voo» (o carimbo do piloto), o produto grava e devolve o
       arranjo relido, e a página repinta pelo que o disco diz. Uma
       recusa não repinta, e a piscada acha o botão clicado. No
       exemplo, sem produto, a pintura continua local. */
    if (lg && lg.hasAttribute("data-gesto")) return;
    if (lg) {
      /* o apagado responde e não declara: a razão está na dica */
      if (lg.getAttribute("aria-disabled") !== "true") declarar(editando, "liga", lg.getAttribute("data-liga"));
      pintar(); return;
    }
    /* O PAINEL DO APARELHO — 04/10/2026. O que leva `data-gesto` o produto grava e a página
       espera o disco; o que não leva (o exemplo) muda só na tela. */
    var abre = ev.target.closest("[data-ap-abre]");
    if (abre) {
      achado = null; editandoDe = "mapa"; editandoAp = null; segurando = null;
      editando = abre.getAttribute("data-ap-abre"); if (modo === "ideal") modo = "mesa";
      pintar(); return;
    }
    var ext = ev.target.closest("#edita [data-extensor]");
    if (ext && ext.hasAttribute("data-gesto")) return;
    if (ext) {
      var liga = ext.getAttribute("data-ligado") === "true", pe = porNum(editando);
      declarar(editando, "extensor", liga); if (pe) pe.esticada = liga;
      pintar(); return;
    }
    var tp = ev.target.closest("#edita [data-tipodito]");
    if (tp && (tp.hasAttribute("data-gesto") || tp.disabled)) return;
    if (tp) {
      var ap0 = aparelhoDaEntrada(editando);
      if (ap0) {
        ap0.tipoDeclarado = tp.getAttribute("data-tipodito");
        ap0.cor = COR_DO_TIPO[ap0.tipoDeclarado] || ap0.cor;
      }
      pintar(); return;
    }
    var vauto = ev.target.closest("#edita #voltar-ao-automatico");
    if (vauto && (vauto.hasAttribute("data-gesto") || vauto.disabled)) return;
    if (vauto) {
      var ap1 = aparelhoDaEntrada(editando);
      if (ap1) { delete ap1.tipoDeclarado; delete ap1.nomeDeclarado; ap1.cor = ap1.corDaMaquina || ap1.cor; }
      if (DECLARADO[editando]) delete DECLARADO[editando].extensor;
      var pv = porNum(editando); if (pv) pv.esticada = false;
      pintar(); return;
    }
    if (ev.target.closest("#edita #identificar")) {
      identificando = alocacao[editando] || null; pintar(); return;
    }
    if (ev.target.id === "ver-a-sugestao") { editando = null; editandoAp = null; segurando = null; modo = "ideal"; pintar(); return; }
    if (ev.target.id === "aviso-ver") { avisoAberto = true; pintar(); return; }
    if (ev.target.id === "aviso-fecha") { modo = "mesa"; pintar(); return; }
    var ub = ev.target.closest("#edita [data-usb]");
    if (ub && ub.hasAttribute("data-gesto")) return;
    if (ub) {
      if (ub.getAttribute("aria-disabled") !== "true") declarar(editando, "usb", parseInt(ub.getAttribute("data-usb"), 10));
      pintar(); return;
    }
    if ((editando || editandoAp) && !ev.target.closest("#edita") && !ev.target.closest(".plug[data-porta]")
        && !ev.target.closest(".chip[data-ap]")) {
      editando = null; editandoAp = null; segurando = null; pintar();
    }
    var m = ev.target.closest(".modo[data-modo]");
    if (m) { modo = m.getAttribute("data-modo"); if (modo !== "mao") { naMao = null; segurando = null; } pintar(); return; }

    var pb = ev.target.closest(".escolha[data-perfil]");
    if (pb) { perfil = pb.getAttribute("data-perfil"); pintar(); return; }
    var qb = ev.target.closest(".escolha[data-quantos]");
    if (qb) { quantos = parseInt(qb.getAttribute("data-quantos"), 10); pintar(); return; }
    var mb = ev.target.closest(".escolha[data-mic-de]");
    if (mb) { var quem = mb.getAttribute("data-mic-de");
      CONTROLES.forEach(function (c) { if (c.nome === quem) c.mic = !c.mic; }); pintar(); return; }

    var vb = ev.target.closest(".escolha[data-var]");
    if (vb) { variante = vb.getAttribute("data-var"); pintar(); return; }

    if (ev.target.id === "reexaminar" || ev.target.classList.contains("ja-movi")) {
      /* relata a diferença; NÃO troca o que o mapa mostra. No produto quem
         abre o reexame é a leitura nova, que chega pelo `hefestoArranjo`. */
      if (doProduto()) return;
      recomecarOAviso(); modo = "reexame"; segurando = null; naMao = null; pintar(); return;
    }
    if (ev.target.id === "voltar-leitura") { modo = "mesa"; pintar(); return; }
    if (ev.target.id === "ver-antes") {
      var t = leituraAtual; leituraAtual = leituraAnterior; leituraAnterior = t;
      modo = "mesa"; pintar(); return;
    }
    /* O "aplicar" saiu, e o motivo fica escrito: ele gravava
       `novo[n] = cam[pl[n]]` — o caminho de HOJE do aparelho que o plano QUERIA
       naquela entrada, não o caminho do soquete. Os dois só coincidem quando não
       há nada a mover; em todo caso interessante ele escrevia uma ligação falsa,
       e mapa que mente é pior que mapa vazio. O lugar de aprender a ligação é o
       reexame, que LÊ o sistema de novo e pergunta. Ver a §7.3 da
       MOTOR-DO-ARRANJO-01. */
    if (ev.target.id === "voltar") { MAPA = Object.assign({}, MAPA_ORIGINAL); pintar(); return; }

    var esc = ev.target.closest(".escolha[data-mao]");
    if (esc) { var x = esc.getAttribute("data-mao"); naMao = (naMao === x ? null : x); segurando = null; pintar(); return; }

    var chip = ev.target.closest(".chip[data-ap]");
    /* NO PRODUTO, O APARELHO QUE JÁ ESTÁ NUMA ENTRADA abre o editor dela: quem
       corrige ali é o «Trocar com…» (um ato por porta). O que não está em
       entrada nenhuma continua indo para a mão, para ser ensinado. */
    if (chip && portaDe(chip.getAttribute("data-ap"))) {
      achado = null; editandoDe = "lista"; editandoAp = null;
      editando = portaDe(chip.getAttribute("data-ap")); modo = "mesa";
      segurando = null; naMao = null; pintar(); return;
    }
    if (chip) {
      /* o aparelho sem entrada: o painel abre perto dele e diz o passo; o clique na entrada certa
         marca o lugar dele (as candidatas acendem) */
      var ap = acha(chip.getAttribute("data-ap"));
      achado = null; editando = null; editandoAp = ap.id; segurando = ap.id; naMao = null; modo = "mesa";
      pintar(); return;
    }

    var plug = ev.target.closest(".plug[data-porta]");
    if (plug) {
      if (modo === "ideal") return;
      var n = plug.getAttribute("data-porta"), p = porNum(n);
      if (segurando) {
        /* NO PRODUTO A PÁGINA ESPERA O DISCO (D-2609-ENSINAR-GRAVA-O-NO): o
           plugue candidato levou o gesto, e o arranjo relido tira o
           aparelho da mão. A entrada que não grava não aprende: o que
           ficava só na memória a releitura desfazia. */
        if (doProduto()) return;
        if (ocupada(alocacao, p)) return;
        /* ENSINAR O MAPA: esta entrada é o caminho deste aparelho, para sempre */
        var c = leitura()[segurando];
        if (c) {
          Object.keys(MAPA).forEach(function (k) { if (MAPA[k] === c) delete MAPA[k]; });
          MAPA[n] = c;
        }
        segurando = null; naMao = null; editandoAp = null; modo = "mesa"; editando = n;
      } else {
        /* o plugue abre o editor dela: o que tem nesta entrada, e a velocidade */
        editando = n;
      }
      pintar(); return;
    }
  });

  /* ══ A PORTA PARA O CENSO DE QUEM ABRE — 11/09/2026 ══════════════════
     Até aqui esta página só sabia desenhar UM gabinete: o que estava digitado
     no JavaScript dela. `hefestoArranjo` é por onde o produto entrega a
     leitura da máquina de quem abriu, e a página se repinta inteira com ela.
     Ver `interface/pagina_do_mapa.py` e `interface/arranjo_desta_maquina.py`. */
  function controlesSobre(aparelhos, base) {
    /* A fileira de controles é SIMULADOR — os botões 1..4 ao lado dela são a
       pergunta "e se fossem quatro?". O censo vivo não a traz; ela se espalha
       pelos adaptadores que a máquina de quem abre tiver. */
    var bts = aparelhos.filter(function (a) { return a.classe === "bt"; });
    return base.map(function (c, i) {
      return { nome: c.nome, mic: c.mic, onde: bts.length ? bts[i % bts.length].id : null };
    });
  }

  function aplicarArranjo(f, manterOEditor) {
    fonte = f;
    APARELHOS = f.aparelhos;
    FACES = f.faces;
    MAPA = f.mapa;
    /* O "Voltar" do reexame restaura ESTE mapa. Deixá-lo com o do exemplo
       devolveria a pessoa a um gabinete que não é o dela, com um clique. */
    MAPA_ORIGINAL = Object.assign({}, MAPA);
    LEITURAS = f.leituras;
    leituraAtual = "agora";
    leituraAnterior = "antes";
    CONTROLES = f.controles || controlesSobre(APARELHOS, EXEMPLO.controles);
    quantos = CONTROLES.length;
    /* O QUE ELA DECLAROU EM CADA ENTRADA — 26/09/2026, o editor da entrada.
       Toda entrada do mapa dela vem, com {} quando ela não disse nada, e as
       chaves são as que o editor GRAVA no disco. A que o desenho monta do que
       ela declarou (as do hub, a ponta do extensor) não vem: ali, e no
       exemplo, o editor fica só na tela. */
    DECLARADO = JSON.parse(JSON.stringify(f.declarado || {}));
    GRAVA = Object.keys(DECLARADO);
    /* O NOME DE CADA ENTRADA, composto pelo dono (O-MAPA-QUE-ELA-CORRIGE-01):
       `entrada_a_entrada.rotulos_das_entradas`. */
    ROTULOS = f.rotulos || {};
    /* AS ENTRADAS EM QUE O COMPUTADOR LÊ UM HUB (D-2609-O-HUB-PENDE-DA-
       ENTRADA): o editor delas nasce com «Hub», e o plugue ganha a marca. */
    HUB_LIDO = f.hubLido || {};
    /* DE ONDE VEIO A VELOCIDADE de cada entrada: a mesma precedência que
       pintou o plugue (aparelho, depois o que o usuário disse, depois a placa). */
    USB_DE = f.usbDe || {};
    /* A VOLTA DE UMA GRAVAÇÃO NÃO FECHA O EDITOR — 26/09/2026,
       O-MAPA-QUE-ELA-CORRIGE-01: o usuário clicou numa entrada, e a entrada
       continua aberta com o que o disco diz agora. */
    if (!manterOEditor) editando = null;
  }

  function dizerDeQuando() {
    /* O cabeçalho nasce dizendo o exemplo, no HTML, para a página ser honesta
       mesmo sem JavaScript nenhum. FATO SUBSTITUÍDO em 26/09/2026: aqui ele
       passava a dizer de quando era a leitura desta máquina, e o usuário pediu que
       isso saísse («essa info some»). A linha existe só para o exemplo se
       dizer exemplo; com a leitura de quem abre, ela sai da página. */
    var el = document.getElementById("de-quando");
    if (el && fonte.quando !== EXEMPLO.quando) el.remove();
  }

  /* O «EXAMINAR» NO PRODUTO — 26/09/2026, O-MAPA-DAS-CONEXOES-NO-PRODUTO-02.
     Com a leitura desta máquina na tela, quem relê é o produto: o botão leva
     o gesto `reexaminar`, a leitura nova sai fora do fio da janela e volta por
     `hefestoArranjo(dado, true)`, com a que a página tinha como «antes». No
     exemplo não há o que reler, e o reexame é o das duas leituras dele. */
  function doProduto() { return fonte !== EXEMPLO; }
  function examinaNoProduto() { return doProduto() ? ' data-gesto="reexaminar"' : ""; }
  function marcarOExaminar() {
    var ex = document.querySelector(".topo #reexaminar");
    if (ex && doProduto()) ex.setAttribute("data-gesto", "reexaminar");
  }

  window.hefestoArranjo = function (dado, como) {
    /* COMO ELE CHEGA — 26/09/2026, O-MAPA-QUE-ELA-CORRIGE-01: `false` é a
       abertura, `true` é o «Examinar», e "gravou" é a volta
       de uma gravação do editor (`arranjo_desta_maquina.CHAVE_DEPOIS_DE_GRAVAR`):
       a página repinta pelo disco sem mudar de modo nem fechar o editor. */
    var comoReexame = como === true;
    var gravou = como === "gravou";
    var falta = CAMPOS_DO_ARRANJO.filter(function (c) { return !dado || !dado[c]; });
    if (falta.length) {
      /* RECUSAR É METADE DO TRABALHO: meio arranjo desenharia um gabinete sem
         entradas, e isso se lê como "não tenho nada ligado". */
      throw new Error("arranjo incompleto, falta: " + falta.join(", "));
    }
    /* O REEXAME RELÊ O QUE ELA ENSINOU, porque o ensinar grava no disco
       (O-MAPA-QUE-ELA-CORRIGE-01, D-2609-ENSINAR-GRAVA-O-NO). Até aqui o
       mapa da tela era guardado por cima da releitura: o que ela ensinava
       só vivia na memória, e a releitura o desfazia. */
    /* a leitura anterior da tela fica: gravar não é reexaminar */
    var antesDaTela = gravou && LEITURAS ? LEITURAS.antes : null;
    aplicarArranjo(dado, gravou);
    if (antesDaTela) LEITURAS = { agora: dado.leituras.agora, antes: antesDaTela };
    if (comoReexame) {
      modo = "reexame"; segurando = null; naMao = null;
    }
    /* o aparelho que estava na mão foi ensinado: ele sai da mão */
    if (gravou && segurando) { segurando = null; naMao = null; modo = "mesa"; }
    dizerDeQuando();
    marcarOExaminar();
    pintar();
    return "ok";
  };

  pintar();
})();
</script>
