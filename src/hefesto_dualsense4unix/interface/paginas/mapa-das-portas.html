<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hefesto — o mapa das entradas</title>
<style>
  :root {
    --color-paper:      #282a36;
    --color-paper-2:    #21222c;
    --color-paper-3:    #343746;
    --color-rule:       #44475a;
    --color-ink:        #f8f8f2;
    --color-ink-quiet:  #a8b0c8;
    --color-ink-faint:  #6272a4;
    --color-accent:     #bd93f9;
    --color-ok:         #50fa7b;
    --color-lacuna:     #ffb86c;
    --color-alerta:     #ff5555;
    --color-frio:       #8be9fd;

    --font-corpo: ui-sans-serif, system-ui, "Cantarell", "Fira Sans", "Segoe UI", Roboto, sans-serif;
    --font-dado:  ui-monospace, "JetBrains Mono", "Fira Mono", "DejaVu Sans Mono", monospace;

    --space-3xs: .25rem; --space-2xs: .5rem;  --space-xs: .75rem;
    --space-sm:  1rem;   --space-md:  1.5rem; --space-lg: 2.5rem;

    --text-xs: .75rem;  --text-sm: .8125rem; --text-base: .9375rem;
    --text-lg: 1.125rem; --text-xl: 1.5rem;

    --radius-sm: 3px; --radius-md: 6px;
    --ease-out: cubic-bezier(.22,.61,.36,1);
    --dur-fast: 120ms;

    --usb3: #2c5f9e;
    --usb2: #5b6072;
  }

  * { box-sizing: border-box; }
  :root { --fundo-da-pagina: #11121a; }
  body {
    margin: 0; background: var(--fundo-da-pagina); color: var(--color-ink);
    font-family: var(--font-corpo); font-size: var(--text-base); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
  }
  .pagina { background: var(--color-paper); border: 1px solid var(--color-paper-3);
            border-radius: 11px; overflow: hidden; display: flex; flex-direction: column;
            padding: var(--space-md) var(--space-sm) 0; }
  .pagina > .topo { flex: 0 0 auto; }
  .pagina > .corpo { flex: 1; min-height: 0; overflow-y: auto;
                     margin: 0 calc(-1 * var(--space-sm));
                     padding: 0 var(--space-sm) var(--space-lg); }
  :root{--recuo-do-corpo:16px;--piso-da-vista:777px;--teto-da-vista:855px;--alt-janela:clamp(var(--piso-da-vista), calc(100dvh - var(--recuo-do-corpo) * 2), var(--teto-da-vista))}
  body{padding:var(--recuo-do-corpo)}
  .pagina{width:min(100%,1600px);height:var(--alt-janela);max-width:100%;max-height:calc(100dvh - var(--recuo-do-corpo) * 2)}

  .topo { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2xs) var(--space-sm);
          padding-bottom: var(--space-xs); border-bottom: 1px solid var(--color-rule); }
  .topo h1 { margin: 0; font-size: var(--text-xl); font-weight: 600; letter-spacing: -.01em; }
  .topo h1 em { color: var(--color-accent); font-style: normal; }
  .topo .nota { color: var(--color-ink-faint); font-size: var(--text-sm); margin-left: auto; }
  .topo .quando { color: var(--color-ink-faint); font-size: var(--text-sm); margin-left: auto;
                  font-family: var(--font-dado); }

  .modos { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-md); }
  .modo {
    font: inherit; font-size: var(--text-sm); font-weight: 600;
    background: var(--color-paper-3); color: var(--color-ink);
    border: 1px solid var(--color-rule); border-radius: var(--radius-sm);
    padding: .45rem .85rem; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .modo:hover { background: var(--color-rule); }
  .modo:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .modo[aria-pressed="true"] { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 22%, var(--color-paper-3)); }

  .painel { margin-top: var(--space-2xs); border: 1px solid var(--color-rule);
            border-radius: var(--radius-md); background: var(--color-paper-2); padding: var(--space-sm); }
  .painel > p.chamada { margin: 0 0 var(--space-2xs); font-size: var(--text-base); font-weight: 600; }
  .painel > p.chamada .grande { color: var(--color-ink); }
  .escolhas { display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
  .escolha { font: inherit; font-size: var(--text-sm); display: inline-flex; align-items: center; gap: .4rem;
             background: var(--color-paper-3); color: var(--color-ink); border: 1px solid var(--color-rule);
             border-radius: var(--radius-sm); padding: .35rem .7rem; cursor: pointer; }
  .escolha:hover { background: var(--color-rule); }
  .escolha:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .escolha[aria-pressed="true"] { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 20%, var(--color-paper-3)); }
  .escolha i { width: .55rem; height: .55rem; border-radius: 50%; flex: none; }

  .licao { margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: 1px solid var(--color-rule);
           display: grid; grid-template-columns: minmax(0,1fr) minmax(0,15rem); gap: var(--space-sm); align-items: start; }
  @media (max-width: 760px) { .licao { grid-template-columns: 1fr; } }
  .licao .texto { margin: 0; font-size: var(--text-sm); color: var(--color-ink-quiet); max-width: 62ch; }
  .licao .texto b { color: var(--color-ink); font-weight: 600; }
  .conta-caixa { border: 1px solid var(--color-rule); border-radius: var(--radius-sm); background: var(--color-paper);
                 padding: var(--space-2xs) var(--space-xs); font-size: var(--text-xs); }
  .conta-caixa b { display: block; color: var(--color-ink); margin-bottom: .2rem; }
  .conta-caixa div { font-family: var(--font-dado); color: var(--color-ink-quiet); font-variant-numeric: tabular-nums; }

  .receita { list-style: none; margin: 0; padding: 0; counter-reset: passo;
             display: flex; flex-direction: column; gap: var(--space-2xs); }
  .receita > li { counter-increment: passo; display: grid; grid-template-columns: 1.7rem minmax(0,1fr); gap: var(--space-2xs);
                  border: 1px solid var(--color-rule); border-left: 3px solid var(--color-ok);
                  border-radius: var(--radius-sm); background: var(--color-paper); padding: var(--space-2xs) var(--space-xs); }
  .receita > li::before { content: counter(passo); font-family: var(--font-dado); font-weight: 600;
                          color: var(--color-ok); font-size: var(--text-sm); line-height: 1.6; }
  .receita h4 { margin: 0 0 .15rem; font-size: var(--text-base); font-weight: 600; }
  .receita ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .18rem; }
  .receita ul li { display: flex; flex-wrap: wrap; gap: .4rem; align-items: baseline; font-size: var(--text-sm); color: var(--color-ink-quiet); }
  .receita ul li b { color: var(--color-ink); font-weight: 600; }
  .nada-a-fazer { border: 1px solid color-mix(in srgb, var(--color-ok) 45%, var(--color-rule));
                  border-left: 3px solid var(--color-ok); border-radius: var(--radius-sm);
                  background: var(--color-paper); padding: var(--space-xs) var(--space-sm); }
  .nada-a-fazer b { color: var(--color-ok); }
  .acoes { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-sm); }
  .btn { font: inherit; font-size: var(--text-sm); background: var(--color-paper-3); color: var(--color-ink);
         border: 1px solid var(--color-rule); border-radius: var(--radius-sm); padding: .35rem .7rem; cursor: pointer; }
  .btn:hover { background: var(--color-rule); }
  .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .btn.forte { border-color: var(--color-ok); color: var(--color-ok); }

  .selo { flex: none; font-family: var(--font-dado); font-size: .625rem; text-transform: uppercase;
          letter-spacing: .06em; padding: .05rem .38rem; border-radius: 2px; border: 1px solid; }
  .selo.medido   { color: var(--color-ok);     border-color: color-mix(in srgb, var(--color-ok) 45%, transparent); }
  .selo.espec    { color: var(--color-frio);   border-color: color-mix(in srgb, var(--color-frio) 45%, transparent); }
  .selo.derivado { color: var(--color-lacuna); border-color: color-mix(in srgb, var(--color-lacuna) 45%, transparent); }

  .palco { display: grid; grid-template-columns: minmax(0,1fr) 268px; gap: var(--space-md); align-items: start; margin-top: var(--space-md); }
  @media (max-width: 900px) { .palco { grid-template-columns: 1fr; } }
  .faces { display: flex; flex-direction: column; gap: var(--space-md); }
  .face-cab { display: flex; align-items: baseline; gap: var(--space-2xs); margin-bottom: var(--space-2xs); }
  .face-cab h3 { margin: 0; font-size: var(--text-sm); font-weight: 600; }
  .face-cab .quantas { font-size: var(--text-xs); color: var(--color-ink-faint); font-family: var(--font-dado); }
  .diverge { margin: 0 0 var(--space-2xs); font-size: var(--text-xs); color: var(--color-lacuna); }
  .edita .lido { font-size: var(--text-xs); color: var(--color-ink-quiet); }
  .edita .origem { font-size: var(--text-xs); color: var(--color-ink-quiet); }

  .chapa { border: 1px solid var(--color-rule); border-radius: var(--radius-md);
           background: linear-gradient(160deg, var(--color-paper-3), var(--color-paper-2)); padding: var(--space-sm); }
  .chapa.grade-tras { display: grid; grid-template-columns: repeat(2, max-content); gap: .55rem var(--space-md); }
  .chapa.coluna { display: flex; flex-direction: column; gap: .55rem; }
  .chapa.fileira { display: grid; grid-template-columns: repeat(3, max-content); gap: .55rem var(--space-md); }
  @media (max-width: 640px) { .chapa.fileira, .chapa.grade-tras { grid-template-columns: max-content; } }

  .soquete { display: flex; align-items: flex-start; gap: .45rem; }
  .num { flex: none; min-width: 1.5rem; height: 1.5rem; padding: 0 .3rem; border-radius: 99px;
         display: inline-grid; place-items: center; font-family: var(--font-dado); font-size: .6875rem;
         font-weight: 600; background: var(--color-paper); color: var(--color-ink-quiet);
         border: 1px solid var(--color-rule); margin-top: .05rem; }
  .plug { position: relative; flex: none; margin-top: .05rem; width: 3.4rem; height: 1.45rem; border-radius: 2px;
          border: 1px solid #0d0e13; cursor: pointer; padding: 0; background: var(--usb2);
          transition: box-shadow var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .plug.v3 { background: var(--usb3); }
  .plug::after { content: ""; position: absolute; left: .28rem; right: .28rem; top: .3rem; height: .34rem;
                 border-radius: 1px; background: rgba(248,248,242,.55); }
  .plug:hover { transform: translateY(-1px); }
  .plug:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }
  .plug[data-v="cheia"]  { box-shadow: 0 0 0 2px var(--color-accent); }
  .plug[data-v="melhor"] { box-shadow: 0 0 0 3px var(--color-ok), 0 0 16px 2px rgba(80,250,123,.4); }
  .plug[data-v="serve"]  { box-shadow: 0 0 0 2px var(--color-ink-faint); }
  .plug[data-v="evite"]  { box-shadow: 0 0 0 2px var(--color-lacuna); }
  .plug[data-v="ruim"]   { box-shadow: 0 0 0 2px var(--color-alerta), 0 0 14px 2px rgba(255,85,85,.32); }
  .plug[data-v="chega"]  { box-shadow: 0 0 0 3px var(--color-ok), 0 0 16px 2px rgba(80,250,123,.4); }
  .plug[data-v="sai"]    { box-shadow: 0 0 0 2px var(--color-alerta); opacity: .55; }
  .plug[data-v="fica"]   { box-shadow: 0 0 0 2px var(--color-ink-faint); }
  .plug[data-problema="1"] { box-shadow: 0 0 0 2px var(--color-alerta), 0 0 14px 2px rgba(255,85,85,.32); }

  .rotulo { min-width: 8.6rem; max-width: 13rem; font-size: var(--text-xs); line-height: 1.35; }
  .rotulo .nome { display: block; font-weight: 600; }
  .rotulo .caminho { display: block; font-family: var(--font-dado); color: var(--color-ink-faint); font-size: .6875rem; }
  .rotulo .vazio { color: var(--color-ink-faint); font-style: italic; }
  .rotulo .nomeada { display: block; font-weight: 700; white-space: nowrap;
                     overflow: hidden; text-overflow: ellipsis; }
  .rotulo .veredito { display: block; font-weight: 600; }
  .rotulo .veredito.melhor, .rotulo .veredito.chega { color: var(--color-ok); }
  .rotulo .veredito.serve, .rotulo .veredito.fica { color: var(--color-ink-quiet); }
  .rotulo .veredito.evite { color: var(--color-lacuna); }
  .rotulo .veredito.ruim, .rotulo .veredito.sai { color: var(--color-alerta); }
  .rotulo .veredito.cheia { color: var(--color-ink-faint); }
  .rotulo .porque { display: block; color: var(--color-ink-quiet); }

  .por-confirmar {
    margin-top: var(--space-2xs); padding: var(--space-2xs) var(--space-xs);
    border: 1px dashed var(--color-lacuna); border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--color-lacuna) 8%, var(--color-paper-2));
  }
  .por-confirmar > b { display: block; font-size: var(--text-sm); color: var(--color-lacuna); margin-bottom: .3rem; }
  .pend-lista { display: flex; flex-wrap: wrap; gap: .3rem; }
  .pend-lista .chip.pend { width: auto; min-width: 11rem; }
  .por-confirmar .pend-ajuda { display: block; margin-top: .35rem; font-size: var(--text-xs); color: var(--color-ink-faint); }
  .plug[data-v="fora"] { opacity: .35; box-shadow: none; cursor: not-allowed; }
  .rotulo .veredito.fora { color: var(--color-ink-faint); }

  .filho { margin-left: 2rem; padding-left: var(--space-sm); border-left: 2px dashed var(--color-rule); margin-top: .3rem; }
  .filho .cabo { font-size: var(--text-xs); color: var(--color-ink-faint); margin-bottom: .2rem; }

  .bandeja { border: 1px solid var(--color-rule); border-radius: var(--radius-md); background: var(--color-paper-2); padding: var(--space-xs); }
  .bandeja h3 { margin: 0 0 var(--space-3xs); font-size: var(--text-sm); font-weight: 600; }
  .bandeja p.ajuda { margin: 0 0 var(--space-2xs); font-size: var(--text-xs); color: var(--color-ink-faint); }
  .lista { display: flex; flex-direction: column; gap: .3rem; }
  .chip { display: flex; align-items: center; gap: .5rem; width: 100%; font: inherit; font-size: var(--text-xs);
          text-align: left; background: var(--color-paper-3); color: var(--color-ink);
          border: 1px solid var(--color-rule); border-radius: var(--radius-sm); padding: .35rem .5rem; cursor: pointer; }
  .chip:hover { border-color: var(--color-ink-faint); }
  .chip:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .chip[data-alocado="1"] { opacity: .45; }
  .chip[data-segurando="1"] { border-color: var(--color-ok); background: color-mix(in srgb, var(--color-ok) 16%, var(--color-paper-3)); opacity: 1; }
  .chip .marca { flex: none; width: .5rem; height: .5rem; border-radius: 50%; }
  .chip .txt { flex: 1; min-width: 0; }
  .chip .txt b { display: block; font-weight: 600; }
  .chip .txt span { display: block; font-family: var(--font-dado); color: var(--color-ink-faint); font-size: .6875rem; }

  .legenda { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-xs);
             font-size: var(--text-xs); color: var(--color-ink-faint); }
  .legenda span { display: inline-flex; align-items: center; gap: .35rem; }
  .amostra { width: 1.4rem; height: .65rem; border-radius: 2px; border: 1px solid #0d0e13; flex: none; }
  .amostra.v3 { background: var(--usb3); } .amostra.v2 { background: var(--usb2); }
  .amostra.r-ok { background: transparent; border: 2px solid var(--color-ok); }
  .amostra.r-ev { background: transparent; border: 2px solid var(--color-lacuna); }
  .amostra.r-ru { background: transparent; border: 2px solid var(--color-alerta); }

  .secao { margin-top: var(--space-lg); }
  .secao > h2 { margin: 0 0 var(--space-2xs); font-size: var(--text-base); font-weight: 600; color: var(--color-accent); }
  .secao > .sub { margin: 0 0 var(--space-sm); font-size: var(--text-sm); color: var(--color-ink-faint); max-width: 70ch; }
  .moldura { border: 1px solid var(--color-rule); border-radius: var(--radius-md); background: var(--color-paper-2); padding: var(--space-sm); }
  .adaptadores { display: flex; flex-direction: column; gap: var(--space-2xs); }
  .adap { display: grid; grid-template-columns: 13rem minmax(0,1fr) 10rem; gap: var(--space-2xs) var(--space-sm); align-items: center; font-size: var(--text-sm); }
  @media (max-width: 720px) { .adap { grid-template-columns: 1fr; } }
  .adap .quem b { font-weight: 600; }
  .adap .quem span { display: block; font-family: var(--font-dado); font-size: var(--text-xs); color: var(--color-ink-faint); }
  .barra { height: .55rem; border-radius: 99px; background: var(--color-paper-3); border: 1px solid var(--color-rule); overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--color-accent); }
  .barra i.folgada  { background: var(--color-ok); }
  .barra i.apertada { background: var(--color-lacuna); }
  .barra i.cheia    { background: var(--color-alerta); }
  .conta { font-family: var(--font-dado); font-size: var(--text-xs); font-variant-numeric: tabular-nums; color: var(--color-ink-quiet); text-align: right; }
  .conta em { font-style: normal; color: var(--color-ok); }
  .conta em.folgada  { color: var(--color-ok); }
  .conta em.apertada { color: var(--color-lacuna); }
  .conta em.cheia    { color: var(--color-alerta); }

  .linha-perfil { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-bottom: .5rem; }
  .linha-mic { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem;
               margin: 0 0 .9rem; padding: var(--space-2xs) var(--space-xs);
               border: 1px solid var(--color-rule); border-left: 3px solid var(--color-frio);
               border-radius: var(--radius-sm); background: var(--color-paper); }
  .linha-mic > b { font-size: var(--text-sm); margin-right: .3rem; }
  .mic-porque { flex: 1 1 22rem; font-size: var(--text-xs); color: var(--color-ink-faint); }
  .mic-porque b { color: var(--color-ink-quiet); }

  .controles-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-bottom: .5rem; }
  .ctl-rot { font-size: var(--text-sm); color: var(--color-ink-quiet); }
  .ctl-nota { margin: 0 0 .9rem; font-size: var(--text-xs); color: var(--color-ink-faint); max-width: 74ch; }
  .ctl-nota b { color: var(--color-ink-quiet); }
  .veredito-mesa { margin-top: .7rem; padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-sm);
                   border: 1px solid var(--color-rule); border-left: 3px solid var(--color-ok);
                   font-size: var(--text-sm); color: var(--color-ink-quiet); }
  .veredito-mesa.ruim { border-left-color: var(--color-alerta); }
  .veredito-mesa.aviso { border-left-color: var(--color-lacuna); margin-top: .5rem; }
  .veredito-mesa b { color: var(--color-ink); }
  .veredito-mesa .selo { display: inline-block; }
  ul.mudar { margin: .4rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .3rem; }
  ul.mudar li { font-size: var(--text-sm); }
  ul.mudar .passo { color: var(--color-ink-faint); font-size: var(--text-xs); }

  .rodape { margin-top: var(--space-lg); padding-top: var(--space-sm); border-top: 1px solid var(--color-rule);
            font-size: var(--text-xs); color: var(--color-ink-faint); max-width: 78ch; }
  .rodape p { margin: 0 0 var(--space-2xs); }
  .rodape code { font-family: var(--font-dado); color: var(--color-ink-quiet); }
  .rodape b { color: var(--color-ink-quiet); }
  .rolar { overflow-x: auto; }
</style>
<style>
  :root { --color-ink-quiet: #f8f8f2; --color-ink-faint: #f8f8f2; }
  .pagina { --texto-suave: #f8f8f2; --texto-mudo: #f8f8f2; }
  .plug[data-v="serve"], .plug[data-v="fica"] { box-shadow: 0 0 0 2px #6272a4; }
  .chip:hover { border-color: #6272a4; }
  .chip[data-alocado="1"] { opacity: 1; }
  .topo .examinar { margin-left: auto; align-self: center; display: inline-flex;
                    align-items: center; gap: .4rem; }
  .topo .examinar span { pointer-events: none; }
  .topo .quando + .examinar { margin-left: 0; }
  .painel span.fina { margin-left: .8rem; font-weight: 400; font-size: var(--text-sm); }
  .palco { position: relative; }
  .rotulo .decl { display: inline-block; margin: .15rem 0 0 .4rem; padding: 0 .4rem;
                  border: 1px solid var(--color-accent); border-radius: var(--radius-sm);
                  color: var(--color-accent); font-size: .6875rem; }
  .edita { position: absolute; z-index: 5; width: 300px; display: flex; flex-direction: column;
           gap: .6rem; padding: .7rem .8rem; background: var(--color-paper-2);
           border: 1px solid var(--color-accent); border-radius: var(--radius-md);

    return base.map(function (c, i) {
      return { nome: c.nome, mic: c.mic, onde: bts.length ? bts[i % bts.length].id : null };
    });
  }

  function aplicarArranjo(f, manterOEditor) {
    fonte = f;
    APARELHOS = f.aparelhos;
    FACES = f.faces;
    MAPA = f.mapa;
    MAPA_ORIGINAL = Object.assign({}, MAPA);
    LEITURAS = f.leituras;
    leituraAtual = "agora";
    leituraAnterior = "antes";
    CONTROLES = f.controles || controlesSobre(APARELHOS, EXEMPLO.controles);
    quantos = CONTROLES.length;
    DECLARADO = JSON.parse(JSON.stringify(f.declarado || {}));
    GRAVA = Object.keys(DECLARADO);
    ROTULOS = f.rotulos || {};
    HUB_LIDO = f.hubLido || {};
    USB_DE = f.usbDe || {};
    if (!manterOEditor) editando = null;
  }

  function dizerDeQuando() {
    var el = document.getElementById("de-quando");
    if (el && fonte.quando !== EXEMPLO.quando) el.remove();
  }

  function doProduto() { return fonte !== EXEMPLO; }
  function examinaNoProduto() { return doProduto() ? ' data-gesto="reexaminar"' : ""; }
  function marcarOExaminar() {
    var ex = document.querySelector(".topo #reexaminar");
    if (ex && doProduto()) ex.setAttribute("data-gesto", "reexaminar");
  }

  window.hefestoArranjo = function (dado, como) {
    var comoReexame = como === true;
    var gravou = como === "gravou";
    var falta = CAMPOS_DO_ARRANJO.filter(function (c) { return !dado || !dado[c]; });
    if (falta.length) {
      throw new Error("arranjo incompleto, falta: " + falta.join(", "));
    }
    var antesDaTela = gravou && LEITURAS ? LEITURAS.antes : null;
    aplicarArranjo(dado, gravou);
    if (antesDaTela) LEITURAS = { agora: dado.leituras.agora, antes: antesDaTela };
    if (comoReexame) {
      modo = "reexame"; segurando = null; naMao = null;
    }
    if (gravou && segurando) { segurando = null; naMao = null; modo = "mesa"; }
    dizerDeQuando();
    marcarOExaminar();
    pintar();
    return "ok";
  };

  var FRASES_SEM_LEITURA = {"sem-mapa": "Entradas ainda não mapeadas", "sem-leitura": "Não deu para ler as entradas deste computador"};
  var NADA_A_SUGERIR = "Nada a sugerir";
  var semLeitura = false;

  window.hefestoSemLeitura = function (porque) {
    var frase = FRASES_SEM_LEITURA[porque];
    if (!frase) throw new Error("sem leitura por um porquê desconhecido: " + porque);
    aplicarArranjo({ quando: frase, aparelhos: [], faces: [], mapa: {}, controles: [],
                     leituras: { agora: { rotulo: "", caminho: {} },
                                 antes: { rotulo: "", caminho: {} } } }, false);
    semLeitura = true;
    modo = "mesa"; segurando = null; naMao = null; editandoAp = null;
    var el = document.getElementById("de-quando");
    if (el) el.textContent = frase;
    var ex = document.querySelector(".topo #reexaminar");
    if (ex) ex.remove();
    pintar();
    return "ok";
  };

  var arranjoDaPorta = window.hefestoArranjo;
  window.hefestoArranjo = function (dado, como) {
    var estava = semLeitura;
    semLeitura = false;
    try { return arranjoDaPorta(dado, como); } catch (erro) { semLeitura = estava; throw erro; }
  };

  pintar();
})();
</script>

(() => {
  let dica = null, alvo = null;
  const descrever = (el, liga) => {
    const lista = (el.getAttribute('aria-describedby') || '').split(/\s+/).filter(t => t && t !== 'hef-dica');
    if (liga) lista.push('hef-dica');
    if (lista.length) el.setAttribute('aria-describedby', lista.join(' ')); else el.removeAttribute('aria-describedby');
  };
  const mostrar = el => {

    if (!dica) { dica = document.createElement('div'); dica.id = 'hef-dica'; dica.className = 'da-base'; dica.setAttribute('role', 'tooltip'); }
    alvo = el; dica.textContent = el.dataset.dica;
    descrever(el, true);
    if (!dica.isConnected) document.body.append(dica);
    const r = el.getBoundingClientRect(), d = dica.getBoundingClientRect();
    let x = r.left + r.width / 2 - d.width / 2, y = r.bottom + 8;
    if (y + d.height > innerHeight - 6) y = r.top - d.height - 8;

    dica.classList.add('visivel');

        el.setAttribute('data-dica', texto); el.setAttribute('data-dica-do-corte', '');

  const sincronizar = b => {

    if (b.dataset.governa)
      document.querySelectorAll(b.dataset.governa).forEach(el => el.classList.toggle('governado-pelo-jogo', on));
  };
  const sincronizarTodos = () => document.querySelectorAll('.modo-auto').forEach(sincronizar);
  sincronizarTodos();
  new MutationObserver(ms => {
    if (ms.some(m => m.type === 'childList' || (m.target.matches && m.target.matches('.modo-auto')))) sincronizarTodos();
  }).observe(document.body, {subtree: true, childList: true, attributes: true, attributeFilter: ['aria-pressed']});
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.modo-auto');

  });
  const fechar = () => document.querySelectorAll('.menu-hefesto.vivo').forEach(m => m.remove());
  document.addEventListener('contextmenu', e => {
    e.preventDefault(); fechar();
    const m = document.createElement('div'); m.className = 'menu-hefesto vivo'; m.setAttribute('role', 'menu');
    const sel = String(getSelection()).trim() !== '';

    const ligar = servico === 'parado' || servico === 'pausado';
    const item = ligar

      : '<button type="button" role="menuitem" data-gesto="menu-desligar" data-menu="desligar" data-dica="O Hefesto sai da frente e o jogo lê o controle direto">Desligar</button>';
    m.innerHTML = `<button type="button" role="menuitem" data-menu="copiar" ${sel ? '' : 'disabled'}>Copiar</button><hr>
      <button type="button" role="menuitem" data-gesto="menu-atualizar">Atualizar</button>
      ${item}
      <button type="button" role="menuitem" data-gesto="menu-reiniciar">Reiniciar</button>
      <button type="button" role="menuitem" data-gesto="menu-reconectar" data-dica="Desliga e liga de novo todos os controles">Reconectar controles</button><hr>
      <button type="button" role="menuitem" data-gesto="menu-fechar">Fechar</button>`;
    document.body.append(m);
    const r = m.getBoundingClientRect();
    m.style.left = Math.min(e.clientX, innerWidth - r.width - 6) + 'px';
    m.style.top = Math.min(e.clientY, innerHeight - r.height - 6) + 'px';
  });
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.menu-hefesto button');

})();
(() => {

  };

  const paradasDe = caixa => Array.from(caixa.querySelectorAll(PARADAS)).filter(aparece);
