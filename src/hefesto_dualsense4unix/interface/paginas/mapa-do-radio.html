   controle sozinho num adaptador dá ~800 relatórios/s, dois dividindo dão
   ~400 cada, em três adaptadores. Cada relatório de entrada custa 2 fatias.
   O que NÃO se ajeita são as saídas de ritmo fixo — a ponte de som ou de
   vibração, 93,75 por segundo —, e é isso que afoga um adaptador.

   NO PRODUTO os Hz vêm do contador (HCIGETDEVINFO por adaptador, o relógio do
   sensor por controle). AQUI a conta abaixo só imita o que o contador diria,
   para o desenho ter números de verdade na forma:
     ar      = C_eff − 187,5 × pontes − o som dos fones e caixas
     por controle = ar / 2 / controles
     voz     = 38% disso quando o microfone está ouvindo (106 Hz no máximo)
   C_eff = 1.500 é o hci0 medido (94% de 1.600); 187,5 é a ponte com k = 3,
   a hipótese de trabalho até a bancada medir o k. */
const PONTES_POR_ADAPTADOR = 2;   // medido: duas viveram 63 min no mesmo adaptador
const MARGINAL_DA_PONTE = 187.5;
const PARTE_DA_VOZ = HZ.voz / (HZ.voz + HZ.movimento_mic);
/* ABAIXO DE 125 Hz o giroscópio passa de 8 ms entre leituras — o número fica
   laranja. Corte de desenho, não medido; a bancada decide o de verdade. */
const HZ_QUE_ENGASGA = 125;

const ligadosEm = lid => moradoresDe(lid).filter(a => !a.esperando);
/* AS PONTES DE UM ADAPTADOR contam quem está esperando PS + Create: a vaga
   fica reservada, senão o «Equilibrar» mandaria dois para a mesma. */
const pontesDe = lid => moradoresDe(lid)
  .filter(a => a.tipo === 'controle' && a.ligado.ponte);
function arDe(lid) {
  const lug = LUGARES.find(l => l.id === lid);
  const ms = ligadosEm(lid);
  const pontes = ms.filter(a => a.tipo === 'controle' && a.ligado.ponte).length;
  const sons = ms.filter(a => a.tipo === 'caixa' || a.tipo === 'fone')
    .reduce((s, a) => s + a.entrada, 0);
  return lug.teto - MARGINAL_DA_PONTE * pontes - sons;
}
function hzDe(ap) {
  const n = ligadosEm(ap.lugar).filter(a => a.tipo === 'controle').length || 1;
  const parte = Math.max(0, arDe(ap.lugar)) / 2 / n;
  const voz = ap.ligado.mic ? Math.min(HZ.voz, parte * PARTE_DA_VOZ) : 0;
  return { mov: parte - voz, voz };
}
/* A PONTE DE UM CONTROLE: qual vaga ele ocupa, contando da primeira. */
function vagaDe(ap) {
  if (ap.tipo !== 'controle' || !ap.ligado.ponte) return 0;
  return pontesDe(ap.lugar).indexOf(ap) + 1;
}

/* R12 — UM MOVIMENTO DE CADA VEZ. A régua é a de 20/09
   (`plano_de_radio.ordem_de_redistribuicao`): primeiro tirar ponte de quem
   passou de duas; depois subir o PIOR movimento da mesa. Um movimento só vale
   se melhora — é o que faz o «Equilibrar» parar sozinho. */
function estadoDaMesa() {
  const alem = LUGARES.reduce((s, l) =>
    s + Math.max(0, pontesDe(l.id).length - PONTES_POR_ADAPTADOR), 0);
  const hzs = APARELHOS.filter(a => a.tipo === 'controle' && !a.esperando)
    .map(a => hzDe(a).mov);
  return { alem, pior: hzs.length ? Math.min(...hzs) : Infinity };
}
const melhorQue = (a, b) => a.alem < b.alem || (a.alem === b.alem && a.pior > b.pior + 10);
function sugestao(soPara) {
  const agora = estadoDaMesa();
  let melhor = null;
  for (const ap of APARELHOS) {
    if (ap.fixo || ap.esperando || ap.tipo !== 'controle') continue;
    for (const destino of LUGARES) {
      if (destino.id === ap.lugar || (soPara && destino.id !== soPara.id)) continue;
      if (ap.ligado.ponte && pontesDe(destino.id).length >= PONTES_POR_ADAPTADOR) continue;
      const de = ap.lugar;
      ap.lugar = destino.id;
      const depois = estadoDaMesa();
      ap.lugar = de;
      if (melhorQue(depois, agora) && (!melhor || melhorQue(depois, melhor.depois))) {
        melhor = { ap, destino, depois };
      }
    }
  }
  /* SEM MOVIMENTO QUE RESOLVA, com ponte além do limite: é a R4 — degrada e
     avisa. O aviso é o número laranja; nada é desligado. */
  if (!melhor) return agora.alem ? { impossivel: true } : null;
  return melhor;
}

/* --------------------------------------------------------- os desenhos
   UM ÍCONE POR COISA, em um lugar só. Trocar um ícone é uma linha, e nenhum
   `<use>` espalhado precisa saber o nome do símbolo. */
const ICONE_DO_APARELHO = {
  teclado: 'i-teclado', mouse: 'i-mouse', caixa: 'i-caixa',
  fone: 'i-fone', webcam: 'i-webcam', outro: 'i-radio',
};
const ICONE_DO_RADIO = {
  wifi: 'i-wifi', fone: 'i-fone', teclado: 'i-teclado',
  mouse: 'i-mouse', webcam: 'i-webcam',
};
const ICONE_DO_CUSTO = { mic: 'i-mic', som: 'i-som', haptica: 'i-vibra' };
/* A COR DE UM APARELHO. O controle traz a do plástico; os outros ganham uma
   cor própria, porque a barra do adaptador é segmentada POR DISPOSITIVO e
   precisa dizer de quem é cada bloco — ordem dela, 22/09: *"e diferenciando a
   cor do mouse e teclado"*.
   As cinco são dessaturadas de propósito: elas convivem, na mesma tela, com as
   cores de FEATURE (ciano, rosa, laranja, roxo) da barra de dentro. Se
   competissem, as duas segmentações virariam uma só mancha. */
/* O VÉU DE UMA COR: o mesmo tratamento das features, para que a linha de um
   teclado e a de um controle falem a mesma língua. */
function veuDaCor(cor, alfa) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(cor || '');
  if (!m) return cor;
  return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' +
    parseInt(m[3], 16) + ',' + alfa + ')';
}
/* AS CORES DOS CONTROLES SÃO AS DO PLÁSTICO DE VERDADE — a tabela dos 28 do
   `ds_limpo.svg`, a mesma que o `mapa-do-controle.html` usa como banco de
   provas. Ordem dela, 22/09: *"sim veja o mapa dos controles"*.

     Cosmic Red      #ae335a       Starlight Blue  #7eb8d4
     Nova Pink       #e35b8c       Galactic Purple #74588e

   E ELAS JÁ SÃO HARMÔNICAS, porque são cor de plástico: nenhuma passa de 60%
   de saturação. As que eu tinha inventado (#d13a3a, #8be9fd, #ff79c6, #a06ee1)
   eram tokens de INTERFACE, feitos para gritar em texto pequeno — quatro deles
   lado a lado numa barra viram arco-íris, e o vermelho ainda brigava com o
   vermelho de alerta do card estourado.

   O teclado, o mouse e os outros ficam em cinzas do mesmo mundo: eles não têm
   plástico declarado, e competir com os controles seria mentir sobre o que é
   identidade. */
const COR_DO_TIPO = {
  teclado: '#8b8fa8', mouse: '#6d7186', webcam: '#a8a08c',
  caixa: '#8c8299', fone: '#7e9aa8', outro: '#606062',
};
function corDe(ap) { return ap.cor || COR_DO_TIPO[ap.tipo] || 'var(--texto-mudo)'; }
/* A PRIMEIRA LETRA DE UMA FRASE DE TELA É MAIÚSCULA — ordem dela, 22/09, e
   vale para o que se lê e para o que se ouve. Um dono só evita a divergência
   que a auditoria achou: o `title` capitalizava e o `aria-label` não. */
const maiuscula = s => (s || '').replace(/^./, c => c.toUpperCase());
const virgula = n => String(n).replace('.', ',');

const NOME_CUSTO = {
  mic: 'microfone', som: 'som', haptica: 'vibração',
  entrada: 'o que o controle manda',
};

function icone(nome, classe) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'i' + (classe ? ' ' + classe : ''));
  s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#' + nome);
  s.appendChild(u);
  return s;
}
/* A SILHUETA CARREGA O `data-colorway`, que é o alvo que a aba08 já usa para
   repintar o desenho sem trocar o SVG inteiro — medido lá: trocar o `innerHTML`
   custava 50 KB na ponte a cada meio segundo. */
function silhueta(ap, classe) {
  const s = icone('i-ds', classe || 'ds');
  s.style.color = ap.cor || 'var(--texto-mudo)';
  s.dataset.campo = 'desenho';
  s.dataset.hefAlvo = 'atributo';
  s.dataset.hefAtributo = 'data-colorway';
  s.dataset.colorway = (ap.cor_nome || '').toLowerCase().replace(/ /g, '-');
  return s;
}

/* COMO UMA COISA SE CHAMA NUMA FRASE. Um dono só, porque a mesma regra vale na
   sugestão, no painel e em qualquer recado que venha depois. O nome da pessoa
   sozinho não diz QUAL controle — na tela do sistema são quatro «DualSense
   Wireless Controller» idênticos, e a cor do plástico é o que o olho resolve
   de longe. */
/* O NOME É DIGITADO POR ELA, e estas duas funções devolvem HTML — o balão já
   as jogava num `innerHTML`. Um nome de adaptador com `<` viraria marcação, e
   o que ela digitou sumiria da tela sem erro nenhum. A fuga é aqui, no dono
   do texto, e não em cada chamador. */
function texto(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/* «DE» E NÃO «DA» — achado em 22/09 na primeira frase com nome masculino:
   *"O Starlight Blue da Pedro"*. O artigo era fixo no feminino porque as
   primeiras frases foram escritas com o nome dela. Um nome não diz gênero de
   ninguém, e este produto é para qualquer pessoa — `de` está certo sempre. */
function comoSeChama(ap) {
  if (ap.tipo === 'controle' && ap.cor_nome) {
    /* SEM NOME, A COR BASTA. «O Starlight Blue de quem usa este» era a frase
       que saía, e ela é pior que o silêncio: o controle já está identificado
       pela cor, que é a identidade dele nesta tela. */
    return 'o <b>' + texto(ap.cor_nome) + '</b>' +
      (ap.nome ? ' de <b>' + texto(ap.nome) + '</b>' : '');
  }
  /* O ARTIGO É MINÚSCULO E SEGUE O TIPO — «Mover O Cosmic Red» e «O Caixa de
     som» saíam na tela. Quem começa frase passa por `maiuscula`. */
  return (ARTIGO_DO_TIPO[ap.tipo] || 'o') + ' <b>' + texto(ap.nome) + '</b>';
}
const ARTIGO_DO_TIPO = { caixa: 'a', webcam: 'a' };
function comoSeChamaOLugar(lug) {
  return lug.nome ? 'o <b>' + texto(lug.nome) + '</b>'
                  : 'a <b>Entrada ' + texto(lug.entrada) + '</b>';
}
/* O QUE UM LEITOR DE TELA ANUNCIA. A cor do plástico é a identidade do
   aparelho, e ela existe só como pixel — quem não enxerga cor fica com quatro
   «Vitória, Pedro, Ana, Rafa» e nenhuma das duas metades da resposta. */
function comoSeLe(ap) {
  const q = ap.tipo === 'controle' && ap.cor_nome
    ? 'controle ' + ap.cor_nome : ap.tipo;
  return ap.nome + ', ' + q;
}

/* --------------------------------------------------------------- pintar */
function pintar() {
  const sala = document.getElementById('sala');
  sala.innerHTML = '';

  for (const lug of LUGARES) {
    const moradores = moradoresDe(lug.id);
    const pontes = pontesDe(lug.id);
    const esperando = moradores.filter(a => a.esperando);
    const card = document.createElement('div');
    card.className = 'lugar' + (pontes.length > PONTES_POR_ADAPTADOR ? ' cheio' : '') +
      (esperando.length ? ' esperando' : '');
    card.dataset.campo = 'lugar';
    card.dataset.alvo = lug.id;
    /* O ID NO PRÓPRIO BLOCO: o destino de um arrasto é o adaptador inteiro,
       aberto ou fechado, e a lista interna some quando ele fecha. */
    card.dataset.id = lug.id;

    // ---- a linha de cima: nome · onde · conta ----------------------------
    const topo = document.createElement('div');
    topo.className = 'lugar-topo';

    if (lug.aberto === undefined) {
      /* No primeiro desenho abre UM só: o que estourou mais. */
      const pior = LUGARES.filter(l => pontesDe(l.id).length > PONTES_POR_ADAPTADOR)
        .sort((a, b) => pontesDe(b.id).length - pontesDe(a.id).length)[0];
      for (const o of LUGARES) o.aberto = false;
      if (pior) pior.aberto = true;
    }
    const abre = document.createElement('button');
    abre.className = 'abre-lugar';
    /* O glifo é desenho: o nome é o aria-label (senão o leitor lê duas vezes). */
    abre.innerHTML = '<span aria-hidden="true">\u25B6</span>';
    abre.setAttribute('aria-expanded', String(lug.aberto));
    abre.title = (lug.aberto ? 'Esconder' : 'Ver') + ' os aparelhos deste adaptador';
    abre.setAttribute('aria-label', abre.title);
    abre.dataset.gesto = 'abrir-adaptador';
    abre.dataset.alvo = lug.id;
    /* ABRIR UM FECHA OS OUTROS — ordem dela, 22/09: *"quando extende um o outro
       minimiza"*. É o que garante o limite vertical sem ninguém ter de pensar
       nele: a seção tem UMA altura, e ela não cresce com o número de
       adaptadores. É a mesma forma que a aba já usa entre as três seções dela
       (um `<input type=radio>` por quadro). */
    abre.addEventListener('click', () => {
      const abrindo = !lug.aberto;
      for (const o of LUGARES) o.aberto = false;
      lug.aberto = abrindo;
      pintar();
    });
    topo.appendChild(abre);

    const nome = document.createElement('input');
    nome.className = 'lugar-nome'; nome.value = lug.nome;
    /* «SEM NOME» NÃO É UM NOME — é um campo esperando. */
    nome.placeholder = 'Dê um nome a este adaptador';
    nome.setAttribute('aria-label', 'Nome deste adaptador');
    nome.dataset.gesto = 'adaptador-renomear';
    nome.dataset.alvo = lug.id;
    nome.dataset.campo = 'lugar-nome';
    nome.dataset.hefAlvo = 'valor';
    /* A LARGURA SEGUE O TEXTO — «Extensor à esquer» cortado é o mesmo defeito
       do «Caixa de» que esta seção existe para matar. */
    const caberNome = () => {
      nome.style.width = Math.max(
        (nome.value || nome.placeholder).length + 2, 10) + 'ch';
    };
    caberNome();
    nome.addEventListener('input', caberNome);
    nome.addEventListener('change', () => { lug.nome = nome.value; pintar(); });
    topo.appendChild(nome);

    const onde = document.createElement('span');
    onde.className = 'onde';
    if (lug.face) {
      const m = document.createElement('span');
      m.className = 'marca ' + (lug.tipo === 'hub' ? 'hub' : 'direto');
      m.appendChild(icone(lug.tipo === 'hub' ? 'i-hub' : 'i-placa'));
      m.title = lug.face; m.setAttribute('role', 'img');
      m.setAttribute('aria-label', lug.face);
      onde.appendChild(m);
      const e = document.createElement('span');
      e.textContent = 'Entrada ' + lug.entrada;
      onde.appendChild(e);
    }
    /* QUEM ESTÁ VARRENDO GANHA MARCA, e a marca não é um alarme: é a razão
       de a barra dele estar mais curta. Sem ela a antena encolhe sozinha e a
       pessoa não sabe por quê — o pior tipo de número numa tela. */
    if (lug.varrendo) {
      const v = document.createElement('span');
      v.className = 'marca varrendo';
      v.appendChild(icone('i-varrendo'));
      v.title = 'Outro programa está procurando aparelhos por aqui. Controle novo vai para outro adaptador.';
      v.setAttribute('role', 'img'); v.setAttribute('aria-label', v.title);
      v.dataset.campo = 'lugar-varrendo';
      onde.appendChild(v);
    }
    /* DOIS RÁDIOS NO MESMO BARRAMENTO SE ATRAPALHAM, e isso nunca esteve na
       tela — só no Check-up, como uma linha de texto. */
    /* COLADO É PORTA VIZINHA, NÃO BARRAMENTO — o estudo de 23/09: a marca
       acusava todo par no mesmo barramento, inclusive os que já pulam uma
       casa, que é o conselho aplicado na mesa dela. A régua é a da faixa das
       portas, um dono só. */
    const portaDele = PORTAS.find(p => p.ocupa === lug.id);
    const aPorta = portaDele ? comoEstaAPorta(portaDele) : null;
    if (aPorta && aPorta.estado !== 'bom' && aPorta.estado !== 'neutro') {
      const j = document.createElement('span');
      j.className = 'marca junto';
      j.appendChild(icone('i-aviso'));
      j.title = maiuscula(aPorta.porque) + '.';
      j.setAttribute('role', 'img'); j.setAttribute('aria-label', j.title);
      onde.appendChild(j);
    }
    /* A ENTRADA USB 3.0 É UM VIZINHO QUE NÃO APARECE NA RÉGUA, porque não é
       um aparelho — é a tomada. `docs/protocol/por-que-usb3-atrapalha-24ghz.md`
       traz a fonte: da ordem de 20 dB acrescentados na faixa de 2,4 GHz. */
    if (/3\.0/.test(lug.usb || '')) {
      const u = document.createElement('span');
      u.className = 'marca usb3';
      u.appendChild(icone('i-aviso'));
      u.title = 'Entrada USB 3.0: faz ruído no rádio. Prefira uma 2.0.';
      u.setAttribute('role', 'img'); u.setAttribute('aria-label', u.title);
      onde.appendChild(u);
    }
    /* R1 — O DESTINO DIZ O QUE FAZER COM O CONTROLE NA MÃO. Aparece fechado
       ou aberto, porque arrastar não abre o destino (decisão dela, 22/09). */
    for (const ap of esperando) {
      const e = document.createElement('span');
      e.className = 'espera';
      e.dataset.campo = 'esperando-parear';
      e.dataset.alvo = ap.id;
      e.appendChild(silhueta(ap));
      e.append('Segure PS + Create');
      e.title = 'Segure PS + Create no ' + (ap.cor_nome || ap.nome) + ' até a luz piscar.';
      onde.appendChild(e);
    }
    if (!lug.face) {
      //: `<a href>` e não `<button data-gesto>`: este atalho abre a MESMA
      //: `#mapear-entrada-a-entrada` do rodapé, e ela é uma âncora `:target`
      //: no produto. Um segundo nome para o mesmo ato parte o contrato.
      const b = document.createElement('a');
      b.className = 'ensina';
      b.href = '#mapear-entrada-a-entrada';
      b.appendChild(icone('i-uma-a-uma'));
      b.append('Onde fica?');
      b.title = 'Mapear Entrada a Entrada';
      b.dataset.alvo = lug.id;
      b.addEventListener('click', () => ensinarOnde(lug));
      onde.appendChild(b);
    }
    topo.appendChild(onde);

    if (lug.quedas > 0) {
      const sino = document.createElement('button');
      sino.className = 'sino';
      sino.appendChild(icone('i-aviso'));
      sino.title = lug.quedas + ' quedas — ver quando';
      sino.setAttribute('aria-label', sino.title);
      sino.dataset.gesto = 'adaptador-historico';
      sino.dataset.alvo = lug.id;
      sino.addEventListener('click', () => abrirHistorico(lug));
      topo.appendChild(sino);
    }

    const conta = document.createElement('span');
    conta.className = 'lugar-conta';
    /* R10 — «PONTES N DE 2» no lugar do «232%». O número é CONTAGEM, não
       estimativa: quantos controles recebem som ou vibração por este rádio. */
    const n = pontes.length;
    const q = document.createElement('span');
    q.className = 'quanto canais-do-lugar ' +
      (n > PONTES_POR_ADAPTADOR ? 'estourou' : (n === PONTES_POR_ADAPTADOR ? 'apertado' : ''));
    q.dataset.campo = 'lugar-pontes';
    q.appendChild(icone('i-som'));
    q.append(n + '/' + PONTES_POR_ADAPTADOR);
    q.title = 'Controles com som ou vibração: ' + n + ' de ' + PONTES_POR_ADAPTADOR +
      (n > PONTES_POR_ADAPTADOR ? ' — o som engasga' : '');
    q.setAttribute('role', 'img');
    q.setAttribute('aria-label', q.title);
    conta.appendChild(q);

    const canais = canaisDe(lug.id);
    const ch = document.createElement('span');
    ch.className = 'canais-do-lugar' + (canais < CANAIS_DO_BT ? ' apertado' : '');
    ch.appendChild(icone('i-radio'));
    ch.append(canais + '/' + CANAIS_DO_BT);
    ch.title = canais === CANAIS_DO_BT ? 'Usa os ' + CANAIS_DO_BT + ' canais'
      : 'Evita ' + (CANAIS_DO_BT - canais) + ' dos ' + CANAIS_DO_BT + ' canais (vizinhos)';
    ch.setAttribute('role', 'img');
    ch.setAttribute('aria-label', ch.title);
    conta.appendChild(ch);

    const livres = PONTES_POR_ADAPTADOR - n;
    const sobra = document.createElement('span');
    sobra.className = 'sobra' + (livres < 0 ? ' passou' : (livres === 0 ? ' nao-cabe' : ''));
    if (livres >= 1) {
      sobra.appendChild(icone('i-mais'));
      for (let i = 0; i < livres; i++) sobra.appendChild(icone('i-ds', 'ds'));
      sobra.title = livres === 1 ? 'Cabe mais 1 com som' : 'Cabem mais ' + livres + ' com som';
    } else {
      sobra.appendChild(icone('i-nao-cabe'));
      sobra.title = livres < 0 ? 'Passou do limite: o som engasga' : 'Cheio de som (sem som, cabe)';
    }
    sobra.setAttribute('role', 'img');
    sobra.setAttribute('aria-label', sobra.title);
    conta.appendChild(sobra);
    topo.appendChild(conta);
    // ---- a barra: UMA VAGA POR PONTE, na cor de quem a ocupa ------------
    const barra = document.createElement('div');
    barra.className = 'barra-do-lugar';
    const trilho = document.createElement('div');
    trilho.className = 'trilho vagas';
    trilho.dataset.campo = 'lugar-barra';
    trilho.dataset.alvo = lug.id;
    trilho.dataset.hefAlvo = 'html';
    const escala = Math.max(PONTES_POR_ADAPTADOR, n);
    for (let i = 0; i < escala; i++) {
      const ap = pontes[i];
      const v = document.createElement('div');
      v.className = 'vaga-ponte' + (ap ? ' cheia' : '') +
        (i >= PONTES_POR_ADAPTADOR ? ' alem' : '') + (ap && ap.esperando ? ' reservada' : '');
      if (ap) {
        v.style.background = veuDaCor(corDe(ap), .5);
        if (i < PONTES_POR_ADAPTADOR) v.style.borderColor = corDe(ap);
        v.appendChild(icone(ICONE_DO_CUSTO[ap.ligado.ponte]));
        v.title = (ap.cor_nome || ap.nome) + ' · ' + NOME_CUSTO[ap.ligado.ponte] +
          (ap.esperando ? ' · esperando' : '') + (i >= PONTES_POR_ADAPTADOR ? ' · passou do limite' : '');
      } else {
        v.title = 'Vaga livre';
      }
      trilho.appendChild(v);
    }
    barra.appendChild(trilho);
    if (n > PONTES_POR_ADAPTADOR) {
      const marca = document.createElement('div');
      marca.className = 'marca-do-teto';
      marca.style.left = 'calc(' + (PONTES_POR_ADAPTADOR / escala) * 100 + '% - 1.5px)';
      marca.title = 'Limite: ' + PONTES_POR_ADAPTADOR;
      barra.appendChild(marca);
      trilho.classList.add('estourado');
    }
    topo.insertBefore(barra, conta);
    card.appendChild(topo);
    if (!lug.aberto) { sala.appendChild(card); continue; }

    // ---- uma linha por dispositivo, na largura toda -----------------------
    const lista = document.createElement('div');
    lista.className = 'aparelhos';
    lista.dataset.lugar = lug.id;
    lista.dataset.campo = 'doca';
    lista.dataset.alvo = lug.id;
    for (const ap of moradores) lista.appendChild(linhaDe(ap));

    /* O ADAPTADOR SOBRANDO VIRA UMA LINHA, com a vaga de soltar e a lâmpada —
       as duas coisas que ela pediu que faltavam nos extensores. */
    /* A VAGA DE SOLTAR EXISTE SEMPRE — ordem dela: *"falta espaço pra soltar e
       arrastar cada dispositivo no extensor à direita e no à esquerda"*. Ela
       não some quando não cabe mais um CONTROLE: cabe um teclado, um mouse,
       uma webcam, e o alvo de arrastar não pode desaparecer. */
    {
      const fila = document.createElement('div');
      fila.className = 'soltar-fila';
      const pe = document.createElement('button');
      pe.className = 'soltar';
      pe.appendChild(icone('i-soltar'));
      pe.append(moradores.length ? 'Arraste outro para cá' : 'Arraste um aparelho para cá');
      pe.title = 'Trazer um aparelho para cá';
      pe.dataset.gesto = 'trazer-para-ca';
      pe.dataset.alvo = lug.id;
      pe.addEventListener('click', () => quemVemPraCa(lug));
      fila.appendChild(pe);
      const s = sugestaoPara(lug);
      if (s) {
        const lamp = document.createElement('button');
        lamp.className = 'lampada';
        lamp.appendChild(icone('i-lampada'));
        lamp.title = 'Quem funciona melhor aqui';
        lamp.setAttribute('aria-label', lamp.title);
        lamp.dataset.gesto = 'sugerir-alocacao';
        lamp.dataset.alvo = lug.id;
        lamp.addEventListener('click', () => mostrarBalao(card, s));
        fila.appendChild(lamp);
      }
      lista.appendChild(fila);
    }
    card.appendChild(lista);
    sala.appendChild(card);
  }

  document.getElementById('conta').textContent =
    APARELHOS.filter(a => a.tipo === 'controle').length + ' controles · ' +
    LUGARES.length + ' adaptadores';
  pintarEspectro();
  pintarPortas();
}

/* A SUGESTÃO PARA UM LUGAR: quem, do adaptador mais cheio, caberia aqui e
   melhoraria o pior. É a mesma conta da `sugestao()` global, mirada num
   destino — a lâmpada é por adaptador, então a pergunta também é. */
function sugestaoPara(destino) {
  const s = sugestao(destino);
  return s && !s.impossivel ? s : null;
}

/* A PERGUNTA — a janela que vem ANTES do ato (R7, R8). O terceiro botão é o
   da R3 + R4: «ligar aqui mesmo» para quem não pode re-parear agora. */
let _fecharPergunta = null;
function perguntar(diz, rotuloSim, sim, nao, outro) {
  const caixa = document.getElementById('pergunta');
  const veu = document.getElementById('veu-pergunta');
  if (!caixa) return;
  const antesDoFoco = document.activeElement;
  caixa.querySelector('.diz').innerHTML = diz;
  const s = caixa.querySelector('#pergunta-sim');
  const n = caixa.querySelector('#pergunta-nao');
  const o = caixa.querySelector('#pergunta-outro');
  s.textContent = rotuloSim;
  /* CLONAR PARA TROCAR O OUVINTE: `addEventListener` empilha, e a segunda
     pergunta da sessão dispararia a resposta da primeira junto. */
  const s2 = s.cloneNode(true), n2 = n.cloneNode(true), o2 = o.cloneNode(true);
  s.replaceWith(s2); n.replaceWith(n2); o.replaceWith(o2);
  o2.hidden = !outro;
  if (outro) o2.textContent = outro.rotulo;
  const fechar = () => {
    caixa.hidden = true;
    veu.classList.remove('aberto');
    document.removeEventListener('keydown', porEscape, true);
    _fecharPergunta = null;
    if (antesDoFoco && antesDoFoco.focus) antesDoFoco.focus();
  };
  const porEscape = e => {
    if (e.key === 'Escape') { e.stopPropagation(); fechar(); if (nao) nao(); }
  };
  s2.addEventListener('click', () => { fechar(); sim(); });
  n2.addEventListener('click', () => { fechar(); if (nao) nao(); });
  if (outro) o2.addEventListener('click', () => { fechar(); outro.aoEscolher(); });
  /* O VÉU FECHA, e fechar é CANCELAR. Um clique fora que confirmasse seria a
     pior saída possível para um ato que derruba o controle. */
  veu.onclick = () => { fechar(); if (nao) nao(); };
  document.addEventListener('keydown', porEscape, true);
  _fecharPergunta = () => { fechar(); if (nao) nao(); };
  caixa.hidden = false;
  veu.classList.add('aberto');
  s2.focus();
}

/* R1 + R7 — MOVER É DESCONECTAR, ESQUECER E PAREAR DE NOVO, e a janela diz
   as três coisas antes. Palavra dela, 23/09: *"No ato de mover e arrasta pra
   outro dispositivo. No pop UP ele aparece falando que vai fazer isso se vc
   der o ok"*.  <!-- (noqa-acento) -->

   NÃO HÁ MAIS «SAI E VOLTA SOZINHO». O estudo derrubou: o controle guarda UM
   computador só, e a chave do pareamento é presa aos dois endereços. Um bond
   velho no destino não traz o controle de volta — ele chama sempre o último
   que o pareou. Toda mudança passa por PS + Create, e a janela não promete
   outra coisa. */
function comoSeParea(ap) {
  if (ap.tipo === 'controle') return 'Depois, segure <b>PS + Create</b> até a luz piscar.';
  return 'Depois, ponha ' + (ARTIGO_DO_TIPO[ap.tipo] || 'o') + ' ' + ap.tipo + ' para parear.';
}
function pedirParaMover(ap, destinoId, depois) {
  if (!ap || ap.lugar === destinoId || ap.fixo) return false;
  const lug = LUGARES.find(l => l.id === destinoId);
  document.querySelectorAll('.lugar.alvo').forEach(l => l.classList.remove('alvo'));
  const alvo = document.querySelector('.lugar[data-id="' + destinoId + '"]');
  if (alvo) alvo.classList.add('alvo');
  const ela = ARTIGO_DO_TIPO[ap.tipo] === 'a';
  /* R4 — se lá também não cabe a ponte, a janela diz o fato ANTES. */
  const cheio = ap.tipo === 'controle' && ap.ligado.ponte &&
    pontesDe(destinoId).length >= PONTES_POR_ADAPTADOR;
  /* DUAS LINHAS, E A PRIMEIRA DIZ «SÓ ELE» — ela, 23/09: *"moveriamos por
     exemplo 1 controle por vez. Apagaria esse um controle (…) E não apagar
     tudo"*.  <!-- (noqa-acento) --> */
  perguntar(
    'Mover ' + comoSeChama(ap) + ' para ' + comoSeChamaOLugar(lug) + '?<br>' +
    'Só ' + (ela ? 'ela' : 'ele') + ' sai daqui. ' + comoSeParea(ap) +
    (cheio ? ' Lá o som pode engasgar.' : ''),
    'Mover',
    () => { moverAgora(ap, destinoId); if (depois) depois(); },
    () => { if (alvo) alvo.classList.remove('alvo'); });
  return true;
}

/* R3 + R4 — A TERCEIRA PONTE NUM ADAPTADOR PEDE MOVER, sempre. Se ela não
   puder re-parear agora, «Ligar aqui mesmo» liga — o som engasga, e a tela
   diz o fato no número laranja. Sem vaga em lugar nenhum, só resta ligar. */
function pedirVagaDePonte(ap, k) {
  const lug = LUGARES.find(l => l.id === ap.lugar);
  let destino = null, melhor = null;
  for (const d of LUGARES) {
    if (d.id === ap.lugar || pontesDe(d.id).length >= PONTES_POR_ADAPTADOR) continue;
    const de = ap.lugar;
    ap.lugar = d.id; ap.ligado.ponte = k;
    const est = estadoDaMesa();
    ap.lugar = de; ap.ligado.ponte = null;
    if (!melhor || melhorQue(est, melhor)) { melhor = est; destino = d; }
  }
  const ligarAqui = () => { ap.ligado.ponte = k; pintar(); };
  const oQue = k === 'som' ? 'o som' : 'a vibração';
  if (!destino) {
    perguntar('Todas as entradas já têm ' + PONTES_POR_ADAPTADOR +
      ' controles com som ou vibração.<br>Ligar ' + oQue + ' mesmo assim? Pode engasgar.',
      'Ligar', ligarAqui);
    return;
  }
  perguntar(maiuscula(comoSeChamaOLugar(lug)) + ' já tem ' + PONTES_POR_ADAPTADOR +
    ' controles com som ou vibração.<br>Mover ' + comoSeChama(ap) + ' para ' +
    comoSeChamaOLugar(destino) + ' e ligar lá?',
    'Mover e ligar',
    () => { ap.ligado.ponte = k; moverAgora(ap, destino.id); },
    null,
    { rotulo: 'Ligar aqui', aoEscolher: ligarAqui });
}

/* O ATO. O controle sai daqui (esquecido de propósito — a marca impede o
   autorestore de ressuscitar a conexão) e ESPERA no destino, com a vaga de
   ponte guardada. Chegou = o `HID_PHYS` diz o adaptador certo. */
const PS_CREATE_NO_MOCKUP_MS = 4000;
function moverAgora(ap, destinoId) {
  if (!ap || ap.lugar === destinoId) return false;
  ap.lugar = destinoId;
  ap.bonds = [];
  ap.esperando = true;
  pintar();
  if (!window.SEM_RELOGIO) setTimeout(() => chegou(ap), PS_CREATE_NO_MOCKUP_MS);
  return true;
}
function chegou(ap) {
  if (!ap.esperando) return;
  ap.esperando = false;
  ap.bonds = [ap.lugar];
  pintar();
  /* A CONFIRMAÇÃO É A PISCADA (R8). */
  const card = document.querySelector('.lugar[data-id="' + ap.lugar + '"]');
  if (card) {
    card.classList.add('recebeu');
    setTimeout(() => card.classList.remove('recebeu'), 900);
  }
}

/* R6 REVISTA POR ELA, 23/09: nada se apaga em lote. A conexão velha de um
   controle em outro adaptador sai quando AQUELE controle é movido — é o
   `bonds = []` de `moverAgora`. As outras ficam. */

function mostrarBalao(card, s) {
  const velho = card.querySelector('.balao');
  if (velho) { velho.remove(); return; }
  const b = document.createElement('div');
  b.className = 'balao';
  b.dataset.campo = 'sugestao-do-radio';
  b.dataset.hefAlvo = 'html';
  b.appendChild(icone('i-lampada'));
  if (s.ap.tipo === 'controle') b.appendChild(silhueta(s.ap));
  const t = document.createElement('span');
  t.innerHTML = maiuscula(comoSeChama(s.ap)) + ' funciona melhor n' + comoSeChamaOLugar(s.destino);
  b.appendChild(t);
  /* O «MOVER» DO BALÃO ABRE A MESMA JANELA de todo mover: é ela que diz o que
     será desconectado e esquecido (R7). Um atalho que pulasse a janela seria
     o único mover sem aviso. */
  const ok = document.createElement('button');
  ok.className = 'ok'; ok.textContent = 'Mover';
  ok.dataset.gesto = 'aceitar-sugestao';
  ok.dataset.alvo = s.ap.id;
  ok.addEventListener('click', () => { b.remove(); pedirParaMover(s.ap, s.destino.id); });
  b.appendChild(ok);
  card.appendChild(b);
  ok.focus();
}

/* ------------------------------------------------ a linha de um dispositivo
   ELA OCUPA A LARGURA TODA, e é o pedido dela: um controle espremido em 386 px
   não tem onde desenhar no que gasta o rádio. */
function linhaDe(ap) {
  const linha = document.createElement('div');
  linha.className = 'linha' + (ap.esperando ? ' esperando' : '');
  linha.draggable = !ap.fixo && !ap.esperando;
  linha.dataset.id = ap.id;
  linha.dataset.campo = 'aparelho';
  linha.dataset.alvo = ap.id;
  /* ARRASTAR NÃO PODE SER O ÚNICO CAMINHO. Num app de acessibilidade, um gesto
     que só existe no rato exclui exatamente quem o produto atende. */
  if (!ap.fixo && !ap.esperando) {
    linha.tabIndex = 0;
    linha.setAttribute('role', 'button');
    linha.setAttribute('aria-label', comoSeLe(ap) + ' — Enter para mudar de adaptador');
    linha.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); paraOndeVai(ap); }
    });
  } else {
    linha.setAttribute('aria-label', comoSeLe(ap));
  }

  if (ap.tipo === 'controle') {
    linha.appendChild(silhueta(ap));
  } else {
    const ic = icone(ICONE_DO_APARELHO[ap.tipo] || 'i-radio', 'ico');
    ic.style.color = corDe(ap);
    linha.appendChild(ic);
  }

  /* TODO NOME É EDITÁVEL — ordem dela, 22/09: *"todo texto ali tem que permitir
     que eu possa alterar. Vitória, Caixa de som, teclado, mouse"*. */
  const nome = document.createElement('input');
  nome.className = 'nome'; nome.value = ap.nome;
  nome.setAttribute('aria-label', 'Nome deste aparelho');
  nome.title = 'Clique para renomear; arraste para mover';
  /* ARRASTAR PELO NOME, e o campo continua editável. Um `<input>` come o
     arrasto do pai: quem pegava a linha pelo nome não levava nada. Ele nasce
     arrastável e SÓ deixa de ser quando ela clica dentro dele — aí o arrasto
     volta a ser o de selecionar texto, que é o que se espera de um campo em
     edição. */
  nome.draggable = true;
  nome.addEventListener('focus', () => { nome.draggable = false; });
  nome.addEventListener('blur', () => { nome.draggable = true; });
  nome.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', ap.id);
    e.dataTransfer.effectAllowed = 'move';
    linha.classList.add('arrastando');
  });
  nome.addEventListener('dragend', () => linha.classList.remove('arrastando'));
  nome.dataset.gesto = 'aparelho-renomear';
  nome.dataset.alvo = ap.id;
  nome.dataset.campo = 'aparelho-nome';
  nome.dataset.hefAlvo = 'valor';
  nome.addEventListener('change', () => { ap.nome = nome.value; pintar(); });
  nome.addEventListener('mousedown', e => e.stopPropagation());
  nome.addEventListener('keydown', e => e.stopPropagation());
  linha.appendChild(nome);

  // ---- a barra de features, com os espaços reservados ---------------------
  const features = document.createElement('div');
  features.className = 'features';
  /* AS DUAS DIREÇÕES, E ELAS NÃO DISPUTAM NADA ENTRE SI — pedido dela,
     22/09/2026, depois de perguntar como tudo funciona junto nos jogos dela.

     A tela punha as três barras lado a lado, e lado a lado se lê como UMA
     fila. Não é: o giroscópio, o acelerômetro, o touchpad e o microfone vão
     no que o controle MANDA; o som e a vibração vêm no que o PC ESCREVE nele.
     São dois caminhos, e é por isso que ela pode ter tudo ligado ao mesmo
     tempo — foi o que ela viu no Don't Scream, no Big Walk e no PRAGMATA.

     A separação é uma linha vertical e uma seta por grupo. Sem palavra nova
     na tela: o que cada seta quer dizer fica na dica dela. */
  const faixa = document.createElement('div');
  faixa.className = 'faixa-do-aparelho';
  /* A escala é o aparelho mais caro DESTE adaptador: o maior enche a linha e os
     outros encurtam na proporção. A comparação entre adaptadores é trabalho da
     barra de cima, que é segmentada por dispositivo na escala do teto. */
  /* R10 — A LARGURA NÃO É MAIS CUSTO SOMADO. Cada linha ocupa a largura toda
     e as partes dentro dela são os Hz de agora. */
  faixa.style.width = '100%';
  features.appendChild(faixa);

  /* R1 — QUEM ESPERA PS + CREATE não manda nada ainda: a linha diz o gesto e
     só. Os Hz voltam quando o controle chega. */
  if (ap.esperando) {
    faixa.remove();
    const e = document.createElement('span');
    e.className = 'segure';
    e.textContent = 'Segure PS + Create';
    features.appendChild(e);
    linha.appendChild(features);
    const z = document.createElement('span');
    z.className = 'fatias';
    z.textContent = '\u2013';
    linha.appendChild(z);
    return linha;
  }

  if (ap.tipo === 'controle') {
    /* VAGA 1 — E ELA SE DIVIDE. O que o controle manda cabe numa fila só, e
       a fila tem duas partes: MOVIMENTO e VOZ. O microfone não é um acréscimo
       na ponta — é a divisória andando. Quem liga o mic vê o pedaço do
       movimento ENCOLHER, que é o fato. */
    const hz = hzDe(ap);
    const v1 = document.createElement('div');
    v1.className = 'vaga entrada fixa partida';
    v1.style.flex = ap.entrada + (ap.ligado.mic ? ap.mic : 0) + ' 0 0';
    v1.title = 'O que o controle manda';

    const mov = document.createElement('span');
    mov.className = 'parte movimento' + (hz.mov < HZ_QUE_ENGASGA ? ' pouco' : '');
    mov.style.flex = Math.max(hz.mov, 40) + ' 1 0';
    mov.appendChild(icone('i-sinal'));
    const hz1 = document.createElement('span');
    hz1.className = 'hz';
    hz1.dataset.campo = 'hz-movimento';
    hz1.dataset.alvo = ap.id;
    hz1.textContent = Math.round(hz.mov) + ' Hz';
    mov.appendChild(hz1);
    /* R10 — O NÚMERO É O DE AGORA, contado; a dica diz de onde ele vem e o
       que o move, sem prometer conta. */
    mov.title = 'Movimento: ' + Math.round(hz.mov) + ' por segundo' +
      (hz.mov < HZ_QUE_ENGASGA ? ' (baixo)' : '');

    /* OS PASSAGEIROS viajam dentro do relatório de movimento, e por isso ficam
       DENTRO desta parte: é onde eles de fato andam. */
    for (const [ic, rot] of PASSAGEIROS) {
      const s = document.createElement('span');
      s.className = 'passageiro';
      s.appendChild(icone(ic));
      s.title = rot + ': vem junto, não custa nada';
      s.setAttribute('role', 'img');
      s.setAttribute('aria-label', s.title);
      mov.appendChild(s);
    }
    v1.appendChild(mov);

    /* O MICROFONE É A OUTRA PARTE DA FILA, e o botão dele É essa parte:
       apertado, ele ocupa a largura que toma. Um selo do tamanho de um ícone
       desenharia um custo pequeno onde o custo é 40% da fila. */
    const mic = document.createElement('button');
    mic.className = 'parte voz selo-mic';
    mic.style.flex = ap.ligado.mic ? Math.max(hz.voz, 40) + ' 1 0' : '0 0 26px';
    mic.appendChild(icone('i-mic'));
    if (ap.ligado.mic) {
      const hzv = document.createElement('span');
      hzv.className = 'hz'; hzv.textContent = Math.round(hz.voz) + ' Hz';
      mic.appendChild(hzv);
    }
    mic.setAttribute('aria-pressed', String(ap.ligado.mic));
    mic.setAttribute('aria-label', 'Microfone de ' + ap.nome);
    mic.title = 'Microfone: divide a fila com o movimento';
    mic.dataset.gesto = 'custo-mic';
    mic.dataset.alvo = ap.id;
    mic.addEventListener('click', e => {
      e.stopPropagation(); ap.ligado.mic = !ap.ligado.mic; pintar();
    });
    v1.appendChild(mic);

    const manda = document.createElement('div');
    manda.className = 'fluxo manda';
    manda.style.flex = (ap.entrada + (ap.ligado.mic ? ap.mic : 0)) + ' 1 0';
    const setaM = icone('i-manda', 'seta');
    setaM.setAttribute('role', 'img');
    manda.appendChild(setaM);
    manda.appendChild(v1);
    manda.title = 'O que o controle manda';
    faixa.appendChild(manda);

    /* VAGA 2 — a ponte. UM espaço, dois ocupantes possíveis: pelo rádio o
       escritor manda som OU vibração, nunca os dois. */
    const ponte = document.createElement('div');
    ponte.className = 'ponte';
    ponte.style.flex = ap.ponte + ' 0 0';
    for (const k of ['som', 'haptica']) {
      const b = document.createElement('button');
      b.className = 'vaga ' + k;
      b.appendChild(icone(ICONE_DO_CUSTO[k]));
      if (ap.ligado.ponte === k) {
        const hz = document.createElement('span');
        hz.className = 'hz'; hz.textContent = Math.round(HZ.ponte) + ' Hz';
        b.appendChild(hz);
      }
      b.setAttribute('aria-pressed', String(ap.ligado.ponte === k));
      /* O RÓTULO COMEÇA MAIÚSCULO como qualquer outra frase da tela. O
         `NOME_CUSTO` é minúsculo porque ele entra NO MEIO de frases («acender
         o som»), e quem usa no começo é que capitaliza — o `title` já fazia,
         o `aria-label` não, e a divergência só aparecia para quem ouve. */
      b.setAttribute('aria-label', maiuscula(NOME_CUSTO[k]) + ' de ' + ap.nome);
      /* A TELA DIZ O QUE ACONTECE, e só. A razão de ser um de cada vez, a
         procedência da medição e a passada que ainda falta estão no
         cabeçalho deste arquivo e no mapa de canais. Ordem dela, 22/09:
         *"sem tolltips que refutem o projeto"*.  <!-- (noqa-acento) --> */
      const alem = ap.ligado.ponte === k && vagaDe(ap) > PONTES_POR_ADAPTADOR;
      if (alem) b.classList.add('alem');
      b.title = maiuscula(NOME_CUSTO[k]) + ': ' + Math.round(HZ.ponte) + ' por segundo. ' +
        'Pelo rádio, som ou vibração, um por vez.' + (alem ? ' Passou do limite: pode engasgar.' : '');
      /* QUEM ESTÁ LIGADO OCUPA A VAGA INTEIRA; o outro encolhe para um botão
         de troca. Dois botões de largura igual liam-se como DUAS vagas, e
         desenhavam um espaço reservado que o rádio não tem: pelo rádio a
         ponte é uma só. */
      b.style.flex = ap.ligado.ponte === null ? '1 1 0'
                   : (ap.ligado.ponte === k ? '1 1 0' : '0 0 34px');
      b.dataset.gesto = k === 'som' ? 'custo-som' : 'custo-vibracao';
      b.dataset.alvo = ap.id;
      b.addEventListener('click', e => {
        e.stopPropagation();
        const ligando = ap.ligado.ponte === null;
        if (ligando && pontesDe(ap.lugar).length >= PONTES_POR_ADAPTADOR) {
          pedirVagaDePonte(ap, k);
          return;
        }
        ap.ligado.ponte = (ap.ligado.ponte === k) ? null : k;
        pintar();
      });
      ponte.appendChild(b);
    }
    const recebe = document.createElement('div');
    recebe.className = 'fluxo recebe';
    recebe.style.flex = ap.ponte + ' 1 0';
    const setaR = icone('i-recebe', 'seta');
    setaR.setAttribute('role', 'img');
    recebe.appendChild(setaR);
    recebe.appendChild(ponte);
    recebe.title = 'O que o PC manda para o controle';
    faixa.appendChild(recebe);

    /* AS FEATURES QUE NÃO PESAM ficam FORA da barra, como selos. É o que
       responde à pergunta dela — *"os que usam desses canais via bt preciso
       que separe eles com o valor real"* — para os DOIS lados: as que pesam
       têm largura proporcional; as que não pesam têm zero de largura e
       aparecem mesmo assim, para que a pessoa saiba que existem e que são de
       graça. */
    const luz = document.createElement('button');
    luz.className = 'selo-zero';
    luz.appendChild(icone('i-lightbar'));
    luz.setAttribute('aria-pressed', String(ap.ligado.luz));
    luz.setAttribute('aria-label', 'Barra de luz de ' + ap.nome);
    luz.title = 'Barra de luz: não pesa no rádio';
    luz.dataset.gesto = 'custo-luz';
    luz.dataset.alvo = ap.id;
    luz.addEventListener('click', e => {
      e.stopPropagation(); ap.ligado.luz = !ap.ligado.luz; pintar();
    });
    recebe.appendChild(luz);
  } else {
    /* TECLADO, MOUSE, WEBCAM E CAIXA não têm feature para ligar — a vaga
       mostra o que eles gastam, e nada mais, em vez de fingir um botão. */
    /* CUSTO ZERO NÃO GANHA BARRA. Medido em 22/09: a webcam saía com
       `faixa-do-aparelho` de largura 0 e a vaga de 16 px, e o "sem rádio"
       vazava 77 px por cima da linha. Uma barra de largura zero não é um
       desenho pequeno — é um desenho que não existe, com texto solto em cima.
       Quem não pesa no rádio diz isso em palavra, no lugar da barra. */
    if (custoDe(ap) === 0) {
      faixa.remove();
      const nada = document.createElement('span');
      nada.className = 'sem-radio';
      nada.textContent = 'Sem rádio';
      nada.title = 'Não usa rádio; só ocupa porta';
      features.appendChild(nada);
      linha.appendChild(features);
      const z = document.createElement('span');
      z.className = 'fatias zero';
      z.textContent = '\u2013';
      z.title = 'Não usa rádio';
      linha.appendChild(z);
      return linha;
    }
    const v = document.createElement('div');
    v.className = 'vaga entrada fixa';
    v.style.flex = '1 1 0';
    v.appendChild(icone(ICONE_DO_APARELHO[ap.tipo] || 'i-radio'));
    const hzO = document.createElement('span');
    hzO.className = 'hz';
    /* CADA PACOTE DE A2DP CUSTA 4 FATIAS (2-DH5 = 3, mais a resposta), então o
       hertz sai da divisão — e o zero da webcam sai como palavra, não como
       "0 Hz", que se leria como aparelho mudo em vez de aparelho sem rádio. */
    hzO.textContent = custoDe(ap) === 0 ? 'Sem rádio'
                    : Math.round(custoDe(ap) / 4) + ' Hz';
    v.appendChild(hzO);
    v.title = maiuscula(ap.nome) + ': ' + Math.round(custoDe(ap) / 4) + ' pacotes de som por segundo';
    v.style.background = 'var(--panel)';
    v.style.borderColor = corDe(ap);
    v.style.color = corDe(ap);
    faixa.appendChild(v);
  }
  linha.appendChild(features);

  /* O NÚMERO QUE SOBRA NA DIREITA É «QUANTO DE UMA ANTENA», e não mais a
     contagem de fatias: *"o termo fatias é muito dificil de entender se
     tratando de bt"*.  <!-- (noqa-acento) -->
     É o mesmo dado — 928 de 1.600 é 58% —, dito na grandeza em que a pergunta
     é feita: cabe ou não cabe. */
  /* R10 — A COLUNA DA DIREITA DIZ QUAL VAGA DE PONTE ELE OCUPA, e não mais
     «% de uma antena»: a porcentagem era a soma que a D-CONTA-ADITIVA proíbe.
     É o que liga a linha à barra do adaptador lá em cima. */
  const f = document.createElement('span');
  const vaga = vagaDe(ap);
  f.className = 'fatias' + (vaga > PONTES_POR_ADAPTADOR ? ' alem' : '');
  f.dataset.campo = 'vaga-de-ponte';
  f.dataset.alvo = ap.id;
  f.textContent = vaga ? vaga + ' de ' + PONTES_POR_ADAPTADOR : '\u2013';
  f.title = vaga ? (vaga > PONTES_POR_ADAPTADOR ? 'Passou do limite' : 'Som ' + vaga + ' de ' + PONTES_POR_ADAPTADOR)
               : 'Sem som';
  linha.appendChild(f);

  linha.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', ap.id);
    linha.classList.add('arrastando');
  });
  linha.addEventListener('dragend', () => linha.classList.remove('arrastando'));
  return linha;
}

/* ARRASTAR é o gesto do rato; a lista do painel é o do teclado; a lâmpada é o
   atalho de quem não quer nenhum dos dois. Os três fazem a mesma coisa. */
/* O ALVO É O ADAPTADOR INTEIRO, ABERTO OU FECHADO — pedido dela, 22/09:
   *"clicar e arrastar qualquer elemento (…) me permita jogar rapidamente pro
   adaptador minimizado"*.  <!-- (noqa-acento) -->

   O alvo era a `.aparelhos`, que só existe com o adaptador ABERTO. Com o
   acordeão exclusivo — um aberto por vez, decisão dela — isso queria dizer
   que o único destino alcançável era aquele de onde a linha estava saindo.
   Mudar para `.lugar` faz a fileira fechada aceitar, e é a mesma linha de
   código para os dois casos. */
const ondeSoltar = e =>
  (e.target.closest && e.target.closest('.lugar')) || null;

document.addEventListener('dragover', e => {
  const doca = ondeSoltar(e);
  if (!doca) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.lugar').forEach(l => l.classList.remove('alvo'));
  doca.classList.add('alvo');
});
document.addEventListener('dragleave', e => {
  const doca = ondeSoltar(e);
  if (doca && !doca.contains(e.relatedTarget)) doca.classList.remove('alvo');
});
document.addEventListener('drop', e => {
  const doca = ondeSoltar(e);
  if (!doca) return;
  e.preventDefault();
  const ap = APARELHOS.find(a => a.id === e.dataTransfer.getData('text/plain'));
  document.querySelectorAll('.lugar').forEach(l => l.classList.remove('alvo'));
  /* A JANELA PERGUNTA E O DESTINO SE MARCA — e o adaptador NÃO se abre. Abrir o
     destino fecharia o de origem (o acordeão é exclusivo) e ela perderia de
     vista a fila de onde acabou de tirar a linha. */
  if (ap) pedirParaMover(ap, doca.dataset.id);
});

/* --------------------------------------------------------- o espectro */
/* QUANTOS CANAIS UM VIZINHO CUSTA: a interseção entre a faixa dele e os canais
   que o adaptador ABANDONOU. É o que transforma a régua de enfeite em conta —
   ordem dela: *"a parte do gigahertz tem que ser útil ao user de alguma forma"*.
   A física: o Bluetooth salta entre 79 canais e o AFH tira do salto os que
   estão ocupados. Um dongle não enche a barra do adaptador — ele ENCOLHE a
   antena, e este número é o quanto. */
function canaisQueCusta(e) {
  /* FORA DA FAIXA NÃO CUSTA. O Wi-Fi dela responde canal 161 / 5.805 MHz, e
     desenhar-lhe o anel de quem pesa seria a régua acusando um inocente. */
  if (e.forca === 'fora') return 0;
  return EVITADOS.reduce((s, v) =>
    s + Math.max(0, Math.min(e.fim, v.fim) - Math.max(e.ini, v.ini)), 0);
}

/* A PISTA É A PRIMEIRA QUE NÃO ENCOSTA EM NINGUÉM. Duas bastam para o caso
   real (um Wi-Fi largo mais um dongle); acima disso a régua volta a empilhar,
   e é melhor empilhar do que espremer a ponto de não se ler o número. */
function pistaLivre(e, pistas) {
  for (let i = 0; i < pistas.length; i++) {
    if (pistas[i].every(o => e.ini >= o.fim || e.fim <= o.ini)) {
      pistas[i].push(e); return i;
    }
  }
  if (pistas.length >= 2) { pistas[1].push(e); return 1; }
  pistas.push([e]); return pistas.length - 1;
}

/* QUEM ATRAPALHA QUEM, NA PORTA. Três regras, e as três são medidas:

   1. DOIS RÁDIOS NO MESMO GRUPO — duas antenas a centímetros uma da outra.
      Esta casa já media isso no Check-up como linha de texto; aqui vira marca.
   2. USB 3.0 NO MESMO GRUPO QUE UM RÁDIO — ~20 dB de ruído em 2,4 GHz.
   3. UMA PORTA LIVRE NUM GRUPO SEM RÁDIO é a boa para o próximo, e é o
      «pular uma casa» que resolveu a mesa dela.

   A avaliação é por GRUPO (o hub), porque é a proximidade física que conta —
   não o barramento lógico. */
const EH_RADIO = new Set(['controle', 'wifi', 'teclado', 'mouse', 'fone', 'caixa']);

function oQueOcupa(porta) {
  if (!porta.ocupa) return null;
  const l = LUGARES.find(x => x.id === porta.ocupa);
  if (l) return { tipo: 'adaptador', nome: l.nome || 'Entrada ' + l.entrada, radio: true, icone: 'i-radio' };
  const a = APARELHOS.find(x => x.id === porta.ocupa);
  if (a) return { tipo: a.tipo, nome: a.nome, radio: a.tipo !== 'webcam',
                  icone: a.tipo === 'controle' ? 'i-ds' : (ICONE_DO_APARELHO[a.tipo] || 'i-radio'),
                  cor: corDe(a) };
  const e = ESPECTRO.find(x => x.id === porta.ocupa);
  if (e) return { tipo: e.tipo, nome: e.nome, radio: true,
                  icone: ICONE_DO_RADIO[e.tipo] || 'i-radio' };
  return null;
}

/* COLADO É PORTA AO LADO — a regra da casa, medida na mesa dela: «pular uma
   casa» resolve. O estudo de 23/09 achou a faixa chamando de «colado» o par
   que pula uma (3-4.2 com 3-4.4) e acusando a porta 3.0 LIVRE. Porta 3.0 sem
   nada plugado não faz ruído; o que faz é o tráfego 3.0 ao lado do rádio. */
function numeroDaPorta(porta) {
  const m = /^(.*)\.(\d+)$/.exec(porta.caminho) || /^(\d+)-(\d+)$/.exec(porta.caminho);
  return m ? { pai: m[1], n: Number(m[2]) } : null;
}
function aoLado(a, b) {
  const x = numeroDaPorta(a), y = numeroDaPorta(b);
  return !!(x && y && x.pai === y.pai && Math.abs(x.n - y.n) === 1);
}
function comoEstaAPorta(porta) {
  const meu = oQueOcupa(porta);
  const vizinhas = PORTAS.filter(o => o.id !== porta.id && aoLado(o, porta));
  const radiosAoLado = vizinhas.filter(o => { const q = oQueOcupa(o); return q && q.radio; });
  const tresOcupadaAoLado = vizinhas.filter(o => o.usb === '3.0' && oQueOcupa(o));
  if (meu && meu.radio) {
    if (tresOcupadaAoLado.length) return { estado: 'ruim', porque: 'USB 3.0 ao lado' };
    if (radiosAoLado.length) {
      const quem = radiosAoLado.map(o => (oQueOcupa(o) || {}).nome).filter(Boolean);
      return { estado: 'atento', porque: 'colado em ' + (quem.join(', ') || 'outro rádio') };
    }
    return { estado: 'bom', porque: 'nenhum rádio ao lado' };
  }
  if (!meu) {
    if (porta.usb === '3.0') return { estado: 'neutro', porque: 'livre (USB 3.0: melhor para o que não é rádio)' };
    if (radiosAoLado.length) return { estado: 'atento', porque: 'livre, rádio ao lado' };
    return { estado: 'bom', porque: 'livre' };
  }
  return { estado: 'neutro', porque: 'não usa rádio' };
}

function pintarPortas() {
  const faixa = document.getElementById('portas');
  if (!faixa) return;
  faixa.innerHTML = '';
  const grupos = [];
  for (const porta of PORTAS) {
    let g = grupos.find(x => x.nome === porta.grupo);
    if (!g) { g = { nome: porta.grupo, portas: [] }; grupos.push(g); }
    g.portas.push(porta);
  }
  for (const g of grupos) {
    const bloco = document.createElement('div');
    bloco.className = 'grupo-de-portas';
    bloco.title = g.nome;
    bloco.setAttribute('aria-label', g.nome);
    for (const porta of g.portas) {
      const meu = oQueOcupa(porta);
      const como = comoEstaAPorta(porta);
      const c = document.createElement('button');
      c.className = 'porta ' + como.estado + (porta.usb === '3.0' ? ' tres' : '');
      c.dataset.grupo = g.nome;
      c.dataset.gesto = 'examinar-portas';
      c.dataset.alvo = porta.id;
      if (meu) {
        const ic = icone(meu.icone, meu.icone === 'i-ds' ? 'ds' : '');
        if (meu.cor) ic.style.color = meu.cor;
        c.appendChild(ic);
      }
      c.title = 'Entrada ' + porta.caminho + ' · USB ' + porta.usb + ' · ' +
        (meu ? meu.nome || meu.tipo : 'livre') + ' — ' + como.porque + '.';
      c.setAttribute('aria-label', c.title);
      /* O IMPACTO EM TEMPO REAL: passar por uma porta acende as que dividem o
         hub com ela. É a resposta à pergunta dela — «qual objeto impacta o
         quê» — e ela é de ida e volta, porque a proximidade é mútua. */
      c.addEventListener('mouseenter', () => acenderGrupo(g.nome, true));
      c.addEventListener('mouseleave', () => acenderGrupo(g.nome, false));
      c.addEventListener('focus', () => acenderGrupo(g.nome, true));
      c.addEventListener('blur', () => acenderGrupo(g.nome, false));
      bloco.appendChild(c);
    }
    faixa.appendChild(bloco);
  }
}

function acenderGrupo(nome, ligar) {
  for (const c of document.querySelectorAll('.porta')) {
    c.classList.toggle('vizinha', ligar && c.dataset.grupo === nome);
  }
}

function pintarEspectro() {
  const faixa = document.getElementById('canais');
  faixa.innerHTML = '';
  const pistas = [];
  faixa.classList.remove('duas-pistas');
  /* A CAMADA DO SALTO vem primeiro, por baixo de tudo: ela é o fundo em que os
     vizinhos se apoiam. */
  const livres = [];
  let c = 0;
  for (const v of EVITADOS.slice().sort((a, b) => a.ini - b.ini)) {
    if (v.ini > c) livres.push([c, v.ini]);
    c = Math.max(c, v.fim);
  }
  if (c < CANAIS_DO_BT) livres.push([c, CANAIS_DO_BT]);
  for (const [a, b] of livres) {
    const s = document.createElement('div');
    s.className = 'salto';
    s.style.left = (a / CANAIS_DO_BT * 100) + '%';
    s.style.width = ((b - a) / CANAIS_DO_BT * 100) + '%';
    faixa.appendChild(s);
  }
  for (const v of EVITADOS) {
    const d = document.createElement('div');
    d.className = 'evitado';
    d.style.left = (v.ini / 79 * 100) + '%';
    d.style.width = ((v.fim - v.ini) / 79 * 100) + '%';
    const dono = LUGARES.find(l => l.id === v.lugar);
    d.title = (dono ? maiuscula(comoSeChamaOLugar(dono)).replace(/<\/?b>/g, '') : 'O rádio') +
      ' parou de saltar nos canais ' + v.ini + ' a ' + v.fim + ' — medido no próprio adaptador';
    faixa.appendChild(d);
  }
  /* QUEM NÃO ESTÁ EM 2,4 NÃO ENTRA NA RÉGUA DE 2,4 — achado por ela em
     22/09/2026: *"tá certo a sobreposição do teclado e wifi (...)? parece um
     erro"*.  <!-- (noqa-acento) -->

     ERA ERRO, E MEDIDO: o Wi-Fi ocupava px 1 a 329 e o Teclado px 269 a 508 na
     mesma pista — 60 px de sobreposição, com o Wi-Fi pintando POR CIMA. E o
     Wi-Fi dela responde canal 161 / 5.805 MHz, ou seja, nem sequer disputa
     esta faixa. Desenhá-lo aqui era afirmar uma disputa que não existe.

     Ele não some da tela: vira selo cinza no cabeçalho, ao lado dos aparelhos,
     dizendo o que ele CUSTARIA se caísse para 2,4. */
  const foraDaFaixa = ESPECTRO.filter(e => e.forca === 'fora');
  const naFaixa = ESPECTRO.filter(e => e.forca !== 'fora');
  /* AS PISTAS SÃO DECIDIDAS ANTES DE PINTAR A PRIMEIRA. Numa passagem só, quem
     era pintado antes da segunda pista existir ficava de altura inteira e
     voltava a encobrir o vizinho — o defeito que a pista veio curar. */
  const pistaDe = new Map();
  for (const e of naFaixa.slice().sort((a, b) => a.ini - b.ini)) {
    pistaDe.set(e.id, pistaLivre(e, pistas));
  }
  faixa.classList.toggle('duas-pistas', pistas.length > 1);
  for (const e of naFaixa) {
    const semNome = !e.nome;
    const d = document.createElement('button');
    /* E QUANDO DOIS VIZINHOS DE VERDADE SE SOBREPÕEM — um Wi-Fi em 2,4 mais um
       teclado, que é o caso de quase todo mundo — a régua tem de MOSTRAR a
       sobreposição, não escondê-la sob quem foi pintado por último. Cada faixa
       recebe a primeira pista livre; com uma só, ocupa a altura inteira. */
    d.className = 'faixa provavel ' + e.forca + (semNome ? ' sem-nome' : '') +
                  (pistas.length > 1 ? ' pista-' + pistaDe.get(e.id) : '');
    d.style.left = (e.ini / 79 * 100) + '%';
    d.style.width = ((e.fim - e.ini) / 79 * 100) + '%';
    const custa = canaisQueCusta(e);
    if (custa) d.classList.add('custa');
    d.title = (e.nome || 'Rádio sem nome') +
      (e.forca === 'fora' ? ' em 5 GHz: fora desta faixa'
        : ' — canais ' + e.ini + ' a ' + e.fim + ' (provável)') +
      (custa ? '. Custa ' + custa + ' canais.' : '.');
    d.dataset.gesto = 'vizinho-o-que-e';
    d.dataset.alvo = e.id;
    d.addEventListener('click', () => batizarRadio(e));
    if (semNome) {
      /* OS QUATRO «— O que é? —» DE HOJE VIRAM ETIQUETAS NA RÉGUA: o que ela
         ensina fica desenhado onde o aparelho de fato atrapalha, em vez de numa
         fileira de dropdowns sem posição. O GESTO É O DA ABA — `vizinho-o-que-e`
         já existe, e um segundo nome para o mesmo ato parte o contrato. */
      d.appendChild(icone('i-ajuda'));
      d.setAttribute('aria-label', d.title + '. Toque para dizer o que é.');
    } else {
      d.appendChild(icone(ICONE_DO_RADIO[e.tipo] || 'i-radio'));
      d.setAttribute('aria-label', d.title + '. Toque para trocar.');
    }
    const ch = document.createElement('span');
    ch.className = 'ch'; ch.textContent = ' ' + e.ini + '\u2013' + e.fim;
    d.appendChild(ch);
    faixa.appendChild(d);
  }
  /* O CABEÇALHO NOMEIA O CULPADO, que é a única coisa acionável aqui: saber
     que 27 canais sumiram não muda nada; saber QUAL aparelho pesa, sim. */
  /* POR ADAPTADOR, NÃO SOMADO — cada um tem o seu mapa de canais, e somar
     os de dois adaptadores dava «24/79» a um rádio que evita 12. */
  const evitados = Math.max(0, ...LUGARES.map(l => CANAIS_DO_BT - canaisDe(l.id)));
  const semNome = ESPECTRO.filter(e => !e.nome).length;
  const pior = ESPECTRO.slice().sort((a, b) => canaisQueCusta(b) - canaisQueCusta(a))[0];
  const conta = document.getElementById('fonte-espectro');
  conta.textContent = evitados + '/79 evitados' +
    (pior && canaisQueCusta(pior) ? ' \u00B7 pior: ' + (pior.nome || 'sem nome') : '') +
    (semNome ? ' \u00B7 ' + semNome + ' sem nome' : '');
  /* OS SEUS APARELHOS TAMBÉM ESTÃO NO AR, e eles não têm lugar no eixo: saltam
     pelo que sobrou. É a resposta à pergunta dela — *"como isso se relaciona
     com os demais?"* —, e é o que a régua não dizia. */
  const fora = document.getElementById('fora-da-faixa');
  fora.innerHTML = '';
  for (const e of foraDaFaixa) {
    const s = document.createElement('span');
    s.className = 'selo-fora';
    s.appendChild(icone(ICONE_DO_RADIO[e.tipo] || 'i-radio'));
    s.append(' 5 GHz');
    s.title = (e.nome || 'Este rádio') + ' em 5 GHz: fora desta faixa';
    s.setAttribute('role', 'img');
    s.setAttribute('aria-label', s.title);
    fora.appendChild(s);
  }
  const meus = document.getElementById('meus-no-ar');
  meus.innerHTML = '';
  const porTipo = {};
  const noAr = APARELHOS.filter(a => a.tipo !== 'webcam');
  for (const a of noAr) porTipo[a.tipo] = (porTipo[a.tipo] || 0) + 1;
  for (const tipo of Object.keys(porTipo)) {
    const ic = icone(tipo === 'controle' ? 'i-ds' : (ICONE_DO_APARELHO[tipo] || 'i-radio'),
                     tipo === 'controle' ? 'ds' : '');
    meus.appendChild(ic);
  }
  const n = noAr.length;
  const cada = LUGARES.map(l => canaisDe(l.id));
  const restam = Math.min(...cada) === Math.max(...cada) ? String(cada[0])
               : Math.min(...cada) + '\u2013' + Math.max(...cada);
  meus.append('\u00A0' + n + ' no ar');
  meus.title = 'Seus ' + n + ' aparelhos Bluetooth saltam pelos ' + restam + ' canais livres';
  conta.title = 'O adaptador que mais evita: ' + evitados + ' de 79 canais' +
    (pior && canaisQueCusta(pior) ? '. Pior vizinho: ' + (pior.nome || 'sem nome') + '.' : '.');
}

/* ----------------------------------------------------------- o painel
   O QUE O LAUDO DE QA ACHOU, e está curado aqui: o painel fechado continuava
   alcançável pelo Tab com `aria-hidden="true"` — o leitor de tela não via e o
   teclado ia parar num foco invisível. O `inert` fecha os dois de uma vez. E o
   foco agora ENTRA quando ele abre e VOLTA para quem o abriu quando fecha. */
const painel = document.getElementById('painel');
const veu = document.getElementById('veu');
let quemAbriu = null;

function abrirPainel(titulo, corpo, pulsando) {
  quemAbriu = document.activeElement;
  document.getElementById('painel-titulo').textContent = titulo;
  document.getElementById('pulso').style.display = pulsando ? '' : 'none';
  const alvo = document.getElementById('painel-corpo');
  alvo.innerHTML = ''; alvo.appendChild(corpo);
  painel.classList.add('aberto');
  painel.removeAttribute('inert');
  painel.setAttribute('aria-hidden', 'false');
  veu.classList.add('aberto');
  const primeiro = painel.querySelector('button, a, input, [tabindex]:not([tabindex="-1"])');
  if (primeiro) primeiro.focus();
}
function fecharPainel() {
  if (painel.contains(document.activeElement)) document.activeElement.blur();
  painel.classList.remove('aberto');
  painel.setAttribute('inert', '');
  painel.setAttribute('aria-hidden', 'true');
  veu.classList.remove('aberto');
  if (quemAbriu && document.contains(quemAbriu)) quemAbriu.focus();
  quemAbriu = null;
}
document.getElementById('b-fechar').addEventListener('click', fecharPainel);
veu.addEventListener('click', fecharPainel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharPainel(); });

function listaDeBotoes(itens, aoEscolher, comIcone) {
  const corpo = document.createElement('div');
  corpo.className = 'escolha';
  for (const it of itens) {
    const b = document.createElement('button');
    b.className = 'btn';
    if (comIcone) b.appendChild(icone(comIcone(it)));
    b.append(typeof it === 'string' ? it : it.rotulo);
    b.addEventListener('click', () => aoEscolher(it));
    corpo.appendChild(b);
  }
  return corpo;
}

/* CONECTAR — a paridade com a tela do sistema, num painel lateral (decisão
   dela). O adaptador de destino vem ESCOLHIDO no mais vazio: é o que faz o
   multi-adaptador ser automático sem ser mudo. */
document.getElementById('b-conectar').addEventListener('click', () => {
  const corpo = document.createElement('div');
  corpo.style.cssText = 'display:flex;flex-direction:column;gap:11px;min-height:0';

  /* R5 + D8 — o destino vem escolhido no que tem MAIS VAGA DE PONTE, e no
     empate o de menos controles. Só vale no parear: depois, quem liga é o
     controle, e ele chama sempre o mesmo computador. */
  const maisVazio = LUGARES.slice().sort((a, b) =>
    (pontesDe(a.id).length - pontesDe(b.id).length) ||
    (ligadosEm(a.id).filter(x => x.tipo === 'controle').length -
     ligadosEm(b.id).filter(x => x.tipo === 'controle').length) ||
    (a.varrendo - b.varrendo))[0];
  const escolha = document.createElement('div');
  escolha.className = 'escolha-lugar';
  escolha.setAttribute('role', 'group');
  escolha.setAttribute('aria-label', 'Em qual adaptador conectar');
  for (const l of LUGARES) {
    const b = document.createElement('button');
    b.className = 'op';
    b.textContent = l.nome || 'Entrada ' + l.entrada;
    b.setAttribute('aria-pressed', String(l.id === maisVazio.id));
    b.title = 'Com som: ' + pontesDe(l.id).length + ' de ' + PONTES_POR_ADAPTADOR;
    b.dataset.gesto = 'escolher-adaptador';
    b.dataset.alvo = l.id;
    b.addEventListener('click', () => {
      escolha.querySelectorAll('.op').forEach(o => o.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
    });
    escolha.appendChild(b);
  }
  corpo.appendChild(escolha);

  const lista = document.createElement('div');
  lista.className = 'achados';
  for (const a of lerCsv('perto')) {
    const seu = a.conhecido === 'sim';
    const div = document.createElement('div');
    div.className = 'achado';
    if (a.tipo === 'controle') {
      const d = icone('i-ds', 'ds cheio'); div.appendChild(d);
    } else {
      div.appendChild(icone('i-radio', 'ico'));
    }
    const n = document.createElement('span');
    n.className = 'nome'; n.textContent = a.nome; div.appendChild(n);
    const f = document.createElement('span');
    f.className = 'forca'; f.textContent = a.forca + ' dBm';
    f.title = 'Sinal: mais perto de zero, mais perto';
    div.appendChild(f);
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = seu ? 'Conectar' : 'Parear';
    b.dataset.gesto = seu ? 'conectar-aparelho' : 'parear-aparelho';
    b.dataset.alvo = a.id;
    div.appendChild(b);
    lista.appendChild(div);
  }
  corpo.appendChild(lista);
  abrirPainel('Procurando', corpo, true);
});

/* O HISTÓRICO, atrás do sino — pedido dela, e economiza a altura que uma lista
   permanente custaria. */
function abrirHistorico(lug) {
  const corpo = document.createElement('div');
  corpo.style.cssText = 'display:flex;flex-direction:column;gap:6px';
  for (const q of QUEDAS.filter(q => q.lugar === lug.id)) {
    const d = document.createElement('div');
    d.className = 'queda';
    d.appendChild(icone('i-aviso'));
    const t = document.createElement('span'); t.textContent = maiuscula(q.porque);
    d.appendChild(t);
    const w = document.createElement('span');
    w.className = 'quando'; w.textContent = q.quando;
    d.appendChild(w);
    corpo.appendChild(d);
  }
  abrirPainel(lug.nome || 'Entrada ' + lug.entrada, corpo);
}

/* «MAPEAR ENTRADA A ENTRADA», chamado de onde a dúvida está — e com as MESMAS
   quatro respostas que o pop-up de hoje já oferece. Inventar uma quinta
   abriria uma segunda língua para a mesma pergunta. */
const FACES = ['Frente do gabinete', 'Traseira', 'Num hub ou extensão', 'Na escrivaninha'];
function ensinarOnde(lug) {
  abrirPainel('Onde fica esta entrada?',
    listaDeBotoes(FACES, face => { lug.face = face; fecharPainel(); pintar(); },
      f => /hub|extens/.test(f) ? 'i-hub' : 'i-placa'));
}

/* QUEM VEM PRA CÁ: o «Arraste para cá» clicado vira a lista dos aparelhos que
   estão em outro adaptador. É o mesmo ato do arrastar, pelo caminho de quem
   não arrasta. */
function quemVemPraCa(lug) {
  const itens = APARELHOS.filter(a => a.lugar !== lug.id && !a.fixo)
    .map(a => ({ rotulo: a.nome + (a.cor_nome ? ' \u00B7 ' + a.cor_nome : ''), a }));
  if (!itens.length) { abrirPainel('Nada para trazer', document.createElement('div')); return; }
  abrirPainel('Quem vem para ' + (lug.nome || 'a Entrada ' + lug.entrada) + '?',
    listaDeBotoes(itens, it => { fecharPainel(); pedirParaMover(it.a, lug.id); },
      it => it.a.tipo === 'controle' ? 'i-ds' : (ICONE_DO_APARELHO[it.a.tipo] || 'i-radio')));
}

/* O CAMINHO DE TECLADO para mover um controle — o mesmo ato do arrastar. */
function paraOndeVai(ap) {
  const itens = LUGARES.filter(l => l.id !== ap.lugar)
    .map(l => ({ rotulo: (l.nome || 'Entrada ' + l.entrada) +
                 ' · com som ' + pontesDe(l.id).length + ' de ' + PONTES_POR_ADAPTADOR, l }));
  abrirPainel('Para onde vai ' + (ap.cor_nome || ap.nome) + '?',
    listaDeBotoes(itens, it => { fecharPainel(); pedirParaMover(ap, it.l.id); },
      it => it.l.tipo === 'hub' ? 'i-hub' : 'i-placa'));
}

function batizarRadio(radio) {
  const itens = [['Wi-Fi','wifi','i-wifi'], ['Fone','fone','i-fone'],
                 ['Teclado','teclado','i-teclado'], ['Mouse','mouse','i-mouse'],
                 ['Webcam','webcam','i-webcam'], ['Outro','outro','i-radio']]
    .map(([rotulo, tipo, ic]) => ({ rotulo, tipo, ic }));
  abrirPainel('O que é este rádio?',
    listaDeBotoes(itens, it => {
      radio.nome = it.rotulo; radio.tipo = it.tipo; fecharPainel(); pintar();
    }, it => it.ic));
}

/* R12 — O EQUILIBRAR PROPÕE UM MOVIMENTO SÓ, pela mesma janela de todo
   mover. Ela aperta PS + Create, o Hefesto confere que o controle chegou, e
   só então o próximo clique propõe o próximo. Com um controle ainda
   esperando, ou nada a melhorar, o botão balança (R8) e a dica diz por quê. */
const bEquilibrar = document.getElementById('b-equilibrar');
const TITULO_DO_EQUILIBRAR = bEquilibrar.title;
function recusar(botao, porque) {
  botao.title = porque;
  botao.classList.remove('recusa');
  void botao.offsetWidth;
  botao.classList.add('recusa');
  setTimeout(() => { botao.classList.remove('recusa'); botao.title = TITULO_DO_EQUILIBRAR; }, 2500);
}
bEquilibrar.addEventListener('click', () => {
  const esperando = APARELHOS.find(a => a.esperando);
  if (esperando) {
    recusar(bEquilibrar, 'Esperando o ' + (esperando.cor_nome || esperando.nome) + ' chegar');
    return;
  }
  const s = sugestao();
  if (!s) { recusar(bEquilibrar, 'Já está equilibrado'); return; }
  if (s.impossivel) { recusar(bEquilibrar, 'Nenhuma entrada com vaga'); return; }
  pedirParaMover(s.ap, s.destino.id);
});

/* OS TRÊS BOTÕES DAS ENTRADAS — mantidos, só reposicionados. No produto eles
   abrem os mesmos pop-ups de hoje; aqui só mostram o painel para ela julgar. */
document.getElementById('b-uma-a-uma').addEventListener('click', () => {
  ensinarOnde(LUGARES.find(l => !l.face) || LUGARES[0]);
});
for (const [bid, titulo, texto] of [
  ['b-mapear', 'Mapear Entradas',
   'Abre o desenho do gabinete: as entradas numeradas por face, com ocupada, vazia, serve e vale evitar.'],
  ['b-examinar', 'Examinar Entradas',
   'Refaz o exame das entradas — energia e rádio — e repinta o Check-up.'],
]) {
  document.getElementById(bid).addEventListener('click', () => {
    const corpo = document.createElement('div');
    corpo.style.cssText = 'color:var(--texto-mudo);font-size:12.5px';
    corpo.textContent = texto;
    abrirPainel(titulo, corpo);
  });
}

pintar();
</script>
