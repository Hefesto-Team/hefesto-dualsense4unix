<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hefesto — Rádio e Adaptadores</title>
<!--
  RÁDIO E ADAPTADORES — a seção nova. Mockup para ela aprovar. 22/09/2026.

  A ORDEM DESTA VOLTA, com as palavras dela: *"na real eu quero ter menos texto
  nessa interface. ela tá muito carregada (…) texto aparece só como tooltip. tá
  muito lotado mesmo de texto e tá bem confuso. falta indicar os controles svg
  tipo cosmic red e afins."*

  O QUE ISSO MUDOU, e é uma regra e não uma limpeza:

    **IDENTIDADE fica na tela. EXPLICAÇÃO vira dica.**

  Identidade é o que a pessoa precisa para saber DE QUEM é a coisa — o nome do
  adaptador, o nome de quem segura o controle, o número da entrada. Explicação é
  tudo que ensina o que aquilo significa — quanto custa, por que está junto, o
  que o rádio já evita. A primeira não tem substituto visual; a segunda tem, e é
  o ícone.

  A LEGENDA INTEIRA SAIU. Seis linhas para dizer o que cada cor era — e a cor já
  está no ícone do chip que a produz. Uma legenda é o sintoma de que o desenho
  não se explica; quando ele se explica, ela é peso.

  A SILHUETA É A DA CASA: o `<path class="corpo">` do `ds_limpo.svg`, byte a
  byte. Desenhar um segundo DualSense aqui abriria uma segunda fonte para a
  mesma figura — que é o defeito que esta casa paga desde que o `novo-layout/`
  divergiu 25 KB sem ninguém ver.

  OS ENDEREÇOS ESTÃO POSTOS, e é o item 1 do laudo de QA que ela aprovou:
  `data-campo` diz o que o Python PINTA, `data-hef-alvo` diz COMO, e
  `data-gesto` diz o que a pessoa ACIONA. Sem os três, o produto não alcança um
  botão desta seção e régua nenhuma consegue morder. Onde a aba já tem um gesto
  para a mesma coisa, o nome é o DELA — `examinar-portas` e `vizinho-o-que-e` —
  porque um segundo nome para o mesmo ato é como o contrato se parte.

  STANDALONE: nenhuma fonte de rede, nenhum script externo. O CSV embutido é a
  verdade; este HTML é a leitura — mesma forma do `specs.html`.
-->
<style>
  /* A PALETA É A DA CASA, token por token — lida de
     `interface/paginas/08-conexoes.html`, que é o que o produto renderiza.
     Nomes iguais aos de lá de propósito: assim esta seção cai dentro da aba
     sem uma linha de tradução. */
  :root {
    --app-bg:#21222c; --panel:#282a36; --elevated:#2b2d3a;
    --border-sutil:#343746; --border-forte:#44475a; --linha:#53576f;
    --fg:#f8f8f2; --texto-suave:#c8ccda; --texto-mudo:#9a9eb8; --comment:#8896c4;
    --cyan:#8be9fd; --green:#50fa7b; --orange:#ffb86c;
    --pink:#ff79c6; --purple:#bd93f9; --red:#ff5555; --yellow:#f1fa8c;
    --sel-bg:rgba(189,147,249,0.16);

    --font-corpo: 'Space Grotesk', system-ui, sans-serif;
    --font-dado:  'JetBrains Mono', ui-monospace, monospace;
    --ease: cubic-bezier(.22,.61,.36,1);

    /* UMA COR POR COISA QUE CUSTA RÁDIO, e as quatro saem da paleta. A mesma
       cor no ícone do chip e na fatia da barra — é o que dispensa a legenda. */
    --c-entrada: var(--cyan);
    --c-mic:     var(--pink);
    --c-som:     var(--orange);
    --c-haptica: var(--purple);
    /* E A VERSÃO CALMA DE CADA UMA. Uma barra de 900 px em ciano cheio, quatro
       vezes na mesma tela, grita — ela olhou e disse *"tá carregadíssimo (…) e
       não tá harmônico"*. O preenchimento cai para um véu da cor e o ÍCONE
       fica cheio: a identidade continua inteira e o volume some. */
    --c-entrada-veu: rgba(139,233,253,.32);
    --c-som-veu:     rgba(255,184,108,.32);
    --c-haptica-veu: rgba(189,147,249,.32);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; padding: 20px;
    background: var(--app-bg); color: var(--fg);
    font-family: var(--font-corpo); font-size: 13.5px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* O ÍCONE, EM UM LUGAR SÓ. Traço em `currentColor`, tamanho pela `font-size`
     do pai — assim um ícone nunca precisa de uma cor própria escrita à mão. */
  .i { width: 1em; height: 1em; display: block; flex: none;
       fill: none; stroke: currentColor; stroke-width: 1.9;
       stroke-linecap: round; stroke-linejoin: round; }
  .i.cheio { fill: currentColor; stroke: none; }
  /* A SILHUETA É TRAÇO, E NÃO PREENCHIMENTO — medido nas duas: o
     `<path class="corpo">` do `ds_limpo.svg` é uma forma com RECORTES (os
     furos dos analógicos e do touchpad, por `fill-rule="evenodd"`). Preenchê-la
     a 30 px de largura deixa os furos comerem quase todo o corpo e o resultado
     lê como um anel fino. O traço desenha o contorno E os recortes, e é o que
     entrega «isto é um DualSense, e é DESTA cor» de longe. */
  /* O TRAÇO DA SILHUETA É FIXO EM PIXEL, e não em unidade do desenho.
     Ela viu o que estava errado: *"a borda dos svgs contém os motores hápticos
     e por isso fica grossa destoando do resto"*. A borda dupla das
     empunhaduras é o contorno da casca do aparelho — ela existe no desenho da
     casa e não sai. O que destoava era a ESPESSURA: um `stroke-width` em
     unidades do `viewBox` engorda quando o desenho encolhe, e a 34 px ele
     ficava mais pesado que os ícones ao lado, que são de 1,9.
     Com `non-scaling-stroke` o traço vale 1,1 px em qualquer tamanho, e a
     silhueta passa a pesar o mesmo que o resto da linha. */
  .ds { fill: none; stroke: currentColor; stroke-width: 1.1;
        vector-effect: non-scaling-stroke; }

  /* O PALCO É A SEÇÃO, E NÃO A JANELA — medido em 22/09/2026 na aba real.
     Pergunta dela: *"não vai sobrepor o menu de abas e nem o banner ou
     rodapé, certo?"*.  <!-- (noqa-acento) -->

     Ia sobrepor os três. A casca da `08-conexoes.html` a 1280x800 é:
       banner  `.fita-linha`  topo  17, altura  68
       abas    `.tira`        topo  85, altura  42
       MIOLO   `.miolo`       topo 127, altura 609  (overflow-y: auto)
       rodapé  `.rodape`      topo 736, altura  47
     O painel nasceu `position: fixed; top:0; bottom:0` e o véu `fixed;
     inset:0` — os dois cobriam de 0 a 800, isto é, os três.

     A CURA TEM DUAS PARTES, e a segunda é a que não se vê:
     1. `position: relative` aqui e `absolute` nos dois: o painel passa a
        medir a SEÇÃO, e o `.miolo` continua dono do que rola.
     2. `z-index: 0` aqui. Isto abre um contexto de empilhamento próprio, e
        é o que garante que NENHUM z-index de dentro — hoje ou depois —
        alcance a casca. Sem ele a regra vale por disciplina; com ele, por
        construção.

     E O PAINEL DEIXOU DE DESLIZAR DE FORA. `transform: translateX(100%)`
     fechado punha 340 px de conteúdo à DIREITA do palco: sem `overflow:
     hidden` ele apareceria, e com `overflow: hidden` os balões da régua
     seriam decepados. A entrada agora é véu + 14 px, e o fechado é
     `visibility: hidden` — que não pinta, não recebe clique e não gera
     rolagem lateral no `.miolo`. */
  .quadro {
    position: relative; z-index: 0;
    max-width: 1210px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--linha);
    border-radius: 9px; padding: 11px 14px 14px;
  }

  /* ------------------------------------------------------------ cabeçalho */
  .cab { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .cab .seta { color: var(--purple); font-size: 10px; }
  .cab h1 { font-size: 13.5px; font-weight: 600; margin: 0; color: var(--purple); }
  .cab .conta {
    font-family: var(--font-dado); font-size: 11px; color: var(--texto-mudo);
    margin-left: 4px;
  }
  .cab .direita { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 7px; min-height: 32px;
    background: transparent; border: 1px solid var(--linha);
    color: var(--texto-suave); font: inherit; font-size: 12.5px; cursor: pointer;
    text-decoration: none;  /*: o `.btn` também veste `<a>` — ver os dois do rodapé */
    transition: background var(--ease) 120ms, border-color var(--ease) 120ms, color var(--ease) 120ms;
  }
  .btn:hover { border-color: var(--texto-suave); color: var(--fg); }
  .btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .btn .i { font-size: 15px; }
  .btn.principal { border-color: var(--green); color: var(--green); }
  .btn.principal:hover { background: rgba(80,250,123,.1); }
  .btn.so-icone { padding: 7px; width: 32px; justify-content: center; }

  /* ------------------------------------------------------------- A SALA
     OS ADAPTADORES SÃO EMPILHADOS, e não três colunas — ordem dela, 22/09,
     vendo os quatro controles espremidos numa coluna de 386 px:
     *"todos os dualsense expremidos dessa forma fica horrível. Eles no mínimo
     deveriam ocupar o espaço horizontal todo."*

     Em três colunas, a linha de um controle tinha 386 px para caber silhueta,
     nome e três botões — e sobrava zero para a barra dele. Empilhado, cada
     dispositivo tem a largura toda, que é o que a barra de features precisa
     para dizer alguma coisa.

     E O ADAPTADOR VAZIO ENCOLHE PARA UMA LINHA, também ordem dela: *"ambos
     pequenos como uma linha"*. Um card vazio com 300 px de altura reservada é
     o que ela olhou e não curtiu duas vezes. */
  .sala { display: flex; flex-direction: column; gap: 7px; }

  .lugar {
    background: var(--app-bg); border: 1px solid var(--linha);
    border-radius: 9px; padding: 5px 10px 6px;
    display: flex; flex-direction: column; gap: 7px;
    transition: border-color var(--ease) 140ms;
  }
  /* A MARCA DE QUEM VARRE É ÂMBAR, e não vermelha: não há nada errado
     acontecendo — outra janela está fazendo o trabalho dela. */
  .marca.varrendo { color: var(--yellow); cursor: help; }
  .lugar.alvo  { border-color: var(--green); background: rgba(80,250,123,.06); }
  /* O DESTINO PISCA UMA VEZ depois de receber — é o que diz "caiu aqui" sem
     trocar o que ela está vendo. */
  .lugar.recebeu { animation: recebeu 900ms var(--ease) 1; }
  @keyframes recebeu {
    0%, 100% { border-color: var(--border-forte); }
    25%, 60% { border-color: var(--green); }
  }
  @media (prefers-reduced-motion: reduce) { .lugar.recebeu { animation: none } }
  .lugar.cheio { border-color: var(--orange); }

  /* O ADAPTADOR É UMA LINHA QUE EXPANDE — ordem dela, 22/09: *"a ideia é que
     essa seção não quebre o limite vertical que temos nessa página e nas
     outras pra não arrumarmos pra cabeça"*.

     Com os três abertos a seção passava de 840 px, e a aba tem 855 no total
     para topo, três seções e rodapé. Fechado, um adaptador é UMA linha de
     34 px que já diz tudo o que se bate o olho para saber: nome, entrada,
     barra, quanto do rádio, quantos canais. Aberto, mostra os aparelhos.

     E O ESTOURADO NASCE ABERTO: quem precisa de atenção não pode cobrar um
     clique para se mostrar. */
  .lugar-topo { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .abre-lugar {
    width: 24px; height: 24px; padding: 0; flex: none; border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent;
    color: var(--texto-mudo); cursor: pointer; font-size: 10px;
    transition: transform var(--ease) 140ms;
  }
  .abre-lugar:hover { border-color: var(--linha); color: var(--fg); }
  .abre-lugar:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .abre-lugar[aria-expanded="true"] { transform: rotate(90deg); }
  .lugar-corpo { display: flex; flex-direction: column; gap: 8px; }

  /* O NOME É EDITÁVEL NO LUGAR. Hoje o gesto existe e é invisível — um
     sublinhado pontilhado. Ela disse que não fazia ideia de como renomear. */
  .lugar-nome {
    font-size: 13.5px; font-weight: 600; color: var(--fg);
    width: 16ch; flex: none; min-height: 26px;
    background: transparent; border: 1px solid var(--linha); border-radius: 6px;
    padding: 3px 6px; font-family: inherit;
  }
  .lugar-nome:hover { border-color: var(--texto-mudo); }
  .lugar-nome:focus { outline: none; border-color: var(--purple); background: var(--panel); }
  .lugar-nome::placeholder { color: var(--orange); font-weight: 400; font-style: italic; }

  .sino {
    width: 26px; height: 26px; padding: 0; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid rgba(255,184,108,.5);
    background: transparent; color: var(--orange); cursor: pointer; font-size: 14px;
  }
  .sino:hover { background: rgba(255,184,108,.14); }
  .sino:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  /* ------------------------------------------------------- onde ele está
     AS PALAVRAS SÃO AS DO «MAPEAR ENTRADAS». O que era palavra virou ÍCONE, e
     a palavra virou a dica. */
  .onde { display: flex; align-items: center; gap: 6px;
          font-family: var(--font-dado); font-size: 11px; color: var(--texto-mudo); }
  .onde .marca {
    display: inline-flex; align-items: center; font-size: 15px;
    color: var(--texto-suave); cursor: help;
  }
  .onde .marca.hub   { color: var(--orange); }
  .onde .marca.junto { color: var(--orange); }
  .onde .marca.usb3  { color: var(--yellow); }

  .ensina {
    display: inline-flex; align-items: center; gap: 4px; min-height: 26px;
    padding: 1px 9px; border-radius: 20px; font-size: 11.5px;
    color: var(--purple); border: 1px solid rgba(189,147,249,.65);
    background: transparent; cursor: pointer; font-family: var(--font-corpo);
    text-decoration: none;  /*: o «Onde fica?» é `<a href>`, não `<button>` */
  }
  .ensina:hover { background: var(--sel-bg); }
  .ensina:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .ensina .i { font-size: 13px; }

  /* --------------------------------------------- a barra DO ADAPTADOR
     ELA É SEGMENTADA POR DISPOSITIVO, e cada bloco tem a cor do plástico
     daquele aparelho — ordem dela: *"no caso ali seriam 6 blocos sendo cada um
     4 controles, 1 teclado e um mouse e cada tendo a cor do plástico de cada
     controle. e diferenciando a cor do mouse e teclado."*

     São DUAS segmentações diferentes na mesma tela, e é de propósito: esta diz
     DE QUEM é o rádio; a de dentro de cada linha diz NO QUE ele é gasto. Uma
     fala em cor de plástico, a outra em cor de feature — e o olho separa as
     duas porque a cor do bloco é a mesma da silhueta logo abaixo. */
  .lugar-conta { display: flex; align-items: center; gap: 8px; margin-left: auto;
                 font-family: var(--font-dado); font-size: 11.5px; color: var(--texto-mudo); }
  .lugar-conta .quanto.apertado { color: var(--orange); }
  .lugar-conta .quanto.estourou { color: var(--orange); font-weight: 600; }
  .lugar-conta .sobra { display: flex; align-items: center; gap: 3px; cursor: help; }
  .lugar-conta .sobra.nao-cabe { color: var(--texto-suave); }
  .lugar-conta .sobra.passou { color: var(--orange); }
  .lugar-conta .sobra .i { font-size: 14px; }
  .canais-do-lugar { display: flex; align-items: center; gap: 4px; cursor: help;
                     font-size: 11px; color: var(--texto-mudo); }
  .canais-do-lugar .i { font-size: 14px; }
  .canais-do-lugar.apertado { color: var(--orange); }

  .trilho {
    position: relative; height: 10px; border-radius: 5px; overflow: hidden; opacity: .88;
    background: var(--panel); border: 1px solid var(--linha); display: flex; gap: 1px;
  }
  .trilho.estourado { border-color: rgba(255,184,108,.6); }
  .bloco { height: 100%; min-width: 2px; cursor: help;
           transition: width var(--ease) 260ms, filter var(--ease) 120ms; }
  .bloco:hover { filter: brightness(1.25); }
  /* A MARCA DO TETO: onde a antena acaba. Uma barra que satura em 100% mente
     exatamente no estado em que a pessoa precisa dela. */
  .barra-do-lugar { position: relative; padding-top: 7px; flex: 1 1 auto; min-width: 110px; }
  .marca-do-teto {
    position: absolute; top: 0; width: 0; height: 0; transform: translateX(-4px);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid var(--orange); cursor: help;
  }

  /* ------------------------------------------- a linha de um dispositivo */
  .aparelhos { display: flex; flex-direction: column; gap: 2px; }

  /* A LINHA NÃO TEM MOLDURA. Eram quatro caixas encaixadas — card, linha,
     faixa e vaga —, e o olho não tem onde descansar. Fica o fundo, que separa
     sem desenhar mais uma borda. */
  /* A LINHA É UMA GRADE DE QUATRO COLUNAS, e não uma fila. Em `flex` o ícone
     de um teclado (19 px) e a silhueta de um controle (34 px) empurravam a
     faixa para posições diferentes, e as seis linhas do mesmo adaptador saíam
     desalinhadas — ela olhou e disse *"falta alinhamento horizontal desses
     elementos"*. Com a grade, desenho, nome, faixa e número ficam em colunas
     fixas, e o olho pode descer a coluna sem tropeçar. */
  .linha {
    display: grid; grid-template-columns: 36px 13ch 1fr 6ch;
    align-items: center; gap: 9px;
    padding: 3px 8px 3px 5px; border-radius: 7px;
    background: transparent; border: 1px solid transparent;
    cursor: grab; user-select: none;
    transition: background var(--ease) 120ms;
  }
  .linha:hover { background: var(--panel); }
  .linha:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .linha.arrastando { opacity: .45; }
  .linha .ds  { width: 34px; height: 24px; justify-self: center; }
  .linha .ico { font-size: 19px; justify-self: center; }
  /* TODO NOME É EDITÁVEL — ordem dela: *"todo texto ali tem que permitir que eu
     possa alterar. Vitória, Caixa de som, teclado, mouse"*. O campo tem moldura
     ao passar o rato: um input sem moldura nenhuma não se anuncia como campo,
     que é o defeito da tabela de hoje. */
  .nome {
    font-size: 12.5px; color: var(--fg); background: transparent;
    border: 1px solid transparent; border-radius: 5px;
    padding: 3px 5px; min-height: 26px; width: 100%; min-width: 0; font-family: inherit;
  }
  .nome:hover { border-color: var(--linha); }
  .nome:focus { outline: none; border-color: var(--purple); background: var(--app-bg); }

  /* A BARRA DE FEATURES DO CONTROLE, e ela é o pedido literal dela: *"ter uma
     barra interna com os espaços reservados pra cada feature na barra dele e
     dentro da barra de cada controle, teriamos os svgs de cada feature
     ocupando o espaço ali."*

     SÃO DOIS ESPAÇOS, e não quatro, porque a física é essa:
       · o que o controle manda — e o MICROFONE anda dentro dele. Medido:
         `dualsense_bt_audio.py` diz que o áudio não abre canal novo, o input
         cai de 260,4 para 170,5 Hz e o total mal se mexe. Por isso o ◉ é um
         selo DENTRO deste espaço, e não um espaço ao lado.
       · a ponte — som OU vibração, nunca os dois (`alto_falante_bt.py:835`).
         Um espaço reservado com dois ocupantes possíveis.

     O ESPAÇO FICA RESERVADO MESMO DESLIGADO: é o que deixa ver, sem clicar,
     quanto aquele controle AINDA pode pedir. */
  /* A FAIXA DE CADA LINHA É PROPORCIONAL AO QUE AQUELE APARELHO GASTA, na
     mesma escala dentro do adaptador. Sem isso a linha do teclado (96 fatias)
     desenhava a mesma largura que a de um controle (928) — e a barra mentia
     exatamente onde ela existe para comparar. O que sobra à direita é o que
     aquele aparelho NÃO gasta. */
  .features { display: flex; min-width: 0; }
  .faixa-do-aparelho { display: flex; gap: 0; min-width: 0; align-items: center; }
  /* UM GRUPO POR DIREÇÃO. A linha entre eles é a informação: o que está de um
     lado não disputa fila com o que está do outro. */
  .fluxo { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .fluxo .seta { font-size: 13px; flex: none; opacity: .4; }
  .fluxo.manda .seta  { color: var(--c-entrada); }
  .fluxo.recebe .seta { color: var(--c-som); }
  .fluxo + .fluxo { margin-left: 7px; padding-left: 7px;
                    border-left: 1px solid var(--border-forte); }
  .sem-radio { font-family: var(--font-dado); font-size: 10.5px;
               color: var(--texto-mudo); opacity: .7; cursor: help;
               align-self: center; }
  .fatias.zero { opacity: .45; }
  .vaga {
    position: relative; display: flex; align-items: center; gap: 5px;
    height: 24px; border-radius: 6px; padding: 0 7px;
    border: 1px dashed var(--linha); background: transparent;
    color: var(--texto-mudo); font: inherit; font-size: 11px; cursor: pointer;
    overflow: hidden; transition: all var(--ease) 140ms;
  }
  .vaga .i { font-size: 15px; flex: none; }
  /* O HERTZ FICA ONDE ELE É GERADO — dentro da vaga que o cobra. */
  .hz { font-family: var(--font-dado); font-size: 10px; opacity: .8;
        white-space: nowrap; margin-left: 3px; }
  /* AS DUAS PARTES DA FILA. A divisória entre elas é o dado: ela anda quando o
     microfone liga, e é isso que a tela tem de mostrar. */
  .parte { display: flex; align-items: center; gap: 2px; min-width: 0;
           height: 24px; border-radius: 6px; padding: 0 6px; overflow: hidden;
           border: 1px solid transparent; font: inherit; font-size: 11px;
           transition: flex-grow var(--ease) 200ms; }
  /* AS PARTES SÃO A VAGA. A moldura externa virou redundante quando a fila
     passou a ter dois pedaços com moldura própria — e, mantida, espremia os
     dois para 22 px, abaixo dos 24 que um alvo de toque pede. */
  .parte.movimento { color: var(--c-entrada); border-color: var(--c-entrada);
                     background: var(--panel); }
  .parte.voz { color: var(--texto-mudo); border-style: dashed;
               border-color: var(--linha); cursor: pointer;
               justify-content: center; }
  .parte.voz[aria-pressed="true"] { color: var(--c-mic); border-style: solid;
                                    border-color: var(--c-mic);
                                    background: rgba(255,121,198,.08); }
  .parte.voz:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }
  /* SÓ A VAGA PARTIDA PERDE A MOLDURA — achado por ela em 22/09: *"cade a
     barra desses elementos?"*.  <!-- (noqa-acento) -->
     A regra nasceu sem o `.partida` e alcançou a caixa de som, o fone e a
     webcam, que têm vaga INTEIRA: elas ficaram com o número solto no escuro,
     sem nada que dissesse quanto daquela linha é delas. A moldura é a barra. */
  .vaga.entrada.fixa.partida { gap: 3px; padding: 0; border: none;
                               background: none; height: 24px;
                               overflow: visible; }
  /* UM PASSAGEIRO não tem largura porque não tem custo próprio. */
  .passageiro { display: inline-flex; align-items: center; flex: none;
                font-size: 13px; opacity: .45; cursor: help; margin-left: 2px; }
  .passageiro:hover, .passageiro:focus-visible { opacity: .95; }
  .vaga:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .vaga.fixa { cursor: help; }
  .vaga[aria-pressed="true"], .vaga.fixa { border-style: solid; }
  /* UMA MANCHA DE COR SÓ, e ela é o resumo lá em cima. Dois arranjos antes
     deste eram dissonantes: cor cheia nas oito barras gritava, e véu em todas
     virava lama — o ciano em azul-petróleo, o laranja em marrom. O que fecha
     é HIERARQUIA: a barra do adaptador é a única mancha; as vagas das linhas
     ficam no fundo do painel e levam a cor só na BORDA e no ÍCONE. */
  .vaga[aria-pressed="true"], .vaga.fixa { background: var(--panel); }
  .vaga.entrada[aria-pressed="true"], .vaga.entrada.fixa {
    border-color: var(--c-entrada); color: var(--c-entrada); }
  .vaga.som[aria-pressed="true"]     { border-color: var(--c-som);     color: var(--c-som); }
  .vaga.haptica[aria-pressed="true"] { border-color: var(--c-haptica); color: var(--c-haptica); }
  .vaga:not([aria-pressed="true"]):not(.fixa):hover { border-color: var(--texto-suave); color: var(--texto-suave); }
  .vaga:not([aria-pressed="true"]):not(.fixa):hover { border-color: var(--texto-suave); color: var(--texto-suave); }

  /* O MICROFONE É UM SELO DENTRO DA VAGA DA ENTRADA, porque é ali que ele
     viaja. Pôr o ◉ ao lado desenharia um fluxo que o aparelho não tem. */
  /* O SELO DE UMA FEATURE QUE NÃO PESA. Largura fixa, fora da barra: a barra é
     a conta de rádio, e um custo zero não pode ocupar espaço nela. */
  .selo-zero {
    width: 26px; height: 24px; border-radius: 6px; padding: 0; flex: none;
    margin-left: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px dashed var(--linha); background: transparent;
    color: var(--texto-mudo); cursor: pointer; font-size: 15px;
  }
  .selo-zero[aria-pressed="true"] { border-style: solid; border-color: var(--yellow);
                                    color: var(--yellow); }
  .selo-zero:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  /* O SELO DO MICROFONE VIROU PARTE DA FILA, e as regras de bolinha que ele
     tinha antes davam forma de pílula a um pedaço de barra. A forma dele agora
     é a de `.parte`: o que muda entre ligado e desligado é a LARGURA. */
  .selo-mic { padding: 0 5px; }

  /* A ESCOLHA DA PONTE: som e vibração dividem UMA vaga, e os dois ícones
     moram dentro dela — acender um apaga o outro. */
  .ponte { display: flex; gap: 3px; flex: 1 1 auto; min-width: 88px; }

  .fatias { font-family: var(--font-dado); font-size: 10.5px; color: var(--texto-mudo);
            text-align: right; cursor: help; }

  /* A VAGA DE SOLTAR, uma linha só — para o adaptador que está sobrando. */
  /* «ARRASTE PARA CÁ» É UM BOTÃO — ordem dela. Uma faixa tracejada que diz uma
     coisa e não responde ao clique é o que faz a pessoa tentar e desistir. */
  .soltar-fila { display: flex; align-items: center; justify-content: center; gap: 6px;
                 margin-top: 3px; }
  .soltar {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    flex: 1 1 auto; min-height: 28px; border: 1px dashed var(--linha);
    border-radius: 7px; background: transparent; font: inherit;
    color: var(--texto-mudo); font-size: 11.5px; cursor: pointer;
  }
  .soltar:hover { border-color: var(--texto-suave); color: var(--texto-suave); }
  .soltar:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .lugar.alvo .soltar { border-color: var(--green); color: var(--green); }

  /* A LÂMPADA — ordem dela: a frase da sugestão *"tem que ser um balão botão
     verde com svg de lâmpada ao lado do adicionar itens de cada extensor
     sobrando e clicando aí sim ele exibe"*. Ela só nasce no adaptador que tem
     espaço E tem alguém para receber. */
  /* A LÂMPADA É SÓ O ÍCONE — ordem dela: *"a direita dele temos só o svg da
     lâmpada"*. A palavra «Sugerir» ao lado de «Arraste para cá» punha dois
     rótulos disputando a mesma linha. */
  .lampada {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 30px; height: 28px; padding: 0; border-radius: 7px; font-family: inherit;
    border: 1px solid var(--green); background: rgba(80,250,123,.08);
    color: var(--green); cursor: pointer;
  }
  .lampada:hover { background: rgba(80,250,123,.2); }
  .lampada:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .lampada .i { font-size: 14px; }

  .balao {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 8px;
    background: rgba(80,250,123,.09); border: 1px solid rgba(80,250,123,.35);
    font-size: 12.5px; color: var(--texto-suave);
  }
  .balao .ds { width: 28px; height: 20px; flex: none; }
  .balao .como { font-size: 11px; color: var(--texto-mudo); }
  .balao .ok {
    margin-left: auto; padding: 5px 14px; border-radius: 6px; min-height: 28px;
    background: var(--green); border: none; color: var(--app-bg);
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .balao .ok:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* ------------------------------------------------------- a sugestão
     A ÚNICA FRASE LONGA QUE FICA NA TELA, e ela é dela: *"O controle Cosmic
     Red da Vitória funciona melhor no Extensor à esquerda"*. É a coisa que a
     seção existe para dizer; virar ícone seria virar charada. */
  .sugestao {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    padding: 7px 10px; border-radius: 9px;
    background: rgba(80,250,123,.07); border: 1px solid rgba(80,250,123,.3);
    font-size: 12.5px; color: var(--texto-suave);
  }
  .sugestao.impossivel { background: rgba(255,184,108,.07); border-color: rgba(255,184,108,.32); }
  .sugestao .marca { color: var(--green); font-size: 16px; display: flex; }
  .sugestao.impossivel .marca { color: var(--orange); }
  .sugestao .ds { width: 26px; height: 18px; flex: none; }
  .sugestao .ok {
    margin-left: auto; padding: 5px 14px; border-radius: 6px; min-height: 28px;
    background: var(--green); border: none; color: var(--app-bg);
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .sugestao .ok:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* ------------------------------------------------------- o espectro
     SLOTS DE BT E OCUPAÇÃO DE 2,4 GHz SÃO DUAS FÍSICAS: um dongle não enche o
     copo, ele ENCOLHE O COPO. Por isso a régua tem outra forma e outra altura
     — pôr as duas na mesma barra foi o que fez a tela de hoje mentir. */
  .espectro { margin-bottom: 11px; }
  .espectro-cab {
    display: flex; align-items: center; gap: 7px; margin-bottom: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--green);
  }
  .espectro-cab .ajuda {
    width: 20px; height: 20px; padding: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--linha); background: transparent;
    color: var(--texto-mudo); cursor: help; font-size: 13px;
  }
  .espectro-cab .conta { font-weight: 400; font-size: 11px; color: var(--texto-mudo);
                         font-family: var(--font-dado); }
  .selo-fora {
    display: inline-flex; align-items: center; gap: 4px; margin-left: auto;
    padding: 1px 7px; border-radius: 999px; cursor: help;
    border: 1px dashed var(--border-forte); color: var(--texto-mudo);
    font-family: var(--font-dado); font-size: 10px;
  }
  .selo-fora .i { font-size: 13px; }
  .selo-fora + .no-ar { margin-left: 9px; }
  /* A FAIXA DAS PORTAS — a segunda física. Ela é discreta de propósito: a
     régua de cima é o que muda a toda hora; esta muda quando alguém pluga
     alguma coisa, e o valor dela é responder «quem está colado em quem». */
  .portas { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  .grupo-de-portas {
    display: flex; gap: 3px; padding: 3px; border-radius: 7px;
    border: 1px dashed var(--border-sutil); cursor: help;
  }
  .porta {
    width: 26px; height: 26px; border-radius: 5px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--linha); background: var(--app-bg);
    color: var(--texto-mudo); cursor: pointer;
    transition: all var(--ease) 130ms;
  }
  .porta .i { font-size: 14px; }
  .porta .ds { width: 18px; height: 13px; }
  .porta.bom    { border-color: rgba(80,250,123,.45); }
  .porta.atento { border-color: var(--orange); }
  .porta.ruim   { border-color: var(--orange); background: rgba(255,184,108,.08); }
  /* USB 3.0 leva um risco: a entrada em si é o vizinho, ocupada ou não. */
  .porta.tres::after {
    content: ''; position: absolute; width: 18px; height: 1px;
    background: var(--yellow); transform: translateY(9px);
  }
  .porta { position: relative; }
  .porta.vizinha { background: var(--sel-bg); border-color: var(--purple); }
  .porta:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .canais {
    position: relative; height: 38px; border-radius: 9px;
    background: var(--app-bg); border: 1px solid var(--linha); overflow: hidden;
  }
  .evitado {
    position: absolute; top: 0; bottom: 0;
    background: repeating-linear-gradient(45deg,
      rgba(255,184,108,.22) 0 4px, transparent 4px 8px);
  }
  /* DUAS PISTAS só existem quando há sobreposição; com uma, a faixa ocupa a
     altura toda e nada muda.

     E A RÉGUA CRESCE COM ELAS. Espremer duas pistas nos 38 px de uma deixava
     cada faixa com 10 px de altura — clicável no papel, inalcançável no dedo.
     Dois alvos de 24 px pedem 58 px de régua, e a seção continua 70 px abaixo
     do teto vertical da página. */
  .canais.duas-pistas { height: 58px; }
  .canais.duas-pistas .faixa.pista-0 { top: 4px;  bottom: auto; height: 24px; }
  .canais.duas-pistas .faixa.pista-1 { top: 30px; bottom: auto; height: 24px; }
  .faixa {
    position: absolute; top: 6px; bottom: 6px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; overflow: hidden; border: 1px solid transparent;
    padding: 0; background: none;
  }
  .faixa { background: var(--panel); border-color: var(--linha); color: var(--texto-mudo); }
  .faixa.forte { border-color: var(--orange); color: var(--orange); }
  .faixa.medio { border-color: var(--yellow); color: var(--yellow); }
  .faixa.fraco { border-color: var(--comment); color: var(--comment); }
  /* FORA DA FAIXA: existe, e não disputa. O cinza é a informação. */
  .faixa.fora { border-style: dashed; border-color: var(--border-forte);
                color: var(--texto-mudo); opacity: .55; }
  /* O QUE ELA AINDA NÃO ENSINOU pede a palavra em roxo, e é o único lugar da
     régua que cobra alguma coisa. */
  /* QUEM ESTÁ CUSTANDO CANAL ganha o anel — é a diferença entre um vizinho que
     só existe e um vizinho que pesa. */
  .faixa.custa { background: rgba(255,184,108,.10); }
  /* R11 — A FAIXA DO VIZINHO É PROVÁVEL, e a borda diz isso: o que o rádio
     MEDE é o canal que ele evita (o hachurado); quem ocupa é dedução. */
  .faixa.provavel { border-style: dashed; }
  .faixa.sem-nome { border-color: var(--purple); color: var(--purple);
                    background: var(--sel-bg); cursor: pointer; }
  .faixa.sem-nome:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }
  /* O NÚMERO MORA DENTRO DO BLOCO — ordem dela: *"isso de legenda não funciona
     coloca o número ou dentro da seção dele"*. Três números soltos embaixo
     obrigam a pessoa a medir com o olho onde cada bloco cai; dentro do bloco,
     a resposta está onde a pergunta nasce. */
  .faixa .ch { font-family: var(--font-dado); font-size: 9.5px; opacity: .9;
               margin-left: 4px; }

  /* ONDE O SEU BLUETOOTH SALTA. Os vizinhos ficam PARADOS numa faixa; o
     Bluetooth salta por todos os canais que sobraram, 1.600 vezes por segundo.
     É a diferença que explica tudo o mais, e ela não estava desenhada. */
  .salto {
    position: absolute; top: 0; bottom: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg,
      rgba(139,233,253,.13) 0 1px, transparent 1px 7px);
  }
  .no-ar { display: flex; align-items: center; gap: 5px; margin-left: auto;
           padding-right: 10px; margin-right: 6px; border-right: 1px solid var(--linha);
           font-size: 11px; color: var(--texto-mudo); cursor: help; }
  .no-ar .i { font-size: 15px; }
  .no-ar .ds { width: 20px; height: 14px; }

  /* ------------------------------------------------- a barra das entradas
     OS TRÊS BOTÕES FICAM (palavra dela) e só mudam de lugar: saem do meio da
     seção — onde «Mapear Entradas» e «Mapear Entrada a Entrada» disputavam
     colunas diferentes com nomes quase iguais — e viram uma barra só, no pé,
     na ordem em que se usam. Aqui a palavra É o rótulo do ato, não explicação:
     o nome de cada um é contrato com a aba. */
  .entradas {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--linha);
  }
  /* O RECADO É UMA LINHA SÓ e nunca empurra nada: ele vive no vão que a
     fileira já tinha, encolhe com reticências e some sozinho. */
  .recado {
    margin-left: auto; display: none; align-items: center; gap: 8px;
    min-width: 0; font-size: 12px; color: var(--texto-suave);
    padding: 0 4px;
  }
  .recado.vivo { display: inline-flex; animation: recado-entra 180ms var(--ease); }
  .recado .diz { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recado .desfazer {
    flex: none; min-height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--border-forte); background: transparent;
    color: var(--purple); font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .recado .desfazer:hover { border-color: var(--purple); background: var(--sel-bg); }
  /* O BOTÃO QUE FAZ A COISA acontecer é o verde, e é o único com peso: a
     pergunta tem duas saídas e só uma delas mexe no aparelho dela. */
  .recado .confirma { color: var(--green); border-color: var(--green); }
  .recado .confirma:hover { border-color: var(--green); background: rgba(80,250,123,.10); }
  .recado.perguntando { color: var(--fg); margin-left: 0; flex: 1 1 auto; }
  /* A PERGUNTA NUNCA É CORTADA. Medido a 820 px: a frase pedia 706 px e tinha
     600, e as reticências comiam justamente o que ela precisa para decidir —
     se o controle volta sozinho ou se pede PS + Create. Um aviso serve
     resumido; uma pergunta, não. Ela quebra em linha e a fileira cresce os
     poucos pixels que isso custa. */
  .recado.perguntando .diz { white-space: normal; overflow: visible;
                             text-overflow: clip; }
  .entradas.perguntando > .btn,
  .entradas.perguntando > .mapa { display: none; }
  .recado .desfazer:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  @keyframes recado-entra { from { opacity: 0 } to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .recado.vivo { animation: none } }
  .recado + .mapa { margin-left: 6px; }

  .entradas .mapa {
    margin-left: auto; color: var(--purple); text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 7px;
    border: 1px solid var(--border-sutil);
  }
  .entradas .mapa .i { font-size: 16px; }
  .entradas .mapa:hover { border-color: var(--purple); background: var(--sel-bg); }
  .entradas .mapa:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  /* --------------------------------------------------- O PAINEL LATERAL
     DECISÃO DELA: *"virar um painel lateral"*. Com dez aparelhos a gaveta
     embutida empurrava a sala inteira para baixo. */
  /* O VÉU DA PERGUNTA É MAIS FUNDO QUE O DO PAINEL. Medido: `rgba(0,0,0,.45)`
     sobre um tema já escuro quase não se vê, e a seção continuava parecendo
     acionável atrás de uma decisão que bloqueia. O painel lateral é uma
     gaveta — dá para olhar a sala enquanto ele está aberto; a pergunta, não. */
  #veu-pergunta.aberto { background: rgba(0,0,0,.72); }
  .caixa-pergunta {
    position: absolute; z-index: 3; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(440px, calc(100% - 40px));
    background: var(--elevated); border: 1px solid var(--border-forte);
    border-radius: 10px; padding: 16px 17px 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
    display: flex; flex-direction: column; gap: 13px;
  }
  .caixa-pergunta[hidden] { display: none; }
  .caixa-pergunta .diz { margin: 0; font-size: 13px; line-height: 1.5; color: var(--fg); }
  .caixa-pergunta .botoes { display: flex; justify-content: flex-end; gap: 8px; }
  .caixa-pergunta .confirma { color: var(--green); border-color: var(--green); }
  .caixa-pergunta .confirma:hover { border-color: var(--green); background: rgba(80,250,123,.10); }
  .veu {
    position: absolute; inset: 0; border-radius: 9px;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none; transition: opacity var(--ease) 180ms;
  }
  .veu.aberto { opacity: 1; pointer-events: auto; }
  .painel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 340px; max-width: 92%;
    background: var(--panel); border-left: 1px solid var(--linha);
    border-radius: 0 9px 9px 0; overflow-y: auto;
    padding: 15px 15px 20px; display: flex; flex-direction: column; gap: 11px;
    /* O DESLIZE É PARA DENTRO. Fechado a 14 px À DIREITA o painel punha borda
       fora do palco, e num `.miolo` com `overflow: auto` isso vira barra de
       rolagem lateral. Começando 14 px à esquerda, ele nunca passa da borda. */
    opacity: 0; visibility: hidden; transform: translateX(-14px);
    transition: opacity var(--ease) 180ms, transform var(--ease) 180ms,
                visibility 0s linear 180ms;
    z-index: 2;
  }
  .painel.aberto { opacity: 1; visibility: visible; transform: none;
                   transition-delay: 0s, 0s, 0s; }
  .painel-cab { display: flex; align-items: center; gap: 9px; }
  .painel-cab h2 { font-size: 13.5px; font-weight: 600; margin: 0; color: var(--green); }
  .pulso { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
           animation: pisca 1.4s var(--ease) infinite; flex: none; }
  @keyframes pisca { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) {
    .pulso { animation: none }
    .fatia, .painel, .veu, .btn, .custo { transition: none }
  }
  .painel-cab .fechar { margin-left: auto; }

  .escolha-lugar { display: flex; gap: 5px; flex-wrap: wrap; }
  .op {
    padding: 5px 10px; border-radius: 20px; font-size: 11.5px; min-height: 28px;
    border: 1px solid var(--linha); background: var(--app-bg);
    color: var(--texto-mudo); cursor: pointer; font-family: inherit;
  }
  .op[aria-pressed="true"] { border-color: var(--green); color: var(--green); background: rgba(80,250,123,.1); }
  .op:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .achados { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
  .achado {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 9px; border-radius: 9px;
    background: var(--app-bg); border: 1px solid var(--linha);
  }
  .achado .ds { width: 26px; height: 18px; flex: none; color: var(--cyan); }
  .achado .ico { font-size: 17px; color: var(--texto-mudo); flex: none; }
  .achado .nome { font-size: 12.5px; }
  .achado .forca { margin-left: auto; font-family: var(--font-dado); font-size: 10.5px; color: var(--texto-mudo); }
  .achado .btn { padding: 4px 10px; font-size: 11.5px; min-height: 26px; }

  .queda {
    display: flex; align-items: center; gap: 8px; padding: 6px 9px;
    border-radius: 9px; background: var(--app-bg); border: 1px solid var(--linha);
    font-size: 12px;
  }
  .queda .quando { font-family: var(--font-dado); font-size: 10.5px; color: var(--texto-mudo); margin-left: auto; }

  .painel .escolha { display: flex; flex-direction: column; gap: 7px; }

  /* ------------------------------------------ PROPOSTA DE 23/09 (as doze)
     R10 — A BARRA DO ADAPTADOR SÃO AS VAGAS DE PONTE. O que transborda um
     adaptador é o que o PC escreve em ritmo fixo (som e vibração); a entrada
     é elástica e se ajeita no ar que sobra. Então a barra conta o que é fixo,
     uma vaga por ponte, e o limite é o medido: duas. */
  .trilho.vagas { height: 14px; overflow: visible; opacity: 1; gap: 3px;
                  background: transparent; border: 0; }
  .vaga-ponte { flex: 1 1 0; height: 100%; border-radius: 4px; cursor: help;
                border: 1px dashed var(--linha); display: flex; align-items: center;
                justify-content: center; color: var(--fg); }
  .vaga-ponte .i { font-size: 10px; }
  .vaga-ponte.cheia { border-style: solid; }
  .vaga-ponte.alem  { border: 1px solid var(--orange); }
  .vaga-ponte.reservada { animation: pisca 1.4s var(--ease) infinite; }
  /* O MOVIMENTO QUE CAIU FICA LARANJA — nunca vermelho: rádio cheio é
     reversível (regra de `radio_da_mesa.py`). */
  .parte.movimento.pouco { border-color: var(--orange); }
  .parte.movimento.pouco .hz { color: var(--orange); font-weight: 600; opacity: 1; }
  .fatias.alem { color: var(--orange); font-weight: 600; }
  .vaga.alem { border-color: var(--orange) !important; }
  /* R1 — ESPERANDO PS + CREATE. É estado, não recado: sem ele a pessoa não
     sabe o que fazer com o controle na mão. */
  .espera { display: inline-flex; align-items: center; gap: 5px; min-height: 24px;
            padding: 1px 9px; border-radius: 20px; font-family: var(--font-corpo);
            font-size: 11.5px; color: var(--green); border: 1px solid rgba(80,250,123,.6);
            animation: pisca 1.4s var(--ease) infinite; white-space: nowrap; }
  .espera .ds { width: 20px; height: 14px; }
  .lugar.esperando { border-color: rgba(80,250,123,.6); }
  .linha.esperando { cursor: default; }
  .linha.esperando .nome { opacity: .6; }
  .linha .segure { color: var(--green); font-size: 11.5px;
                   animation: pisca 1.4s var(--ease) infinite; }
  /* R8 — SEM RECADO: a recusa do «Equilibrar» é o botão que balança. */
  .btn.recusa { animation: recusa 420ms var(--ease) 1; border-color: var(--texto-mudo); }
  @keyframes recusa { 0%,100% { transform: none } 25% { transform: translateX(-3px) }
                      75% { transform: translateX(3px) } }
  @media (prefers-reduced-motion: reduce) {
    .vaga-ponte.reservada, .espera, .linha .segure, .btn.recusa { animation: none }
  }
  .caixa-pergunta .outro[hidden] { display: none; }
</style>
</head>
<body>

<div class="quadro">
  <div class="cab">
    <span class="seta" aria-hidden="true">&#9660;</span>
    <h1>Rádio e Adaptadores</h1>
    <span class="conta" id="conta" data-campo="conta-de-adaptadores" data-hef-alvo="html"></span>
    <div class="direita">
      <button class="btn principal" id="b-conectar" data-gesto="conectar-aparelho">
        <svg class="i"><use href="#i-mais"/></svg> Conectar</button>
      <button class="btn" id="b-equilibrar" data-gesto="equilibrar-radio"
              title="Move um controle por vez">
        <svg class="i"><use href="#i-equilibrar"/></svg> Equilibrar</button>
    </div>
  </div>

  <!-- OS VIZINHOS VÊM PRIMEIRO — ordem dela, 22/09: *"talvez fosse importante
       ele aparecer primeiro acima dos dispositivos de conexão e com outro nome
       melhor. do que só 2.4"*.

       E A ORDEM CONTA UMA HISTÓRIA: primeiro o ar que já está lá — que não é
       meu e eu não escolhi —, depois as antenas que eu ponho nele. Embaixo, a
       régua era um rodapé sem dono, e a pergunta dela (*"como é que isso tá
       falando com os controles?"*) não tinha resposta na tela.

       O NOME. «Rádio e Adaptadores» já é o nome da seção que expande, então
       este bloco precisava de um próprio. «2,4 GHz» é a UNIDADE, não o
       assunto. «Vizinhos de rádio» descrevia só metade — os de fora — e a
       pergunta dela foi exatamente sobre a outra metade: *"se temos wifi,
       fones, caixa de som, webcam e os controles além do mouse e teclado, como
       isso se relaciona com os demais?"*.
       «Quem está no ar» é a pergunta que a pessoa faz olhando para lá, cabe os
       dois lados, e é palavra de todo mundo. -->
  <div class="espectro" data-campo="quem-esta-no-ar">
    <div class="espectro-cab">
      Quem está no ar
      <span class="ajuda" role="img"
            aria-label="Wi-Fi, teclado e mouse sem fio dividem os 2,4 GHz com o Bluetooth. O hachurado são os canais que os adaptadores evitam; as faixas com nome são o vizinho provável."
            title="Wi-Fi, teclado e mouse sem fio dividem os 2,4 GHz com o Bluetooth. O hachurado são os canais que os adaptadores evitam; as faixas com nome são o vizinho provável.">
        <svg class="i"><use href="#i-ajuda"/></svg></span>
      <span class="fora-da-faixa" id="fora-da-faixa"
            data-campo="espectro-fora-da-faixa" data-hef-alvo="html"></span>
      <span class="no-ar" id="meus-no-ar" role="img"></span>
      <span class="conta" id="fonte-espectro" data-campo="espectro-conta" data-hef-alvo="html"></span>
    </div>
    <div class="canais" id="canais" data-campo="espectro-canais" data-hef-alvo="html"></div>
    <!-- A SEGUNDA FÍSICA: as PORTAS. Ela não repete a régua de cima; mede
         outra coisa, e é por isso que fica abaixo e não dentro. -->
    <div class="portas" id="portas" data-campo="vizinhanca-das-portas"
         data-hef-alvo="html"></div>
  </div>

  <div class="sala" id="sala" data-campo="radio-sala" data-hef-alvo="html"></div>

  <div class="entradas">
    <!-- ESTES DOIS NÃO SÃO GESTOS, E O ERRO ERA MEU — medido em 22/09 na
         `paginas/08-conexoes.html`: as duas telas se abrem por
         `href="#mapear-entradas"` e `href="#mapear-entrada-a-entrada"`, CSS
         `:target` puro, sem uma linha de JavaScript e sem `data-gesto` nenhum.
         Este arquivo declarava um `data-gesto` de nome próprio para eles, e
         transplantar isso criaria um SEGUNDO nome para um ato que já tem
         o dele.

         Palavra dela, 22/09: *"mapear entradas, mapear entrada a entrada e
         examinar entrada e o botão pro mapa das portas, vc sabe que eles já
         estão prontos, correto? não mexeremos nelees"*.
         <!== (noqa-acento: citação literal dela) ==>

         No produto as âncoras acham as `div.tela-nova` irmãs. Aqui elas não
         acham nada, e é de propósito: o mockup mostra a FORMA do contrato,
         não reimplementa as telas. -->
    <a class="btn" id="b-mapear" href="#mapear-entradas"
       title="Mapear Entradas — desenhar o meu computador: as entradas numeradas por face, com ocupada, vazia, serve e vale evitar">
      <svg class="i"><use href="#i-mapa"/></svg> Mapear Entradas</a>
    <a class="btn" id="b-uma-a-uma" href="#mapear-entrada-a-entrada"
       title="Mapear Entrada a Entrada — um toque por aparelho: você pluga, ele aprende">
      <svg class="i"><use href="#i-uma-a-uma"/></svg> Mapear Entrada a Entrada</a>
    <button class="btn" id="b-examinar" data-gesto="examinar-portas"
            title="Examinar Entradas — refaz o exame das entradas, energia e rádio, e repinta o Check-up">
      <svg class="i"><use href="#i-reexaminar"/></svg> Examinar Entradas</button>
    <!-- R8, 23/09: SEM RECADO. A TELA-CALADA-01 vale aqui também: a
         confirmação de um ato é o destino que pisca, e a recusa é o botão que
         balança. A pergunta ANTES de mover continua — é pergunta, não
         narração. -->
    <!-- SÓ O SVG, e a razão é dela: *"o link que vai abrir vai ser no
         navegador"*. Um rótulo de três palavras prometia uma gaveta desta
         mesma tela; o ícone sozinho promete um lugar, e a dica diz qual. -->
    <a class="mapa so-icone" href="mapa-das-portas.html"
       title="O mapa das entradas — abre no navegador"
       aria-label="O mapa das entradas — abre no navegador">
      <svg class="i"><use href="#i-mapa"/></svg></a>
  </div>

  <!-- A PERGUNTA É UMA JANELA, e não uma linha no rodapé — ela viu e disse:
       *"aparece escondido ali no final. Pop up?"*.  <!== (noqa-acento) ==>

       A faixa do rodapé serve para AVISAR: ela custa zero de altura e some
       sozinha, que é o certo para «pronto, já foi». Não serve para PERGUNTAR
       sobre um ato que derruba o controle na mão de quem está jogando: ali
       embaixo, longe de onde o dedo soltou, a pergunta se lê depois do susto.

       A janela mora DENTRO do palco, como o painel lateral: o `.quadro` é
       `position: relative` com contexto de empilhamento próprio, então ela
       cobre a seção e não encosta no banner, nas abas nem no rodapé do app.
       E custa ZERO de altura — nada é empurrado.

       O resultado continua na faixa. Pergunta interrompe; aviso não. -->
  <div class="veu" id="veu-pergunta"></div>
  <div class="caixa-pergunta" id="pergunta" role="alertdialog" aria-modal="true"
       aria-labelledby="pergunta-diz" hidden>
    <p class="diz" id="pergunta-diz" data-campo="pergunta"></p>
    <div class="botoes">
      <button class="btn cancelar" id="pergunta-nao" data-gesto="cancelar-mudanca">Cancelar</button>
      <!-- R3 + R4: o «ligar aqui mesmo» de quem não pode re-parear agora. -->
      <button class="btn outro" id="pergunta-outro" data-gesto="ligar-mesmo-assim" hidden></button>
      <button class="btn confirma" id="pergunta-sim" data-gesto="confirmar-mudanca"></button>
    </div>
  </div>

  <!-- O véu e o painel são filhos do PALCO, não do documento. -->
  <div class="veu" id="veu"></div>
  <aside class="painel" id="painel" aria-hidden="true" inert role="dialog" aria-labelledby="painel-titulo">
    <div class="painel-cab">
      <span class="pulso" id="pulso"></span>
      <h2 id="painel-titulo">Procurando</h2>
      <button class="btn so-icone fechar" id="b-fechar" aria-label="Fechar" title="Fechar">
        <svg class="i"><use href="#i-sair"/></svg></button>
    </div>
    <div id="painel-corpo"></div>
  </aside>
</div>
