<div class="tela-nova" id="lanc-conf">
  <div class="tn-cx" role="dialog" aria-modal="true" aria-label="Configurar o lançador">
    <div class="tn-topo">
      <span class="tn-tit">Configurar · Steam</span>
      <a class="tn-x" href="#" data-dica="Fechar">×</a>
    </div>
    <div class="tn-corpo">
      <div class="lc-linha"><span>Como entrou</span><span class="lc-val">Do sistema</span></div>
      <div class="lc-linha"><span>Onde ele está</span><span class="lc-val"><code>~/.steam/steam</code><a class="btn mini" href="#lanc-conf">Escolher a pasta…</a></span></div>
      <div class="lc-linha"><span>Pastas dos jogos</span><span class="lc-val"><span>Pasta <code>steamapps</code></span><small>48 jogos</small></span></div>
      <div class="lc-linha"><span>Impedimentos</span><span class="lc-val"><small>2 jogos não recebem gatilhos e vibração</small><a class="btn mini" href="#impedimentos" data-gesto="ver-impedimentos" data-v="steam">Ver e resolver</a></span></div>
      <div class="lc-linha"><span data-dica="O perfil entra sozinho quando o jogo abre">Cada jogo ganha o seu perfil</span><span class="lc-val"><span class="nj-tog ligado" data-on="Ligado" data-off="Desligado"><span class="pino"></span><span class="txt">Ligado</span></span></span></div>
    </div>
    <div class="tn-rod">
      <a class="btn" href="#">Cancelar</a>
      <a class="btn roxo" href="#">Guardar</a>
    </div>
  </div>
</div>
