# As datas ficam em branco até quem mantém decidir; o título diz o que cabe em cada marco.
milestones:
  - titulo: "Primeira versão pública"
    descrição: "O que entra na primeira versão pública do Hefesto."
  - titulo: "Depois da primeira versão"
    descrição: "O que fica para as versões seguintes."

# Os tipos de issue são da organização; os formulários de `ISSUE_TEMPLATE/` os escolhem pelo nome.
tipos_de_issue:
  - {nome: "Bug", descrição: "Algo não funciona como deveria", cor: "red"}
  - {nome: "Ideia", descrição: "Uma funcionalidade nova ou uma melhoria", cor: "blue"}
  - {nome: "Jogo ou emulador", descrição: "Um jogo ou emulador que não reconhece o controle", cor: "purple"}

# A publicação só segue com a aprovação de quem mantém, e só a partir de uma tag de versão. O segredo
# de publicação não existe: a publicação no PyPI usa o publicador de confiança (OIDC) do `release.yml`.
# Cada ambiente implanta só dos ramos e das tags listados: a regra que sobra sai. O `github-pages` nasce
# com as Pages e com a regra do ramo padrão (o `dev`); a página publica do `main`, e sem esta linha a
# publicação seria recusada.
ambientes:
  - nome: pypi
    revisores: [vitoriamariadb, AndreBFarias]
    impedir_autoaprovacao: false
    tags: ["v*"]
  - nome: release
    revisores: [vitoriamariadb, AndreBFarias]
    impedir_autoaprovacao: false
    tags: ["v*"]
  - nome: github-pages
    revisores: []
    impedir_autoaprovacao: false
    ramos: [main]

# As categorias nascem com as Discussions e a API do GitHub não cria nem renomeia categoria: aqui só se mede.
# Os modelos de `DISCUSSION_TEMPLATE/` têm o nome destes endereços.
discussoes:
  categorias:
    - {slug: announcements, responsável: false}
    - {slug: q-a, responsável: true}
    - {slug: ideas, responsável: false}
    - {slug: show-and-tell, responsável: false}

# O quadro «Roteiro» é da organização e serve ao Hefesto e à Forja. As issues entram nele pelo fluxo
# `rotulos.yml` (o GitHub não deixa ligar a entrada automática por API).
projetos:
  - título: "Roteiro"
    descrição: "O que vem a seguir no Hefesto e na Forja, por etapa e por versão."
    público: true
    ligado_a:
      - Hefesto-Team/hefesto-dualsense4unix
      - Hefesto-Team/Forja
    etapas:
      - {nome: "Ideia", cor: GRAY}
      - {nome: "Planejado", cor: BLUE}
      - {nome: "Em andamento", cor: YELLOW}
      - {nome: "Feito", cor: GREEN}
    vistas:
      - {nome: "Quadro", formato: board}
      - {nome: "Por versão", formato: table, agrupar_por: Milestone}
      - {nome: "Bugs por área", formato: table, filtro: "label:bug", agrupar_por: Labels}

# Cada regra é uma chave com um aplicador em `scripts/github/aplicar.py`.
# `checks` são os nomes que o GitHub mostra (o `name` do job, ou o id dele; o job com matriz
# leva o valor entre parênteses) e cada um tem de existir em `.github/workflows/`.
# Os administradores passam pelo ruleset «a porta» (o trabalho do dia entra por push direto no `dev`).
# A história do `dev` e a do `main` não se apagam nem se reescrevem, sem exceção para ninguém.
# A assinatura (SSH, o selo «Verified») mora num ruleset por ramo: no `dev` sem exceção, porque uma
# exceção anularia a regra para quem mais empurra commit; no `main` com a exceção de quem administra,
# porque o `main` está milhares de commits atrás do `dev`, nenhum deles assinado, e sem ela o primeiro
# avanço dele na release seria recusado pelos commits antigos. A exceção vale para todas as regras do
# ruleset em que está, por isso esse ruleset só tem a assinatura. O histórico linear mora na porta, e não
# na história, pelo mesmo motivo (o `dev` traz centenas de merges que o `main` ainda não tem).
# A assinatura só se aplica depois do push da história: a que já existe não é assinada.
rulesets:
  - nome: "A história do dev e do main não se reescreve"
    ramos: [dev, main]
    sem_apagar: true
    sem_push_forcado: true
  - nome: "O que entra no dev e no main passa pelos checks e pela revisão"
    ramos: [dev, main]
    historico_linear: true
    revisão:
      aprovacoes: 1
    checks:
      - autoria
      - "lint-test (3.10)"
      - "lint-test (3.11)"
      - "lint-test (3.12)"
    excecao: administradores
  - nome: "As versões publicadas não se apagam nem se reescrevem"
    tags: ["v*"]
    sem_apagar: true
    sem_push_forcado: true
    sem_atualizar: true
  - nome: "A história do dev vem assinada"
    ramos: [dev]
    assinatura: exigida
  - nome: "A história do main vem assinada, e quem administra a avança"
    ramos: [main]
    assinatura: exigida
    excecao: administradores

# O perfil da comunidade do GitHub (README, licença, conduta, como contribuir, segurança e os
# modelos de issue e de PR) em 100%.
comunidade:
  saude_minima: 100

# O que o GitHub oferece e a casa deixa de fora, cada um com o motivo medido em 06/10/2026.
de_fora:
  lfs: "o maior arquivo versionado tem 2,3 MB (`git ls-files` com `stat`); o limite do GitHub é 100 MB por arquivo"
  merge_queue: "o trabalho do dia entra por push direto de quem mantém no `dev`; a fila serve a quem mescla PR de muita gente"
  codespaces: "o produto pede o aparelho (hidraw, uinput, Bluetooth) e uma sessão gráfica, que um contêiner na nuvem não tem"
  autolinks: "o prefixo `D-` das decisões casa com «D-pad», que 47 arquivos do repositório escrevem (`grep -rli`), e os identificadores das tarefas internas não aparecem no texto público"
  imagem_de_previa_social: "a API do GitHub não tem endpoint para a imagem (nenhum caminho de «social preview» na descrição OpenAPI de 06/10/2026); sobe-se pela interface, em Settings"
