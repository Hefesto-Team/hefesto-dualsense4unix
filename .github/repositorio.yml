# O que este repositório tem no GitHub, escrito como código. Quem lê é o
# `scripts/github/aplicar.py`:
#   python3 scripts/github/aplicar.py --repo DONO/NOME --conferir   diz a diferença; sai com 1 se houver
#   python3 scripts/github/aplicar.py --repo DONO/NOME --aplicar    aplica pelo `gh api`, e rodar de novo não muda nada
# Mudar uma configuração na interface do GitHub não vale: a próxima conferência acusa a diferença.
versão: 1

about:
  descrição: "O DualSense completo no Linux: gatilhos adaptativos, luz, vibração, giroscópio, áudio e até quatro jogadores."
  site: "https://hefesto-team.github.io/hefesto-dualsense4unix/"
  topicos:
    - dualsense
    - ps5
    - linux
    - gamepad
    - controller
    - adaptive-triggers
    - haptic-feedback
    - gyroscope
    - accessibility
    - python

# A mesclagem de PR em linha reta: o histórico do `dev` e do `main` não ganha commit de merge feito
# pelo botão do GitHub (a porta, abaixo, também exige histórico linear de quem não mantém).
configuração:
  # O ramo padrão é declarado, não herdado do primeiro push: o `--conferir` reprova o repositório
  # recriado que nasceu com `main`, e o `--aplicar` o volta a este (o ramo tem de existir no remoto).
  ramo_padrao: dev
  mesclagem:
    merge_commit: false
    squash: true
    rebase: true
    apagar_ramo: true
    atualizar_ramo: true

# `ligada: false` precisa de `depois`: o que está desligado hoje e quando volta a ser considerado.
# As Pages saem do fluxo `paginas.yml` (pelo ambiente `github-pages`, abaixo); a Wiki nasce vazia e é
# preenchida por quem mantém.
funções:
  issues:
    ligada: true
  wiki:
    ligada: true
  pages:
    ligada: true
  projects:
    ligada: true
  discussions:
    ligada: true
  # O botão Sponsor mostra o que o FUNDING.yml lista; o GitHub Sponsors, o Ko-fi e o PIX entram lá
  # quando quem mantém decidir quem recebe.
  sponsor:
    ligada: true

# Só o alerta do Dependabot fica: ele avisa da dependência com falha conhecida, e a atualização se faz
# num commit de quem mantém. O PR de segurança do robô sairia vermelho no check `autoria` (o autor
# dele não está no `.mailmap`) e não se mescla, nem pela exceção de administrador: qualquer jeito de
# mesclar põe o robô como autor na história do `dev`.
seguranca:
  relato_privado: true
  alertas_do_dependabot: true
  atualizacoes_de_seguranca: false
  varredura_de_segredo: true
  protecao_de_push_de_segredo: true
  varredura_de_codigo: true
  linguagens_da_varredura: [python, actions]
  grafo_de_dependencias: true
  # A release do `release.yml` nasce como rascunho, recebe os arquivos e só então é publicada
  # (`scripts/release/publicar.py`): a imutável trava os arquivos e a tag da versão publicada, e o
  # GitHub nunca reaproveita uma tag que já foi de uma release imutável.
  releases_imutaveis:
    ligada: true

# Só o fluxo mais restrito: o `GITHUB_TOKEN` lê, e o PR de gente de fora espera a aprovação de quem mantém.
ações:
  permissao_do_fluxo: leitura
  fluxo_aprova_pr: false
  aprovacao_de_fork: todos_de_fora

# Quem mantém: as duas contas do `.mailmap`.
mantenedores:
  - conta: vitoriamariadb
    função: admin
  - conta: AndreBFarias
    função: admin

# A equipe que o `CODEOWNERS` chama para revisar. Existe só em organização.
equipes:
  - nome: mantenedores
    descrição: "Quem mantém o Hefesto e a Forja."
    acesso: maintain
    membros:
      - conta: vitoriamariadb
        função: maintainer
      - conta: AndreBFarias
        função: maintainer

# A série da versão: o prefixo das versões que este repositório numera. O `scripts/release/versao.py`
# lê esta linha, descobre a última tag da série e propõe a próxima pelo tipo dos commits (`feat` sobe o
# primeiro número depois do prefixo, `fix` o seguinte); nenhum número é escolhido à mão. «0.9» segue a
# numeração do `pyproject.toml` (0.9.4.5 -> 0.9.5); seguir do `v4.0.0`, que também está nas tags, é
# trocar por «4» (-> 4.1.0). Nenhuma versão foi publicada com esta série ainda: trocar custa uma linha.
release:
  serie: "0.9"

