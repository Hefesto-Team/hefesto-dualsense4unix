name: Release

on:
  push:
    tags:
      # QUATRO-COMPONENTES-01 (13/08/2026): a versão canônica passou a ter
      # quatro componentes (0.9.4.2) — a série 0.9.4.x marca o avanço do
      # mapeamento dentro da mesma alfa. O padrão de três NÃO casa `v0.9.4.2`,
      # e a tag subiu sem disparar release nenhum: nem erro, nem run, silêncio.
      # Os dois padrões convivem porque as tags antigas (v0.1.0 … v4.0.0) são
      # de três e continuam válidas para republicação por `workflow_dispatch`.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para re-publicar (ex.: v2.1.0). Permite correr release.yml manualmente contra uma tag existente — útil após fixes de CI (CHORE-CI-REPUBLISH-TAGS-01)."
        required: true
        type: string

# O fluxo lê; o job que precisa de mais pede o seu (o `integridade` atesta, o `github-release` publica
# e o `pypi` assina pelo OIDC). Nada mais escreve no repositório.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Consistência de versão entre os alvos versionados
        run: python3 scripts/check_version_consistency.py
      - name: A tag diz a versão do pacote
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/release/versao.py conferir-tag "${REF_NAME}"
      - name: Build wheel + sdist
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Ler versão
        id: info
        env:
          # Em workflow_dispatch, github.ref_name é o branch/ref do run (ex.: main);
          # o input `tag` tem o valor real (ex.: v2.1.0). Prioriza o input.
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.info.outputs.version }}
          path: dist/

  appimage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Deps do SO (libfuse2 pra AppImage + librsvg pra PNG)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 librsvg2-bin \
            libhidapi-dev libhidapi-hidraw0 libudev-dev libxi-dev
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - name: Instalar python-appimage
        run: |
          pip install -e ".[dev]"
          pip install python-appimage build
      - name: Gerar AppImage
        run: bash scripts/build_appimage.sh
      - name: Smoke AppImage
        run: ./dist/appimage/Hefesto-Dualsense4Unix-*-x86_64.AppImage version
      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ needs.build.outputs.version }}
          path: dist/appimage/*.AppImage

  deb:
    # Um .deb por distro: o venv bundlado (--copies) linka contra a
    # libpython3.X exata do build, então 22.04->py310 e 24.04->py312. Os dois
    # vão no release; o usuário instala o da sua distro (apt recusa o outro
    # via Depends python3.X). Resolve BUG-DEB-VENV-CROSS-PYVER-01.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # setup-python 3.12 fica no PATH só para o build_deb.sh ler a versão via
      # tomllib (3.11+); o venv bundlado usa /usr/bin/python3 (default da distro).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Instalar dpkg-deb + python3-venv do sistema
        run: sudo apt-get update && sudo apt-get install -y dpkg python3-venv build-essential python3-dev libudev-dev
      - name: Build .deb
        run: bash scripts/build_deb.sh
      - name: Upload pacote .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ needs.build.outputs.version }}-${{ matrix.os }}
          path: dist/*.deb

  deb-install-smoke:
    name: Smoke install do .deb
    # Um smoke por distro, casando o .deb que aquela distro produz: o py310 é
    # instalado e validado no 22.04 (Jammy, libpython3.10) e o py312 no 24.04
    # (Noble, libpython3.12). O venv bundlado é AUTOCONTIDO (pydantic 2, typer,
    # etc. pinados via pip no build) — não precisa do antigo hack de
    # `pip install --user pydantic` (que ainda por cima quebraria no 22.04, cujo
    # pip não tem --break-system-packages). gi vem do python3-gi do sistema via
    # .pth shim. Resolve BUG-DEB-VENV-CROSS-PYVER-01.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    needs: [build, deb]
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Baixar artifact do .deb
        uses: actions/download-artifact@v8
        with:
          name: deb-${{ needs.build.outputs.version }}-${{ matrix.os }}
          path: ./dist
      - name: Listar artifact
        run: ls -lah ./dist
      - name: Instalar .deb via apt (resolve deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/hefesto-dualsense4unix_*_amd64_*.deb
      - name: Validar binário hefesto-dualsense4unix
        run: |
          which hefesto-dualsense4unix
          # Venv bundlado é autocontido — roda direto, sem PYTHONPATH.
          # 'version' é subcomando (não existe '--version' top-level).
          hefesto-dualsense4unix version
      - name: Validar os módulos que o produto importa
        run: /opt/hefesto-dualsense4unix/venv/bin/python -c 'import hidapi, pydualsense, uinput, jeepney'
      - name: Validar binário hefesto-dualsense4unix-gui
        run: |
          which hefesto-dualsense4unix-gui
          # --help em runner headless pode falhar por falta de DISPLAY/GTK;
          # o critério é localizar o binário. Exit não-zero aqui é aceitável.
          hefesto-dualsense4unix-gui --help || echo "gui --help retornou não-zero em headless (esperado)"
      - name: Validar o atalho do menu e o alvo dele
        run: |
          sudo apt-get install -y desktop-file-utils
          atalho=/usr/share/applications/hefesto-dualsense4unix.desktop
          desktop-file-validate "${atalho}"
          if grep -qE '@[A-Za-z_]+@|^X-HefestoNaoEmpacotado' "${atalho}"; then
            echo "o atalho do menu saiu com marcador ou com a chave de não empacotado"
            exit 1
          fi
          alvo="$(sed -n 's/^Exec=env HEFESTO_NA_TELA=1 //p' "${atalho}")"
          test -x "${alvo}"
      - name: Desinstalar (valida postrm)
        run: sudo apt-get remove -y hefesto-dualsense4unix

  arch-smoke:
    name: Smoke do pacote do Arch
    runs-on: ubuntu-latest
    needs: build
    container: archlinux:latest
    steps:
      - name: Preparar o Arch
        run: pacman -Syu --noconfirm base-devel git sudo
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Construir o pacote
        run: |
          git config --global --add safe.directory "$PWD"
          VERSAO="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          useradd -m construtor
          echo 'construtor ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/construtor
          install -d -o construtor /home/construtor/pkg
          git archive --prefix="hefesto-dualsense4unix-${VERSAO}/" \
            -o "/home/construtor/pkg/hefesto-dualsense4unix-${VERSAO}.tar.gz" HEAD
          cp packaging/arch/PKGBUILD packaging/arch/hefesto-dualsense4unix.install /home/construtor/pkg/
          chown -R construtor /home/construtor/pkg
          su construtor -c 'cd ~/pkg && makepkg --syncdeps --noconfirm'
      - name: Instalar e importar o que o produto usa
        run: |
          pacman -U --noconfirm /home/construtor/pkg/hefesto-dualsense4unix-*.pkg.tar.zst
          python -c 'import hidapi, pydualsense, uinput, jeepney'
          hefesto-dualsense4unix version
      - name: Validar o atalho do menu e o alvo dele
        run: |
          pacman -S --noconfirm desktop-file-utils
          atalho=/usr/share/applications/hefesto-dualsense4unix.desktop
          desktop-file-validate "${atalho}"
          if grep -qE '@[A-Za-z_]+@|^X-HefestoNaoEmpacotado' "${atalho}"; then
            echo "o atalho do menu saiu com marcador ou com a chave de não empacotado"
            exit 1
          fi
          alvo="$(sed -n 's/^Exec=env HEFESTO_NA_TELA=1 //p' "${atalho}")"
          test -x "${alvo}"

  fedora-smoke:
    name: Smoke do pacote do Fedora
    runs-on: ubuntu-latest
    needs: build
    container: fedora:latest
    steps:
      - name: Preparar o Fedora
        run: dnf install -y rpm-build dnf-plugins-core git
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Construir o pacote
        run: |
          git config --global --add safe.directory "$PWD"
          SPEC=packaging/fedora/hefesto-dualsense4unix.spec
          VERSAO="$(sed -n 's/^Version:[[:space:]]*//p' "$SPEC")"
          mkdir -p "$HOME/rpmbuild/SOURCES"
          git archive --prefix="hefesto-dualsense4unix-${VERSAO}/" \
            -o "$HOME/rpmbuild/SOURCES/hefesto-dualsense4unix-${VERSAO}.tar.gz" HEAD
          dnf builddep -y "$SPEC"
          rpmbuild -bb "$SPEC"
      - name: Instalar e importar o que o produto usa
        run: |
          dnf install -y "$HOME"/rpmbuild/RPMS/*/hefesto-dualsense4unix-*.rpm
          python3 -c 'import hidapi, pydualsense, uinput, jeepney'
          hefesto-dualsense4unix version
      - name: Validar o atalho do menu e o alvo dele
        run: |
          dnf install -y desktop-file-utils
          atalho=/usr/share/applications/hefesto-dualsense4unix.desktop
          desktop-file-validate "${atalho}"
          if grep -qE '@[A-Za-z_]+@|^X-HefestoNaoEmpacotado' "${atalho}"; then
            echo "o atalho do menu saiu com marcador ou com a chave de não empacotado"
            exit 1
          fi
          alvo="$(sed -n 's/^Exec=env HEFESTO_NA_TELA=1 //p' "${atalho}")"
          test -x "${alvo}"

  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            flatpak \
            flatpak-builder \
            python3-pip \
            python3-build \
            libhidapi-dev \
            libudev-dev
      - name: Adicionar remote Flathub
        run: |
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Instalar runtime GNOME//47
        run: |
          flatpak install --user -y flathub \
            org.gnome.Platform//47 \
            org.gnome.Sdk//47
      - name: Construir wheel Python
        run: |
          pip3 install build
          python3 -m build --wheel --outdir dist/
      # PACOTE-COM-NOME-01: o manifesto não declara `branch:`, então o
      # flatpak-builder gravava o ref como `master` — nome herdado do git, que
      # não diz nada sobre canal de distribuição. A branch passa a ser `stable`.
      #
      # ATENÇÃO, medido em 29/07: `--default-branch` existe SÓ no
      # `flatpak-builder`. O `flatpak build-bundle` NÃO conhece essa flag
      # (`man flatpak-build-bundle` aceita apenas --runtime, --arch, --repo-url,
      # --runtime-repo, --gpg-keys, --gpg-homedir, --from-commit, --oci e os
      # verbosos) e morreria com "Unknown option" na primeira tag — levando o
      # `github-release`, que depende deste job, junto. No bundle a branch é o
      # ÚLTIMO ARGUMENTO POSICIONAL, e é assim que a branch viaja abaixo.
      - name: Construir Flatpak
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --default-branch=stable \
            --repo=flatpak-repo \
            flatpak-build-dir \
            flatpak/io.github.hefesto_team.hefesto_dualsense4unix.yml
      # PACOTE-COM-NOME-01: o bundle era o ÚNICO artefato sem versão no nome —
      # o AppImage e os dois .deb já a carregam. Duas releases publicavam o
      # mesmo `Hefesto-Dualsense4Unix.flatpak`, e quem baixasse não tinha como
      # saber qual estava na mão.
      - name: Exportar bundle .flatpak
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flatpak build-bundle \
            flatpak-repo \
            "Hefesto-Dualsense4Unix-${VERSION}-x86_64.flatpak" \
            io.github.hefesto_team.hefesto_dualsense4unix \
            stable
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ needs.build.outputs.version }}
          path: Hefesto-Dualsense4Unix-${{ needs.build.outputs.version }}-x86_64.flatpak
          if-no-files-found: error

  # PACOTE-COM-NOME-01, acoplamento release/CI: o `ci.yml` já dispara na tag
  # `v*` (bloco C do PORTÃO-VIVO-01), mas o `github-release` só dependia de
  # jobs deste arquivo. Resultado medido: os nove portões que existem SÓ no
  # ci.yml — packaging-parity, shellcheck, glifos, referencias-docs,
  # version-sync, pre-commit, gtk-real, runtime-smoke, smoke-multi-distro —
  # informavam e não impediam nada. Um ci.yml vermelho e uma release verde
  # conviviam no mesmo commit.
  #
  # Das três saídas possíveis, esta é a que NÃO duplica lógica: em vez de
  # copiar os portões para cá (que os faria divergir na primeira mudança) ou
  # converter o ci.yml em `workflow_call` (que muda o gatilho de TODOS os
  # eventos do arquivo mais crítico da casa, incluindo os PRs), o guarda
  # apenas PERGUNTA qual foi a conclusão do ci.yml na MESMA SHA.
  #
  # A política de "o que é flaky" continua morando no ci.yml, onde já está
  # declarada: fedora-42 e archlinux são `continue-on-error: true`, portanto a
  # falha deles não muda a conclusão do run e não trava a release. Este guarda
  # não mantém lista paralela nenhuma — se amanhã alguém marcar outro job como
  # experimental, o guarda obedece sem ser editado.
  guarda-ci:
    name: Guarda — o ci.yml desta SHA tem de estar verde
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Exigir conclusão "success" do ci.yml na mesma SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "SHA sob julgamento: ${SHA}"
          ID="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse
                  | ((map(select(.conclusion == "success")) | .[0]) // .[0]) // empty | .id')"
          if [ -z "${ID}" ]; then
            echo "::error::Nenhum run do ci.yml para a SHA ${SHA}: rode o ci.yml nesta ref (workflow_dispatch) antes de republicar a tag."
            exit 1
          fi
          gh run watch "${ID}" --repo "${REPO}" --exit-status --interval 60

  # O que se baixa se confere: o `SHA256SUMS` de todo arquivo da release e o atestado de procedência (de que
  # commit e de que fluxo cada um saiu). O atestado só existe no servidor (precisa do token OIDC); no `act`,
  # que não o tem, o passo é pulado e o resto roda de verdade, sobre os arquivos que o `act` consegue montar.
  # O atestado de repositório público vai para o registro público de transparência (Sigstore) e não se
  # apaga: ele espera o `guarda-ci` como todo job que entrega para fora.
  # A peça GDK (xgameruntime.dll), o GameInput da casa (gameinput.dll) e as duas sondas, do fonte em
  # assets/gdk-runtime/. O Ubuntu é o 24.04 fixo: o pino.txt grava o sha256 do binário, e só o mesmo compilador dá
  # o mesmo binário. O `--conferir` reprova a release se o fonte mudou sem o pino acompanhar.
  peca-gdk:
    name: A peça GDK, compilada e conferida com o pino
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Compilador mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y $(sed -n 's/^mingw=//p' assets/gdk-runtime/pino.txt)
      - name: Compilar, marcar como builtin do Wine e conferir com o pino
        run: bash assets/gdk-runtime/construir.sh dist/peca-gdk --conferir
      - name: Upload da peça GDK
        uses: actions/upload-artifact@v7
        with:
          name: peca-gdk-${{ needs.build.outputs.version }}
          path: dist/peca-gdk/
          if-no-files-found: error

  integridade:
    name: SHA256SUMS e atestado de procedência
    runs-on: ubuntu-latest
    needs: [build, appimage, deb, flatpak, guarda-ci, peca-gdk]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-${{ needs.build.outputs.version }}*"
          path: dist/tudo/
          merge-multiple: true
      - name: Gerar o SHA256SUMS
        run: python3 scripts/release/sums.py gerar dist/tudo
      - name: Conferir o SHA256SUMS com o do sistema
        run: |
          python3 scripts/release/sums.py conferir dist/tudo
          cd dist/tudo && sha256sum --check SHA256SUMS
      - name: Atestado de procedência
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/tudo/SHA256SUMS
      - name: Guardar o SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: sums-${{ needs.build.outputs.version }}
          path: dist/tudo/SHA256SUMS
          if-no-files-found: error

  # A release nasce como rascunho, recebe os arquivos e só então é publicada: a release imutável trava a versão
  # no instante em que a versão é pública, e apagar e recriar a versão (o que este job fazia a cada re-execução) o
  # GitHub recusa. `scripts/release/publicar.py` faz os passos e recusa o que não confere.
  github-release:
    needs: [build, appimage, deb, deb-install-smoke, arch-smoke, fedora-smoke, flatpak, guarda-ci, integridade, peca-gdk]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # Tudo o que a release publica numa pasta só: o wheel, o sdist, o AppImage, os dois .deb, o bundle
      # Flatpak e o `SHA256SUMS` que o job `integridade` guardou.
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-${{ needs.build.outputs.version }}*"
          path: dist/tudo/
          merge-multiple: true
      - name: Conferir os arquivos com o SHA256SUMS
        run: python3 scripts/release/sums.py conferir dist/tudo --exigir '*.whl' '*.tar.gz' '*.AppImage' '*.deb' '*.flatpak' 'xgameruntime.dll' 'sonda-gdk.exe' 'gameinput.dll' 'sonda-gameinput.exe'
      - name: Notas da release (a seção do CHANGELOG e como conferir)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/release/changelog.py notas "${VERSION}" --repo "${GITHUB_REPOSITORY}" > /tmp/release-notes.md
          echo "---NOTES PREVIEW---"
          head -20 /tmp/release-notes.md
          wc -l /tmp/release-notes.md
      - name: Publicar a release (rascunho, arquivos, publicação)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/release/publicar.py "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pasta dist/tudo \
            --notas /tmp/release-notes.md \
            --titulo "Hefesto - DualSense4Unix v${VERSION}"

  # Os arquivos de pacote de cada distribuição seguem a versão: o `PKGBUILD` ganha o hash do tarball da tag, e o
  # que sai daqui fica num artefato para quem mantém o pacote publicar (o AUR e o Flathub são contas de quem mantém).
  # Com `PACOTES_REPOS` (uma lista de DONO/NOME no GitHub) e o segredo `PACOTES_TOKEN`, ele também abre o PR de
  # atualização em cada um.
  pacotes:
    name: Pacotes de distribuição na versão da tag
    runs-on: ubuntu-latest
    needs: [build, github-release]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Baixar o tarball da tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: curl --fail --silent --show-error --location --output fonte.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/v${VERSION}.tar.gz"
      - name: Preparar os arquivos de pacote
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 scripts/release/pacotes.py preparar --numero "${VERSION}" --tarball fonte.tar.gz --saida dist/pacotes
      - name: Guardar os arquivos de pacote
        uses: actions/upload-artifact@v7
        with:
          name: pacotes-${{ needs.build.outputs.version }}
          path: dist/pacotes/
          if-no-files-found: error
      - name: Abrir o PR de atualização nos repositórios de pacote
        if: ${{ vars.PACOTES_REPOS != '' }}
        env:
          GH_TOKEN: ${{ secrets.PACOTES_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PACOTES_REPOS: ${{ vars.PACOTES_REPOS }}
        run: python3 scripts/release/pacotes.py abrir-pr --numero "${VERSION}" --pasta dist/pacotes --repos "${PACOTES_REPOS}"

  # O `if` deixa este job inerte enquanto a variável não existir, mas inerte não
  # é guardado: no dia em que a variável existir, sem o `guarda-ci` aqui o wheel sobe
  # ao PyPI — que é irreversível, o índice não aceita reenvio da mesma versão —
  # com os portões do ci.yml vermelhos. Todo job que entrega para fora depende
  # do guarda; quem cobra isso é `tests/unit/test_release_workflow_nomes_e_portoes.py`.
  pypi:
    needs: [build, guarda-ci, integridade]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - name: Publicar no PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
