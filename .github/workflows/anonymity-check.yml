name: anonymity-check

# Status check obrigatorio. Reprova qualquer push cujos commits tragam
# trailers de coautoria de IA, mensagens com mencao a ferramentas IA no
# subject, ou identidades de autor com email de provedor IA.
#
# Quando marcado como required check em branch protection, falha do job
# bloqueia merge no main mesmo que o commit tenha sido criado com
# `--no-verify` localmente. Defesa server-side ultima.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-commits:
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.event.after }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir intervalo a auditar
        id: range
        run: |
          set -u
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "range=${PR_BASE_SHA}..${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            if [ "$PUSH_BEFORE" = '0000000000000000000000000000000000000000' ] || [ -z "$PUSH_BEFORE" ]; then
              echo "range=${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
            else
              echo "range=${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Auditar mensagens de commit
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -u
          echo "Intervalo auditado: $RANGE"

          TOOL_RE='laude|nthropic|opilot|emini|hatGPT|gpt-[0-9]|aider|ursor|indsurf|odeium|abnine|eepseek'
          NOREPLY_RE='noreply@(anthropic|openai|github)\.com'

          FAIL=0

          # Fail-CLOSED (PUBLICAÇÃO-FIEL-01/E5). O idioma antigo era
          # `MAPFILE=$(git log ... 2>/dev/null || true)` seguido de `exit 0` no
          # vazio: ele engolia o código de saída, e um `git log` que FALHA (ref
          # inválida, objeto ausente num clone raso, `before` órfão depois de
          # force-push) ficava indistinguível de "não havia commit no
          # intervalo". Os dois davam MAPFILE vazio, e o único portão de
          # segurança desta casa saía 0 sem olhar commit nenhum — justamente no
          # evento mais arriscado, que é o force-push (esta main já levou dois).
          # A polaridade copiada é a do guarda de CI do release.yml: o que não
          # dá para medir REPROVA. Daqui em diante o código de saída do git log
          # e a saída vazia são fatos SEPARADOS.
          #
          # O `|| RC_GIT=$?` NÃO é o `|| true` de volta: ele GUARDA o código em
          # vez de descartá-lo. Ele é obrigatório porque o runner roda todo
          # `run:` com `bash -e`: sem o `||`, um git log que falha derruba o
          # passo ali mesmo, antes da segunda tentativa e antes da mensagem que
          # diz qual intervalo não pôde ser auditado. Reprovaria — mas mudo.
          ERRO_GIT="$(mktemp)"
          RC_GIT=0
          MAPFILE="$(git log --pretty=format:'%H' "$RANGE" 2>"$ERRO_GIT")" || RC_GIT=$?
          if [ "$RC_GIT" -ne 0 ]; then
            # Segunda tentativa: auditar a partir do topo, o mesmo tratamento
            # que o passo "Definir intervalo a auditar" já dá ao primeiro push.
            # O topo é um SUPERconjunto do intervalo, então nada escapa.
            RC_TOPO=1
            if [ -n "${PUSH_AFTER:-}" ]; then
              RC_TOPO=0
              MAPFILE="$(git log --pretty=format:'%H' "$PUSH_AFTER" 2>>"$ERRO_GIT")" || RC_TOPO=$?
            fi
            if [ "$RC_TOPO" -ne 0 ]; then
              echo "::error::não consegui auditar o intervalo '$RANGE' (git log saiu $RC_GIT). Isto NÃO é intervalo vazio: git log: $(tr '\n' ' ' <"$ERRO_GIT")"
              exit 1
            fi
            echo "::warning::intervalo '$RANGE' não resolvível; auditando o topo '$PUSH_AFTER'."
          fi

          if [ -z "$MAPFILE" ]; then
            echo "Nada a auditar: o git log resolveu o intervalo '$RANGE' e ele não tem commit."
            exit 0
          fi

          while IFS= read -r SHA; do
            [ -z "$SHA" ] && continue
            MSG=$(git log -1 --pretty=format:'%B' "$SHA")
            AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae' "$SHA")
            COMMITTER_EMAIL=$(git log -1 --pretty=format:'%ce' "$SHA")
            SUBJECT=$(printf '%s\n' "$MSG" | head -1)

            # Trailer de coautoria de IA no CORPO da mensagem. O termo do trailer
            # e' montado por partes (TRAILER_KW) DE PROPOSITO: o sanitizer de
            # coautoria do pre-commit apaga qualquer linha com o literal e ja
            # havia comido este bloco antes (deixando um fi orfao = sintaxe bash
            # quebrada -> o step nunca rodava). Casa o lado IA via TOOL_RE/NOREPLY_RE.
            TRAILER_KW='co[-]?''aut''hored[-]?by'
            if printf '%s\n' "$MSG" | grep -qiE "${TRAILER_KW}:?.*(${TOOL_RE})" \
               || printf '%s\n' "$MSG" | grep -qiE "${TRAILER_KW}:?.*${NOREPLY_RE}"; then
              echo "::error::commit $SHA tem trailer de coautoria com IA"
              FAIL=1
            fi

            if printf '%s\n' "$SUBJECT" | grep -qiE "($TOOL_RE)"; then
              echo "::error::commit $SHA: subject menciona ferramenta IA"
              FAIL=1
            fi

            if printf '%s' "$AUTHOR_EMAIL" | grep -qiE "@(anthropic|openai)\.com"; then
              echo "::error::commit $SHA: author email de provedor IA"
              FAIL=1
            fi
            if printf '%s' "$COMMITTER_EMAIL" | grep -qiE "@(anthropic|openai)\.com"; then
              echo "::error::commit $SHA: committer email de provedor IA"
              FAIL=1
            fi
          done <<<"$MAPFILE"

          if [ $FAIL -ne 0 ]; then
            echo "::error::Auditoria de anonimato falhou. Use git anonymity-rebase para limpar antes de re-pushar."
            exit 1
          fi
          echo "OK: nenhum trailer/identidade IA detectado no intervalo."

      - name: Auditar arquivos de instrucao IA no tree
        run: |
          set -u
          BLACKLIST=(
            'CLAUDE.md' 'AGENTS.md' 'GEMINI.md' 'COPILOT.md'
            'HANDOFF-PROMPT.md' 'HANDOFF.md' 'HOW_TO_RESUME.md'
            'VALIDATOR_BRIEF.md' 'STATE.md'
            '.cursorrules' '.windsurfrules'
          )
          BLACKDIRS=( '.claude' '.cursor' '.aider' '.continue' )

          FAIL=0
          for f in "${BLACKLIST[@]}"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::arquivo proibido versionado: $f"
              FAIL=1
            fi
          done
          for d in "${BLACKDIRS[@]}"; do
            if git ls-files | grep -qE "(^|/)${d//./\\.}/"; then
              echo "::error::diretório proibido versionado: $d/"
              FAIL=1
            fi
          done
          if git ls-files --error-unmatch '.github/copilot-instructions.md' >/dev/null 2>&1; then
            echo "::error::arquivo proibido versionado: .github/copilot-instructions.md"
            FAIL=1
          fi
          [ $FAIL -ne 0 ] && exit 1
          echo "OK: tree sem arquivos de instrucao IA."
