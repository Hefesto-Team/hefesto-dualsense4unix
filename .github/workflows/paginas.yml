name: Páginas

# A página do produto sai do README e das fotos das abas: `scripts/github/montar_pagina.py` monta a
# pasta `_site`, e o GitHub Pages a publica. Só o `main` publica, para a página mostrar a versão lançada.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/usage/**
      - assets/appimage/**
      - scripts/github/montar_pagina.py
      - .github/workflows/paginas.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    name: Montar a página
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install markdown-it-py
      - run: python3 scripts/github/montar_pagina.py --saida _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  publicar:
    name: Publicar a página
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
