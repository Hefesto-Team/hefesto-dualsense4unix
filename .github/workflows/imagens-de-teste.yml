name: Imagens de teste

# As distribuições do `smoke-multi-distro` (ci.yml) com as dependências já instaladas, publicadas em
# `ghcr.io/hefesto-team/hefesto-teste-<distro>`. O CI e o `ci-local.sh` puxam a mesma imagem, e a
# primeira corrida deixa de gastar minutos instalando pacote. A pasta `scripts/github/imagens/` tem
# um Dockerfile por distribuição, e os testes exigem que cada um instale o mesmo que a matriz do ci.yml.
on:
  push:
    branches: [dev]
    paths:
      - scripts/github/imagens/**
      - scripts/ci/instalar_como_usuaria.sh
      - .github/workflows/imagens-de-teste.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagem:
    name: Imagem ${{ matrix.distro }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora-42, archlinux, debian-12, ubuntu-24.04-pop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/hefesto-team/hefesto-teste-${{ matrix.distro }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: scripts/github/imagens/${{ matrix.distro }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
