# Só o alerta de segurança fica: a atualização das dependências se faz à mão.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    labels:
      - "type:infra"
      - "status:ready"
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    labels:
      - "type:infra"
      - "status:ready"
