# Só o alerta de segurança fica: a atualização das dependências se faz à mão, e por isso o limite de PRs é zero.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    labels:
      - "dependências"
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    labels:
      - "dependências"
