# hefesto-dualsense4unix — o pino do .exe de prova da rodada do Proton candidato.
#
# A fonte é assets/sonda-proton/sonda.c; o CI a compila com mingw-w64 e publica o
# binário no release. A rodada (scripts/ensaios/a_rodada_do_proton_candidato.py)
# só lança um sonda.exe cujo sha256 bate com este, como o install faz com o
# Proton. Enquanto o primeiro binário do CI não sai, o sha256 é «a-medir» e a
# rodada só aceita o binário compilado ali mesmo, na VM, com --compilar.
name=sonda-proton-1
url=https://github.com/Hefesto-Team/hefesto-dualsense4unix/releases/download/sonda-proton-1/sonda.exe
sha256=a-medir
compilar=x86_64-w64-mingw32-gcc -O2 -o sonda.exe sonda.c -lsetupapi -lhid -lole32 -lxinput1_4 -luuid
