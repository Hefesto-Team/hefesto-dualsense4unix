# hefesto-dualsense4unix — Proton PINADO: a versão que o projeto validou.
#
# O install a instala em compatibilitytools.d e TRAVA os jogos nela
# (CompatToolMapping); o doctor confere; o uninstall destrava SÓ o que o
# hefesto escreveu.
#
# Por que pinar: a semântica do winebus mudou entre Proton 9 e 10
# (PROTON_ENABLE_HIDRAW deixou de existir). Sem pino, um upgrade automático de
# Proton pode reintroduzir o controle físico duplicado de um dia para o outro.
#
# Por que esta versão: a partir do GE-Proton 11-4 o Proton acha o dispositivo
# de áudio do DualSense e entrega ao jogo o alto-falante do controle e a
# vibração por voice-coil (a nota do 11-4: *"finalized DualShock 4, DualSense,
# and DualSense Edge haptics, controller-speaker audio, and hotplug
# handling"*). O 11-7 rebaseou essa pilha *"retaining behavior"* (commit
# 2bad9078). O estudo da subida está em
# docs/protocol/proton-o-pino-desta-casa-e-a-subida-para-o-11-7.md.
#
# O nome tem o sufixo `-x86_64` de propósito: desde o 11-4 o release publica
# `GE-Proton11-N-x86_64.tar.gz`, e o nome interno do `compatibilitytool.vdf`,
# que é o valor que vai ao `CompatToolMapping`, leva o sufixo. Sem ele a trava
# não casa.
#
# Um jogo marcado como preservado (a guarda `preservado`) mantém o Proton que
# já tinha.
#
# Upgrade é SEMPRE deliberado: valide a versão nova, edite as três chaves
# abaixo e rode o install de novo.
#
# sha256 = do tarball do release oficial, medido em fluxo junto com o sha512,
# que bate com o `.sha512sum` publicado no mesmo release.
