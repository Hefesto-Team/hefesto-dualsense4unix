# hefesto-dualsense4unix — Proton PINADO (PLAT-01, sprint 2026-07-18).
#
# Fonte da verdade da versão de Proton VALIDADA pelo projeto. O install a
# instala em compatibilitytools.d e TRAVA os jogos nela (CompatToolMapping);
# o doctor confere; o uninstall destrava SÓ o que o hefesto escreveu.
#
# Por que pinar: a semântica do winebus MUDOU entre Proton 9→10
# (PROTON_ENABLE_HIDRAW morreu — provado no estudo 2026-07-18). Sem pin, um
# upgrade automático de Proton pode reintroduzir o vazamento do controle
# físico (duplicado) da noite para o dia.
#
# Upgrade é SEMPRE deliberado: valide a versão nova, edite as três chaves
# abaixo e rode o install de novo — nunca automático.
#
# sha256 = do tarball do release oficial (conferido também contra o
# .sha512sum publicado no mesmo release).
#
# ---------------------------------------------------------------------------
# 16/09/2026 — SUBIU DE `GE-Proton10-34` PARA `GE-Proton11-6-x86_64`, e a razão
# é uma feature do produto, não manutenção de rotina.
#
# O QUE A VERSÃO NOVA TRAZ, e o que a velha não tinha: o **áudio do
# alto-falante do controle e as haptics de voice-coil dentro do jogo**. Por USB
# o DualSense é uma placa de som de quatro canais — dois são o alto-falante,
# dois são os atuadores —, e o que faltava no Linux não era o canal (o card
# desta máquina já sobe em `analog-surround-40`): era o Proton **achar** esse
# dispositivo. Nas palavras da própria nota de release, o GE-Proton 11-4
# (11/08/2026) *"finalized DualShock 4, DualSense, and DualSense Edge haptics,
# controller-speaker audio, and hotplug handling"*, e o 11-6 (28/08/2026)
# *"reworked … audio/haptic routing, endpoint identity, profile switching and
# hotplug lifecycle"*. Pedido dela, 16/09/2026, com o Sackboy na mesa: *"sons
# do jogo sfx, microfone também (…) quero tudo funcionando liso"*.
#
# CORREÇÃO DE FATO, 17/09/2026: estas linhas diziam que o 11-4 *"fechou o
# casamento do `ContainerId` do HID com o MMDevice que o jogo abre"* e que o
# 11-6 *"refez o caminho pelo `dsound` do Wine"*. As três palavras não aparecem
# em NENHUMA nota de release do 11-4 ao 11-7, e o `dsound.dll` do
# `GE-Proton10-34` — o pino VELHO — tem os mesmos 12 símbolos de ContainerId
# que o do 11-6, então eles não distinguem versão nenhuma. O mecanismo era
# inferência sem endereço; a feature, essa, continua declarada pelo autor.
# Medição inteira em docs/protocol/proton-o-pino-desta-casa-e-a-subida-para-o-11-7.md
#
# A RAZÃO ANTIGA CONTINUA DE PÉ e é por isso que o pino existe: a semântica do
# winebus mudou entre Proton 9 e 10, e sem pino um upgrade automático pode
# reintroduzir o controle duplicado.
#
# O NOME TEM SUFIXO `-x86_64` DE PROPÓSITO, e quem o omitir quebra a trava: a
# partir do 11-4 o release publica `GE-Proton11-N-x86_64.tar.gz`, a raiz do
# tarball é `GE-Proton11-6-x86_64/` e o **nome interno** do
# `compatibilitytool.vdf` é `GE-Proton11-6-x86_64` — é esse o valor que vai ao
# `CompatToolMapping`. Até o 11-3 não havia sufixo.
#
# O 11-7 SAIU EM 16/09/2026, no mesmo dia, e NÃO foi pinado: o pino é a versão
# que este projeto validou, e a validação do som do jogo foi desenhada sobre o
# 11-6. Subir para o 11-7 é deliberado, como esta linha aqui foi.
#
# E O ESTUDO DA SUBIDA ESTÁ FEITO — 17/09/2026, sem aplicar nada:
# docs/protocol/proton-o-pino-desta-casa-e-a-subida-para-o-11-7.md traz o
# mecanismo inteiro, o plano passo a passo e os três valores já medidos
# (`GE-Proton11-7-x86_64`, com o nome interno lido do tarball, e o sha256
# cruzado contra o .sha512sum publicado). A nota do 11-7 diz que a pilha de
# áudio/haptics Sony foi rebaseada *"retaining behavior"* — a feature deste
# pino não se perde na subida. Falta a palavra dela.
#
# Conferido em 16/09/2026: o sha512 do tarball bate com o
# `GE-Proton11-6-x86_64.sha512sum` do release, e o sha256 abaixo é do mesmo
# arquivo.
