# hefesto-dualsense4unix — o codec de áudio da placa-mãe sem o sono de 1 s.
#
# O snd_hda_intel nasce com power_save=1: o codec dorme depois de 1 s de
# silêncio, e o som da TV pela HDMI pode perder o começo ou estalar ao acordar.
# power_save=0 e power_save_controller=N mantêm o codec e o controlador de pé.
#
# SÓ ENTRA DEPOIS DA PROVA NO APARELHO (sprint A-ENERGIA-DE-NOTEBOOK-NUM-
# DESKTOP-01, hipótese 2): um som curto depois de 2 s de silêncio, gravado pelo
# monitor da saída, com 1 e com 0. Vale no próximo carregamento do módulo.
# REVERSÍVEL: apague este arquivo e reinicie (o uninstall faz isso).
options snd_hda_intel power_save=0 power_save_controller=N
