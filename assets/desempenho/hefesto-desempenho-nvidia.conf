# hefesto-dualsense4unix — a placa NVIDIA sem a economia de notebook.
#
# O driver proprietário nasce com NVreg_DynamicPowerManagement=3 (lido de
# /proc/driver/nvidia/params): é o modo de notebook híbrido, em que a placa
# dorme em D3 quando fica parada e leva tempo para acordar. Num computador em
# que ela comanda a tela, 0 desliga esse sono.
#
# SÓ ENTRA DEPOIS DA PROVA NO APARELHO (sprint A-ENERGIA-DE-NOTEBOOK-NUM-
# DESKTOP-01, hipótese 1): o quadro do jogo medido com 3 e com 0, no mesmo
# trecho. Vale no próximo carregamento do módulo (reinício).
# REVERSÍVEL: apague este arquivo e reinicie (o uninstall faz isso).
options nvidia NVreg_DynamicPowerManagement=0x00
