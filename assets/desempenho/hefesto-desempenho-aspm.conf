# hefesto-dualsense4unix — a política de ASPM do PCIe em «performance».
#
# Com «default» quem decide é o firmware da placa-mãe, e o link do adaptador
# USB ou Bluetooth pode ir para economia. «performance» desliga o ASPM dos
# links. O tmpfiles.d escreve o valor a cada boot (um comando solto some no
# reinício).
#
# SÓ ENTRA DEPOIS DA PROVA NO APARELHO (sprint A-ENERGIA-DE-NOTEBOOK-NUM-
# DESKTOP-01, hipótese 3): o LnkCtl dos controladores xHCI e do adaptador (que
# o lspci só mostra a root) e a queda do rádio sob carga.
# ATENÇÃO: com pcie_aspm=off no cmdline este arquivo não muda nada, e a política
# lida do sysfs não prova o contrário.
# REVERSÍVEL: apague este arquivo (o uninstall faz isso).
w /sys/module/pcie_aspm/parameters/policy - - - - performance
