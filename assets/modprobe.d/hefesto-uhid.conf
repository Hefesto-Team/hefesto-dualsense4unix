# hefesto-dualsense4unix — contrapressão do uhid (RADIO-AFOGADO-02, 22/09/2026).
#
# X-HefestoNaoEmpacotado: opt-in; muda o write(2) de todo HID por Bluetooth
#
# **ESTE ARQUIVO NÃO É INSTALADO POR PADRÃO.** Ele só vai para
# /etc/modprobe.d/ com `./install.sh --uhid-contrapressao`, e o `uninstall.sh`
# o remove. Ver assets/dkms/uhid/README.md.
#
# O QUE ELE LIGA, e por que ele existe: o `uhid.ko` de fábrica descarta o
# report em silêncio quando a fila de saída (31 lugares) enche —
# `uhid_queue()` é `void`, faz `kfree(ev)` com um `hid_warn` e
# `uhid_hid_output_raw()` devolve `count` assim mesmo. Quem escreve recebe
# SUCESSO sobre um report que foi para o lixo.
#
# Medido nesta máquina em 22/09/2026, numa mesa de quatro DualSense por rádio:
# a ponte de áudio escrevia 93,75 reports de 334 B por segundo POR CONTROLE; o
# kernel descartou 3807 vezes em um minuto; o diário do produto marcou ZERO
# escritas recusadas. Sem sinal, o produtor não tem como ceder, e a saturação
# segue até o `bluetoothd` levar EAGAIN no socket L2CAP e derrubar a sessão
# HID dos quatro controles.
#
# Com `backpressure=1` a escrita devolve -EAGAIN e quem escreve pode CEDER o
# quadro — e ceder não custa ar nenhum, porque a escrita recusada não põe um
# byte no rádio. É o freio que faltava.
#
# O PREÇO, e é por isso que é opt-in: a mudança vale para TODO userspace que
# escreve report de saída num HID por Bluetooth, o Steam Input inclusive.
# Software que trata falha de escrita como «o aparelho sumiu» passa a largar o
# controle no primeiro engasgo.
#
# REVERSÍVEL A QUENTE, sem reboot e sem reload (recarregar o uhid derrubaria
# todo HID por Bluetooth):
#   echo 0 | sudo tee /sys/module/uhid/parameters/backpressure
options uhid backpressure=1
