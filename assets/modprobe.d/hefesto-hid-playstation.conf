# hefesto-dualsense4unix — opções do hid-playstation patchado (contenção BT
# 25/07; instalado pelo install.sh, removido pelo uninstall.sh — NÃO editar
# à mão).
#
# feature_retries=2: cura da perda de um DualSense inteiro quando dois (ou
# mais) controles pareiam quase juntos no mesmo adaptador. Medido em 25/07:
# o 1º DualSense concluiu a probe em 74 ms; o 2º, 1 s depois, pegou o pairing
# info e perdeu o firmware info —
#   playstation 0005:054C:0CE6.0009: Failed to retrieve feature with reportID 32: -5
#   playstation 0005:054C:0CE6.0009: probe with driver playstation failed with error -5
# — e sumiu do sistema (sem hidraw, sem input, sem LED, sem bateria).
#
# O -5 é MÁSCARA, não diagnóstico. A cadeia real, medida ponta a ponta:
#   1. o uhid do kernel achata QUALQUER erro do transporte em -EIO
#      (uhid_hid_get_report: "if (req->err) ret = -EIO;");
#   2. passaram 3,26 s até a falha, e a espera do uhid é de 5 s — logo o
#      kernel ainda esperava, quem desistiu foi o userspace;
#   3. o bluetoothd registrou quem desistiu, no mesmo segundo:
#      "hidp_report_req_timeout() Device ... HIDP GET_REPORT request timed
#      out" — o REPORT_REQ_TIMEOUT do BlueZ, que é de 3 s.
# Ou seja: o controle estava vivo (tinha acabado de responder o report
# anterior) e só não ganhou o canal de controle L2CAP em 3 s enquanto o outro
# pad subia no mesmo rádio. Transiente — e piora quanto mais controles
# pareiam juntos, que é exatamente o alvo do projeto (4 por Bluetooth).
#
# Ler feature report é LEITURA pura, sem efeito colateral, então repetir é
# seguro; e quando o timeout do BlueZ dispara ele já limpou o pedido
# pendente, então a nova tentativa é aceita na hora (não recusada com EBUSY).
# A probe roda num worker do uhid, então o retry não segura o bluetoothd.
#
# Custo no pior caso (controle de fato morto): 3 tentativas x 3 s + 100 ms +
# 200 ms de backoff ~= 9,3 s de probe, contra 3,3 s hoje.
#
# Default NO MÓDULO é 0 (uma tentativa == vanilla): a mudança é opt-in DAQUI.
# É lido A CADA PROBE e é 0644, então para A/B basta escrever no sysfs e
# RECONECTAR o controle — nunca precisa reload (proibido com DualSense em uso)
# nem reboot:
#   echo 0 | sudo tee /sys/module/hid_playstation/parameters/feature_retries
options hid_playstation feature_retries=2

# ---------------------------------------------------------------------------
# ds4_short_pairing_info=1 + ds4_synthetic_mac=1 (patch 0002, 25/07 à noite):
# cura do clone 8BitDo Pro em modo DirectInput/PS4 NO CABO, que se anuncia
# como 054c:05c4 e é perdido inteiro na probe. Medido em 25/07 ~21:02:
#   playstation 0003:054C:05C4.0012: Invalid byte count transferred, expected 16 got 9
#   playstation 0003:054C:05C4.0012: retrying feature reportID 18 in 100 ms (2 attempt(s) left)
#   playstation 0003:054C:05C4.0012: Invalid byte count transferred, expected 16 got 9
#   playstation 0003:054C:05C4.0012: Failed to retrieve DualShock4 pairing info: -22
#   playstation 0003:054C:05C4.0012: Failed to get MAC address from DualShock4
#   playstation 0003:054C:05C4.0012: probe with driver playstation failed with error -22
# Fica sem driver nenhum: sem hidraw, sem input, sem LED, sem bateria — e o
# hid-generic não assume, porque um driver específico deu match.
#
# O report 0x12 é o pairing info, e NO CABO ele é o único lugar de onde o
# driver tira o endereço do controle. Por Bluetooth esse report nem é lido (o
# endereço vem do uniq do HIDP) — é por isso que ESTE MESMO controle sobe por
# BT e só morre no cabo.
#
# NÃO é timing, e as linhas acima provam: o feature_retries=2 dispara, e as
# três tentativas trazem os MESMOS 9 bytes. Resposta curta e consistente — o
# clone não implementa o report inteiro. Esperar mais não muda nada (custo:
# 300 ms por conexão, o preço de ter a prova no log).
#
# O driver usa 7 dos 16 bytes: o report ID e os 6 do endereço. O resto é o
# endereço do host com quem o controle pareou por último, que ele nunca lê.
# Ou seja, uma resposta de 9 bytes PODE trazer tudo o que é usado:
#
#   ds4_short_pairing_info=1  aceita a resposta curta QUANDO ela traz o
#                             endereço (report ID certo + campo não-zerado);
#   ds4_synthetic_mac=1       quando não traz nada aproveitável, fabrica
#                             02:VID:PID:bus (02:05:4C:05:C4:03 aqui) — bit de
#                             administração local ligado, então nunca colide
#                             com OUI de fabricante.
#
# O endereço fabricado NÃO é identidade: ele descreve o MODELO e o barramento,
# não o aparelho. O hefesto já sabe disso — MAC começando em 02 é identidade
# VOLÁTIL (ganha número na sessão, nunca vai ao disco) e a deduplicação cai
# para a instância HID. Dois clones idênticos no mesmo barramento recebem o
# MESMO endereço e o segundo é recusado pelo ps_devices_list_add com -EEXIST:
# UM controle perdido onde hoje se perdem os dois.
#
# Nada muda para DualShock 4 genuíno: ele responde os 16 bytes e nunca chega
# nesses ramos. Defaults NO MÓDULO são N (== vanilla): a mudança é opt-in
# DAQUI. Lidos a cada probe e 0644, então para A/B basta escrever no sysfs e
# RECONECTAR o controle — nunca reload (derrubaria todos os DualSense):
#   echo N | sudo tee /sys/module/hid_playstation/parameters/ds4_synthetic_mac
options hid_playstation ds4_short_pairing_info=1 ds4_synthetic_mac=1
