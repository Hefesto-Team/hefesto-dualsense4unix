# hefesto-dualsense4unix — opções do hid-playstation patchado (contenção BT
# 25/07; instalado pelo install.sh, removido pelo uninstall.sh — NÃO editar
# à mão).
#
# feature_retries=2: cura da perda de um DualSense inteiro quando dois (ou
# mais) controles pareiam quase juntos no mesmo adaptador. Medido em 25/07:
# o 1º DualSense concluiu a probe em 74 ms; o 2º, 1 s depois, pegou o pairing
# info e perdeu o firmware info —
#   playstation 0005:054C:0CE6.0009: Failed to retrieve feature with reportID 32: -5
#   playstation 0005:054C:0CE6.0009: probe with driver playstation failed with error -5
# — e sumiu do sistema (sem hidraw, sem input, sem LED, sem bateria).
#
# O -5 é MÁSCARA, não diagnóstico. A cadeia real, medida ponta a ponta:
#   1. o uhid do kernel achata QUALQUER erro do transporte em -EIO
#      (uhid_hid_get_report: "if (req->err) ret = -EIO;");
#   2. passaram 3,26 s até a falha, e a espera do uhid é de 5 s — logo o
#      kernel ainda esperava, quem desistiu foi o userspace;
#   3. o bluetoothd registrou quem desistiu, no mesmo segundo:
#      "hidp_report_req_timeout() Device ... HIDP GET_REPORT request timed
#      out" — o REPORT_REQ_TIMEOUT do BlueZ, que é de 3 s.
# Ou seja: o controle estava vivo (tinha acabado de responder o report
# anterior) e só não ganhou o canal de controle L2CAP em 3 s enquanto o outro
# pad subia no mesmo rádio. Transiente — e piora quanto mais controles
# pareiam juntos, que é exatamente o alvo do projeto (4 por Bluetooth).
#
# Ler feature report é LEITURA pura, sem efeito colateral, então repetir é
# seguro; e quando o timeout do BlueZ dispara ele já limpou o pedido
# pendente, então a nova tentativa é aceita na hora (não recusada com EBUSY).
# A probe roda num worker do uhid, então o retry não segura o bluetoothd.
#
# Custo no pior caso (controle de fato morto): 3 tentativas x 3 s + 100 ms +
# 200 ms de backoff ~= 9,3 s de probe, contra 3,3 s hoje.
#
# Default NO MÓDULO é 0 (uma tentativa == vanilla): a mudança é opt-in DAQUI.
# É lido A CADA PROBE e é 0644, então para A/B basta escrever no sysfs e
# RECONECTAR o controle — nunca precisa reload (proibido com DualSense em uso)
# nem reboot:
#   echo 0 | sudo tee /sys/module/hid_playstation/parameters/feature_retries
options hid_playstation feature_retries=2
