# hefesto-dualsense4unix — opções do hid-nintendo patchado (Onda T; instalado
# pelo install.sh, removido pelo uninstall.sh — NÃO editar à mão).
#
# bt_probe_retries=3: cura da morte por probe BT (-110/-ETIMEDOUT) medida 3x
# nesta máquina (o HID não re-proba; sem retry o controle some até power-cycle).
# Só o módulo DKMS do hefesto conhece os parâmetros; se o in-tree carregar no
# lugar (fail-safe), o kernel apenas loga "unknown parameter 'bt_probe_retries'
# ignored" e o módulo sobe normalmente — nunca ficamos sem controle.
#
# skip_tx_on_rate_exceeded=1: não transmitir após "exceeded max attempts"
# (transmitir sem janela segura é o que o comentário do próprio driver diz
# que derruba o link BT). No MÓDULO o default é 0 (== vanilla, transmitir);
# a mudança de comportamento é opt-in DAQUI e reversível AO VIVO, sem
# recompilar: echo 0 | sudo tee /sys/module/hid_nintendo/parameters/skip_tx_on_rate_exceeded
# (validação A/B do checklist da Onda T usa exatamente esse knob).
#
# register_leds_on_set_failure=1 (fix 21/07): registra os LED class devices
# mesmo quando o SET inicial falha (-110 em BT congestionado). Sem isso o
# controle fica SEM LEDs de player pela conexão inteira ("Failed to set
# players LEDs, skipping registration" — medido ao vivo no Pro Controller
# com 4 controles BT: o link se recuperou segundos depois, mas não havia
# nó de LED para o daemon curar). Registrar é operação local; a próxima
# escrita de brightness (atribuição de player do hefesto) conserta.
#
# Tuning p/ rádio congestionado (medição 21/07: probe com 13x "timeout
# waiting for input report" + IMU dropando 30-40% com 4 controles BT):
#   sync_send_tries=4        (vanilla 2)  — mais tentativas por subcomando;
#   input_report_wait_ms=500 (vanilla 250) — espera maior por janela de TX;
#   probe_info_timeout_ms=4000 (vanilla 2000) — info do probe com folga.
# Reversível ao vivo via /sys/module/hid_nintendo/parameters/ (sem rebuild).
#
# CLONE USB 057E:2009 (patch 0003, 25/07) — o 8BitDo Pro se apresenta com o
# MESMO VID:PID e o MESMO serial 000000000001 do Pro genuíno (só o bcdDevice
# difere: 0200 clone x 0210 genuíno) e MORRE na probe: "Failed to get joycon
# info; ret=-110" -> device SEM driver, sem hidraw, sem input, sem LEDs. Não é
# timeout: já se mediu 4 tentativas x 4000 ms falhando. A causa é o HANDSHAKE
# USB que nunca é respondido — o driver cai no ramo "assume ble pro
# controller" e pede REQ_DEV_INFO a um controle que nunca foi posto em modo
# USB.
#
# usb_cmd_pad_to_report=1: manda o output report 0x80 com os 64 bytes que o
#   PRÓPRIO descritor do controle declara (85 80 ... 95 3f 91 83) em vez de
#   só 2. O genuíno tolera o report curto; o firmware clone parece ignorá-lo.
#   Custo: 62 bytes zerados em 1 frame de 8 ms por comando, só na probe.
# usb_send_conn_status=1: manda 0x80 0x01 (status de conexão) antes do
#   handshake, como um console faz — o comando está DEFINIDO no driver desde
#   sempre e nunca era enviado. A resposta ainda traz o MAC, guardado como
#   identidade de reserva.
# usb_probe_degrade=1: rede de segurança. Se a info do device não vier, o
#   driver sintetiza a identidade (tipo pelo PID, MAC pelo status de conexão
#   ou um 02:... localmente administrado e estável) e segue; IMU/report
#   mode/rumble viram avisos. Melhor um controle degradado do que device
#   nenhum. SÓ USB — em BT a cura continua sendo bt_probe_retries.
#   DEPENDE de register_leds_on_set_failure=1 (acima): sem ele a probe ainda
#   morreria em joycon_leds_create se o SET de LED não for respondido.
#
# Os três são LIDOS NA PROBE: para A/B basta escrever em
# /sys/module/hid_nintendo/parameters/<param> e REPLUGAR o controle — não
# precisa reload do módulo (proibido com BT vivo) nem reboot. Ex.:
#   echo 0 | sudo tee /sys/module/hid_nintendo/parameters/usb_cmd_pad_to_report
# Defaults NO MÓDULO são 0/N (== vanilla): a mudança é opt-in daqui.
#
# subcmd_silence_streak_max=3 (patch 0004, 25/07) — o PREÇO de um controle
# mudo. O controle degradado (usb_probe_degrade acima) sobe, mas nunca mais
# responde: como ele não gera "report deltas válidos", o
# joycon_enforce_subcmd_rate roda SEMPRE até o teto de tentativas, e cada
# volta espera input_report_wait_ms e loga uma linha. Com os valores desta
# conf (500 ms x 25 tentativas x 4 tries) UM subcomando custa 50 SEGUNDOS
# segurando o output_mutex e 100 linhas de dmesg — e cada escrita futura de
# LED/rumble paga tudo de novo. Medido em 25/07: 500 linhas a 1,99 linha/s
# por 4 minutos, só das 5 escritas de LED que o daemon faz após a probe.
# Com =3, depois de 3 esperas seguidas sem NENHUM input report (1,5 s de
# silêncio real — em BT o controle manda reports a dezenas de Hz, então isto
# é link caído, não jitter) o driver para de esperar: o subcomando falha em
# microssegundos com o MESMO -ETIMEDOUT de antes, sem transmitir.
# DESTRAVA SOZINHO: qualquer input report completo zera o contador, então um
# controle que volta ao alcance ou entra no modo de report certo volta a
# aceitar subcomando sem replug e sem reload. Default NO MÓDULO é 0
# (desligado == vanilla); ajustável ao vivo, vale na hora:
#   echo 0 | sudo tee /sys/module/hid_nintendo/parameters/subcmd_silence_streak_max
options hid_nintendo bt_probe_retries=3 skip_tx_on_rate_exceeded=1 register_leds_on_set_failure=1 sync_send_tries=4 input_report_wait_ms=500 probe_info_timeout_ms=4000 usb_cmd_pad_to_report=1 usb_send_conn_status=1 usb_probe_degrade=1 subcmd_silence_streak_max=3
