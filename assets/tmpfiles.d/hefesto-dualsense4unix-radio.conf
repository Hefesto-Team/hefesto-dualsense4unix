# hefesto-dualsense4unix — a trava comum do rádio (O-DIARIO-DO-RADIO-01).
# instalado por hefesto-dualsense4unix (install.sh) — remoção: uninstall.sh
#
# Quem mexe no rádio Bluetooth pega esta trava antes: o watchdog (root, de 2 em
# 2 min), o bt_active_mode.sh (root, no start do bluetoothd) e o daemon (a
# sessão, pela central e pelo vigia). Sem ela, o watchdog podia reiniciar um
# adaptador no meio de um controle sendo movido pela central.
#
# O DIRETÓRIO é do root e NÃO é gravável pela sessão: o root abre o arquivo, e
# um diretório gravável deixaria trocá-lo por um link que levasse a escrita do
# root a outro lugar. Só o ARQUIVO tem o grupo, para o daemon escrever nele
# quem está com a trava.
#
# O GRUPO É O `hefesto`, o grupo de sistema que as regras udev já criam para
# o /dev/uhid e o /dev/uinput (VPAD-09) — e não o grupo pessoal de quem
# instalou: vale para toda conta que o install pôs no grupo. Quem acabou de
# entrar nele só escreve o próprio nome na trava depois de entrar de novo na
# sessão; até lá o daemon a abre só para leitura, e o `flock` funciona igual.
#
# 0660, e não 0664: o flock não precisa de escrita, e com leitura para
# «outros» qualquer conta local seguraria a trava e o watchdog pularia todo
# tique.
d /run/hefesto-dualsense4unix 0755 root root -
f /run/hefesto-dualsense4unix/radio.lock 0660 root hefesto -
