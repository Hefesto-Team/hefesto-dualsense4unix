# Hefesto - Dualsense4Unix — FEAT-WIREPLUMBER-DUALSENSE-NOT-DEFAULT-SOURCE-01
#
# Impede o microfone do DualSense (placa de áudio USB do controle) de virar a
# FONTE de entrada padrão do sistema ao conectar — sintoma relatado: "o controle
# fica diminuindo/mexendo no microfone". Em vez de desabilitar o dispositivo (o
# que tornaria o mic/fone do controle inutilizável), apenas REBAIXA a prioridade
# para que ele nunca seja eleito default automaticamente; continua disponível
# para seleção manual.
#
# WirePlumber >= 0.5 (formato SPA-JSON em ~/.config/wireplumber/wireplumber.conf.d/).
# O reset da fonte padrão já persistida ocorre via
# scripts/fix_wireplumber_default_source.sh (instalado junto pelo install.sh
# --with-wireplumber-fix, ou via scripts/doctor.sh --fix).
#
# Para DESABILITAR de vez (em vez de só rebaixar), comente as linhas de
# priority/ dont-reconnect e descomente `node.disabled = true`.
#
# REVISÃO MIC-USB-01 (25/07) — o que este arquivo NÃO faz, e o que faltava.
#
# Este drop-in NÃO é o culpado quando o microfone do controle aparece MUDO.
# Isso ficou medido ao vivo: o mudo vinha de três camadas empilhadas, nenhuma
# delas aqui — o `"mute":true` persistido por ROTA em
# ~/.local/state/wireplumber/default-routes (camada 1), o perfil da placa preso
# em `input:iec958-stereo`, que é S/PDIF e não carrega sinal (camada 2), e o
# mudo do FIRMWARE do controle (camada 3). As duas primeiras se curam com
# `scripts/doctor.sh --fix-mic`; a terceira com
# `hefesto-dualsense4unix mic unmute`. Rebaixar prioridade não emudece nada:
# só decide quem é ELEITO microfone padrão quando ninguém pediu nada.
#
# O que de fato faltava: a subida. Rebaixar por default é a política certa (a
# queixa que originou este arquivo é o controle virando entrada padrão sozinho),
# mas sem um caminho de promoção ela virava proibição — com este arquivo no
# lugar, um `set-default-source` escolhido pela usuária era sobrescrito de volta
# para o monitor da saída no settle seguinte. A promoção EXPLÍCITA agora existe:
#
#     scripts/fix_wireplumber_default_source.sh --promote-source
#     hefesto-dualsense4unix mic promote      (mesmo caminho, pelo CLI)
#
# Ela remove este drop-in, cura as camadas 1 e 2 e ELEGE o mic do controle como
# padrão, persistindo a escolha. O caminho de volta é `--install` (ou
# `hefesto-dualsense4unix mic demote`), que reinstala este arquivo e devolve a
# prioridade rebaixada. Escolha explícita nos dois sentidos, nenhum default
# escondido.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*[Dd]ual[Ss]ense.*" }
      { device.name = "~alsa_card.*[Dd]ual[Ss]ense.*" }
    ]
    actions = {
      update-props = {
        priority.session = 50
        priority.driver = 50
        node.dont-reconnect = true
        # node.disabled = true
      }
    }
  }
]
