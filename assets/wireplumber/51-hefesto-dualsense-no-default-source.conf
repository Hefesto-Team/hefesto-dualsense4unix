# Hefesto - Dualsense4Unix — FEAT-WIREPLUMBER-DUALSENSE-NOT-DEFAULT-SOURCE-01
#
# Impede o microfone do DualSense (placa de áudio USB do controle) de virar a
# FONTE de entrada padrão do sistema ao conectar — sintoma relatado: "o controle
# fica diminuindo/mexendo no microfone". Em vez de desabilitar o dispositivo (o
# que tornaria o mic/fone do controle inutilizável), apenas REBAIXA a prioridade
# para que ele nunca seja eleito default automaticamente; continua disponível
# para seleção manual.
#
# WirePlumber >= 0.5 (formato SPA-JSON em ~/.config/wireplumber/wireplumber.conf.d/).
# O reset da fonte padrão já persistida ocorre via
# scripts/fix_wireplumber_default_source.sh (instalado junto pelo install.sh
# --with-wireplumber-fix, ou via scripts/doctor.sh --fix).
#
# Para DESABILITAR de vez (em vez de só rebaixar), comente as linhas de
# priority/ dont-reconnect e descomente `node.disabled = true`.
#
# REVISÃO MIC-USB-01 (25/07) — o que este arquivo NÃO faz, e o que faltava.
#
# Este drop-in NÃO é o culpado quando o microfone do controle aparece MUDO.
# Isso ficou medido ao vivo: o mudo vinha de três camadas empilhadas, nenhuma
# delas aqui — o `"mute":true` persistido por ROTA em
# ~/.local/state/wireplumber/default-routes (camada 1), o perfil da placa preso
# em `input:iec958-stereo`, que é S/PDIF e não carrega sinal (camada 2), e o
# mudo do FIRMWARE do controle (camada 3). As duas primeiras se curam com
# `scripts/doctor.sh --fix-mic`; a terceira com
# `hefesto-dualsense4unix mic unmute`. Rebaixar prioridade não emudece nada:
# só decide quem é ELEITO microfone padrão quando ninguém pediu nada.
#
# O que de fato faltava: a subida. Rebaixar por default é a política certa (a
# queixa que originou este arquivo é o controle virando entrada padrão sozinho),
# mas sem um caminho de promoção ela virava proibição — com este arquivo no
# lugar, um `set-default-source` escolhido pela usuária era sobrescrito de volta
# para o monitor da saída no settle seguinte. A promoção EXPLÍCITA agora existe:
#
#     scripts/fix_wireplumber_default_source.sh --promote-source
#     hefesto-dualsense4unix mic promote      (mesmo caminho, pelo CLI)
#
# Ela remove este drop-in, cura as camadas 1 e 2 e ELEGE o mic do controle como
# padrão, persistindo a escolha. O caminho de volta é `--install` (ou
# `hefesto-dualsense4unix mic demote`), que reinstala este arquivo e devolve a
# prioridade rebaixada. Escolha explícita nos dois sentidos, nenhum default
# escondido.

# REVISÃO FONTE-PADRÃO-01 (30/07/2026) — o furo que fazia este arquivo curar o
# sintoma e criar outro pior.
#
# As duas regras abaixo casavam a ENTRADA do controle (`alsa_input.*DualSense`) e
# a placa dele. Rebaixada a entrada, o WirePlumber reelegia — e o que ele elegia
# era `alsa_output.usb-...DualSense...analog-surround-40.monitor`: o MONITOR do
# alto-falante do próprio controle. O `node.name` dele começa com `alsa_output`,
# então NENHUM dos dois padrões o alcançava.
#
# O efeito, medido na máquina da mantenedora em 30/07 logo depois de um
# `uninstall` + `install` limpos: `pactl get-default-source` devolvia o monitor, e
# o que qualquer aplicativo gravasse era o áudio de SAÍDA — não a voz dela. Ou
# seja: o drop-in tirava o microfone do controle de padrão e punha no lugar algo
# que não é microfone nenhum.
#
# O monitor entra na lista. Ele continua existindo e selecionável à mão (é útil
# para gravar o que sai do controle); só para de ser candidato a padrão.
#
# ─────────────────────────────────────────────────────────────────────────────
# REVISÃO MONITOR-QUE-VENCE-01 (08/08/2026) — a cura de 30/07 NÃO FUNCIONA, e a
# medição diz por quê. GRAU: MEDIDO, na máquina dela, com o drop-in instalado.
#
#     alsa_output…DualSense…analog-surround-40.monitor   priority.session = 1109
#     alsa_input…DualSense…iec958-stereo                 priority.session =   50
#     alsa_input.pci-…analog-stereo (a placa do PC)      priority.session = 2009
#
# A terceira regra da lista abaixo — a que a FONTE-PADRÃO-01 acrescentou para
# rebaixar o monitor — está escrita, está correta na intenção, e **nunca dispara**:
# o monitor continua em 1109, intocado. O mecanismo é estrutural, não erro de
# padrão: `monitor.alsa.rules` só alcança nós criados pelo **monitor de ALSA** do
# WirePlumber; o nó `.monitor` de uma saída não nasce dali — quem o deriva do
# sink é o próprio PipeWire. A regra mira um nó que aquela camada não vê.
#
# Resultado medido: o monitor (1109) vence o microfone (50) por vinte e duas
# vezes, e a eleição de fonte padrão entrega o áudio de SAÍDA no lugar da voz
# dela. O `install.sh` deste repositório **cria** essa condição por default, e a
# conferência final do próprio install a denuncia no mesmo fôlego:
#
#     [FAIL] a fonte de captura padrão é um MONITOR — o que qualquer app gravar
#            é o áudio de SAÍDA, não a voz
#
# A CURA, e por que ela é por CONSTRUÇÃO em vez de por regra
# ----------------------------------------------------------
# Parar de depender de uma regra que não pode disparar. O que o produto precisa
# é de um INVARIANTE, e ele se enuncia em uma linha:
#
#     um microfone de verdade nunca pode perder para um monitor.
#
# Monitor é laço de retorno do que sai. Ele nunca é a resposta certa para "quem é
# o microfone padrão?" — não nesta máquina, não em nenhuma. Então o mic do
# controle passa a viver numa FAIXA, e a faixa é medida:
#
#     abaixo de qualquer captura real  → 2009 na placa dela (e ~2000 é o valor
#                                        que o WirePlumber dá a captura de verdade)
#     acima de qualquer monitor        → 1109 é o mais alto desta máquina
#                                        (os outros: 736 e 696)
#
# 1500 fica no meio da faixa, com folga dos dois lados. O objetivo original do
# arquivo continua cumprido — o controle **não** rouba o posto de um microfone de
# verdade, que é a queixa que o criou —, e o modo de falha que ele introduziu
# deixa de ser possível: com 1500, nenhum monitor vence.
#
# A regra do monitor FICA. Ela não custa nada, documenta a intenção, e passa a
# valer sozinha se alguma versão do WirePlumber estender o alcance da camada. O
# que muda é que o produto deixou de DEPENDER dela.
#
# O portão que trava isto: `tests/unit/test_monitor_que_vence_01.py`.
# ─────────────────────────────────────────────────────────────────────────────

monitor.alsa.rules = [
  {
    # MONITOR-QUE-VENCE-01: a ENTRADA do controle, na faixa "abaixo de captura
    # real, acima de qualquer monitor". Ver o bloco acima para os números medidos.
    matches = [
      { node.name = "~alsa_input.*[Dd]ual[Ss]ense.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver = 1500
        node.dont-reconnect = true
        # node.disabled = true
      }
    }
  }
  {
    # A placa e o monitor do controle continuam rebaixados a 50: nenhum dos dois
    # é microfone, e nenhum dos dois deve ser eleito padrão jamais.
    #
    # FONTE-PADRÃO-01 escreveu a regra do monitor; MONITOR-QUE-VENCE-01 mediu que
    # ela não dispara (o `.monitor` não é nó do monitor de ALSA). Ela fica porque
    # a intenção está certa e o custo é zero — mas a proteção real hoje é a faixa
    # de 1500 da regra acima, não esta linha.
    matches = [
      { device.name = "~alsa_card.*[Dd]ual[Ss]ense.*" }
      { node.name = "~alsa_output.*[Dd]ual[Ss]ense.*[Mm]onitor" }
    ]
    actions = {
      update-props = {
        priority.session = 50
        priority.driver = 50
      }
    }
  }
]
