# Hefesto - Dualsense4Unix — SOM-QUE-NAO-DORME-01 (16/08/2026)
#
# O alto-falante do controle nunca dorme. Sem flag, sem clique, em toda
# instalação.
#
# A DECISÃO DELA, textual (16/08/2026, 00h): *"precisamos setar o som sempre em
# todos os controles no 100% e garantir que sempre fique acordado"*. Este
# arquivo é a metade do "sempre acordado"; a posse do volume é a outra metade e
# vive no backend.
#
# ─────────────────────────────────────────────────────────────────────────────
# O DEFEITO, MEDIDO NA ORELHA DELA — bancada de 15/08/2026, 23h45
# ─────────────────────────────────────────────────────────────────────────────
# Controle azul (hw 0x00001111) no CABO, card2, teste CEGO (ela relatava sem
# saber o que fora enviado). Mesmo arquivo, mesma rota, mesmo volume, três
# passadas:
#
#     canal 1 sozinho, nó ocioso ......... ela: "não saiu"
#     os quatro timbres logo depois ...... ela: "saiu no controle"
#     canal 1 sozinho, nó já acordado .... ela: "tuuuuuuuu"
#
# Nada mudou entre elas além do ESTADO DO NÓ. O `pactl list sinks short` mostra
# os sinks do DualSense em SUSPENDED quando ociosos, e o religar do hardware
# COME O COMEÇO DO SOM. TRÊS leituras da primeira rodada foram descartadas por
# causa disto — o instrumento (a bancada) foi enganado pelo mesmo defeito que
# engana o jogo.
#
# Num jogo, isso é o SFX importante sumindo: o tiro que abre o combate, o aviso
# de vida baixa, a fala que começa depois de um silêncio. A pergunta dela,
# textual: *"como garantimos durante um jogo que o som sempre saia?"*
#
# Ensaio: `sfx-no-suspenso-come-o-comeco` em docs/data/ensaios.csv.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUE CONFIGURAÇÃO, E NÃO UM FLUXO AQUECEDOR — GRAU: MEDIDO + INFERIDO
# ─────────────────────────────────────────────────────────────────────────────
# A alternativa considerada era o produto manter um fluxo contínuo inaudível (1
# LSB nos quatro canais), que já teve prova de conceito na bancada: leva o sink
# de SUSPENDED para RUNNING. Ela foi RECUSADA, e os motivos são estes:
#
# 1. É REDUNDANTE. Quem suspende o nó não é a falta de som — é o
#    `suspend-node.lua` do WirePlumber, por relógio. MEDIDO no código instalado
#    nesta máquina (wireplumber 0.5.12, /usr/share/wireplumber/scripts/node/
#    suspend-node.lua:38-45): ao entrar em `idle`, ele agenda a suspensão para
#    `session.suspend-timeout-seconds` (padrão 5 s) — e, se o valor for ZERO,
#    RETORNA sem agendar nada. Com zero, o nó fica IDLE de porta aberta: não há
#    religar, e não há começo comido. O aquecedor pagaria CPU, um cliente de
#    áudio novo e um fluxo a arbitrar, para chegar no mesmo lugar.
# 2. É MAIS BARATO NO EP0, não mais caro. Cada ciclo suspende→religa refaz a
#    abertura do dispositivo ALSA (control transfers de configuração), e esta
#    casa já pagou caro pelo storm -71 que nasce de rajada de control-transfer
#    no áudio USB do DualSense (ver assets/75-ps5-controller-disable-usb-audio.
#    rules). Nunca suspender ELIMINA esses ciclos. GRAU: INFERIDO do mecanismo,
#    não medido com contador.
# 3. O produto não vira dono do sink. Um aquecedor nosso ocuparia o caminho de
#    saída para sempre, e os três modos que ela quer no fim do projeto (HDMI+SFX
#    no controle, só SFX, só HDMI) são exatamente decisões sobre QUEM toca ali.
#    Uma regra que só diz "não durma" não decide nada disso.
#
# O preço honesto de escolher configuração: mexemos no áudio da máquina dela. É
# um arquivo em `~/.config/wireplumber/wireplumber.conf.d/`, o mesmo diretório
# que o produto já governa desde 25/07 (51/52/53), instalado e removido pelo
# mesmo caminho, e o `uninstall.sh` o apaga por nome.
#
# O SEGUNDO PREÇO, e ele NÃO FOI MEDIDO: com o nó nunca suspenso, o dispositivo
# ALSA fica aberto, e a interface de áudio USB do controle segue com o
# altsetting ativo — ou seja, largura de banda isócrona RESERVADA no barramento
# enquanto o controle estiver no cabo. O aquecedor da alternativa (b) pagaria
# exatamente o mesmo preço (é o mesmo dispositivo aberto), então isto não separa
# as duas — mas separa as duas de NÃO CURAR, e por isso está escrito. Se um dia
# aparecer disputa de barramento com outro periférico USB no mesmo hub, é aqui
# que se olha primeiro; o sintoma seria no OUTRO aparelho, não no controle.
# Por rádio o custo é ZERO, porque não existe placa (ver a seção abaixo).
#
# ─────────────────────────────────────────────────────────────────────────────
# O QUE ACONTECE NO RÁDIO — e por que este arquivo não fala do rádio
# ─────────────────────────────────────────────────────────────────────────────
# NADA, e é o certo. Por Bluetooth o DualSense não publica placa ALSA nenhuma:
# não existe sink, não existe nó, não existe suspensão para desligar. A regra
# casa por nome de nó (`alsa_output.*DualSense*`) e simplesmente não encontra
# nada — não é um caminho quebrado, é um caminho que não existe. O áudio por
# rádio, quando existir, virá como Opus dentro dos reports HID e será outra
# camada inteira, com outro remédio. Este arquivo não promete nada sobre ela.
#
# ─────────────────────────────────────────────────────────────────────────────
# O QUE ESTE ARQUIVO **NÃO** FAZ, DE PROPÓSITO
# ─────────────────────────────────────────────────────────────────────────────
# * NÃO toca o `alsa_input` (o microfone do controle). Um microfone que nunca
#   suspende é um microfone sempre aberto — bateria e privacidade. A queixa dela
#   é o som que SAI; a entrada continua dormindo como sempre dormiu.
# * NÃO toca sink nenhum que não seja do DualSense. A saída HDMI, a placa do PC
#   e o resto da máquina continuam com o padrão de 5 s.
# * NÃO decide volume, rota, nem quem toca. Só o sono.
#
# UNIVERSAL: casa por padrão de nome, então vale para 1, 2, 4 ou 7 controles, em
# qualquer PC, com qualquer DualSense (o Edge inclusive — o nome dele contém
# "DualSense"). Nenhum MAC, nenhuma ordem de conexão, nenhum número mágico.
#
# WirePlumber >= 0.5 (SPA-JSON em ~/.config/wireplumber/wireplumber.conf.d/).
# Instalado por scripts/fix_wireplumber_default_source.sh --nunca-dorme, que o
# `install.sh` chama SEM FLAG, em todos os formatos e antes de qualquer decisão
# sobre o microfone.
#
# Portão: tests/unit/test_o_alto_falante_nunca_dorme_01.py

monitor.alsa.rules = [
  {
    # A SAÍDA do controle — e só ela. Zero desliga o agendador de suspensão do
    # `suspend-node.lua`; o nó fica ocioso de porta aberta, e o primeiro som
    # depois do silêncio sai inteiro.
    matches = [
      { node.name = "~alsa_output.*[Dd]ual[Ss]ense.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
