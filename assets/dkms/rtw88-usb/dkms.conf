# dkms.conf — hefesto-rtw88-usb (Onda W)
# Módulo rtw88_usb patchado (vanilla v7.0.11 + patch/0001 memleak backport +
# patch/0002 device-gone/port-reset): detecta device removido/travado
# (padrão do rtw89: -ENODEV/-ESHUTDOWN imediato; -EPROTO só após >4 erros
# consecutivos), silencia o teardown contra hardware morto e enfileira
# usb_queue_reset_device() — a cura automática do fantasma USB de 13h.
# Instala em updates/dkms, que vence o in-tree automaticamente
# (/etc/depmod.d/ubuntu.conf: "search updates ubuntu built-in").
# Os headers rtw88 (main.h, reg.h, ...) vêm JUNTO no pacote: linux-headers
# não os traz (conferido — só `Kconfig` e `Makefile`); os símbolos do
# rtw88_core resolvem pelo Module.symvers que o linux-headers JÁ traz (CRCs de
# todos os módulos in-tree).
PACKAGE_NAME="hefesto-rtw88-usb"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="rtw88_usb"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Pino de ABI: os headers privados do rtw88 empacotados aqui congelam o layout
# de `struct rtw_dev`. Compilar contra outro kernel LINKA LIMPO e corrompe
# memória em runtime se o layout mudar (diferente do hid-nintendo, que é
# autocontido).
#
# ISSO NÃO É TEORIA — MEDIDO EM 01/09/2026, compilando de propósito com o
# `main.h` errado contra os headers do 7.1.5:
#
#   - compila SEM UM ERRO;
#   - os CRCs dos exports saem IDÊNTICOS (0x2a20bc53 / 0x2f18c1ed), logo o
#     modversions não pega — `rtw_get_usb_priv()` é `static inline` e o offset
#     do `priv` some dentro do código, sem símbolo que o descreva;
#   - o único sinal é o `.ko` ter 16 bytes a menos.
#
# Nada avisa. Por isso o pino é no BUILD EXATO, e não na versão nominal: um
# respin da mesma 7.1.5 com struct diferente teria o mesmo nome.
#
# DOIS KERNELS VALIDADOS, e o `main.h` de cada um viaja em
# `main-por-kernel/main-<build>.h`. O `PRE_BUILD` põe o certo no lugar antes de
# compilar. Kernel fora da lista: o DKMS PULA (fail-safe — o in-tree assume,
# nunca ficar sem WiFi). O ritual para acrescentar um está em `patch/BASELINE`.
BUILD_EXCLUSIVE_KERNEL="^(7\.0\.11-76070011|7\.1\.5-76070105)-"
PRE_BUILD="./escolher-o-main.sh $kernelver"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
