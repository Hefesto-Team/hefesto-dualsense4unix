# dkms.conf — hefesto-uhid (RADIO-AFOGADO-02, 22/09/2026)
#
# Módulo `uhid` patchado (v7.1 + patch/0001): a fila de saída cheia passa a
# poder ser DITA a quem escreve, em vez de descartada em silêncio.
#
# **O DEFAULT DO MÓDULO É O VANILLA.** O parâmetro `backpressure` nasce
# desligado, e com ele desligado o comportamento é byte a byte o de fábrica —
# medido nesta máquina em 22/09/2026, com o mesmo provador: 80 escritas, 80
# «sucessos», 0 recusas nos dois. Ligado (`backpressure=1`): 29 aceitas, 51
# recusadas, a primeira em EAGAIN.
#
# POR QUE ELE NÃO SE IMPÕE: ligar muda a semântica do `write(2)` para TODO
# userspace que escreve report de saída num HID por Bluetooth — o Steam Input
# inclusive. Quem trata falha de escrita como «o aparelho sumiu» largaria o
# controle no primeiro engasgo do rádio, que é exatamente o defeito que a
# RADIO-AFOGADO-02 curou do NOSSO lado. Enquanto isso não for medido com os
# jogos dela abertos, o parâmetro é opt-in.
#
# O parâmetro é 0644: liga e desliga A QUENTE, por
# /sys/module/uhid/parameters/backpressure. Isso importa porque RECARREGAR o
# uhid derruba todo HID por Bluetooth da máquina.
#
# PACKAGE_VERSION fica em 1.0.0 pelo mesmo motivo dos pacotes vizinhos: o
# dkms_lib.sh rebuilda quando o source muda, e um bump deixaria a 1.0.0 antiga
# registrada em updates/dkms — dois .ko candidatos para o mesmo módulo.
PACKAGE_NAME="hefesto-uhid"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="uhid"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
