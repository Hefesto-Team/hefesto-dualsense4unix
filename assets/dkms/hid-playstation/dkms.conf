# dkms.conf — hefesto-hid-playstation
# (contenção BT 25/07 + clone no cabo 25/07 + microfone 10/09)
#
# Módulo hid-playstation patchado (stable v7.1.5 + patch/0001 + 0002 + 0003):
#
#   0001  retry opcional nos feature reports da probe, para o controle que
#         perde o canal de controle Bluetooth quando vários pareiam ao mesmo
#         tempo;
#   0002  probe que sobrevive ao pairing info curto do clone no cabo, em vez de
#         largar o device sem driver nenhum;
#   0003  NÃO parsear os quadros de ÁUDIO do microfone como estado de gamepad.
#         Eles chegam com o MESMO report id 0x31, o MESMO tamanho de 78 B e CRC
#         válido; só o bit 1 do byte 1 os separa, e o driver não o consultava.
#         Sem isso o driver DESLIGA o microfone sozinho (borda falsa do botão
#         de mudo sobre payload Opus) e injeta eixos e botões que ninguém
#         apertou — o cursor e o teclado da pessoa se mexem sozinhos.
#         Medido na bancada em 10/09/2026, com os dois sintomas ao vivo.
#         Desde 28/09/2026 o 0003 também expõe a MARCA `mic_frames_ignored`
#         (0444, sempre Y): o daemon só põe o microfone no ar pelo rádio com
#         ela (`daemon/subsystems/bt_mic.py`), porque nada mais no sysfs separa
#         um driver com a guarda de um sem ela.
#
# Instala em updates/dkms, que vence o in-tree automaticamente
# (/etc/depmod.d/ubuntu.conf: "search updates ubuntu built-in").
#
# PACKAGE_VERSION fica em 1.0.0 DE PROPÓSITO, pelo mesmo motivo dos pacotes
# vizinhos: o dkms_lib.sh já rebuilda quando o source muda (diff -rq -x patch)
# e um bump deixaria a 1.0.0 antiga registrada e instalada em updates/dkms —
# dois .ko candidatos para o mesmo módulo. Só bumpar junto com um
# uninstall/remove explícito da versão antiga.
PACKAGE_NAME="hefesto-hid-playstation"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="hid-playstation"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# SÓ NOS KERNELS CONFERIDOS (O-PRODUTO-EM-QUALQUER-MAQUINA-01, 28/09/2026). Este
# `hid-playstation.c` SUBSTITUI o de fábrica: construído contra um kernel cujo
# de fábrica é outro, ele compila limpo e devolve o arquivo ERRADO. Foi o que
# aconteceu até aqui: a base era o v7.0.11, e no 7.1.5-76070105 o módulo tirava
# as duas verificações de `num_touch_reports` do DualShock 4 que o stable
# acrescentou (a conta está no `patch/BASELINE`). Kernel fora da lista: o DKMS
# PULA (o `dkms_lib.sh` lê o rc 77 como pulo, não como falha) e o de fábrica
# assume. O custo é o microfone pelo rádio, e ele é dito: sem a marca do 0003 o
# daemon não o põe no ar (`bt_mic.motivo`), e o doctor diz a cura. O ritual
# para acrescentar um kernel está em `patch/BASELINE`.
BUILD_EXCLUSIVE_KERNEL="^7\.1\.5-76070105-"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
