# dkms.conf — hefesto-usb-f-hid (14/10/2026)
#
# Módulo `usb_f_hid` patchado (stable v7.1.5 + patch/0001): a resposta do
# GET_REPORT termina no tamanho do relatório que o Hefesto grava, e o pacote
# vazio fecha a transferência. É a função HID dos pads USB virtuais (o gadget
# `hefesto-pad-*` do broker).
#
# O QUE ELE CURA, medido em 14/10/2026 com 4 pads virtuais: o Wine e o SDL
# pedem as features com `wLength` 128; o de fábrica responde sempre 64 bytes
# sem o pacote vazio, e cada pedido volta ETIMEDOUT aos ~5,1 s. O `winebus`
# estoura o prazo de 10 s do `services.exe`, e o jogo no Proton sobe sem
# controle nenhum. Com este módulo, 2–6 ms por pedido.
#
# PACKAGE_VERSION fica em 1.0.0 pelo mesmo motivo dos pacotes vizinhos: o
# dkms_lib.sh rebuilda quando o source muda, e um bump deixaria a 1.0.0 antiga
# registrada em updates/dkms — dois .ko candidatos para o mesmo módulo.
PACKAGE_NAME="hefesto-usb-f-hid"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="usb_f_hid"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# SÓ NOS KERNELS CONFERIDOS, como o `uhid` e o `hid-playstation`. Este
# `f_hid.c` SUBSTITUI o de fábrica: construído contra um kernel cujo `f_hid.c`
# é outro, ele compila limpo e devolve o arquivo ERRADO, com uma correção do
# stable perdida em silêncio. Fora da lista o DKMS PULA (o `dkms_lib.sh` lê o
# rc 77 como pulo, não como falha) e o de fábrica assume: os pads sobem, e o
# doctor diz o que falta. O ritual para acrescentar um kernel está em
# `patch/BASELINE`.
BUILD_EXCLUSIVE_KERNEL="^7\.1\.5-76070105-"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
