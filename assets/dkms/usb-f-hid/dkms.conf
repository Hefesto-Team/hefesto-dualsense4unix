# dkms.conf — hefesto-usb-f-hid (14/10/2026)
#
# Módulo `usb_f_hid` patchado (o de fábrica do kernel que roda + patch/0001 e 0002): a resposta
# do GET_REPORT termina no tamanho do relatório que o Hefesto grava, o pacote
# vazio fecha a transferência, e o id recusado ou sem resposta sai como stall. É a função HID dos pads USB virtuais (o gadget
# `hefesto-pad-*` do broker).
#
# O QUE ELE CURA, medido em 14/10/2026 com 4 pads virtuais: o Wine e o SDL
# pedem as features com `wLength` 128; o de fábrica responde sempre 64 bytes
# sem o pacote vazio, e cada pedido volta ETIMEDOUT aos ~5,1 s. O `winebus`
# estoura o prazo de 10 s do `services.exe`, e o jogo no Proton sobe sem
# controle nenhum. Com este módulo, 2–6 ms por pedido. E, medido em 02/11/2026, o id
# que o pad não guarda voltava 64 bytes zerados com sucesso (o firmware 0x0000 do
# jogo); com o 0002, volta EPIPE, como no aparelho.
#
# PACKAGE_VERSION fica em 1.0.0 pelo mesmo motivo dos pacotes vizinhos: o
# dkms_lib.sh rebuilda quando o source muda, e um bump deixaria a 1.0.0 antiga
# registrada em updates/dkms — dois .ko candidatos para o mesmo módulo. Quem
# separa o 0001 do 0002 é a marca `get_report_refuses`.
PACKAGE_NAME="hefesto-usb-f-hid"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="usb_f_hid"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# O KERNEL QUE RODA (31/10/2026, OS-DKMS-COMPILAM-NO-KERNEL-QUE-RODA-01). Este fonte
# SUBSTITUI o de fábrica, e construído sobre o de fábrica de OUTRO kernel compila limpo e
# devolve o arquivo errado (a conta está no `patch/BASELINE`). O `preparar-o-fonte.py` usa o
# fonte conferido de `fonte-por-kernel/` quando o build está lá (o cache) e, fora dele, acha o
# de fábrica do kernel que roda (a árvore do kernel, a fonte da distro ou o stable do
# kernel.org da versão que os headers declaram), confere pelo `srcversion` do módulo de
# fábrica (no kernel que não o grava, pelos alias e parâmetros, só na versão exata) e aplica a
# série de `patch/` sem fuzz. Ele decide quando o DKMS lê este arquivo: o
# `BUILD_EXCLUSIVE_KERNEL` sai vazio quando o fonte se preparou e, quando o de fábrica fica,
# não casa kernel nenhum, e o DKMS pula com 77 em vez de reprovar o `autoinstall` e, com ele,
# a instalação do kernel (o rc do `PRE_BUILD` o DKMS ignora). O motivo fica em
# `fonte-<kernel>.txt`, que o `dkms_lib.sh` e o doctor dizem. O DKMS que reprova o 77 no
# `autoinstall` (o 3.0.10 do Debian 12; o pulo entrou no 3.0.11) quebraria o kernel novo
# em todo pulo, e ali o `autoinstall` sai: o kernel novo fica no de fábrica até o próximo
# install, que constrói pelo `dkms build` e lê o veredito.
BUILD_EXCLUSIVE_KERNEL="$("${BASH_SOURCE[0]%/*}/preparar-o-fonte.py" --exclusivo "$kernelver" "${kernel_source_dir}" "${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}")"
if declare -F autoinstall >/dev/null && ! declare -f autoinstall | grep -qw 77; then
    AUTOINSTALL=""
fi
PRE_BUILD="./preparar-o-fonte.py $kernelver ${kernel_source_dir} ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
