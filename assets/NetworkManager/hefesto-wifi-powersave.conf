# hefesto-dualsense4unix — Onda W2 (economia de energia do Wi-Fi USB Realtek rtw88 desligada)
#
# Desliga o power save do adaptador Wi-Fi USB Realtek (rtw88): o LPS raso do
# firmware dele tem histórico de 'failed to leave lps state', 'failed to get tx
# report', beacon errors e picos de latência (lwfinger/rtw88 #402). O deep PS
# NÃO é o alvo: em USB ele nunca engaja (rtw_usb_deep_ps é função vazia) — por
# isso NÃO existe conf de disable_lps_deep aqui.
#
# PADRÃO do install.sh numa máquina sem bateria com esse adaptador (30/10/2026;
# de 23/10 a 30/10 valia em toda máquina com Wi-Fi, e tirava a economia de
# placas que não caem com ela). As outras placas ficam com a economia da
# distro. Instalado em /etc/NetworkManager/conf.d/ pelo install.sh (passo
# 3d-bis), que também desliga a economia na hora (iw dev <if> set power_save
# off), sem reconectar; removido pelo uninstall.sh (simétrico). Vence o
# default-wifi-powersave-on.conf do sistema por ordem lexicográfica dentro de
# conf.d. O NetworkManager casa o driver pelo nome exato, sem glob: os dois
# nomes do kernel (rtw_ até o 6.x, rtw88_ depois) de cada chip USB do rtw88.
# A medição A/B do scripts/medir_w2_lps.sh continua aí para quem quiser
# conferir o ganho no próprio aparelho.
#
# 2 = disable, 3 = enable (default da distro).
[connection.hefesto-wifi-powersave]
match-device=driver:rtw88_8723du,driver:rtw88_8812au,driver:rtw88_8814au,driver:rtw88_8821au,driver:rtw88_8821cu,driver:rtw88_8822bu,driver:rtw88_8822cu,driver:rtw_8723du,driver:rtw_8812au,driver:rtw_8814au,driver:rtw_8821au,driver:rtw_8821cu,driver:rtw_8822bu,driver:rtw_8822cu
wifi.powersave=2
