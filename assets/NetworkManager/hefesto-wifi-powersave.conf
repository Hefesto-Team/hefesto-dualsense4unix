# hefesto-dualsense4unix — Onda W2 (economia de energia do Wi-Fi desligada)
#
# Desliga o power save do WiFi (LPS raso do firmware rtw88): em dongles
# Realtek USB (RTL8822BU) o PS do firmware tem histórico de 'failed to
# leave lps state', beacon errors e picos de latência (lwfinger/rtw88
# #402; série original do driver chegou a propor PS desligado em USB).
# O deep PS NÃO é o alvo: em USB ele nunca engaja (rtw_usb_deep_ps é
# função vazia) — por isso NÃO existe conf de disable_lps_deep aqui.
#
# PADRÃO do install.sh em toda máquina com Wi-Fi (decisão dela, 23/10/2026):
# o NetworkManager da distro liga wifi.powersave=3, e o dongle rtw88 USB caiu
# seis vezes num dia com a assinatura do firmware ('failed to get tx report',
# 'failed to leave ips state'). Instalado em /etc/NetworkManager/conf.d/ pelo
# install.sh, que também desliga a economia na hora (iw dev <if> set
# power_save off), sem reconectar; removido pelo uninstall.sh (simétrico). Vence
# o default-wifi-powersave-on.conf do sistema por ordem lexicográfica dentro de
# conf.d. A medição A/B do scripts/medir_w2_lps.sh continua aí para quem quiser
# conferir o ganho no próprio aparelho.
#
# 2 = disable, 3 = enable (default da distro).
[connection.hefesto-wifi-powersave]
match-device=type:wifi
wifi.powersave=2
