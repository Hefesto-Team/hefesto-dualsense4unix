<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.321 14.067 104.383 71.988" role="img" aria-labelledby="titulo-pro"
     data-controle="pro" data-modelo="Nintendo Switch Pro Controller">
  <title id="titulo-pro">Nintendo Switch Pro Controller — mapa de peças e features</title>

  <!--
    SEM width/height NO <svg>, DE PROPOSITO: o viewBox ja define a proporcao, e
    declarar tamanho com razao um pouco diferente faz o renderizador ENCAIXAR
    COM TARJA e deslocar o desenho meio pixel. Custou duas confusoes num dia
    so: a medida de componente saiu com posicao relativa impossivel (1,207), e
    a prova de fidelidade acusou 19.968 pixels de diferenca que eram apenas
    esse deslocamento. Quem consome define o tamanho; o arquivo nao opina.

    Mesma norma do dualsense.svg. O que é próprio deste controle:

    1. A FORMA veio de Nintendo-pro_controller.svg, decomposta em 12 componentes.
       Prova de fidelidade: 137 pixels de ~540.000 (0,03%). A primeira tentativa
       diferia em 1.124 porque a ferramenta só procurava <path> e APAGAVA o
       <circle> do botão menos — um botão inteiro sumia, e o defeito apareceu
       como ponto sólido no diff, não como antisserrilhado de borda.

    2. data-evdev é NOVO e existe porque a casa não tem léxico Nintendo (só
       "home"). Foi LIDO da fonte do driver que roda nesta máquina,
       /usr/src/hefesto-hid-nintendo-1.0.0/hid-nintendo.c:473-481, não suposto:
       A=BTN_EAST, B=BTN_SOUTH, X=BTN_NORTH, Y=BTN_WEST. Note que A e B ficam
       TROCADOS em relação ao layout PlayStation — é a ponte entre o que está
       escrito no plástico e o que o código recebe.

    3. L, R, ZL e ZR NÃO EXISTEM como peça neste desenho: são corcovas da
       própria silhueta. As regiões abaixo são acrescentadas para o mapa ter
       onde acender; a arte não foi tocada.

    4. O direcional é UMA cruz só. As quatro direções entram como regiões
       transparentes por cima, para o mapa acender direção por direção sem
       cortar o desenho original.
  -->

  <style>
    svg[data-colorway="preto"]   .corpo { fill: #2f333c; }
    svg[data-colorway="branco"]  .corpo { fill: #9aa1ad; }
    g[data-entrada]:hover > .peca,
    g[data-feature]:hover > .peca,
    g.marcada > .peca { fill: #bd93f9; }
    .regiao { fill: transparent; }
    g[data-entrada]:hover > .regiao, g.marcada > .regiao { fill: #bd93f9; opacity: .55; }
    .oculta       { opacity: 0; }
    .oculta.acesa { opacity: .95; }
  </style>

  <g id="corpo" data-feature="chassi">
      <title>Corpo</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="corpo" fill="none" d="M 89.7 81.4 c -2.5 0.8 -5.9 -0.9 -7.7 -5.5 c -2.1 -5.5 -3.6 -8.7 -3.7 -8.8 s -1.7 -3.6 -6.7 -3.7 c -1.5 0 -4.7 0 -8.2 -0.1 H 28.5 c -4.9 0.1 -6.6 3.6 -6.6 3.7 c -0.1 0.1 -1.6 3.3 -3.7 8.9 c -1.7 4.6 -5.2 6.3 -7.7 5.5 c -2.6 -0.8 -7 -4.1 -6.8 -11.4 c 0.2 -8.2 0.6 -14.2 1.7 -22.6 c 0.8 -6 2 -10.7 3.1 -14.5 c 1 -3.5 3.2 -6.6 6.3 -8.9 c 4.1 -3 16.8 -3.6 21.4 -3.5 H 64 c 3.1 0 9.9 0.2 15.3 1.4 c 2.6 0.5 4.8 1.3 6.2 2.3 c 3 2.2 5.1 5.3 6.1 8.8 c 1.1 3.8 2.4 8.6 3.1 14.5 c 1 8.4 1.5 14.4 1.7 22.6 c 0.3 7.2 -4.1 10.5 -6.7 11.3"/>
  </g>
  <g id="a" data-entrada="a" data-evdev="BTN_EAST">
      <title>A</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 85.3 32.4 c -1.9 0 -3.4 1.5 -3.4 3.5 c 0 1.9 1.5 3.4 3.4 3.4 s 3.5 -1.5 3.5 -3.4 c -0.1 -2 -1.6 -3.5 -3.5 -3.5"/>
  </g>
  <g id="x" data-entrada="x" data-evdev="BTN_NORTH">
      <title>X</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 78.6 25.8 c -0.4 -0.2 -0.9 -0.3 -1.3 -0.3 c -1.9 0 -3.4 1.5 -3.4 3.4 c 0 0.5 0.1 0.9 0.3 1.3 c 0.5 1.2 1.7 2.1 3.2 2.1 c 1.9 0 3.4 -1.5 3.4 -3.4 c -0.1 -1.4 -1 -2.6 -2.2 -3.1"/>
  </g>
  <g id="b" data-entrada="b" data-evdev="BTN_SOUTH">
      <title>B</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 77.1 39.4 c -1.9 0 -3.4 1.5 -3.4 3.4 s 1.5 3.5 3.4 3.5 s 3.4 -1.6 3.4 -3.5 c 0 -1.8 -1.5 -3.4 -3.4 -3.4"/>
  </g>
  <g id="y" data-entrada="y" data-evdev="BTN_WEST">
      <title>Y</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 69.1 32.4 c -1.2 0 -2.2 0.6 -2.8 1.5 c -0.4 0.6 -0.6 1.2 -0.6 2 c 0 0.9 0.4 1.8 1 2.4 s 1.5 1 2.4 1 c 1.9 0 3.5 -1.5 3.5 -3.4 c 0 -2 -1.6 -3.5 -3.5 -3.5"/>
  </g>
  <g id="plus" data-entrada="plus" data-evdev="BTN_START">
      <title>Mais (+)</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 62.4 30.2 c 1.1 0 1.9 -0.9 1.9 -1.9 c 0 -1.1 -0.9 -1.9 -1.9 -1.9 c -1.1 0 -2 0.9 -2 1.9 c 0 1.1 0.9 1.9 2 1.9"/>
  </g>
  <g id="home" data-entrada="home" data-evdev="BTN_MODE">
      <title>Home</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 57.1 37.8 c 1.1 0 2 -0.9 2 -2 s -0.9 -1.9 -2 -1.9 s -1.9 0.9 -1.9 1.9 c -0.1 1.1 0.8 2 1.9 2"/>
  </g>
  <g id="capture" data-entrada="capture" data-evdev="BTN_Z">
      <title>Capture</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 43.5 34.3 h -1.9 c -0.4 0 -0.8 0.4 -0.8 0.8 V 37 c 0 0.5 0.4 0.8 0.8 0.8 h 1.9 c 0.4 0 0.8 -0.4 0.8 -0.8 v -1.9 c 0 -0.4 -0.3 -0.8 -0.8 -0.8"/>
  </g>
  <g id="stick_r" data-entrada="stick_r" data-clique="r3" data-evdev="BTN_THUMBR">
      <title>Analógico Direito (R3)</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 63.5 55.8 c -3 0 -5.5 -2.5 -5.5 -5.5 s 2.5 -5.5 5.5 -5.5 s 5.5 2.5 5.5 5.5 s -2.5 5.5 -5.5 5.5"/>
  </g>
  <g id="stick_l" data-entrada="stick_l" data-clique="l3" data-evdev="BTN_THUMBL">
      <title>Analógico Esquerdo (L3)</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 29.5 36 c 0 -4.5 -3.6 -8.1 -8.1 -8.1 c -3.6 0 -6.7 2.4 -7.8 5.7 c -0.2 0.8 -0.4 1.6 -0.4 2.4 c 0 4.5 3.7 8.1 8.1 8.1 c 2 0 3.7 -0.7 5.2 -1.9 c 1.8 -1.4 3 -3.6 3 -6.2"/>
  </g>
  <g id="dpad" data-entrada="dpad" data-evdev="ABS_HAT0X/ABS_HAT0Y">
      <title>Direcional</title>
      <path stroke="#2f333c" stroke-width="0.78" stroke-linejoin="round" class="peca" fill="none" d="M 40.8 47.8 h -4.4 v -4.4 c 0 -0.5 -0.4 -0.9 -0.9 -0.9 h -3.1 c -0.1 0 -0.3 0 -0.4 0.1 c -0.3 0.1 -0.5 0.5 -0.5 0.8 v 4.4 h -4.4 c -0.5 0 -0.9 0.4 -0.9 0.9 v 3.1 c 0 0.5 0.4 0.9 0.9 0.9 h 4.4 v 4.4 c 0 0.5 0.4 0.9 0.9 0.9 h 3.1 c 0.5 0 0.9 -0.4 0.9 -0.9 v -4.4 h 4.4 c 0.5 0 0.9 -0.4 0.9 -0.9 v -3.1 c 0.1 -0.5 -0.4 -0.9 -0.9 -0.9"/>
  </g>
  <g id="minus" data-entrada="minus" data-evdev="BTN_SELECT">
      <title>Menos (−)</title>
      <circle class="peca" fill="none" stroke="#2f333c" stroke-width="0.78" cx="37.1" cy="28.3" r="1.9"/>
  </g>

  <!-- L, R, ZL, ZR: corcovas da silhueta, sem peça própria na arte -->
  <g id="zl" data-entrada="zl" data-evdev="BTN_TL2">
      <title>ZL</title><rect class="regiao" x="19" y="14.6" width="20" height="3.4" rx="1.5"/>
  </g>
  <g id="l" data-entrada="l" data-evdev="BTN_TL">
      <title>L</title><rect class="regiao" x="19" y="18" width="20" height="3.6" rx="1.5"/>
  </g>
  <g id="zr" data-entrada="zr" data-evdev="BTN_TR2">
      <title>ZR</title><rect class="regiao" x="61" y="14.6" width="20" height="3.4" rx="1.5"/>
  </g>
  <g id="r" data-entrada="r" data-evdev="BTN_TR">
      <title>R</title><rect class="regiao" x="61" y="18" width="20" height="3.6" rx="1.5"/>
  </g>

  <!-- direções do direcional: regiões por cima da cruz, medidas do bbox dela -->
  <g id="dpad_up" data-entrada="dpad_up" data-evdev="ABS_HAT0Y-">
      <title>D-pad Cima</title><rect class="regiao" x="31.36" y="42.49" width="5.18" height="5.18"/>
  </g>
  <g id="dpad_down" data-entrada="dpad_down" data-evdev="ABS_HAT0Y+">
      <title>D-pad Baixo</title><rect class="regiao" x="31.36" y="52.85" width="5.18" height="5.18"/>
  </g>
  <g id="dpad_left" data-entrada="dpad_left" data-evdev="ABS_HAT0X-">
      <title>D-pad Esquerda</title><rect class="regiao" x="26.18" y="47.67" width="5.18" height="5.18"/>
  </g>
  <g id="dpad_right" data-entrada="dpad_right" data-evdev="ABS_HAT0X+">
      <title>D-pad Direita</title><rect class="regiao" x="36.54" y="47.67" width="5.18" height="5.18"/>
  </g>

  <!-- POSIÇÃO LOCALIZADA em 11/08/2026, por FOTO DELA do próprio aparelho:
       quatro LED numa faixa recuada na aresta frontal, entre os grips, no vão
       que os ombros deixam. Na foto, os dois da esquerda acesos e os dois da
       direita apagados — o padrão de jogador 2.
       A geometria não é chute: ZL/L ocupam x 19..39 e ZR/R ocupam x 61..81, o
       que deixa o vão em x 39..61 (centro 50); a aresta superior do corpo, no
       trecho horizontal, está em y 20.5. Os quatro cabem centrados nisso.
       Ela descreveu como "parte de baixo" porque no aparelho na mão a faixa
       fica na aba inferior da aresta frontal; numa vista de cima, que é esta,
       a mesma aba projeta no topo, entre os ombros. As duas leituras concordam
       sobre QUAL extremidade — e é a extremidade que importa para o mapa. -->
  <g id="led-jogador" data-feature="led-jogador" data-posicao="aresta-frontal-centro">
      <title>Indicador de jogador (quatro LED, aresta frontal, entre os grips)</title>
      <rect class="peca" fill="none" stroke="#2f333c" stroke-width="0.4" x="43.8" y="22.2" width="2.2" height="1.5" rx="0.3"/>
      <rect class="peca" fill="none" stroke="#2f333c" stroke-width="0.4" x="47.2" y="22.2" width="2.2" height="1.5" rx="0.3"/>
      <rect class="peca" fill="none" stroke="#2f333c" stroke-width="0.4" x="50.6" y="22.2" width="2.2" height="1.5" rx="0.3"/>
      <rect class="peca" fill="none" stroke="#2f333c" stroke-width="0.4" x="54.0" y="22.2" width="2.2" height="1.5" rx="0.3"/>
  </g>

  <g id="feat-rumble-esquerdo" class="oculta" data-feature="rumble-esquerdo">
