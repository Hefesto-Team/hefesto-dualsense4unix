      <ellipse cx="20" cy="66" rx="9" ry="10" fill="none" stroke="#bd93f9" stroke-width=".7" stroke-dasharray="2 1.5"/>
  </g>
  <g id="feat-rumble-direito" class="oculta" data-feature="rumble-direito">
