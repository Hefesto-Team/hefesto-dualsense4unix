  </g>
  <g id="feat-acelerometro" class="oculta" data-feature="acelerometro">
      <title>Acelerômetro</title>
      <rect x="41" y="52" width="18" height="18" rx="3" fill="none" stroke="#bd93f9" stroke-width=".7" stroke-dasharray="2 1.5"/>
  </g>
  <g id="feat-nfc" class="oculta" data-feature="nfc">
