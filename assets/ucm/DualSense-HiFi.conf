# Hefesto — HAPTICA-NATIVA-01. O DualSense no cabo é uma placa USB Audio de
# quatro canais:
#   canais 1-2 (FL/FR) = o alto-falante do controle
#   canais 3-4 (RL/RR) = os dois motores voice-coil (a háptica)
# O sink que este verbo produz, `…HiFi__Speaker__sink`, é o nome que o caminho
# de háptica do GE-Proton procura no winepulse.

SectionDevice."Speaker" {
	Comment "Controller speaker and haptic motors"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
		PlaybackPriority 100
	}
}

# O GANHO DE ENTRADA PASSA A TER DONO — O-GANHO-DO-MIC-TEM-DONO-01, 20/09/2026.
#
# O `Headset Capture Volume` do DualSense (Feature Unit 5 do descritor UAC) é
# uma faixa de 0 a +48,00 dB em 102 degraus, e o aparelho vive no ÚLTIMO deles.
# Lido na bancada com `LC_ALL=C amixer -c <placa> scontents`:
#
#   Simple mixer control 'Headset',0
#     Capabilities: cvolume cvolume-joined cswitch cswitch-joined
#     Limits: Capture 0 - 101
#     Mono: Capture 101 [100%] [48.00dB] [on]
#
# Até aqui NENHUMA porta ligava esse elemento, e a de 20/09 era NOSSA: este
# `SectionDevice` declarava só `CapturePCM` e `CapturePriority`. Sem
# `CaptureVolume`/`CaptureMixerElem` o elemento fica fora do alcance do
# PipeWire — e, portanto, do produto e dela.
#
# O QUE CADA UMA DAS DUAS LINHAS É, e as duas são precisas porque o alsa-lib
# aceita as duas gramáticas (o modelo é `NXP/iMX8/Librem_5/HiFi.conf` no disco
# desta máquina, que declara o par junto):
#   CaptureVolume     o identificador do controle ALSA, como o `amixer controls`
#                     o imprime (`numid=6,iface=MIXER,name='Headset Capture Volume'`);
#   CaptureMixerElem  o nome do elemento SIMPLES, que é o que o
#                     `amixer scontents` chama de `Headset`.
#
# QUEM VIGIA É O `doctor`, e ele não confia em nenhuma das duas por escrito:
# `_dualsense_porta_de_captura_status` (`scripts/doctor.sh`) lê o elemento que a
# PLACA tem e cobra que a definição da porta ativa nomeie ESSE elemento. Arranque
# as duas linhas abaixo e o WARN volta.
#
# NÃO ENTRA UM `CaptureSwitch`: o mudo desta casa é do firmware (`mic.set`) e da
# rota do WirePlumber, e um terceiro mudo seria a terceira verdade sobre o mesmo
# botão.
SectionDevice."Mic" {
	Comment "Controller microphone"

	Value {
		CapturePCM "hw:${CardId},0"
		CaptureVolume "name='Headset Capture Volume'"
		CaptureMixerElem "Headset"
		CapturePriority 100
	}
}
