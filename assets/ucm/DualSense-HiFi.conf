# Hefesto — HAPTICA-NATIVA-01. O DualSense no cabo é uma placa USB Audio de
# quatro canais:
#   canais 1-2 (FL/FR) = o alto-falante do controle
#   canais 3-4 (RL/RR) = os dois motores voice-coil (a háptica)
# O sink que este verbo produz, `…HiFi__Speaker__sink`, é o nome que o caminho
# de háptica do GE-Proton procura no winepulse.

SectionDevice."Speaker" {
	Comment "Controller speaker and haptic motors"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
		PlaybackPriority 100
	}
}

SectionDevice."Mic" {
	Comment "Controller microphone"

	Value {
		CapturePCM "hw:${CardId},0"
		CapturePriority 100
	}
}
