Syntax 4

# hefesto-ucm-dualsense — gravado por scripts/install_ucm_dualsense.sh.
#
# SYNTAX 4, E NÃO 6 — medido em 18/09/2026 com o DualSense no cabo: o
# `alsaucm -c hw:N list _verbs` e o `list _devices` do HiFi saem idênticos
# nas duas (alsa-lib 1.2.11). O número é o piso de versão que a alsa-lib
# exige para ler o arquivo, e este gancho só usa `SectionUseCase` e `File`.
# Não foi medido numa alsa-lib antiga: o piso mais baixo só alarga o alcance.
#
# O ucm.conf procura conf.d/USB-Audio/<nome longo da placa>.conf ANTES do
# USB-Audio.conf do pacote, e o nome longo do DualSense sai cortado em 79
# caracteres dentro do endereço do controlador USB: este arquivo vale para
# toda porta daquele controlador. O pacote alsa-ucm-conf fica intacto.
Comment "Sony Interactive Entertainment DualSense (Hefesto)"

SectionUseCase."HiFi" {
	Comment "Default"
	File "/USB-Audio/Hefesto/DualSense-HiFi.conf"
}
